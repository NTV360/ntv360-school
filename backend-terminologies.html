    const mx=Math.max(...reqs.map(r=>r.v));const p=ez((e-.8)/1.6),sorted=e>2.5;
    const byRank=[];reqs.forEach(r=>byRank[r.to]=r);

      const c=!sorted?col.req:r.to>=99?col.bad:r.to>=95?col.slot:r.to>=50?alpha(col.req,.75):col.req;

    g.ln(x0,base,x1,base,col.line,1.5);
    g.t(sorted?'fastest →':'',x0,base+13,{c:col.muted,s:11,a:'left'});g.t(sorted?'← slowest':'unsorted, as they arrived',sorted?x1:x0,base+13,{c:col.muted,s:11,a:sorted?'right':'left'});
    if(sorted){const a=clamp((e-2.5)/.6,0,1);
      [[49,col.ad,'p50'],[94,col.slot,'p95'],[98,col.bad,'p99']].forEach(([k,c,l],j)=>{const r=byRank[k],x=x0+(k+.5)*bw,h=(base-top)*r.v/mx;
        const ly=12+j*20;g.ln(x,base-h-4,x,ly,alpha(c,a),1.5,[3,3]);g.pill(clamp(x,52,W-52),ly,l+' '+Math.round(r.v)+' ms',alpha(c,a),col.on)});
      s50(Math.round(byRank[49].v)+' ms');s95(Math.round(byRank[94].v)+' ms');s99(Math.round(byRank[98].v)+' ms')}
    else{s50('–');s95('–');s99('–')}
    if(e>9)want=true;
  })};

D['tail-latency']=(s,ui)=>{let N=10,tr=null,tot=0,slow=0;
  ui.slider('Backends called per request',1,100,N,v=>{N=v;tot=0;slow=0;tr=null});
  const sP=ui.stat('chance ≥1 is slow','bad'),sT=ui.stat('requests run','ink'),sS=ui.stat('slow requests seen','bad');
  const nt=()=>{const b=Array.from({length:N},()=>{const sl=rnd()<.01;return{sl,d:sl?1.3+rnd()*.5:.18+rnd()*.25}});tr={b,st:s.T,end:Math.max(...b.map(x=>x.d))}};
  s.label('A grid of backend calls; the request finishes only when the slowest one returns.');
  s.frame((t,dt)=>{if(!tr)nt();const {g,W,H}=s;const e=t-tr.st;
    const aw=W-8,ah=H-64,cell=Math.floor(Math.min(34,Math.sqrt(aw*ah/N)*.82)),gp=Math.max(2,cell*.18),cols=Math.max(1,Math.floor(aw/(cell+gp)));
    const rows=Math.ceil(N/cols),gw=Math.min(N,cols)*(cell+gp)-gp,ox=(W-gw)/2,oy=52;
    tr.b.forEach((b,i)=>{const x=ox+(i%cols)*(cell+gp),y=oy+Math.floor(i/cols)*(cell+gp);const dn=e>=b.d;
      g.rr(x,y,cell,cell,Math.min(6,cell/4),dn?(b.sl?col.bad:col.ad):col.panel2,!dn&&b.sl&&e>.5?col.bad:null,1.5);
      if(!dn&&cell>14)g.spin(x+cell/2,y+cell/2,cell/5,t,b.sl&&e>.5?col.bad:col.muted)});
    const any=tr.b.some(b=>b.sl),fin=e>=tr.end;
    g.t(fin?(any?'✗ slow: waited '+Math.round(tr.end*700)+' ms for one straggler':'✓ fast: '+Math.round(tr.end*700)+' ms'):'waiting for all '+N+' backends…',W/2,20,{c:fin?(any?col.bad:col.ad):col.muted,s:14,w:700});
    if(e>tr.end+.55){tot++;if(any)slow++;nt()}
    sP((100*(1-Math.pow(.99,N))).toFixed(1)+'%');sT(tot);sS(slow+(tot?' ('+Math.round(100*slow/tot)+'%)':''));
  })};

D['cold-start']=(s,ui)=>{let bars=[],next=0,idleUntil=-1,lastReq=0,count=0;
  ui.btn('Go idle',()=>{idleUntil=s.T+3.2});
  const sW=ui.stat('warm request','ad','–'),sC=ui.stat('cold request','slot','–');
  s.label('Bar chart of request latencies; requests after an idle period are much taller.');
  s.frame((t,dt)=>{const {g,W,H}=s;const idle=t<idleUntil,asleep=t-lastReq>2.4;
    if(!idle&&t>=next){const cold=asleep||count===0;const v=cold?1100+rnd()*500:70+rnd()*60;bars.push({v,cold});lastReq=t;next=t+.55;count++;
      cold?sC(Math.round(v)+' ms'):sW(Math.round(v)+' ms');if(count%14===0)idleUntil=t+3.2}
    const bw=16,max=Math.floor((W-60)/bw);if(bars.length>max)bars.splice(0,bars.length-max);
    const base=H-24,top=36,X0=46;
    [0,500,1000,1500].forEach(m=>{const y=base-(base-top)*m/1700;g.ln(X0,y,W-4,y,col.line,1,m?[2,4]:null);g.t(m+'',X0-6,y,{c:col.muted,s:10.5,a:'right',w:500})});
    bars.forEach((b,i)=>{const h=(base-top)*b.v/1700,x=X0+4+i*bw;g.rr(x,base-h,bw-4,h,3,b.cold?col.slot:col.req);
      if(b.cold&&h>40&&i>0)g.t('cold',x+(bw-4)/2,base-h-9,{c:col.slot,s:10.5})});
    const st=idle?(asleep?'idle: instance scaled down, zzz':'idle…'):'serving traffic';
    g.pill(W-6,14,st,idle&&asleep?col.slot:col.panel2,idle&&asleep?col.on:col.muted,{a:'right'});
    g.t('ms',X0-6,top-14,{c:col.muted,s:10.5,a:'right'});
  })};

/* ================= II. Promises and budgets ================= */
D['sli-slo-sla']=(s,ui)=>{let pts=[],v=99.97,acc=0,outUntil=-1;

  s.frame((t,dt)=>{const {g,W,H}=s;acc+=dt;while(acc>.08){acc-=.08;const out=s.T<outUntil;const inst=out?98.4:99.985+(rnd()-.5)*.03;v=lerp(v,inst,out?.07:.05);pts.push(v)}
    const x0=50,x1=W-8,top=16,base=H-22,lo=99,hi=100,Y=q=>base-(base-top)*(clamp(q,lo,hi)-lo)/(hi-lo);const max=Math.floor((x1-x0)/3);if(pts.length>max)pts.splice(0,pts.length-max);
    g.rr(x0,Y(99.5),x1-x0,base-Y(99.5),0,alpha(col.bad,.08));

    const ctx=s.ctx;ctx.beginPath();pts.forEach((p,i)=>{const x=x1-(pts.length-1-i)*3;i?ctx.lineTo(x,Y(p)):ctx.moveTo(x,Y(p))});ctx.lineWidth=2.5;ctx.strokeStyle=col.req;ctx.stroke();
    if(pts.length)g.dot(x1,Y(pts[pts.length-1]),4.5,col.req);
    g.pill(x0+4,Y(99.9)-12,'SLO 99.9%  your own target',col.slot,col.on,{a:'left'});
    g.pill(x0+4,Y(99.5)+14,'SLA 99.5%  in the contract',col.bad,col.on,{a:'left'});
    g.t('SLI: measured availability',x1,Y(100)+10,{c:col.req,s:11.5,a:'right'});
    sV(v.toFixed(2)+'%');sS(v<99.5?'SLA breached':v<99.9?'SLO missed':'OK');

D['error-budget']=(s,ui)=>{const T=[99,99.5,99.9,99.95,99.99];let ti=2,used=0,shown=0,inc=[],start=0;
  ui.slider('Target',0,4,ti,v=>{ti=v},v=>T[v]+'%');
  ui.btn('Incident: 10 min down',()=>{used+=10;inc.push({d:day(),m:10})});ui.btn('Incident: 2 min',()=>{used+=2;inc.push({d:day(),m:2})});
  ui.btn('New month',()=>{used=0;inc=[];start=s.T},true);
  const day=()=>Math.min(29,Math.floor((s.T-start)/0.8)%30);
  const sB=ui.stat('budget per month','req'),sL=ui.stat('left','ad');
  s.label('A 30-day month with incidents draining an error budget bar.');
  s.frame((t,dt)=>{const {g,W,H}=s;const budget=43200*(1-T[ti]/100);if((t-start)/0.8>=30){start=t;used=0;inc=[]}
    shown=lerp(shown,used,1-Math.pow(.001,dt));const left=Math.max(0,budget-shown),r=left/budget;
    const cw=(W-12)/30;for(let d=0;d<30;d++){const x=6+d*cw,cur=d===day();g.rr(x+1,20,cw-2,26,4,cur?col.ink:d<day()?col.panel2:'transparent',cur?null:col.line,1);
      if(cw>16&&(d%5===0))g.t(String(d+1),x+cw/2,58,{c:col.muted,s:10,w:500})}
    inc.forEach(i=>g.rr(6+i.d*cw+2,14,cw-4,8,2,col.bad));
    g.t('day '+(day()+1)+' of 30',W-6,74,{c:col.muted,s:11,a:'right'});
    const by=104,bh=30;g.rr(6,by,W-12,bh,8,col.panel2);g.rr(6,by,(W-12)*r,bh,8,r>.5?col.ad:r>.2?col.slot:col.bad);
    g.t(budget<1?(budget*60).toFixed(0)+' seconds allowed':budget.toFixed(1)+' minutes of downtime allowed this month',6,by-12,{s:13,w:700,a:'left'});
    g.t(left<1?(left*60).toFixed(0)+' s left':left.toFixed(1)+' min left',W-10,by+bh/2,{c:col.ink,s:13,w:700,a:'right'});
    if(used>=budget)g.pill(W/2,H-24,'Budget spent: pause risky releases and fix reliability',col.bad,col.on,{s:12});
    else g.t('Release freely while budget remains.',W/2,H-24,{c:col.muted,s:12.5,w:500});
    sB(budget<1?(budget*60).toFixed(0)+' s':budget.toFixed(1)+' min');sL(left<1?(left*60).toFixed(0)+' s':left.toFixed(1)+' min');
  })};
</script>
<script>
/* flights between named points; points are recomputed every frame so layout survives resizes */
function Fl(){const L=[];return{L,
  add(o){L.push(o);return o},
  clear(){L.length=0},
  run(g,t,P){for(let i=L.length-1;i>=0;i--){const f=L[i];if(f.st==null)f.st=t;const p=(t-f.st)/f.dur;
    if(p>=1){L.splice(i,1);f.done&&f.done(t);continue}
    if(f.hide)continue;const A=P[f.a],B=P[f.b];if(!A||!B)continue;const q=ez(p);
    const x=lerp(A[0],B[0],q),y=lerp(A[1],B[1],q)+(f.dy||0);
    if(f.lost&&p>.5){if(p<.9)g.x(lerp(A[0],B[0],ez(.5)),y,7,col.bad);continue}
    g.pk(x,y,f.c,f.label,f.r||6)}}}}

/* ================= III. When things fail ================= */
D.timeout=(s,ui)=>{let to=1000,R=null,ok=0,tout=0,waste=0;const K=.0011;
  ui.slider('Client timeout',200,3000,to,v=>to=v,v=>v+' ms',50);
  const sO=ui.stat('answered in time','ad'),sT=ui.stat('timed out','bad'),sW=ui.stat('server work wasted','slot','0 ms');
  const nr=()=>{R={st:s.T,srv:clamp(logn(520,.7),160,4000),to,tallied:false}};
  s.label('A client waits for a server; if the server is slower than the timeout, the client gives up.');
  s.frame((t,dt)=>{if(!R)nr();const {g,W,H}=s;const e=(t-R.st)/K,gave=R.srv>R.to;
    const bw=Math.min(116,W*.24),bh=54,y=40,x1=4,x2=W-4-bw,a=x1+bw+10,b=x2-10,wy=y+bh/2;
    const cdone=gave?e>=R.to:e>=R.srv;
    g.box(x1,y,bw,bh,'Client',col.pi,{glow:cdone&&!gave});g.box(x2,y,bw,bh,'Server',col.req,{glow:e>100&&e<R.srv-100});
    g.ln(a,wy,b,wy,col.line,2,[5,5]);
    if(e<100)g.dot(lerp(a,b,e/100),wy,7,col.req);
    else if(e<R.srv-100){g.spin(x2+bw/2,y+bh+20,8,t,col.slot);g.t('working '+Math.round(e)+' ms',x2+bw/2,y+bh+40,{c:col.slot,s:11.5})}
    else if(e<R.srv)g.pk(lerp(b,a,(e-R.srv+100)/100),wy,gave?col.muted:col.ad,gave?'too late':null);
    g.ring(x1+bw/2,y+bh+26,13,Math.min(e,R.to)/R.to,gave&&e>=R.to?col.bad:col.req);
    if(gave&&e>=R.to){g.x(x1+bw/2,y-14,7,col.bad);g.t('gave up at '+R.to+' ms',x1+bw/2,y+bh+54,{c:col.bad,s:11.5,w:700});
      if(e<R.srv)g.t('…server is still working for no one',W/2,wy-22,{c:col.muted,s:11.5,it:true})}
    else if(!gave&&e>=R.srv)g.t('✓ '+Math.round(R.srv)+' ms',x1+bw/2,y+bh+54,{c:col.ad,s:12,w:700});
    const tx=8,tw=W-16,ty=H-30,X=v=>tx+tw*Math.min(v,4000)/4000;
    g.ln(tx,ty,tx+tw,ty,col.line,4);g.ln(tx,ty,X(Math.min(e,R.srv)),ty,alpha(col.req,.6),4);
    g.ln(X(R.to),ty-12,X(R.to),ty+10,col.bad,2.5);g.t('timeout',clamp(X(R.to),30,W-30),ty-20,{c:col.bad,s:11});
    if(e>=R.srv){g.dot(X(R.srv),ty,5,gave?col.muted:col.ad)}
    g.t('0',tx,ty+14,{c:col.muted,s:10,a:'left'});g.t('4 s',tx+tw,ty+14,{c:col.muted,s:10,a:'right'});
    if(e>=Math.max(R.srv,R.to)+500){if(gave){tout++;waste+=R.srv-R.to}else ok++;nr()}
    sO(ok);sT(tout);sW(Math.round(waste)+' ms');
  })};

D['retry-backoff']=(s,ui)=>{let jit=false,sim=null,t0=0;const NC=24,CAP=4,TK=.25,DOWN=1,SPAN=10;
  const run=()=>{const att=[],load={},ev=[];for(let c=0;c<NC;c++)ev.push({c,t:rnd()*.05,k:0});
    while(ev.length){ev.sort((a,b)=>a.t-b.t);const e=ev.shift();let ok=false;
      if(e.t>=DOWN){const b=Math.floor(e.t/TK);load[b]=load[b]||0;if(load[b]<CAP){load[b]++;ok=true}}
      att.push({c:e.c,t:e.t,ok});if(!ok&&e.k<7){const d=.3*Math.pow(2,e.k);ev.push({c:e.c,t:e.t+(jit?rnd()*2*d:d),k:e.k+1})}}
    const last=Math.max(...att.filter(a=>a.ok).map(a=>a.t),0);return{att,last,fails:att.filter(a=>!a.ok).length,allOk:new Set(att.filter(a=>a.ok).map(a=>a.c)).size}};
  ui.toggle('Add jitter (randomize each wait)',false,v=>{jit=v;sim=null});ui.btn('Run again',()=>{sim=null},true);
  const sA=ui.stat('total attempts','req'),sF=ui.stat('failed attempts','bad'),sD=ui.stat('everyone served by','ad');
  s.label('Timeline of retry attempts from 24 clients with a histogram of load per tick.');
  s.frame((t,dt)=>{if(!sim){sim=run();t0=t}const {g,W,H}=s;const e=t-t0,ph=Math.min(SPAN,e*1.3);
    const x0=8,x1=W-8,X=v=>x0+(x1-x0)*v/SPAN,rh=4.2,ry=14,hb=H-18,ht=ry+NC*rh+26;
    g.rr(x0,ry-6,X(DOWN)-x0,hb-ry+6,4,alpha(col.bad,.08));g.t('server down',x0+4,hb-8,{c:col.bad,s:10.5,a:'left'});
    sim.att.forEach(a=>{if(a.t>ph)return;g.dot(X(a.t),ry+a.c*rh,2.2,a.ok?col.ad:col.bad)});
    const nb=Math.ceil(SPAN/TK),cnt=new Array(nb).fill(0);sim.att.forEach(a=>{if(a.t<=ph&&a.t<SPAN)cnt[Math.floor(a.t/TK)]++});
    const mx=Math.max(CAP*2.5,...cnt),bw=(x1-x0)/nb,Y=v=>hb-(hb-ht)*v/mx;
    cnt.forEach((c,i)=>{if(!c)return;const okp=Math.min(c,i*TK>=DOWN?CAP:0);g.rr(X(i*TK)+1,Y(c),bw-2,hb-Y(c),2,alpha(col.bad,.7));if(okp)g.rr(X(i*TK)+1,Y(okp),bw-2,hb-Y(okp),2,col.ad)});
    g.ln(X(DOWN),Y(CAP),x1,Y(CAP),col.ink,1.5,[4,4]);g.t('server capacity: 4 per tick',x1,Y(CAP)-9,{c:col.muted,s:10.5,a:'right'});
    g.ln(x0,hb,x1,hb,col.line,1.5);g.ln(X(ph),ry-8,X(ph),hb,alpha(col.ink,.35),1);
    for(let k=0;k<=SPAN;k+=2)g.t(k+'s',clamp(X(k),10,W-12),hb+10,{c:col.muted,s:10,w:500});
    g.t('each row = one client',x1,ry-6,{c:col.muted,s:10.5,a:'right'});
    sA(sim.att.length);sF(sim.fails);sD(sim.allOk<NC?'not all ('+sim.allOk+'/'+NC+')':sim.last.toFixed(1)+' s');
    if(e>SPAN/1.3+2.5)sim=null;
  })};

D['circuit-breaker']=(s,ui)=>{let down=false,state='closed',fails=0,openUntil=0,probe=false,next=0,sent=0,fast=0,failed=0;const F=Fl();
  ui.toggle('Service is down',false,v=>down=v);
  const sS=ui.stat('calls reaching service','req'),sF=ui.stat('rejected instantly','pop'),sX=ui.stat('slow failures','bad');
  const res=ok=>()=>{if(ok){fails=0;if(state==='half'){state='closed';probe=false}F.add({a:'B',b:'C',dur:.35,c:col.ad})}
    else{failed++;fails++;if(state==='half'){state='open';openUntil=s.T+3;probe=false}else if(state==='closed'&&fails>=3){state='open';openUntil=s.T+3}
      F.add({a:'B',b:'C',dur:.35,c:col.bad})}};
  const atS=()=>{if(down)F.add({a:'S',b:'S',dur:1.1,hide:true,done:()=>F.add({a:'S',b:'B',dur:.35,c:col.bad,label:'timeout',done:res(false)})});
    else F.add({a:'S',b:'B',dur:.35,c:col.ad,done:res(true)})};
  const atB=()=>{if(state==='open'||(state==='half'&&probe)){fast++;F.add({a:'B',b:'C',dur:.3,c:col.pop,label:'rejected',dy:16});return}
    if(state==='half')probe=true;sent++;F.add({a:'B',b:'S',dur:.35,c:col.req,label:state==='half'?'probe':null,done:atS})};
  s.label('Client, circuit breaker, and service, with the breaker switching between closed, open and half-open.');
  s.frame((t,dt)=>{const {g,W,H}=s;if(t>=next){next=t+.7;F.add({a:'C',b:'B',dur:.35,c:col.req,done:atB})}
    if(state==='open'&&t>openUntil){state='half';probe=false}
    const bw=Math.min(110,W*.24),bh=60,y=36,cx=4,bx=W/2-bw/2,sx=W-4-bw,wy=y+bh/2;
    const P={C:[cx+bw+8,wy],B:[bx+bw/2,wy],S:[sx-8,wy]};
    g.ln(cx+bw+8,wy,sx-8,wy,col.line,2,[5,5]);
    g.box(cx,y,bw,bh,'Client',col.pi);
    const busy=F.L.some(f=>f.hide);g.box(sx,y,bw,bh,'Service',down?col.bad:col.req,{sub:down?'down':'healthy'});
    if(busy)g.spin(sx+bw/2,y+bh+18,7,t,col.bad);
    const sc=state==='closed'?col.ad:state==='open'?col.bad:col.slot;
    g.box(bx,y,bw,bh,state==='half'?'HALF-OPEN':state.toUpperCase(),sc,{glow:state!=='closed',fill:col.panel,sub:'breaker'});
    F.run(g,t,P);
    for(let k=0;k<3;k++)g.dot(bx+bw/2-14+k*14,y+bh+16,5,k<fails&&state==='closed'?col.bad:col.panel2);
    if(state==='open'){g.ring(bx+bw/2,y+bh+44,12,1-(openUntil-t)/3,col.bad);g.t('cooldown',bx+bw/2,y+bh+68,{c:col.muted,s:11})}
    const msg=state==='closed'?(fails?fails+' failure'+(fails>1?'s':'')+' in a row (trips at 3)':'Closed: calls flow through normally'):
      state==='open'?'Open: failing fast without calling the service':'Half-open: one probe allowed through';
    g.t(msg,W/2,H-16,{c:sc,s:13,w:700});
    sS(sent);sF(fast);sX(failed);
  })};

D.idempotency=(s,ui)=>{let key=false,t0=0;const dur=[1.1,.9,1.2,1.1,1.1,1.5,1,2.4],tot=dur.reduce((a,b)=>a+b,0);
  ui.toggle('Send an Idempotency-Key header',false,v=>{key=v;t0=s.T});
  s.label('A payment request whose reply is lost, then retried, with and without an idempotency key.');

    if(i===6)g.pk(lerp(b,a,ez(p)),wy,col.ad,'200 OK');

    if(key&&i>=1){g.t('saved keys',x2-10,ly,{c:col.muted,s:11,a:'right'});g.pill(x2-10,ly+22,'k_7f3a',col.pop,col.on,{a:'right',m:true})}

D['rate-limiting']=(s,ui)=>{const CAP=5;let tok=5,rate=1,steady=false,q=[],nextS=0,ok=0,no=0;const F=Fl();
  ui.btn('Send a burst of 8',()=>{for(let k=0;k<8;k++)q.push(s.T+k*.1)});

  s.label('A token bucket between a client and an API, letting requests through only when a token is available.');
  s.frame((t,dt)=>{const {g,W,H}=s;tok=Math.min(CAP,tok+dt*rate);
    if(steady&&t>=nextS){nextS=t+.5;q.push(t)}
    q=q.filter(x=>{if(x<=t){F.add({a:'C',b:'B',dur:.35,c:col.req});return false}return true});
    const bw=Math.min(100,W*.22),bh=56,y=50,cx=4,ax=W-4-bw,wy=y+bh/2,kw=Math.min(150,W*.34),kx=W/2-kw/2,kh=86,ky=wy-kh/2+8;
    const P={C:[cx+bw+6,wy],B:[W/2,wy],A:[ax-6,wy]};
    g.ln(cx+bw+6,wy,ax-6,wy,col.line,2,[5,5]);

    g.rr(kx,ky,kw,kh,14,col.panel,col.ink,2);g.t('token bucket',W/2,ky-12,{c:col.muted,s:11.5});
    const tw=(kw-16)/CAP;for(let k=0;k<CAP;k++){const cx2=kx+8+tw*(k+.5),cy=ky+kh-22;
      if(k<Math.floor(tok))g.dot(cx2,cy,Math.min(10,tw/2.6),col.slot);
      else if(k===Math.floor(tok))g.ring(cx2,cy,Math.min(9,tw/2.8),tok-k,col.slot,2.5);
      else g.dot(cx2,cy,Math.min(10,tw/2.6),col.panel2)}
    F.run(g,t,P);
    g.t(Math.floor(tok)+' / '+CAP+' tokens · refills '+rate+'/s',W/2,H-16,{c:col.muted,s:12.5,w:600});
    sO(ok);sN(no);

D.backpressure=(s,ui)=>{const CAP=8,MEM=20;let rate=2.5,bp=false,q=[],acc=0,prod=0,proc=0,drop=0,ct=0,drops=[],flash=-9;
  ui.slider('Producer speed',.5,5,rate,v=>rate=v,v=>v+' /s',.5);
  ui.toggle('Backpressure (pause the producer when the queue is full)',false,v=>{bp=v;if(bp)q.length=Math.min(q.length,CAP)});
  const sP=ui.stat('produced','req'),sC=ui.stat('processed','ad'),sD=ui.stat('dropped','bad'),sQ=ui.stat('in queue','slot');
  s.label('A producer, a queue, and a slower consumer; the queue either grows and drops work or signals the producer to pause.');
  s.frame((t,dt)=>{const {g,W,H}=s;const paused=bp&&q.length>=CAP;
    acc+=dt*rate;while(acc>=1){if(paused){acc=1;break}acc--;
      if(!bp&&q.length>=MEM){drop++;drops.push({t,x:0})}else{q.push(t);prod++}}
    ct+=dt*1.2;if(ct>=1){if(q.length){q.shift();proc++;ct=0;flash=t}else ct=1}
    const bw=Math.min(96,W*.2),bh=54,y=34,px=4,cx=W-4-bw,qx=px+bw+12,qw=cx-12-qx,wy=y+bh/2;
    g.box(px,y,bw,bh,'Producer',col.req,{sub:paused?'paused':rate+' /s',subc:paused?col.pop:col.muted});
    g.box(cx,y,bw,bh,'Consumer',col.ad,{sub:'1.2 /s',glow:t-flash<.25});
    const slots=bp?CAP:MEM,sw=qw/slots;
    for(let k=0;k<slots;k++){const x=qx+k*sw,over=k>=CAP;g.rr(x+1,wy-14,sw-2,28,4,null,over?alpha(col.bad,.45):col.line,1,[3,3])}
    q.forEach((_,k)=>{const x=qx+qw-(k+1)*sw;g.rr(x+2,wy-12,sw-4,24,4,k>=CAP?col.bad:col.slot)});
    g.t('queue  (front is on the right →)',qx,wy-26,{c:col.muted,s:11,a:'left'});
    if(paused){g.ln(qx,wy+26,px+bw/2,wy+26,col.pop,2,[5,4]);g.ln(px+bw/2,wy+26,px+bw/2,y+bh+2,col.pop,2);g.pill(qx+qw/2,wy+38,'queue full: wait',col.pop,col.on)}
    drops=drops.filter(d=>{const a=t-d.t;if(a>1.2)return false;g.rr(qx+6,wy+18+a*90,sw-4,20,4,alpha(col.bad,1-a/1.2));return true});
    const my=H-34,mw=W-8,used=bp?q.length/MEM:q.length/MEM;
    g.t('memory used by the queue',4,my-12,{c:col.muted,s:11,a:'left'});
    g.rr(4,my,mw,14,7,col.panel2);g.rr(4,my,mw*clamp(used,0,1),14,7,used>.9?col.bad:used>.4?col.slot:col.ad);
    if(!bp&&q.length>=MEM)g.t('full: new work is being dropped',W-4,my-12,{c:col.bad,s:11.5,w:700,a:'right'});
    sP(prod);sC(proc);sD(drop);sQ(q.length);
  })};

D['thundering-herd']=(s,ui)=>{const NC=10,TTL=4;let co=false,valid=0,fetching=false,waiting=[],db=0,peak=0,dbq=0,hits=0;const F=Fl();const nx=[];let init=false;
  ui.toggle('Request coalescing (only one request refreshes)',false,v=>{co=v;peak=0;dbq=0;hits=0});
  const sQ=ui.stat('database queries','slot'),sP=ui.stat('peak DB load','bad'),sH=ui.stat('cache hits','ad');
  const back=i=>F.add({a:'K',b:'c'+i,dur:.35,c:col.ad});
  const atK=i=>{if(s.T<valid){hits++;back(i);return}
    if(co&&fetching){waiting.push(i);return}
    if(co)fetching=true;dbq++;
    F.add({a:'K',b:'DB',dur:.3,c:col.slot,done:()=>{db++;peak=Math.max(peak,db);
      F.add({a:'DB',b:'DB',dur:1,hide:true,done:()=>{db--;F.add({a:'DB',b:'K',dur:.3,c:col.slot,done:()=>{valid=s.T+TTL;fetching=false;back(i);waiting.splice(0).forEach(back)}})}})}})};
  s.label('Many clients, one cache key, and a database that gets hit by every request when the key expires.');
  s.frame((t,dt)=>{const {g,W,H}=s;if(!init){valid=t+2.5;for(let i=0;i<NC;i++)nx[i]=t+rnd();init=true}
    for(let i=0;i<NC;i++)if(t>=nx[i]){nx[i]=t+.5+rnd()*.8;F.add({a:'c'+i,b:'K',dur:.35,c:col.req,done:()=>atK(i)})}
    const P={},cx=16,kx=W/2,dx=W-16-Math.min(100,W*.22)/2,dw=Math.min(100,W*.22),top=16,bot=H-40;
    for(let i=0;i<NC;i++){const y=top+(bot-top)*i/(NC-1);P['c'+i]=[cx+6,y];g.dot(cx,y,6,col.pi)}
    const kw=Math.min(150,W*.32),kh=70,ky=(top+bot)/2-kh/2;P.K=[kx,ky+kh/2];P.DB=[dx,ky+kh/2];
    const live=t<valid,rem=Math.max(0,valid-t);
    g.box(kx-kw/2,ky,kw,kh,'cache',live?col.ad:col.bad,{sub:live?'playlist:home ✓':'EXPIRED',subm:true,subc:live?col.muted:col.bad});
    g.rr(kx-kw/2+10,ky+kh-12,(kw-20)*rem/TTL,4,2,col.ad);
    const load=db/NC;g.box(dx-dw/2,ky,dw,kh,'Database',load>.4?col.bad:col.slot,{glow:db>2,sub:db+' running'});
    g.rr(dx-dw/2,ky+kh+12,dw,10,5,col.panel2);g.rr(dx-dw/2,ky+kh+12,dw*Math.min(1,load),10,5,load>.4?col.bad:col.slot);
    waiting.forEach((_,k)=>g.dot(kx-kw/2+10+(k%8)*12,ky-12-Math.floor(k/8)*12,4.5,col.pop));
    if(waiting.length)g.t('waiting for the one refresh',kx,ky-30-Math.floor((waiting.length-1)/8)*12,{c:col.pop,s:11});
    F.run(g,t,P);
    g.t(live?'TTL '+rem.toFixed(1)+' s':(co?'1 request refreshes, the rest wait':'every request misses and hits the database'),W/2,H-14,{c:live?col.muted:col.bad,s:13,w:700});
    sQ(dbq);sP(peak);sH(hits);
  })};

D['load-balancer']=(s,ui)=>{let lc=false,slow=true,rr=0,next=0;const act=[0,0,0],lat=[];let served=[0,0,0];const F=Fl();
  ui.toggle('Least connections (instead of round robin)',false,v=>{lc=v;lat.length=0;served=[0,0,0]});
  ui.toggle('Server 2 is slow',true,v=>slow=v);
  const sA=ui.stat('average latency','req','–'),sD=ui.stat('requests sent to 1 / 2 / 3','ink','0 / 0 / 0');
  s.label('A load balancer spreading requests across three servers, one of which is slow.');
  s.frame((t,dt)=>{const {g,W,H}=s;
    if(t>=next){next=t+.32;const st=t;F.add({a:'C',b:'LB',dur:.25,c:col.req,done:()=>{let k;
      if(lc){k=[0,1,2].sort((a,b)=>act[a]-act[b]||((a-rr+3)%3)-((b-rr+3)%3))[0];rr=(k+1)%3}else{k=rr;rr=(rr+1)%3}
      act[k]++;served[k]++;F.add({a:'LB',b:'S'+k,dur:.25,c:col.req,done:()=>{const d=(k===1&&slow)?2.6:.8;
        F.add({a:'S'+k,b:'S'+k,dur:d,hide:true,done:()=>{act[k]--;lat.push((s.T-st)*125+20);if(lat.length>30)lat.shift()}})}})}})}
    const bw=Math.min(110,W*.24),bh=50,cx=4,lx=Math.max(bw+30,W*.36),sx=W-4-bw,mid=H/2-6;
    const P={C:[cx+bw+6,mid],LB:[lx,mid]};
    g.box(cx,mid-bh/2,bw,bh,'Clients',col.pi);
    for(let k=0;k<3;k++){const y=mid+(k-1)*(bh+18);P['S'+k]=[sx-6,y];g.ln(lx+30,mid,sx-6,y,col.line,1.5,[4,4]);
      const sl=k===1&&slow;g.box(sx,y-bh/2,bw,bh,'Server '+(k+1),sl?col.slot:col.ad,{sub:act[k]+' in progress'+(sl?' · slow':'')});
      for(let j=0;j<Math.min(act[k],12);j++)g.dot(sx-14-j*9,y+bh/2-4,3.2,sl?col.slot:col.ad)}
    g.ln(cx+bw+6,mid,lx-30,mid,col.line,1.5,[4,4]);
    g.box(lx-30,mid-24,60,48,'LB',col.req,{s:14});
    F.run(g,t,P);
    g.t(lc?'Least connections: next request goes to whoever is least busy':'Round robin: 1, 2, 3, 1, 2, 3… regardless of load',W/2,H-10,{c:col.muted,s:12.5,w:600});
    if(lat.length)sA(Math.round(lat.reduce((a,b)=>a+b,0)/lat.length)+' ms');sD(served.join(' / '));
  })};

D.cache=(s,ui)=>{const KEYS='ABCDEF',WT=[34,22,15,11,9,9];let ttl=5,exp={},next=0,hist=[],hits=0,miss=0;const F=Fl();
  const pick=()=>{let r=rnd()*100;for(let i=0;i<6;i++){r-=WT[i];if(r<0)return KEYS[i]}return 'F'};
  ui.slider('TTL',1,12,ttl,v=>ttl=v,v=>v+' s');
  const sR=ui.stat('hit ratio (last 40)','ad','–'),sH=ui.stat('hits · fast','ad'),sM=ui.stat('misses · slow','slot');
  s.label('Requests checking a cache of keys A to F before going to the database.');
  s.frame((t,dt)=>{const {g,W,H}=s;
    if(t>=next){next=t+.55;const k=pick();F.add({a:'C',b:'K',dur:.35,c:col.req,label:k,done:()=>{
      if(exp[k]>s.T){hits++;hist.push(1);F.add({a:'K',b:'C',dur:.35,c:col.ad,label:k+' hit',dy:-16})}
      else{miss++;hist.push(0);F.add({a:'K',b:'DB',dur:.4,c:col.slot,label:k,done:()=>F.add({a:'DB',b:'DB',dur:.5,hide:true,
        done:()=>F.add({a:'DB',b:'K',dur:.4,c:col.slot,label:k,done:()=>{exp[k]=s.T+ttl;F.add({a:'K',b:'C',dur:.35,c:col.slot,label:k+' miss',dy:16})}})})})}
      if(hist.length>40)hist.shift()}})}
    const bw=Math.min(90,W*.2),bh=56,wy=50,cx=4,dx=W-4-bw,kw=Math.min(260,W-2*bw-40),kx=W/2-kw/2,ky=wy-24,kh=118;
    const P={C:[cx+bw+6,wy],K:[W/2,wy],DB:[dx-6,wy]};
    g.box(cx,wy-bh/2,bw,bh,'Client',col.pi);g.box(dx,wy-bh/2,bw,bh,'Database',col.slot,{sub:'slow'});
    g.rr(kx,ky,kw,kh,12,col.panel,col.ad,2);g.t('cache',kx+10,ky+14,{c:col.ad,s:12,a:'left',w:700});
    g.ln(cx+bw+6,wy,kx,wy,col.line,2,[5,5]);g.ln(kx+kw,wy,dx-6,wy,col.line,2,[5,5]);
    const cw=(kw-16)/6;for(let i=0;i<6;i++){const k=KEYS[i],x=kx+8+i*cw,y=ky+56,rem=Math.max(0,(exp[k]||0)-t),on=rem>0;
      g.rr(x+2,y,cw-4,32,6,on?alpha(col.ad,.18):col.panel2,on?col.ad:null,1.5);g.t(k,x+cw/2,y+16,{c:on?col.ink:col.muted,s:14,w:700});
      g.rr(x+4,y+38,(cw-8)*Math.min(1,rem/ttl),4,2,col.ad);if(!on)g.t('empty',x+cw/2,y+50,{c:col.muted,s:9.5,w:500})}
    F.run(g,t,P);
    const pct=['A','B','C','D','E','F'].map((k,i)=>k+' '+WT[i]+'%').join('  ');
    g.t('popularity: '+pct,W/2,H-12,{c:col.muted,s:11,w:500});
    if(hist.length)sR(Math.round(100*hist.reduce((a,b)=>a+b,0)/hist.length)+'%');sH(hits);sM(miss);
  })};

D['connection-pool']=(s,ui)=>{const RTT=.42,WORK=.12;
  const L=[{name:'New connection for every request',st:['TCP handshake','TLS handshake','TLS handshake','query'],i:0,p:0,n:0},
           {name:'Connection pool (already open)',st:['query'],i:0,p:0,n:0}];
  const s0=ui.stat('finished without pool','slot'),s1=ui.stat('finished with pool','ad'),s2=ui.stat('per request','ink','172 vs 52 ms');
  s.label('Two lanes comparing requests that open a new connection each time against requests that reuse pooled connections.');
  s.frame((t,dt)=>{const {g,W,H}=s;const lh=H/2,bw=Math.min(84,W*.2),bh=42;
    L.forEach((l,j)=>{const step=l.st[l.i],d=RTT+(step==='query'?WORK:0);l.p+=dt/d;if(l.p>=1){l.p=0;l.i++;if(l.i>=l.st.length){l.i=0;l.n++}}
      const y0=j*lh,wy=y0+lh/2+8,ax=4,dx=W-4-bw,a=ax+bw+6,b=dx-6;
      g.t(l.name,4,y0+14,{s:12.5,w:700,a:'left',c:j?col.ad:col.slot});g.t(l.n+' done',W-4,y0+14,{s:12.5,w:700,a:'right'});
      g.box(ax,wy-bh/2,bw,bh,'App',col.pi,{s:13});g.box(dx,wy-bh/2,bw,bh,'DB',col.req,{s:13});
      if(j)for(let k=-1;k<=1;k++)g.ln(a,wy+k*8,b,wy+k*8,alpha(col.ad,.35),1.5);else g.ln(a,wy,b,wy,col.line,1.5,[4,4]);
      const cur=l.st[l.i],c=cur==='query'?col.ad:col.slot,rt=cur==='query'?(l.p<RTT/2/d?l.p*d/(RTT/2):l.p*d<RTT/2+WORK?1:1-(l.p*d-RTT/2-WORK)/(RTT/2)):(l.p<.5?l.p*2:2-l.p*2);
      g.pk(lerp(a+6,b-6,rt),wy,c,cur);
      if(!j){const segs=l.st.length,sw=Math.min(36,(W-2*bw-40)/segs);for(let k=0;k<segs;k++)g.rr(W/2-segs*sw/2+k*sw,wy+bh/2+4,sw-3,6,3,k<l.i?(l.st[k]==='query'?col.ad:col.slot):k===l.i?alpha(c,.5):col.panel2)}
      if(j===0)g.ln(0,lh,W,lh,col.line,1)});
    s0(L[0].n);s1(L[1].n);
  })};

D['async-queue']=(s,ui)=>{let as=false,t0=0;
  ui.toggle('Async: reply 202 now, do the work in the background',false,v=>{as=v;t0=s.T});
  const sB=ui.stat('client blocked for','bad','–');
  s.label('Sync versus async job handling with a queue and a background worker.');
  s.frame((t,dt)=>{const {g,W,H}=s;
    const dur=as?[.6,.3,.6,.6,3,.7,2]:[.6,3,.6,2.2],tot=dur.reduce((a,b)=>a+b,0),e=(t-t0)%tot,{i,p}=seq(e,dur);
    const gap=10,bw=Math.min(104,(W-8-3*gap)/4),bh=52,y=50,xs=[0,1,2,3].map(k=>4+k*(bw+gap)),wy=y+bh/2;
    const names=['Client','API','Queue','Worker'],cs=[col.pi,col.req,col.slot,col.ad];

    names.forEach((n,k)=>g.box(xs[k],y,bw,bh,n,dim(k)?col.line:cs[k],{tc:dim(k)?col.muted:cs[k],s:bw<80?12:14,
      glow:(as?[[1],[1],[1,2],[2,3],[3],[3],[]][i]:[[1],[1],[1],[]][i]).includes(k)}));
    const A=k=>xs[k]+bw,B=k=>xs[k];const pk=(k1,k2,q,c,l)=>{const x1=k1<k2?A(k1):B(k1),x2=k1<k2?B(k2):A(k2);g.pk(lerp(x1,x2,ez(q)),wy,c,l)};
    let wait;
    if(!as){
      if(i===0)pk(0,1,p,col.req);
      if(i===1){g.ln(A(0),wy,B(1),wy,col.bad,3);g.spin(xs[1]+bw/2,y+bh+18,7,t,col.req);g.t('building report',xs[1]+bw/2,y+bh+38,{c:col.req,s:11})}
      if(i===2)pk(1,0,p,col.ad,'200');
      wait=i<3?e:dur[0]+dur[1]+dur[2];
      g.t(i<3?'connection held open the whole time':'',W/2,y-22,{c:col.bad,s:12})
    }else{
      if(i===0)pk(0,1,p,col.req);
      if(i===1)pk(1,2,p,col.slot,'job #42');
      if(i===2)pk(1,0,p,col.ad,'202 · #42');
      if(i===3)pk(2,3,p,col.slot,'#42');
      if(i===4){g.spin(xs[3]+bw/2,y+bh+18,7,t,col.ad);g.t('building report',xs[3]+bw/2,y+bh+38,{c:col.ad,s:11})}
      if(i===5){const x=lerp(xs[3]+bw/2,xs[0]+bw/2,ez(p));g.pk(x,y-18,col.pop,'webhook: ready')}
      if(i>=1&&i<=2)g.dot(xs[2]+bw/2,y+bh+14,5,col.slot);
      wait=i<3?e:dur[0]+dur[1]+dur[2];

D['race-condition']=(s,ui)=>{let lock=false,t0=0;const dur=[1.1,1.4,1.4,1.4,1.4,2.8],tot=dur.reduce((a,b)=>a+b,0);

D['eventual-consistency']=(s,ui)=>{let lag=1.2,t0=0,oldV=100,newV=120,stale=0,fresh=0,counted=false;const F0=.6,RD=.8;
  ui.slider('Replication lag',.1,3,lag,v=>lag=v,v=>v.toFixed(1)+' s',.1);
  const sS=ui.stat('stale reads','bad'),sF=ui.stat('fresh reads','ad');
  s.label('A write reaching a primary database and spreading to replicas while a reader reads from a lagging replica.');
  s.frame((t,dt)=>{const {g,W,H}=s;const e=t-t0,L=lag,r1=F0+L*.6,r2=F0+L,readAt=RD+.4,end=Math.max(r2,readAt+.4)+1.8;
    const got=readAt>=r2?newV:oldV;
    if(e>=readAt+.4&&!counted){counted=true;got===newV?fresh++:stale++}
    if(e>end){t0=t;oldV=newV;newV=newV>=180?100:newV+20;counted=false}
    const bw=Math.min(100,W*.22),bh=46,px=W/2-bw/2,py=H/2-bh/2-4,rx=W-4-bw;
    const Pw=[4+bw,30],Pr=[4+bw,H-30],P=[px+bw/2,py+bh/2],R1=[rx,40],R2=[rx,H-40];
    const v=(at)=>e>=at?newV:oldV;
    g.box(4,8,bw,44,'Writer',col.pi,{s:13});g.box(4,H-52,bw,44,'Reader',col.pop,{s:13});
    g.box(px,py,bw,bh,'Primary',col.req,{sub:'price = '+v(F0),subm:true,subc:col.ink});
    g.box(rx,R1[1]-bh/2,bw,bh,'Replica 1',col.ad,{sub:'price = '+v(r1),subm:true,subc:e<r1&&e>F0?col.bad:col.ink});
    g.box(rx,R2[1]-bh/2,bw,bh,'Replica 2',col.ad,{sub:'price = '+v(r2),subm:true,subc:e<r2&&e>F0?col.bad:col.ink});
    [[Pw,P],[P,R1],[P,R2],[Pr,R2]].forEach(([a,b])=>g.ln(a[0],a[1],b[0]-(b===P?bw/2:0),b[1],col.line,1.5,[4,4]));
    const fly=(a,b,q,c,l)=>g.pk(lerp(a[0],b[0],ez(q)),lerp(a[1],b[1],ez(q)),c,l);
    if(e<F0)fly(Pw,[px,P[1]],e/F0,col.pi,'price = '+newV);
    if(e>F0&&e<r1)fly([px+bw,P[1]],R1,(e-F0)/(r1-F0),col.ad,null);
    if(e>F0&&e<r2)fly([px+bw,P[1]],R2,(e-F0)/(r2-F0),col.ad,null);
    if(e>RD&&e<readAt)fly(Pr,R2,(e-RD)/.4,col.pop,'read');
    if(e>readAt&&e<readAt+.4)fly(R2,Pr,(e-readAt)/.4,got===newV?col.ad:col.bad,String(got));
    if(e>=readAt+.4)g.t(got===newV?'Reader saw '+got+' (fresh)':'Reader saw '+got+', but the price is now '+newV+' (stale)',W/2,py+bh+24,{c:got===newV?col.ad:col.bad,s:12.5,w:700});
    sS(stale);sF(fresh);
  })};

/* path-following packets for multi-segment routes; points resolved every frame */
function PathFl(){const L=[];return{L,
  add(o){L.push(o);return o},
  run(g,t,P,colOf){for(let i=L.length-1;i>=0;i--){const f=L[i];if(f.st==null)f.st=t;const p=(t-f.st)/f.dur;
    if(p>=1){L.splice(i,1);f.then&&f.then();continue}
    const pts=f.path.map(k=>P[k]);if(pts.some(x=>!x))continue;
    const seg=[];let tot=0;for(let k=1;k<pts.length;k++){const d=Math.hypot(pts[k][0]-pts[k-1][0],pts[k][1]-pts[k-1][1]);seg.push(d);tot+=d}
    let dist=ez(p)*tot,k=0;while(k<seg.length-1&&dist>seg[k]){dist-=seg[k];k++}
    const q=seg[k]?dist/seg[k]:0,x=lerp(pts[k][0],pts[k+1][0],q),y=lerp(pts[k][1],pts[k+1][1],q);
    g.pk(x,y,colOf(f.type),f.label,f.r||5)}}}}

    g.box(4,aC-40,dw,86,narrow?'Dashboard':'Angular dashboard',col.pop,{sub:narrow?'Angular':'FE layer · '+dash,glow:busy('Dd')||busy('Db')});
    // players: stacked cards
    const off=t<piOff,ph=narrow?100:136,py=aC-40;
    for(let k=2;k>=1;k--)g.rr(pL+k*5,py-k*5,dw,ph,2,col.panel,alpha(col.slot,.35),1);
    g.rr(pL,py,dw,ph,2,col.panel,off?col.line:col.slot,2);
    g.t(narrow?'RPi players':'Raspberry Pi players',pL+dw/2,py+16,{c:off?col.muted:col.slot,s:narrow?12:13.5,w:700});
    g.t(off?'rebooting…':'×6,000 · USA',pL+dw/2,py+33,{c:off?col.bad:col.muted,s:11,m:true});
    if(!narrow){[['NGINX → player UI (Angular)',col.pop],['Node.js backend',col.ad],['SQLite (local copy)',col.req]].forEach(([l,c],k)=>{const ry=py+50+k*26;
      g.rr(pL+10,ry,dw-20,22,2,off?col.panel2:alpha(c,.12),off?null:alpha(c,.5),1);g.t(l,pL+dw/2,ry+11,{s:11.5,c:off?col.muted:col.ink,w:500})})}
    F.run(g,t,P,colOf);
    sH(cH);sS(cS);sQ(cQ);
  })};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= Cover: NTV360 system in 3D (three.js) ================= */
function Arch3D(host,ui,H){
  if(!window.THREE)throw new Error('three.js not loaded');
  const css=k=>getComputedStyle(document.documentElement).getPropertyValue('--'+k).trim();
  const C=k=>new THREE.Color(css(k));
  const wrap=document.createElement('div');wrap.className='arch3d';wrap.style.height=H+'px';host.appendChild(wrap);
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));wrap.appendChild(renderer.domElement);
  const overlay=document.createElement('div');overlay.className='a3lab';wrap.appendChild(overlay);
  const hint=document.createElement('div');hint.className='a3hint';hint.textContent='Drag to rotate';wrap.appendChild(hint);
  const scene=new THREE.Scene();
  const cam=new THREE.OrthographicCamera(-10,10,10,-10,-200,400);
  scene.add(new THREE.AmbientLight(0xffffff,.55));const dl=new THREE.DirectionalLight(0xffffff,.75);dl.position.set(8,18,10);scene.add(dl);

  const mat=(c,o={})=>new THREE.MeshLambertMaterial(Object.assign({color:c},o));
  const edges=(mesh,c,op=.9)=>{const e=new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry),new THREE.LineBasicMaterial({color:c,transparent:true,opacity:op}));mesh.add(e);return e};
  const block=(w,h,d,x,z,ck,y=0)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(C(ck).multiplyScalar(.32)));m.position.set(x,y+h/2,z);edges(m,C(ck));scene.add(m);return m};
  const slab=(w,d,x,z,ck,op=.9)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,.25,d),mat(C(ck),{transparent:true,opacity:op}));m.position.set(x,-.13,z);edges(m,C('line2'),.8);scene.add(m);return m};

  // ground grid
  const grid=new THREE.GridHelper(60,60,C('line'),C('line'));grid.material.transparent=true;grid.material.opacity=.35;grid.position.y=-.3;scene.add(grid);
  // AWS platform + nodes
  slab(8.5,13,0,0,'panel2');
  const rds=block(4.6,1.3,2.6,0,-4.2,'ad'),api=block(4.6,1.8,2.8,0,0,'req'),sock=block(4.6,1.3,2.6,0,4.2,'pi');
  // dashboard
  slab(5,5,-11,0,'panel');const dash=block(3.6,1.6,2.8,-11,0,'pop');
  // screen-ish slab on the dashboard
  const scr=new THREE.Mesh(new THREE.BoxGeometry(3,1.1,.08),mat(C('pop'),{transparent:true,opacity:.55}));scr.position.set(0,1.3,-.2);scr.rotation.x=-.2;dash.add(scr);
  // players field: 600 instanced cubes, each = 10 players
  const PX=24,PZ=25,ps=.34,gap=.46,fx=13,fz=0,fw=PX*gap,fd=PZ*gap;slab(fw+1.2,fd+1.2,fx,fz,'panel');
  const pgeo=new THREE.BoxGeometry(ps,ps,ps),pmat=new THREE.MeshLambertMaterial({color:0xffffff});
  const players=new THREE.InstancedMesh(pgeo,pmat,PX*PZ);const pos=[],hot=new Float32Array(PX*PZ),offl=new Uint8Array(PX*PZ);
  const dummy=new THREE.Object3D();let k=0;
  for(let i=0;i<PX;i++)for(let j=0;j<PZ;j++){const x=fx-fw/2+gap/2+i*gap,z=fz-fd/2+gap/2+j*gap;pos.push(new THREE.Vector3(x,ps/2,z));
    dummy.position.set(x,ps/2,z);dummy.updateMatrix();players.setMatrixAt(k,dummy.matrix);offl[k]=Math.random()<.03?1:0;k++}
  scene.add(players);
  const cOn=C('slot').multiplyScalar(.6),cOff=C('line2'),cHot=new THREE.Color(0xffffff).lerp(C('pi'),.35),cIn=C('req'),tmp=new THREE.Color();
  // wires
  const wireMat=(ck,op=.55)=>new THREE.LineDashedMaterial({color:C(ck),dashSize:.35,gapSize:.25,transparent:true,opacity:op});
  const wire=(pts,ck)=>{const g=new THREE.BufferGeometry().setFromPoints(pts.map(p=>new THREE.Vector3(...p)));const l=new THREE.Line(g,wireMat(ck));l.computeLineDistances();scene.add(l)};
  const Y=.9;
  wire([[-9.2,Y,0],[-2.3,Y,0]],'req');wire([[2.3,Y,0],[fx-fw/2-.6,Y,0]],'req');wire([[0,.7,-2.9],[0,.7,-1.4]],'ad');wire([[0,.7,1.4],[0,.7,2.9]],'req');
  wire([[-11,.4,1.4],[-11,.4,4.2],[-2.3,.4,4.2]],'pi');wire([[2.3,.4,4.2],[fx-fw/2-.6,.4,4.2]],'pi');

  // labels (HTML, positioned by projection)
  const labs=[];const lab=(html,cls,obj,off)=>{const d=document.createElement('div');d.className='a3l '+(cls||'');d.innerHTML=html;overlay.appendChild(d);labs.push({d,obj,off:new THREE.Vector3(...off)});return d};
  lab('<b>RDS · MySQL</b><span>database layer</span>','g',rds,[0,1.2,0]);
  lab('<b>.NET Core API</b><span>API layer</span>','b',api,[0,1.4,0]);
  lab('<b>Socket.IO server</b><span>relay · saves status via API</span>','o',sock,[0,1.2,0]);
  const dashLab=lab('<b>Angular dashboard</b><span>FE layer</span>','p',dash,[0,1.9,0]);
  const field=new THREE.Object3D();field.position.set(fx,0,fz-fd/2);scene.add(field);
  lab('<b>Raspberry Pi players</b><span>×6,000 · each cube ≈ 10 · NGINX + Angular UI · Node.js · SQLite</span>','y',field,[0,1.2,-.6]);
  const aws=new THREE.Object3D();aws.position.set(-3.6,0,-6.4);scene.add(aws);lab('AWS','m',aws,[0,.4,0]);

  // packets
  const pkGeo=new THREE.BoxGeometry(.32,.32,.32);const P=[];
  const colOf=t=>t==='http'?css('req'):t==='sock'?css('pi'):css('ad');
  let cH=0,cS=0,cQ=0;
  const send=(a,b,type,label,then,dur=.9,arc=1.2,small)=>{if(type==='http')cH++;else if(type==='sock')cS++;else cQ++;
    const m=new THREE.Mesh(small?new THREE.BoxGeometry(.18,.18,.18):pkGeo,new THREE.MeshBasicMaterial({color:new THREE.Color(colOf(type))}));scene.add(m);
    let d=null;if(label){d=document.createElement('div');d.className='a3pk';d.style.background=colOf(type);d.textContent=label;overlay.appendChild(d)}
    P.push({m,d,a:new THREE.Vector3(...a),b:new THREE.Vector3(...b),st:T,dur,arc,then})};
  const T0=[];const later=(dt,fn)=>T0.push({at:T+dt,fn});
  const A={dash:[-9.2,Y,0],apiL:[-2.3,Y,0],apiR:[2.3,Y,0],apiT:[0,Y,-1.4],rdsB:[0,Y,-2.9],apiB:[0,Y,1.4],sockT:[0,Y,2.9],sockL:[-2.3,.5,4.2],sockR:[2.3,.5,4.2],dashB:[-11,.5,1.4]};
  const P3=v=>[v.x,v.y+.25,v.z];
  const db=(lbl,then)=>send(A.apiT,A.rdsB,'db',lbl,()=>send(A.rdsB,A.apiT,'db',null,then,.6,.4),.6,.4);
  const checkin=(i,label)=>{const p=P3(pos[i]);send(p,A.apiR,'http',label?'GET playlist':null,()=>db(label?'SELECT':null,()=>send(A.apiR,p,'http',label?'200 · playlist':null,()=>{hot[i]=Math.max(hot[i],.6)},1.1,2)),1.1,2,!label)};
  const live=()=>{let i;do{i=Math.floor(Math.random()*pos.length)}while(offl[i]);return i};
  let log=m=>{const el=document.getElementById('archlog');if(el)el.innerHTML='<b>Now</b>'+m};
  const setDash=s=>{dashLab.querySelector('span').textContent='FE layer · '+s};
  const focus=live();
  ui.btn('Open device list',()=>{log('The dashboard asks the .NET API for a page of devices. The API reads RDS and answers. Online/offline on the list comes from each device’s last check-in, not live.');
    send(A.dash,A.apiL,'http','GET /devices?page=1',()=>db('SELECT … LIMIT 50',()=>send(A.apiL,A.dash,'http','200 · 50 devices',()=>setDash('device list'))))});
  ui.btn('Player check-in',()=>{log('One Pi player asks the API what to play. The API looks it up in RDS, and the player keeps the answer in its local SQLite.');checkin(live(),true)});
  const toast=document.createElement('div');toast.className='a3toast';wrap.appendChild(toast);
  const pop=m=>{toast.textContent=m;toast.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('on'),2800)};
  const sk=(a,b,l,then,small)=>send(a,b,'sock',l,then,1.1,small?1.6:2,small);
  ui.btn('Push playlist',()=>{log('The dashboard sends <code>push:playlist</code> to the Socket.IO server, which relays it to the selected players. Each player calls the .NET API for its new playlist, then sends <code>update:done</code> back through the Socket.IO server to the dashboard, which pops up "Update completed" once all of them report in.');
    const grp=Array.from({length:12},live);let done=0;setDash('pushing to 12 players…');
    sk(A.dashB,A.sockL,'push:playlist',()=>grp.forEach((i,n)=>later(n*.06,()=>{const f=n===0,p=P3(pos[i]);
      sk(A.sockR,p,f?'playlist:update':null,()=>{hot[i]=1;later(.15+Math.random()*.5,()=>
        send(p,A.apiR,'http',f?'GET playlist':null,()=>db(f?'SELECT':null,()=>send(A.apiR,p,'http',f?'200 · new playlist':null,()=>{hot[i]=1;later(.25,()=>
          sk(p,A.sockR,f?'update:done':null,()=>sk(A.sockL,A.dashB,f?'update:done':null,()=>{done++;setDash(done+' of 12 updated');if(done===grp.length){setDash('update completed');pop('✓ Update completed · 12 of 12 players')}},!f),!f))},1.1,2,!f)),1.1,2,!f))},!f)})))});
  ui.btn('Screenshot',()=>{const i=focus,p=P3(pos[i]);log('The dashboard asks for a screenshot through the Socket.IO server. The player takes it and uploads the image to the .NET API, then sends <code>screenshot:done</code> back through the Socket.IO server so the dashboard can show it.');
    sk(A.dashB,A.sockL,'screenshot',()=>sk(A.sockR,p,'screenshot',()=>{hot[i]=1;later(.5,()=>send(p,A.apiR,'http','POST screenshot.png',()=>db('INSERT',()=>send(A.apiR,p,'http','201 Created',()=>
      sk(p,A.sockR,'screenshot:done',()=>sk(A.sockL,A.dashB,'screenshot:done',()=>{setDash('screenshot ready');pop('✓ Screenshot ready')})),1.1,2)),1.1,2))}))});
  ui.btn('Reboot',()=>{const i=focus,p=P3(pos[i]);log('Reboot goes through the Socket.IO server to the player, which drops off (grey) and boots. When it reconnects, the Socket.IO server calls the .NET API to save "online" in RDS, then tells the dashboard.');
    sk(A.dashB,A.sockL,'reboot',()=>sk(A.sockR,p,'reboot',()=>{offl[i]=2;later(2.4,()=>{offl[i]=0;hot[i]=1;sk(p,A.sockR,'connected',()=>
      send(A.sockT,A.apiB,'http','PUT status: online',()=>db('UPDATE',()=>send(A.apiB,A.sockT,'http','200',()=>
        sk(A.sockL,A.dashB,'status: online',()=>{setDash('device back online');pop('● Device back online')}),.6,.3)),.6,.3))})}))});
  const sH=ui.stat('HTTP requests','req'),sS=ui.stat('Socket.IO events','pi'),sQ=ui.stat('database queries','ad');

  // camera control
  let az=-.62,el=.62,drag=null,W=400;const target=new THREE.Vector3(2.6,0,.6);
  const place=()=>{const r=60;cam.position.set(target.x+r*Math.cos(el)*Math.sin(az),target.y+r*Math.sin(el),target.z+r*Math.cos(el)*Math.cos(az));cam.lookAt(target)};
  const fit=()=>{W=wrap.clientWidth;renderer.setSize(W,H);const span=W<640?19:18.5,asp=W/H;cam.left=-span;cam.right=span;cam.top=span/asp;cam.bottom=-span/asp;
    if(cam.top<9){const f=9/cam.top;cam.left*=f;cam.right*=f;cam.top*=f;cam.bottom*=f}cam.updateProjectionMatrix()};
  const ro=new ResizeObserver(fit);ro.observe(wrap);fit();
  renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,az,el};renderer.domElement.setPointerCapture(e.pointerId);hint.style.opacity=0});
  renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;az=drag.az-(e.clientX-drag.x)*.008;el=clamp(drag.el+(e.clientY-drag.y)*.006,.2,1.35)});
  renderer.domElement.addEventListener('pointerup',()=>drag=null);
  renderer.domElement.style.touchAction='pan-y';

  let T=0,last=performance.now(),raf,alive=true,nextBg=0;const v=new THREE.Vector3();
  const loop=now=>{if(!alive)return;const dt=document.hidden?0:Math.min(.05,(now-last)/1000)*(REDUCED?.6:1);last=now;T+=dt;
    if(!drag&&!REDUCED)az+=dt*.03;place();
    for(let n=T0.length-1;n>=0;n--)if(T>=T0[n].at){const f=T0[n].fn;T0.splice(n,1);f()}
    if(T>=nextBg){nextBg=T+.35+Math.random()*.4;checkin(live(),false)}
    for(let n=P.length-1;n>=0;n--){const p=P[n],q=(T-p.st)/p.dur;if(q>=1){scene.remove(p.m);p.m.geometry!==pkGeo&&p.m.geometry.dispose();p.m.material.dispose();if(p.d)p.d.remove();P.splice(n,1);p.then&&p.then();continue}
      const e=ez(q);p.m.position.lerpVectors(p.a,p.b,e);p.m.position.y+=Math.sin(Math.PI*e)*p.arc;
      if(p.d){v.copy(p.m.position).project(cam);p.d.style.transform=`translate(${(v.x+1)/2*W}px,${(1-v.y)/2*H-18}px) translate(-50%,-50%)`}}
    for(let i=0;i<pos.length;i++){hot[i]=Math.max(0,hot[i]-dt*.8);const base=offl[i]?cOff:cOn;tmp.copy(base);if(hot[i]>0)tmp.lerp(cHot,hot[i]);players.setColorAt(i,tmp)}
    players.instanceColor.needsUpdate=true;
    renderer.render(scene,cam);
    labs.forEach(l=>{v.copy(l.obj.position).add(l.off).project(cam);l.d.style.transform=`translate(${(v.x+1)/2*W}px,${(1-v.y)/2*H}px) translate(-50%,-100%)`});
    sH(cH);sS(cS);sQ(cQ);raf=requestAnimationFrame(loop)};
  raf=requestAnimationFrame(loop);
  return{stop(){alive=false;cancelAnimationFrame(raf);ro.disconnect();renderer.dispose();wrap.remove()}};
}
</script>
<script>
/* ---------- language: English · Tagalog · Bisaya (Cebuano) ----------
   Informal on purpose, tech words stay English. Only the one-liners, "Picture it" and labels are translated so far;
   anything missing falls back to English. LOL = the punchline under each "Picture it". */
const I18N={"tl":{"ui":{"search":"Hanapin: p99, 429, cache…","show":"Ipakita ang contents","hide":"Itago ang contents","collapse":"I-collapse lahat","expand":"I-expand lahat","start":"dito magsimula","done":"Nagawa mo na 'to","picture":"Isipin mo 'to","see":"Tingnan din","plain":"Sa simpleng salita","enonly":"English pa 'to sa ngayon. Yung mahahabang explanation, isasalin pa lang.","try":"Subukan mo","nextterm":"Susunod na term →","where":"Saan nakatira ang bawat term","inarch":"Sa Architecture guide","howpage":"Paano basahin ang bawat page","a1t":"Isang sentence","a1d":"Ang buong idea, pinakamaikli na, at naka-spell out ang bawat abbreviation.","a2d":"Animation na may mga knob. Sirain mo nang sadya.","a3d":"Kung saan mo 'to makikita sa NTV360 dashboard, API at players.","a4d":"Halimbawa mula sa labas ng mundo ng computer, na kayang intindihin kahit ng bata.","title":"Mga salitang mukhang mahirap, para sa mga bagay na ginagawa mo na","intro":"Natutunan mo ang polymorphism sa kakasulat ng code, bago pa may nakapagpaliwanag nito nang maayos. Ganun din ang backend jargon: p99, backpressure, idempotency. Karamihan diyan, pangalan lang ng bagay na nagawa mo na, na-debug mo na, o minura mo na. Lahat ng example dito ay gumagamit ng NTV360 system sa baba.","lv_beginner":"Dito magsimula. Mga salitang maririnig mo sa unang linggo mo sa API team.","lv_mid":"Nagsi-ship ka na ng features. Ipinapaliwanag ng mga 'to kung bakit mabagal o weird ang ilan sa kanila.","lv_hard":"Pagpapatakbo sa production: reliability, retries, mga numero sa dashboard.","lv_insane":"Mga problemang lumalabas lang pag malaki na ang scale, pag libo-libong client ang sabay-sabay kumilos."},"one":{"rest":"Ang REST (REpresentational State Transfer) ay paraan ng pag-design ng API kung saan ang URL ang pangalan ng bagay (resource), tapos ang HTTP method ang nagsasabi kung ano'ng gagawin dito.","http-methods":"Ito yung verb ng request. GET para magbasa, POST para gumawa, PUT para palitan lahat, PATCH para baguhin yung parte lang, DELETE para burahin.","status-codes":"Three-digit number na kasama sa bawat response, para malaman kung kumusta yung request. Yung unang digit ang magsasabi kung kaninong problema.","https":"Ang HTTPS (HTTP Secure) ay HTTP na dumadaan sa naka-encrypt na TLS (Transport Layer Security) na connection, kaya walang makakabasa o makakapagbago nito sa gitna.","anatomy":"Pare-pareho ang parte ng bawat HTTP message: first line, headers na may detalye tungkol dito, at minsan body na may laman na data.","auth":"Pagpapatunay kung sino ka sa bawat request, kadalasan gamit ang token na binigay sa'yo ng server nung nag-login ka.","cors":"Cross-Origin Resource Sharing: rule ng browser na hindi pinapabasa sa page ng isang site ang response ng ibang site, maliban kung pinayagan ng site na 'yon.","websocket":"Sa polling, paulit-ulit kang nagtatanong ng “may bago ba?”. Sa WebSocket, may isang connection na laging bukas, kaya ang server na mismo ang magpu-push pag may nangyari.","latency":"Gaano katagal ang isang request, mula pagkapadala mo hanggang bumalik ang sagot.","ttfb":"Time To First Byte: gaano katagal bago dumating ang unang piraso ng sagot, kahit hindi pa tapos dumating yung iba.","throughput":"Ilang request ang natatapos ng system kada segundo. Bilis na sinusukat sa dami, hindi sa oras.","distribution":"Yung hugis na lumalabas pag pinlot mo ang maraming sukat: saan napupunta ang karamihan, at gaano kalayo ang mga nahuhuli.","mean-median":"Ang average, madaling mahatak ng isang napakalaking value. Ang median, yung nasa gitna, halos hindi gumagalaw.","percentiles":"Ang p99 (99th percentile) ibig sabihin, 99% ng mga request ay mas mabilis dito. Ito yung latency ng malas mong 1 sa 100.","tail-latency":"Yung mabagal na dulo ng distribution, at kung bakit lumalala ito pag ang isang request ay umaasa sa marami pang iba.","cold-start":"Yung dagdag na delay sa unang request pagkatapos matagal na naka-idle o kakabukas lang ng isang bagay.","sli-slo-sla":"Ang SLI (Service Level Indicator) ang sinusukat mo. Ang SLO (Service Level Objective) ang target mo. Ang SLA (Service Level Agreement) ang pangako sa kontrata, na may multa.","error-budget":"Yung dami ng failure na pinapayagan ng SLO mo. Pag 99.9% kada buwan, mga 43 minutes lang ang natitira.","timeout":"Yung pinakamatagal na kaya mong hintayin ang sagot bago ka sumuko.","retry-backoff":"Pag nag-fail, subukan ulit, pero pahabain ang hintay kada try at lagyan ng konting random para hindi sabay-sabay ang lahat sa pag-retry.","circuit-breaker":"Tigilan muna ang pagtawag sa service na palaging nagfe-fail, maghintay sandali, tapos i-test nang dahan-dahan bago pagkatiwalaan ulit.","idempotency":"Kahit ipadala mo nang dalawang beses ang parehong request, pareho lang ang epekto na parang isang beses mo lang pinadala.","rate-limiting":"Limit sa dami ng request na pwedeng gawin ng isang client sa loob ng isang time window. Pag lumampas ka, HTTP 429 ang abot mo.","backpressure":"Pag mas mabagal ang consumer kaysa sa producer, itulak pabalik ang producer imbes na hayaang magpatong-patong ang trabaho.","thundering-herd":"Sabay-sabay nagising ang napakaraming request at sabay-sabay ding tumama sa iisang resource.","load-balancer":"Parang traffic enforcer na nagkakalat ng mga papasok na request sa iba’t ibang server.","cache":"Magtabi ng kopya ng sagot malapit sa'yo para hindi mo na kailangang kuwentahin o kunin ulit.","ttl":"Time To Live: gaano katagal pwedeng mabuhay ang naka-cache na item, DNS record, o message bago ituring na luma na.","connection-pool":"Panatilihing bukas ang ilang connection at gamitin ulit ang mga 'yon, imbes na magbukas ng bago sa bawat request.","async-queue":"Tanggapin na ngayon ang job, gawin mamaya sa background, tapos sabihan ang client pag tapos na.","n-plus-1":"Kinuha mo ang listahan gamit ang isang query, tapos nag-query ka pa ng isa para sa bawat item doon.","pagination":"Pagbabalik ng mahabang listahan nang paisa-isang page. Ang offset, “lagpasan mo yung 4”. Ang cursor, “magsimula ka pagkatapos ng item na 'to”.","race-condition":"Dalawang operation ang sabay na tumatakbo, at ang resulta ay depende kung alin ang nauna.","eventual-consistency":"Magkakatugma rin ang lahat ng kopya ng data, hindi lang agad-agad. Sa maikling oras, may makakakita pa ng lumang value."},"like":{"rest":"Parang library. Bawat libro may sariling address sa shelf (yung URL). Pwede mong hiramin, palitan ng bagong edition, o ipatanggal (yung mga method). Hindi ka naaalala ng librarian, kaya ipakita mo ulit ang card mo tuwing balik (stateless).","http-methods":"Parang pag-file ng papeles sa counter. Pagbasa ng form, walang nababago (GET). Pag-file ng bagong form, may nadadagdag na kopya tuwing gagawin mo (POST). Pagpalit ng buong form ng bago, pareho lang ang resulta kahit ilang beses mo pa gawin (PUT).","status-codes":"Parang notice ng delivery. Na-deliver (2xx). Lumipat na ng address (3xx). Mali yung address na sinulat sa parcel (4xx). Nawala ng post office (5xx).","https":"Postcard versus selyadong sobre na may pirma. Kahit sino'ng humawak ng postcard, mababasa niya. Sa sobre, address lang ang kita, at yung pirma ang patunay kung sino ang nagpadala.","anatomy":"Parang parcel. Yung shipping label ang headers: saan papunta, ano ang laman, paano hahawakan. Yung laman ng kahon ang body.","auth":"Parang wristband sa event. Isang beses mo lang ipapakita ang ID sa gate, tapos wristband na lang. Valid lang 'yan ngayong araw.","cors":"Parang bouncer na papasukin lang ang nasa guest list. Sa browser siya nagtatrabaho, hindi sa venue, kaya yung dumadaan sa likod (Postman, servers) hindi niya nahaharang.","websocket":"Tatawag ka sa restaurant kada limang minuto para itanong kung ready na ang table mo, versus iiwan mo na lang number mo para i-text ka nila.","latency":"Parang drive-thru. Yung biyahe papunta sa bintana, yung oras ng pagluto, yung biyahe pabalik. Kahit gaano kabilis magluto, wala ring silbi kung malayo ang daan.","ttfb":"Parang restaurant na nagse-serve muna ng tinapay habang niluluto pa ang main course mo. Yung tinapay ang first byte mo.","throughput":"Parang highway. Yung speed limit ang latency. Pag nagdagdag ka ng lane, hindi bibilis ang kahit isang kotse, pero mas maraming kotse ang makakadaan kada oras.","distribution":"Parang oras ng commute mo. Kadalasan 30 minutes, minsan 35. Tapos isang araw may tumaob na truck, dalawang oras ka sa daan. Pero kahit kailan, hindi ka aabot ng 5 minutes.","mean-median":"May bilyonaryong pumasok sa coffee shop. Biglang ang laki ng average na yaman sa loob. Pero yung median na customer, ordinaryong bumibili lang ng kape.","percentiles":"Parang ranking sa exam. “99th percentile” ibig sabihin, natalo mo ang 99% ng klase. Sa latency baliktad: pag nasa p99 ka, ikaw yung malas.","tail-latency":"Parang group dinner na walang aalis hangga't hindi pa nakakabayad lahat. Mas maraming kasama, mas malaki ang chance na may isang naghahanap pa ng wallet.","cold-start":"Parang kotse sa malamig na umaga. Pangit ang takbo sa unang minuto. Pagkatapos noon, normal na.","sli-slo-sla":"Parang pagda-drive. Ang speedometer ang SLI. Yung sarili mong rule na 5 below the limit ang SLO. Yung nakapaskil na speed limit na may multa ang SLA.","error-budget":"Parang monthly data plan. Gamitin mo kahit paano, pero pag naubos na, kailangan mong magtipid hanggang mag-reset.","timeout":"Parang paghihintay sa barkada mo sa mall. Ikaw ang magdedesisyon: 20 minutes, tapos uuwi na 'ko.","retry-backoff":"Parang siksikang pinto. Kung sabay-sabay umatras at sabay-sabay ulit sumugod ang lahat, maiipit ulit. Pero kung random ang hintay ng bawat isa, makakadaan ang mga tao.","circuit-breaker":"Parang breaker sa bahay. Pag may nag-short, bumabagsak siya para hindi masunog ang bahay. Ibabalik mo nang maingat, isang beses lang.","idempotency":"Parang button ng elevator. Pindutin mo man nang isa o sampung beses, isang elevator lang ang darating.","rate-limiting":"Parang ticket machine sa rides. Pare-pareho ang bilis ng labas ng ticket. Mauubos ng crowd ang stack, tapos maghihintay ang lahat sa susunod na ticket.","backpressure":"Parang kusina na tumitigil tumanggap ng order pag puno na ang ticket rail, imbes na hayaang mahulog sa sahig ang mga ticket.","thundering-herd":"Parang mall na nagbukas sa araw ng sale. Lahat naghihintay, at lahat sabay-sabay pumasok sa iisang segundo.","load-balancer":"Parang counter sa grocery. Ang round robin ay yung staff na tinuturo ka sa lane nang sunud-sunod. Ang least connections ay ikaw mismo pumipili ng pinakamaikling pila.","cache":"Parang may charger ka na sa bag, imbes na umuwi ka pa tuwing kailangan mo mag-charge.","ttl":"Parang best-before date sa karton ng gatas.","connection-pool":"Parang nasa isang mahabang call ka lang kasama ang ka-officemate mo, imbes na ibaba at tawagan ulit sa bawat tanong.","async-queue":"Parang laundry shop. Iiwan mo yung damit, bibigyan ka ng ticket, tapos babalikan mo na lang. Hindi ka naman nakatayo sa counter habang namamalantsa sila.","n-plus-1":"Parang pumupunta ka sa grocery kada isang ingredient, imbes na isang beses lang na may dalang listahan.","pagination":"Bookmark (cursor) versus pag-alala na “nasa page 40 ako” habang may nagsisingit ng pages sa harap (offset).","race-condition":"Parang dalawang tao na sabay nag-withdraw sa joint account sa magkaibang ATM sa iisang segundo, tapos pareho nilang nakita yung buong balance.","eventual-consistency":"Parang paglipat ng bahay. Alam na ng post office ngayon, ng bangko mo next week, ng mga dati mong kaibigan kung kailan lang sila magtanong."}},"ceb":{"ui":{"show":"Abri contents","hide":"Sira contents","collapse":"I-collapse tanan","expand":"I-expand tanan","start":"diri ta start","done":"Nabuhat na nimo ni, actually","picture":"Imagine-a lang ni","see":"Tan-awa sad","plain":"Simple explanation","enonly":"English pa ni for now. Ang taas nga explanation, i-translate pa namo.","try":"Try-a","nextterm":"Next term →","where":"Asa makita ang matag term","inarch":"Sa Architecture guide","howpage":"Unsaon pag-gamit ani nga page","a1t":"One sentence ra","a4d":"Example gikan sa gawas sa computer, nga ma-gets bisan sa bata.","search":"Pangita: p99, 429, cache…","a1d":"Ang whole idea, pinaka-short na, naka-spell out pa ang abbreviations.","a2d":"Animation nga naay knobs. Gubaa lang, okay ra.","a3d":"Asa ni nimo makita sa NTV360 dashboard, API ug players.","title":"Mga words nga murag lisod, pero gibuhat na diay nimo","intro":"Nakat-on ka sa polymorphism kay sige ka og code, wala pa gani nay nag-explain og tarong. Same ra sa backend jargon: p99, backpressure, idempotency. Kadaghanan ana, ngalan ra sa butang nga nabuhat, na-debug, o gimura na nimo. Tanang example diri, gikan sa NTV360 system sa ubos.","lv_beginner":"Diri ta start. Mga words nga madungog nimo sa first week nimo sa API team.","lv_mid":"Nag-ship na ka og features. Diri nimo ma-gets ngano hinay o weird ang uban.","lv_hard":"Pag-run sa production: reliability, retries, mga numbers sa dashboard.","lv_insane":"Mga problema nga mogawas ra pag dako na kaayo, pag libo-libo ka clients dungan."},"one":{"rest":"Ang REST (REpresentational State Transfer) kay style sa pag-design og API: ang URL ang ngalan sa butang (resource), ang HTTP method ang mo-ingon unsay buhaton ana.","http-methods":"Kini ang verb sa request. GET pang-basa, POST pang-create, PUT pang-replace tanan, PATCH pang-edit og part ra, DELETE pang-delete.","status-codes":"Three-digit number sa matag response nga mo-ingon unsa nahitabo. Ang first digit, mo-ingon kinsay sala.","https":"Ang HTTPS (HTTP Secure) kay HTTP nga naka-encrypt gamit ang TLS (Transport Layer Security), so walay maka-basa or maka-usab ana sa tunga.","anatomy":"Same ra ang parts sa matag HTTP message: first line, headers nga naay details, ug usahay body nga naay data.","auth":"Pag-prove kung kinsa ka sa matag request, usually gamit ang token nga gihatag sa server pag-login nimo.","cors":"Cross-Origin Resource Sharing: rule sa browser nga dili ka pabasahon sa response sa laing site, unless gi-allow ka sa site.","websocket":"Sa polling, sige ka og pangutana “naa na bay bag-o?”. Sa WebSocket, naay usa ka connection nga naka-open permi, so ang server na mismo mo-push pag naay nahitabo.","latency":"Unsa ka dugay ang usa ka request, from pag-send nimo hangtod naa na ang tubag.","ttfb":"Time To First Byte: unsa ka dugay before moabot ang first piece sa tubag, bisan wala pa nahuman ang uban.","throughput":"Pila ka requests ang mahuman sa system per second. Speed nga gi-measure sa dami, dili sa oras.","distribution":"Ang shape nga mogawas pag i-plot nimo ang daghang measurements: asa ang kadaghanan, ug unsa ka layo ang mga naulahi.","mean-median":"Ang average, dali ra madala sa usa ka dako kaayo nga value. Ang median, ang naa sa tunga, halos dili mo-move.","percentiles":"Ang p99 (99th percentile) meaning, 99% sa requests mas paspas ani. Kini ang latency sa imong malas nga 1 out of 100.","tail-latency":"Ang hinay nga dulo sa distribution, ug ngano mo-worse pa ni pag ang usa ka request nag-depend sa daghan pa.","cold-start":"Ang extra nga delay sa first request after dugay na-idle o bag-o pa gi-start.","sli-slo-sla":"SLI (Service Level Indicator) ang imong gina-measure. SLO (Service Level Objective) ang imong target. SLA (Service Level Agreement) ang promise sa contract, nga naay multa.","error-budget":"Pila ka failure ang gi-allow sa imong SLO. Pag 99.9% per month, mga 43 minutes ra imong budget.","timeout":"Ang pinaka-dugay nga kaya nimo maghulat sa tubag before ka mo-give up.","retry-backoff":"Pag nag-fail, try-a balik, pero padugaya ang hulat every try ug butangi og random para dili dungan ang tanan mo-retry.","circuit-breaker":"Undang sa usa og tawag sa service nga sige og fail, hulat kadali, then i-test hinay-hinay before nimo i-trust balik.","idempotency":"Bisan i-send nimo og kaduha ang same nga request, same ra gihapon ang effect, murag kausa ra.","rate-limiting":"Limit sa pila ka requests ang pwede sa usa ka client within a time window. Pag lapas ka, HTTP 429 imong makuha.","backpressure":"Pag mas hinay ang consumer kaysa producer, i-push back ang producer imbes nga patong-patongan og trabaho.","thundering-herd":"Daghan kaayo nga requests nga dungan nag-wake up ug dungan sad nga mi-hit sa usa ra ka resource.","load-balancer":"Murag traffic enforcer nga mo-spread sa mga requests sa lain-laing servers.","cache":"Butangi og copy ang tubag duol nimo para di na nimo kinahanglan i-compute or kuhaon balik.","ttl":"Time To Live: unsa ka dugay pwede magpuyo ang cached item, DNS record, or message before i-consider nga luma na.","connection-pool":"Ipa-open ang pipila ka connections ug i-reuse, imbes nga mo-open og bag-o every request.","async-queue":"Dawata ang job karon, buhata later sa background, then sultihi ang client pag human na.","n-plus-1":"Gikuha nimo ang list gamit ang usa ka query, then nag-query pa ka og usa para sa matag item.","pagination":"Pag-return sa taas nga list per page. Offset: “skip-a ang 4”. Cursor: “start after ani nga item”.","race-condition":"Duha ka operations nga dungan nag-run, ug ang result depende kung kinsa ang nauna.","eventual-consistency":"Magka-same ra gihapon ang tanang copies sa data, dili lang dayon. For a while, naay makakita pa sa old value."},"like":{"rest":"Murag library. Ang matag libro naay address sa shelf (ang URL). Pwede nimo hulaman, ilisan og bag-ong edition, or ipa-tangtang (ang methods). Di ka kaila sa librarian, so ipakita lang balik imong card every balik (stateless).","http-methods":"Murag nag-file og papeles sa counter. Pagbasa sa form, walay mausab (GET). Pag-file og bag-ong form, madugangan og copy every time (POST). Pag-replace sa tibuok form, same ra ang result bisan pila ka beses (PUT).","status-codes":"Murag delivery notice. Na-deliver (2xx). Nibalhin na og address (3xx). Sayop ang address sa parcel (4xx). Nawala sa courier (5xx).","https":"Postcard vs sealed nga sobre nga naay pirma. Ang postcard, bisan kinsa maka-basa. Ang sobre, address ra makita, ug ang pirma mo-prove kinsay nag-send.","anatomy":"Murag parcel. Ang shipping label, mao ang headers: asa padulong, unsay sulod, unsaon pag-handle. Ang sulod sa box, mao ang body.","auth":"Murag wristband sa event. Kausa ra nimo ipakita ang ID sa gate, then wristband na lang. Valid ra na karon nga adlaw.","cors":"Murag bouncer nga guest list ra ang pasudlon. Sa browser siya nagtrabaho, dili sa venue, so ang moagi sa likod (Postman, servers) di niya ma-block.","websocket":"Tawag ka sa restaurant every 5 minutes para mangutana kung ready na imong table, vs. ibilin lang imong number para i-text ka nila.","latency":"Murag drive-thru. Ang biyahe padulong sa window, ang pagluto, ang biyahe pabalik. Bisan unsa ka paspas sila magluto, wa gihapoy pulos kung layo ang dalan.","ttfb":"Murag restaurant nga mo-serve una og bread samtang ginaluto pa imong main course. Ang bread, mao imong first byte.","throughput":"Murag highway. Ang speed limit, mao ang latency. Pag dugang ka og lane, walay sakyanan nga mo-paspas, pero mas daghan ang makaagi per hour.","distribution":"Murag imong commute. Usually 30 minutes, usahay 35. Then one day, naay natumba nga truck, 2 hours ka sa dalan. Pero never ka naka-abot in 5 minutes.","mean-median":"Naay bilyonaryo nisulod sa coffee shop. Kalit, dako kaayo ang average nga kwarta sa sulod. Pero ang median nga customer, nagpalit ra gihapon og kape.","percentiles":"Murag ranking sa exam. “99th percentile” meaning, na-beat nimo ang 99% sa class. Sa latency, baliktad: pag naa ka sa p99, ikaw ang malas.","tail-latency":"Murag group dinner nga walay mo-uli hangtod dili pa ka-bayad tanan. Mas daghan og kuyog, mas taas ang chance nga naay usa nga nangita pa sa iyang wallet.","cold-start":"Murag sakyanan sa bugnaw nga buntag. Pangit ang dagan sa first minute. After ana, okay na.","sli-slo-sla":"Murag driving. Ang speedometer, SLI. Imong personal rule nga 5 below sa limit, SLO. Ang speed limit sign nga naay multa, SLA.","error-budget":"Murag monthly data plan. Gamita lang bisan unsaon, pero pag nahurot na, tipid sa ka hangtod mo-reset.","timeout":"Murag naghulat sa imong barkada sa mall. Ikaw mo-decide: 20 minutes, then uli na ko.","retry-backoff":"Murag gidagsaon nga pultahan. Pag dungan tanan mo-atras unya dungan sad mo-sulod, maipit gihapon. Pag random ang hulat sa matag usa, makaagi ra tanan.","circuit-breaker":"Murag breaker sa balay. Pag naay nag-short, mo-trip siya para di masunog ang balay. I-on nimo balik, careful, kausa ra.","idempotency":"Murag button sa elevator. Pindota kausa or napulo ka beses, usa ra gihapon ka elevator ang moabot.","rate-limiting":"Murag ticket machine sa rides. Same ra ang speed sa paggawas sa tickets. Mahurot sa crowd ang stack, then hulat tanan sa next ticket.","backpressure":"Murag kusina nga mo-stop og dawat og orders pag puno na ang ticket rail, imbes nga pasagdan ang tickets mahulog sa salog.","thundering-herd":"Murag mall nga ni-open sa sale day. Tanan naghulat, ug tanan dungan ni-sulod sa same second.","load-balancer":"Murag counter sa grocery. Ang round robin, staff nga mo-tudlo nimo sa lane in order. Ang least connections, ikaw mismo mo-pili sa pinaka-short nga linya.","cache":"Murag naa nay charger sa imong bag, imbes nga mo-uli pa ka every time nga kinahanglan ka mag-charge.","ttl":"Murag best-before date sa karton sa gatas.","connection-pool":"Murag naa ra ka sa usa ka taas nga call sa imong officemate, imbes nga i-end ug tawagan balik every pangutana.","async-queue":"Murag laundry shop. Ibilin nimo ang sinina, hatagan ka og ticket, balikan lang nimo later. Di man ka magbarog sa counter samtang nag-plantsa sila.","n-plus-1":"Murag mo-adto ka sa grocery every ingredient, imbes nga kausa ra nga naay dalang list.","pagination":"Bookmark (cursor) vs. pag-remember nga “naa ko sa page 40” samtang naay sige og insert og pages sa unahan (offset).","race-condition":"Murag duha ka tawo nga dungan nag-withdraw sa joint account sa duha ka ATM sa same second, ug pareho nilang nakita ang full balance.","eventual-consistency":"Murag nibalhin ka og balay. Ang post office, kahibalo na karon. Ang bangko, next week. Ang imong old friends, pag mangutana na lang sila."}}};
const LOL={"en":{"rest":"The librarian has the memory of a goldfish. On purpose.","http-methods":"POST twice and you've ordered two pizzas. Enjoy.","status-codes":"4xx: it's you. 5xx: it's us. 2xx: nobody complains.","https":"Plain HTTP is pinning your password on the barangay bulletin board.","anatomy":"Nobody reads the label until the package goes to the wrong house.","auth":"Lose the wristband and it's back to the long line at the gate (401).","cors":"Yes, the API answered. No, the browser won't show you. Bouncer things.","websocket":"Polling is the kid in the back seat asking “are we there yet?” every minute.","latency":"Fast servers can't fix a long road. Physics doesn't do overtime.","ttfb":"The bread arrives in 2 minutes. The steak... let's not talk about the steak.","throughput":"EDSA has lots of lanes. Your car is still slow. Both are true.","distribution":"The two-hour day is the one your boss remembers.","mean-median":"Average says everyone in the café is rich. Median says it's still KKB.","percentiles":"99th percentile: congrats on an exam, condolences on latency.","tail-latency":"There's always that one friend. In a fan-out, that friend is a server.","cold-start":"Same as you before your first coffee.","sli-slo-sla":"Only the SLA comes with a ticket from the traffic enforcer.","error-budget":"Burn it all by day 3 and it's Free Data until payday.","timeout":"No timeout means waiting at the mall forever. Don't be that person.","retry-backoff":"Jitter is just not rushing the jeepney door all at once.","circuit-breaker":"Flipping it ten times in a row is not a strategy. Ask your electrician.","idempotency":"Pressing it harder doesn't help either. We've all tried.","rate-limiting":"429 is the API saying “one at a time, please, there's a line.”","backpressure":"Saying “not now” is a skill. Kitchens and servers both need it.","thundering-herd":"11.11 sale energy, except the thing getting trampled is your database.","load-balancer":"Nobody wants the lane behind     <div class="fb">${items.map(x=>`<button class="row" data-go="${x.id}"><i style="--c:var(--${l.c})">${ORDER.indexOf(x.id)}</i><div><strong>${x.t}</strong><span>${esc(strip(TR(x,'one')))}</span></div></button>`).join('')}</div></div>`}).join('')}</div>
  <div class="panel" style="margin-top:16px">${ph('book',L('howpage','How each page works'))}

function termPage(x){
  const nx=ORDER[ORDER.indexOf(x.id)+1];
  return `<div class="head"><div class="l"><div class="eyebrow">${badge(x.lv)}<span>${CHAPTERS[x.ch].name}</span></div>
    <h1 class="term">${x.t}</h1>
    ${x.full.length?`<dl class="full">${x.full.map(([a,b])=>`<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join('')}</dl>`:''}
    <p class="one">${TR(x,'one')}</p></div>
    <div class="aka">${x.aka.map(a=>`<span>${esc(a)}</span>`).join('')}</div></div>
  <div class="grid">
    <div class="panel">${ph('fig','Live figure',nx?`<button class="act" data-go="${nx}">${L('nextterm','Next term →')}</button>`:'')}

      <p class="cap"><b>${L('try','Try it')}</b>${x.cap}</p></div></div>
    <div class="side">
      <div class="panel note">${ph('done',L('done',"You've already done this"))}<div class="pb txt"><p>${x.done}</p></div></div>
      <div class="panel likep"><div class="pb txt"><div class="lab">${L('picture','Picture it')}</div><p>${PIC(x)}</p></div></div>
      ${ARCH[x.id]?`<div class="panel">${ph('cube',L('inarch','In the Architecture guide'))}<div class="pb see">${ARCH[x.id].map(([id,t])=>`<a href="architecture-designs.html#${id}"><i>↗</i>${t}<small>design</small></a>`).join('')}</div></div>`:''}
      <div class="panel">${ph('link',L('see','See also'))}<div class="pb see">${x.rel.map(r=>`<button data-go="${r}"><i>${ORDER.indexOf(r)}</i>${byId[r].t}<small>${lvOf(byId[r].lv).name}</small></button>`).join('')}</div></div>
    </div>
  </div>
  <div class="panel plain">${ph('txt',L('plain','In plain words'))}<div class="pb txt">${ENONLY()}${x.body}</div></div>`}
function go(id,push=true){if(!ORDER.includes(id))id='start';const from=ORDER.indexOf(curId),to=ORDER.indexOf(id);
  if(stage){stage.stop();stage=null}curId=id;const page=$('page');
  page.innerHTML=id==='start'?cover():termPage(byId[id]);
  page.classList.remove('turn-n','turn-p');void page.offsetWidth;if(from>=0&&from!==to)page.classList.add(to>from?'turn-n':'turn-p');
  const u=UI($('ctrl'),$('stats'),id);
  if(id==='start'){const h=matchMedia('(max-width:700px)').matches?420:500;
    try{stage=Arch3D($('stage'),u,h)}catch(e){console.warn('3D unavailable, using 2D',e);$('stats').innerHTML='';$('ctrl').innerHTML='';stage=Stage($('stage'),460);D.arch(stage,UI($('ctrl'),$('stats'),'start2'))}}
  else{const x=byId[id];stage=Stage($('stage'),HEIGHTS[x.demo]||240);D[x.demo](stage,u)}
  const x=byId[id];
  $('crumb').innerHTML=id==='start'?'Field Guide / <b>Contents</b>':`${lvOf(x.lv).name} · ${CHAPTERS[x.ch].name} / <b>${esc(x.t)}</b>`;
  $('folio').textContent=id==='start'?'Cover':`${String(to).padStart(2,'0')} / ${TERMS.length}`;
  $('prev').disabled=to<=0;$('next').disabled=to>=ORDER.length-1;
  if(id!=='start'){const k=group==='level'?'l-'+byId[id].lv:'c-'+byId[id].ch;if(COLL[k]){COLL[k]=false;saveColl()}}
  renderToc();linkify();const on=$('toc').querySelector('button.on');if(on)on.scrollIntoView({block:'nearest'});
  if(push){try{history.replaceState(null,'','#'+id)}catch(e){}}
  if(from>=0&&push)window.scrollTo({top:0,behavior:'auto'});
}
document.addEventListener('click',e=>{const f=e.target.closest('.fh');if(f){const p=f.closest('.fp'),k=p.dataset.k;COLL[k]=!COLL[k];saveColl();p.classList.toggle('shut',!!COLL[k]);f.setAttribute('aria-expanded',!COLL[k]);f.querySelector('.act').textContent=COLL[k]?'Show':'Hide';return}
  const b=e.target.closest('[data-go]');if(b){e.preventDefault();hidePop();go(b.dataset.go)}});

const PHR={rest:['REST*','RESTful'],'http-methods':['HTTP method','HTTP methods','GET*','POST*','PUT*','PATCH*','DELETE*'],'status-codes':['status code','status codes','401*','403*','404*','500*','502*','503*','504*'],https:['HTTPS*','TLS*','SSL*','certificate','handshake','encrypted'],
 anatomy:['headers','header','query string','request body','JSON*'],auth:['JWT*','Bearer token','refresh token','authentication','log in','logged in','login'],cors:['CORS*','preflight'],websocket:['WebSocket','WebSockets','polling','poll','Socket.IO*'],
 latency:['latency','round trip','round trips'],timeout:['timeout','timeouts','timed out','times out'],cache:['cache','cached','caching','cache hit','cache miss','caches','Redis*','hit ratio'],ttfb:['TTFB*'],throughput:['throughput','requests per second','RPS*'],
 ttl:['TTL*','TTLs*','time to live'],pagination:['pagination','offset pagination','cursor pagination'],'n-plus-1':['N+1*'],'rate-limiting':['rate limit','rate limiting','rate-limiting','429*'],
 'mean-median':['median','the mean','average','averages','outlier','outliers'],'load-balancer':['load balancer','load balancers','round robin','least connections','horizontal scaling'],'connection-pool':['connection pool','connection pooling','pooling','keep-alive','pooled'],
 'cold-start':['cold start','cold starts'],distribution:['distribution','long tail','long-tailed','histogram'],percentiles:['percentile','percentiles','p50*','p95*','p99*','p99.9*'],
 'sli-slo-sla':['SLI*','SLO*','SLA*','SLOs*','SLAs*'],'error-budget':['error budget','error budgets'],'retry-backoff':['exponential backoff','backoff','jitter','retry','retries','retrying','retried'],
 idempotency:['idempotency','idempotent','idempotency key'],'circuit-breaker':['circuit breaker'],'async-queue':['queue','queues','job queue','message queue','202 Accepted','webhook','background workers'],
 'race-condition':['race condition','race conditions','optimistic concurrency','atomic update','concurrency'],'eventual-consistency':['eventual consistency','replication lag','read replica','read replicas','replica','replicas','stale read'],
 backpressure:['backpressure'],'tail-latency':['tail latency','fan-out','fans out'],'thundering-herd':['thundering herd','request coalescing','stampede']};
const PMAP=new Map();Object.entries(PHR).forEach(([id,arr])=>arr.forEach(p=>{const cs=p.endsWith('*'),w=cs?p.slice(0,-1):p;PMAP.set(w.toLowerCase(),{id,cs,w})}));
const PRE=new RegExp('(?<![\\w-])('+[...PMAP.values()].map(o=>o.w).sort((a,b)=>b.length-a.length).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\w-])','gi');
function linkify(){if(curId==='start')return;const seen=new Set([curId]);
  document.querySelectorAll('#page .one, #page .txt p, #page .cap').forEach(root=>{
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('code,a,b,.xref')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
    const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(n=>{const txt=n.nodeValue;PRE.lastIndex=0;let m,last=0,frag=null;
      while((m=PRE.exec(txt))){const o=PMAP.get(m[1].toLowerCase());if(!o||(o.cs&&m[1]!==o.w)||seen.has(o.id))continue;seen.add(o.id);
        frag=frag||document.createDocumentFragment();frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
        const a=document.createElement('a');a.className='xref';a.href='#'+o.id;a.dataset.go=o.id;a.textContent=m[1];frag.appendChild(a);last=m.index+m[1].length}
      if(frag){frag.appendChild(document.createTextNode(txt.slice(last)));n.replaceWith(frag)}})})}
const pop=document.createElement('div');pop.className='xpop';pop.hidden=true;document.body.appendChild(pop);
function hidePop(){pop.hidden=true}
document.addEventListener('mouseover',e=>{const a=e.target.closest('.xref');if(!a)return;const x=byId[a.dataset.go];if(!x)return;
  pop.innerHTML=`<div class="xh">${badge(x.lv)}<b>${x.t}</b></div>${x.full.length?`<div class="xf">${x.full.slice(0,3).map(([k,v])=>`<span>${esc(k)}</span> ${esc(v)}`).join(' · ')}</div>`:''}<p>${TR(x,'one')}</p><div class="xo">Click to open · page ${ORDER.indexOf(x.id)}</div>`;
  pop.hidden=false;const r=a.getBoundingClientRect(),w=Math.min(340,innerWidth-24);pop.style.width=w+'px';
  let left=clamp(r.left,12,innerWidth-w-12),top=r.bottom+8;pop.style.left=left+'px';pop.style.top=top+'px';
  const ph=pop.offsetHeight;if(top+ph>innerHeight-8)pop.style.top=(r.top-ph-8)+'px'});
document.addEventListener('mouseout',e=>{if(e.target.closest('.xref'))hidePop()});
addEventListener('scroll',hidePop,{passive:true});
$('prev').onclick=()=>{const i=ORDER.indexOf(curId);if(i>0)go(ORDER[i-1])};
$('next').onclick=()=>{const i=ORDER.indexOf(curId);if(i<ORDER.length-1)go(ORDER[i+1])};
document.addEventListener('keydown',e=>{const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'&&e.target.type!=='range'&&e.target.type!=='checkbox')return;
  if(e.key==='/'){e.preventDefault();$('q').focus();return}
  if(tag==='input')return;
  if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==curId)go(h,false)});
go(location.hash.slice(1)||'start',false);
paintLang();
