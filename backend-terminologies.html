<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Backend Field Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: dashboard skin. Fixed left rail = contents + search; right = full-width workspace of sharp bordered panels. Single dark look by design. */
:root{
  color-scheme:dark;
  --bg:#0c161b; --rail:#0f1b21; --panel:#111e25; --panel2:#18272f; --ink:#eef2f4; --muted:#8a9aa3; --line:#22333c; --line2:#2c3f49;
  --brand:#ff6a1a; --req:#4f8cff; --ad:#2ccf7f; --slot:#f5a524; --bad:#ff4d4f; --pop:#a78bfa; --pi:#ff6a1a; --on:#0b1419; --paper:#111e25;
  --sans:'Jost',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:15px;padding:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
::selection{background:var(--brand);color:var(--on)}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}

/* ---------- rail ---------- */
.rail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;
  position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start}
.brand{padding:22px 22px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.brand img{display:block;height:28px;width:auto}
.brand small{display:block;margin-top:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.search{margin:16px 16px 6px;position:relative}
.search input{width:100%;height:40px;border-radius:0;border:1px solid var(--line2);background:var(--panel);padding:0 36px 0 34px;font-size:14px}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--brand);outline:none}
.search svg{position:absolute;left:10px;top:11px;width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2}
.search kbd{position:absolute;right:8px;top:10px;font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line2);padding:1px 6px}
.found{padding:4px 18px 4px;font-family:var(--mono);font-size:10.5px;color:var(--muted);min-height:18px;letter-spacing:.3px}
.toc{overflow:auto;padding:4px 10px 16px;flex:1}
.ch{margin-top:16px}
.ch h3{font-family:var(--mono);font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);margin:0 10px 6px;font-weight:600;display:flex;gap:8px}
.ch h3 i{font-style:normal;color:var(--brand)}
.toc button{display:flex;flex-wrap:wrap;width:100%;align-items:baseline;gap:4px 10px;text-align:left;background:none;border:0;border-left:2px solid transparent;
  padding:7px 10px 7px 14px;cursor:pointer;font-size:14.5px;font-weight:500;color:color-mix(in srgb,var(--ink) 82%,var(--muted))}
.toc button:hover{background:var(--panel);color:var(--ink)}
.toc button.on{background:var(--panel2);border-left-color:var(--brand);color:var(--ink);font-weight:600}
.toc button .pg{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.toc button mark{background:color-mix(in srgb,var(--brand) 35%,transparent);color:inherit;padding:0 1px}
.toc .via{display:block;flex-basis:100%;order:3;font-size:11.5px;color:var(--muted);font-weight:400}
.empty{padding:14px 18px;font-size:13px;color:var(--muted);line-height:1.5}
.railfoot{border-top:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
.railfoot span{font-family:var(--mono);font-size:11px;color:var(--ink);border:1px solid var(--line2);padding:2px 7px}
.mtoggle{display:none}

/* ---------- workspace ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 28px;
  position:sticky;top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);z-index:5}
.crumb{font-family:var(--mono);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:600}
.tnav{margin-left:auto;display:flex;align-items:stretch;border:1px solid var(--line2)}
.tnav button{background:var(--panel);border:0;padding:0 12px;height:34px;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.tnav button:hover:not([disabled]){color:var(--ink);background:var(--panel2)}
.tnav button[disabled]{opacity:.35;cursor:default}
.tnav span{display:flex;align-items:center;padding:0 12px;border-inline:1px solid var(--line2);font-family:var(--mono);font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums}

.page{padding:26px 28px 28px;flex:1}
.page.turn-n{animation:turnN .32s cubic-bezier(.2,.7,.2,1)}
.page.turn-p{animation:turnP .32s cubic-bezier(.2,.7,.2,1)}
@keyframes turnN{from{opacity:0;transform:translateX(22px)}}
@keyframes turnP{from{opacity:0;transform:translateX(-22px)}}

.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--brand);font-weight:600;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:8px;height:8px;background:var(--brand)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 24px;margin-bottom:20px}
.head .l{min-width:0;flex:1 1 420px}
.term{font-size:clamp(28px,3.4vw,40px);line-height:1.05;margin:8px 0 8px;font-weight:700;letter-spacing:-.6px;text-wrap:balance}
.one{font-size:16.5px;line-height:1.5;margin:0;color:var(--muted);max-width:80ch;text-wrap:pretty}
.one code{font-family:var(--mono);font-size:.85em}
.aka{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:520px}
.aka span{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);background:var(--panel);padding:4px 8px;color:var(--muted)}

.grid{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(300px,1fr);gap:16px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);min-width:0}
.ph{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.ph .ic{width:32px;height:32px;border:1px solid var(--brand);display:grid;place-items:center;flex-shrink:0}
.ph .ic svg{width:16px;height:16px;stroke:var(--brand);fill:none;stroke-width:1.8}
.ph h2{font-size:15.5px;font-weight:600;margin:0}
.ph .act{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);background:none;border:0;cursor:pointer;padding:4px 0}
.ph .act:hover{color:var(--ink)}
.pb{padding:18px}
.lab{font-family:var(--mono);font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
.lab em{font-style:normal;color:var(--brand)}

.stats{display:flex;flex-wrap:wrap;gap:0;margin:-18px -18px 16px;border-bottom:1px solid var(--line)}
.stats:empty{display:none}
.stat{display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:6px;padding:12px 18px;border-right:1px solid var(--line);min-width:0;flex:1 1 140px}
.stat b{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.3px}
.stat span{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase;line-height:1.3}
.stage{width:100%;position:relative}
.stage canvas{display:block}
.ctrl{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin:16px -18px -18px;padding:14px 18px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--rail) 60%,var(--panel))}
.ctrl:empty{display:none}
.sl{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;flex-wrap:wrap}
.sl input{width:150px;accent-color:var(--brand)}
.sl output{font-family:var(--mono);font-size:11.5px;color:var(--brand);min-width:62px}
.tg{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;font-weight:500;user-select:none}
.tg input{position:absolute;opacity:0;width:1px;height:1px}
.sw{width:38px;height:20px;background:var(--panel2);border:1px solid var(--line2);position:relative;transition:background .2s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;background:var(--muted);transition:all .2s}
.tg input:checked + .sw{background:var(--brand);border-color:var(--brand)}
.tg input:checked + .sw::after{left:21px;background:var(--on)}
.tg input:focus-visible + .sw{outline:2px solid var(--brand);outline-offset:2px}
.btn{border:1px solid var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand);padding:7px 13px;
  font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:600;cursor:pointer}
.btn:hover{background:var(--brand);color:var(--on)}
.btn.ghost{border-color:var(--line2);background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--panel2);color:var(--ink)}
.cap{font-size:13.5px;color:var(--muted);margin:14px 0 0;line-height:1.5}
.cap b{font-family:var(--mono);color:var(--brand);font-weight:600;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;margin-right:8px}

.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.txt p{font-size:15.5px;line-height:1.65;margin:0 0 12px;max-width:72ch;color:color-mix(in srgb,var(--ink) 88%,var(--muted))}
.txt p:last-child{margin-bottom:0}
.txt strong{color:var(--ink);font-weight:600}
.txt em{color:var(--ink)}
.txt code{font-family:var(--mono);font-size:.82em;background:var(--panel2);border:1px solid var(--line);padding:1px 5px}
.note{border-left:2px solid var(--ad)}
.note .lab{color:var(--ad)}
.likep{border-left:2px solid var(--pop)}
.likep .lab{color:var(--pop)}
.see{display:flex;flex-direction:column}
.see button{display:flex;align-items:center;gap:12px;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;text-align:left;cursor:pointer;font-size:14.5px;font-weight:500}
.see button:first-child{border-top:0;padding-top:0}
.see button:hover{color:var(--brand)}
.see button i{font-style:normal;font-family:var(--mono);font-size:11px;width:24px;height:24px;border:1px solid var(--brand);color:var(--brand);display:grid;place-items:center;flex-shrink:0}
.see button small{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.plain{margin-top:16px}
.plain .pb{columns:2 380px;column-gap:40px}
.plain .pb p{break-inside:avoid}

/* cover */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);padding:16px 18px}
.kpi:first-child{border-left:2px solid var(--brand)}
.kpi .lab{margin-bottom:8px}
.kpi b{font-size:34px;font-weight:600;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.kpi:first-child b{color:var(--brand)}
.kpi p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;align-items:start}
.row{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 18px;text-align:left;cursor:pointer;min-width:0}
.row:first-child{border-top:0}
.row:hover{background:var(--panel2)}
.row i{font-style:normal;font-family:var(--mono);font-size:11px;width:26px;height:26px;border:1px solid var(--brand);color:var(--brand);display:grid;place-items:center;flex-shrink:0}
.row div{min-width:0;flex:1}
.row strong{display:block;font-size:14.5px;font-weight:600}
.row span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.anat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.anat div{padding:16px 18px;border-right:1px solid var(--line);font-size:13.5px;line-height:1.5;color:var(--muted)}
.anat div:last-child{border-right:0}
.anat b{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14.5px;font-weight:600;margin-bottom:4px}
.anat b::before{content:"";width:8px;height:8px;background:var(--c)}


/* levels, abbreviations, cover extras */
.grp{display:flex;margin:4px 16px 2px;border:1px solid var(--line2)}
.grp button{flex:1;background:var(--panel);border:0;padding:6px 0;font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);cursor:pointer}
.grp button+button{border-left:1px solid var(--line2)}
.grp button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--brand)}
.lvd{width:7px;height:7px;flex-shrink:0;align-self:center}
.lvb{font-family:var(--mono);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--c);border:1px solid var(--c);padding:2px 7px;background:color-mix(in srgb,var(--c) 12%,transparent)}
.eyebrow span{color:var(--muted)}
.eyebrow:has(.lvb)::before{display:none}
.full{display:flex;flex-wrap:wrap;gap:6px 18px;margin:2px 0 12px;padding:0}
.full div{display:flex;gap:8px;align-items:baseline}
.full dt{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--brand)}
.full dd{margin:0;font-size:14px;color:var(--ink)}
.where{display:flex;flex-direction:column}
.wh{padding:14px 18px;border-top:1px solid var(--line)}
.wh:first-child{border-top:0}
.wh .lab{margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:var(--panel2);border:1px solid var(--line2);padding:4px 9px;font-size:12.5px;cursor:pointer}
.chips button:hover{border-color:var(--brand);color:var(--brand)}
.kpi.lvk{text-align:left;cursor:pointer;border-left:2px solid var(--c);font:inherit;color:inherit}
.kpi.lvk b{color:var(--c)}
.kpi.lvk:hover{background:var(--panel2)}
.row i{border-color:var(--c,var(--brand));color:var(--c,var(--brand))}
.arch3d{position:relative;width:100%;overflow:hidden;background:radial-gradient(ellipse at 55% 40%,color-mix(in srgb,var(--panel2) 70%,transparent),transparent 70%)}
.arch3d canvas{display:block;cursor:grab}
.arch3d canvas:active{cursor:grabbing}
.a3lab{position:absolute;inset:0;pointer-events:none}
.a3l{position:absolute;left:0;top:0;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line2);border-left:2px solid var(--brand);padding:4px 8px;white-space:nowrap}
.a3l b{display:block;font-size:12.5px;font-weight:600}
.a3l span{display:block;font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.4px}
.a3l.g{border-left-color:var(--ad)}.a3l.b{border-left-color:var(--req)}.a3l.o{border-left-color:var(--pi)}.a3l.p{border-left-color:var(--pop)}.a3l.y{border-left-color:var(--slot)}
.a3l.m{border:0;background:none;font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--muted)}
.a3pk{position:absolute;left:0;top:0;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--on);padding:2px 6px;white-space:nowrap}
.a3toast{position:absolute;left:12px;top:12px;background:var(--panel);border:1px solid var(--ad);border-left:3px solid var(--ad);padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--ad);opacity:0;transform:translateY(-6px);transition:all .3s;pointer-events:none}
.a3toast.on{opacity:1;transform:none}
.a3hint{position:absolute;right:10px;bottom:8px;font-family:var(--mono);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);transition:opacity .4s}
@media (max-width:700px){.a3l span{display:none}.a3l b{font-size:11px}}


/* folding + cross-links */
.ch h3{margin:0 0 4px}
.gh{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:4px 10px;cursor:pointer;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;text-align:left}
.gh:hover{color:var(--ink)}
.gh svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.6;transition:transform .2s;flex-shrink:0}
.gh em{margin-left:auto;font-style:normal;color:var(--muted);font-size:10px}
.ch.shut .gh svg{transform:rotate(-90deg)}
.ch.shut .gi{display:none}
.found{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fold{background:none;border:0;padding:0;font-family:var(--mono);font-size:10.5px;color:var(--brand);cursor:pointer;letter-spacing:.3px}
.fold:hover{text-decoration:underline}
.fh{width:100%;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;font:inherit;color:inherit}
.fh:hover{background:var(--panel2)}
.fh h2 small{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:500;margin-left:6px}
.chev{width:14px!important;height:14px!important;transition:transform .2s}
.fp.shut .chev{transform:rotate(-90deg)}
.fp.shut .fh{border-bottom:0}
.fp.shut .fb{display:none}
a.xref{color:inherit;text-decoration:underline dotted color-mix(in srgb,var(--brand) 80%,transparent);text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:pointer}
a.xref:hover{color:var(--brand);text-decoration-style:solid}
.xpop{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line2);border-top:2px solid var(--brand);padding:12px 14px;box-shadow:0 18px 40px -16px rgb(0 0 0 / .7);pointer-events:none}
.xpop .xh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.xpop .xh b{font-size:15px}
.xpop .xf{font-size:12px;color:var(--muted);margin-bottom:6px}
.xpop .xf span{font-family:var(--mono);color:var(--brand);font-weight:700}
.xpop p{margin:0;font-size:13.5px;line-height:1.5}
.xpop p code{font-family:var(--mono);font-size:.85em}
.xpop .xo{margin-top:8px;font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
@media (hover:none){.xpop{display:none}}

@media (max-width:1180px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.anat{grid-template-columns:repeat(2,minmax(0,1fr))}.anat div:nth-child(2){border-right:0}.anat div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .mtoggle{display:block;margin:4px 16px 12px;width:calc(100% - 32px)}
  .rail:not(.open) .toc,.railfoot{display:none}
  .toc{max-height:55vh}
  .topbar{padding:0 16px}
  .page{padding:20px 16px}
  .aka{justify-content:flex-start}
  .pb{padding:14px}
  .stats{margin:-14px -14px 14px}.ctrl{margin:14px -14px -14px;padding:12px 14px}
  .stat{padding:10px 14px;flex-basis:110px}.stat b{font-size:20px}
  .sl input{width:120px}
  .chgrid{grid-template-columns:1fr}
}
@media (max-width:520px){.anat{grid-template-columns:1fr}.anat div{border-right:0;border-bottom:1px solid var(--line)}.tnav button.word{display:none}}
@media (prefers-reduced-motion:reduce){.page.turn-n,.page.turn-p{animation:none}}
/* guide switcher */
.guides{display:flex;gap:6px;flex-wrap:wrap}
.guides a{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line2);padding:2px 7px;text-decoration:none}
.guides a:hover{color:var(--brand);border-color:var(--brand)}

<script>
const CHAPTERS=[
 {n:'I',name:'The basics',blurb:'REST, methods, status codes, HTTPS, tokens, CORS, and WebSockets.'},
 {n:'II',name:'Measuring speed',blurb:'Latency, TTFB, throughput, and the statistics behind p99.'},
 {n:'III',name:'Promises and budgets',blurb:'SLI, SLO, SLA, and how much failure you are allowed.'},
 {n:'IV',name:'When things fail',blurb:'Timeouts, retries, breakers, and protecting a service under load.'},
 {n:'V',name:'Scaling out',blurb:'Load balancers, caches, pools, and queues.'},
 {n:'VI',name:'Data under pressure',blurb:'What goes wrong when many requests touch the same data.'}
];
const TERMS=[
/* ---------- I ---------- */
{id:'latency',ch:1,t:'Latency',aka:['response time','round trip','RTT'],
 one:`How long one request takes, from the moment you send it to the moment the answer is back.`,
 body:`<p>Latency is a stopwatch on a single request. It is made of parts: time on the network going out, time the server spends working, and time on the network coming back.</p><p>When someone says an endpoint is slow, the first useful question is <em>which part</em> is slow. A server that answers in 5 ms can still feel slow if the user is 250 ms away, and a nearby server can feel slow if its query takes a second.</p>`,
 done:`When a Pi player in a store calls the .NET API on AWS, the wait has three parts: the trip across the internet, the API plus its RDS query, and the trip back. When the Angular dashboard loads a page, the Time column in DevTools' Network tab shows the same number.`,
 like:`A drive-through. The drive to the window, the time they cook, the drive back. Faster cooks don't help if the road is long.`,
 demo:'latency',cap:`Drag the sliders. Network time is paid twice: once out, once back.`,rel:['ttfb','throughput','percentiles']},
{id:'ttfb',ch:1,t:'TTFB',aka:['time to first byte','first byte','Waiting (TTFB)'],
 one:`How long until the first piece of the answer arrives, even if the rest is still on its way.`,
 body:`<p>TTFB is measured from sending the request until the first byte of the response reaches you. It covers the trip out, the server's thinking time, and the first trip back. It does not include downloading the rest of the body.</p><p>A high TTFB usually means the server is slow to <em>start</em> answering: a slow query, a cold cache, or code that builds the entire response in memory before sending any of it.</p>`,
 done:`When the dashboard asks the .NET API for a big list, DevTools' Timing tab shows "Waiting for server response". That's TTFB, and most of it is the API building the answer and the RDS query behind it. Paging or streaming large lists brings it down.`,
 like:`A restaurant that brings bread while your main course cooks. The bread is your first byte.`,
 demo:'ttfb',cap:`Switch on "Server buffers the whole response" and watch TTFB grow until it matches the total.`,rel:['latency','cold-start']},
{id:'throughput',ch:1,t:'Throughput',aka:['RPS','QPS','requests per second','capacity'],
 one:`How many requests a system finishes per second. Speed measured in volume, not in time.`,
 body:`<p>Latency is how long one request takes. Throughput is how many requests get finished in a period of time. They are related, but they are different numbers.</p><p>You can raise throughput without making any single request faster by working on more of them at once: more workers, more servers, more connections. A handy rule of thumb: <strong>throughput ≈ workers ÷ latency</strong>. Four workers at 500 ms each finish about 8 requests per second.</p>`,
 done:`About 6,000 Pi players talk to one .NET API. If each one checks in once a minute, that's 6,000 ÷ 60 = 100 requests per second before anyone opens the dashboard. That's throughput, and it's what the API servers and RDS have to keep up with.`,
 like:`A highway. The speed limit is latency. Adding lanes doesn't make any car faster, but more cars get through each hour.`,
 demo:'throughput',cap:`Add workers. Each request still takes the same time, but more finish every second.`,rel:['latency','load-balancer','connection-pool']},
{id:'distribution',ch:1,t:'Statistical distribution',aka:['histogram','bell curve','long tail','skew','normal distribution'],
 one:`The shape you get when you plot many measurements: where most values land, and how far the stragglers go.`,
 body:`<p>Run the same request a thousand times and you get a thousand slightly different latencies. Put them into buckets and count how many land in each. That shape is the distribution.</p><p>Some things form a symmetric bell (a normal distribution). API latency almost never does. It bunches up near a fast value and has a long tail stretching to the right, because once in a while a garbage-collection pause, a cache miss, or a busy disk makes a request much slower. Requests can't get much faster than the fast path, but they can get a lot slower.</p><p>The shape matters because it decides which summary number tells the truth. With a long tail, the average misleads you, and percentiles don't.</p>`,
 done:`Chart the response times of the players' API calls and you'll get this shape. Most land fast, and a few stragglers stretch the tail far to the right: a slow RDS query, a busy moment on the API, or a player on a weak store network.`,
 like:`Commute times. Most days 30 minutes, some days 35. One day a truck tips over and it's two hours. You never get there in 5.`,
 demo:'distribution',cap:`Each falling dot is one request landing in its latency bucket. Switch between the two shapes and watch the mean drift right of the median.`,rel:['mean-median','percentiles','tail-latency']},
{id:'mean-median',ch:1,t:'Mean vs median',aka:['average','median','p50','outlier'],
 one:`The average is easily dragged around by one huge value. The median, the middle value, barely moves.`,
 body:`<p>The <strong>mean</strong> adds everything up and divides by the count. The <strong>median</strong> sorts the values and takes the one in the middle.</p><p>With well-behaved data they are close. Add a single 3-second request to a batch of 100 ms requests and the mean jumps, while the median stays put. For latency, the median (also called p50) tells you what a typical user sees. The mean mostly tells you that something, somewhere, was slow.</p>`,
 done:`If the API's monitoring says "average response 400 ms" while almost every call takes 100 ms, a few slow outliers, maybe one heavy report query, are doing the talking.`,
 like:`A billionaire walks into a café. The average wealth in the room is now enormous. The median customer is still someone buying coffee.`,
 demo:'mean-median',cap:`Add a slow request and see which marker runs away.`,rel:['percentiles','distribution']},
{id:'percentiles',ch:1,t:'Percentiles (p50, p95, p99)',aka:['p50','p90','p95','p99','p99.9','99th percentile','quantile'],
 one:`p99 means 99% of requests were faster than this. It's the latency of your unlucky 1 in 100.`,
 body:`<p>Sort all your request times from fastest to slowest. p50 is the value halfway along the line, p95 is 95% of the way, p99 is 99% of the way. So "p99 is 800 ms" means 99 out of 100 requests finished in 800 ms or less, and 1 in 100 took longer.</p><p>Teams watch p95 and p99 because averages hide the slow end, and the slow end is where users get annoyed. It also adds up fast: if a screen makes 20 API calls, a 1-in-100 slow call shows up on roughly 1 in 5 screen loads.</p>`,
 done:`"p99 of the player playlist endpoint is 900 ms" means 1 in 100 player calls waits that long. At 100 requests per second from 6,000 players, 1 in 100 is still about 60 slow calls every minute.`,
 like:`Exam rankings. "99th percentile" means you beat 99% of the class. With latency it's flipped: being in the p99 is the bad seat.`,
 demo:'percentiles',cap:`Each bar is one request. Watch them sort, then read the markers. Press "New batch" to roll again.`,rel:['tail-latency','mean-median','sli-slo-sla']},
{id:'tail-latency',ch:1,t:'Tail latency',aka:['tail','fan-out','slowest call wins','Promise.all'],
 one:`The slow end of the distribution, and why it gets worse when one request depends on many others.`,
 body:`<p>Tail latency is the p99-and-beyond end of the distribution. On its own, a 1% slow rate sounds harmless.</p><p>But when one request fans out to many backends and waits for all of them, the slowest one decides the total. With 10 backends, the chance that at least one is slow is about 10%. With 100 backends it's about 63%. In a fan-out system the rare slow case becomes the normal case, which is why big systems obsess over p99 and p99.9.</p>`,
 done:`A dashboard page that fires several API calls at once and renders only when all of them return (Angular's <code>forkJoin</code>, or <code>Promise.all</code>) waits for the slowest one. The same happens inside the .NET API when one endpoint runs several queries and merges the results.`,
 like:`A group dinner where nobody leaves until everyone has paid. More friends, more chance someone is still looking for their wallet.`,
 demo:'tail-latency',cap:`Each square is one backend call (1% chance of being slow). Raise the count and watch slow requests become common.`,rel:['percentiles','timeout']},
{id:'cold-start',ch:1,t:'Cold start',aka:['warm-up','boot time','serverless','scale to zero'],
 one:`The extra delay on the first request after something has been idle or freshly started.`,
 body:`<p>Something that was asleep needs time to wake up. A serverless function boots a container, a JVM warms up its compiler, a connection pool opens its first connections, a cache starts empty. The first request pays for all of that. Later requests are fast because the work is already done.</p><p>Cold starts show up as occasional tall spikes, often after quiet periods or deploys.</p>`,
 done:`After a deploy, the first requests to the .NET API are often slower while it starts, warms up, and opens its first connections to RDS. A Pi that just rebooted shows the same pattern: its first calls after boot are slower than the rest.`,
 like:`A car on a cold morning. The first minute is rough. After that it drives normally.`,
 demo:'cold-start',cap:`Press "Go idle" and watch what the next request costs.`,rel:['latency','connection-pool','cache']},
/* ---------- II ---------- */
{id:'sli-slo-sla',ch:2,t:'SLI, SLO, SLA',aka:['SLI','SLO','SLA','service level','uptime','availability'],
 one:`SLI is what you measure. SLO is the target you aim for. SLA is the promise in a contract, with a penalty.`,
 body:`<p>These three get mixed up all the time.</p><p>The <strong>SLI</strong> (indicator) is a real measurement, like "percentage of requests that succeeded in under 300 ms". The <strong>SLO</strong> (objective) is your team's internal target for that number, like 99.9% over 30 days. The <strong>SLA</strong> (agreement) is what you've promised a customer, usually looser than the SLO, with money or credits on the line if you miss it.</p><p>You set the SLO tighter than the SLA on purpose, so you notice trouble before it costs anything.</p>`,
 done:`If a client agreement promises screens are online 99.5% of the time, that's an SLA. "We want 99.9% of player API calls to succeed" is an SLO. The measured online/offline numbers in the dashboard are an SLI.`,
 like:`Driving. The speedometer is the SLI. Your personal rule of staying 5 under is the SLO. The posted limit with a fine is the SLA.`,
 demo:'sli-slo-sla',cap:`Cause an outage. The line crosses your own target first, and the contract line later.`,rel:['error-budget','percentiles']},
{id:'error-budget',ch:2,t:'Error budget',aka:['burn rate','nines','99.9%','downtime allowance'],
 one:`The amount of failure your SLO allows. 99.9% per month leaves about 43 minutes.`,
 body:`<p>If your target is 99.9%, then 0.1% failure is acceptable. Over a 30-day month that's 43.2 minutes. That allowance is the error budget.</p><p>Teams spend it on deploys, experiments, and the occasional incident. While there's budget left, ship freely. When it's gone, slow down and work on reliability until it refills. Each extra nine shrinks the budget tenfold: 99.99% leaves about 4 minutes a month.</p>`,
 done:`A bad API deploy, an RDS maintenance window, and a Socket.IO server restart all spend from the same budget. "We had a rough week, let's hold the release" is managing an error budget without the name.`,
 like:`A monthly mobile data plan. Use it however you like, but once it's gone you change your habits until it resets.`,
 demo:'error-budget',cap:`Pick a target, then cause some incidents. Notice how small the 99.99% budget is.`,rel:['sli-slo-sla']},
/* ---------- III ---------- */
{id:'timeout',ch:3,t:'Timeout',aka:['deadline','request timeout','504','AbortController'],
 one:`The longest you're willing to wait for an answer before giving up.`,
 body:`<p>Without a timeout, a request to a stuck server can hang forever, holding a thread, a connection, and memory the whole time. A timeout says: after N milliseconds, stop waiting and treat it as a failure.</p><p>Too short, and you give up on requests that were about to succeed. Too long, and slow failures pile up. A common starting point is a little above the healthy p99. Remember that the server usually keeps working after the client gives up, so timed-out work is often wasted work.</p>`,
 done:`If a player calls the .NET API with no timeout and the API hangs, that call can sit there indefinitely. Multiply by 6,000 players and a slow API turns into thousands of stuck connections. <code>HttpClient.Timeout</code> in .NET, the <code>timeout</code> option in axios on the Pi's Node backend, and a gateway's 504 are all this idea.`,
 like:`Waiting for a friend at the mall. You decide: 20 minutes, then I go home.`,
 demo:'timeout',cap:`Lower the timeout. More requests get cut off, including ones that were nearly done.`,rel:['retry-backoff','circuit-breaker','percentiles']},
{id:'retry-backoff',ch:3,t:'Retry with backoff & jitter',aka:['retry','exponential backoff','jitter','full jitter'],
 one:`After a failure, try again, waiting longer each time and adding randomness so everyone doesn't retry at once.`,
 body:`<p>Many failures are temporary, so retrying makes sense. Retrying <em>immediately</em> doesn't: if a server is overloaded, instant retries just add load.</p><p><strong>Exponential backoff</strong> waits 1 s, then 2 s, then 4 s, then 8 s. <strong>Jitter</strong> adds randomness to those waits. Without jitter, every client that failed at the same moment retries at the same moment, so they collide again in waves. With jitter, retries spread out and the server can catch up.</p>`,
 done:`If the API is down for a minute, 6,000 players fail at the same moment. If they all retry every 5 seconds on the dot, the API gets hit by synchronized waves the instant it comes back. Backoff plus jitter in the player's Node backend spreads those retries out.`,
 like:`A crowded doorway. If everyone steps back and lunges forward on the same count, they jam again. If each person waits a random moment, people get through.`,
 demo:'retry-backoff',cap:`The server comes back after 1 s but can only take 4 requests per tick. Toggle jitter and compare the waves.`,rel:['thundering-herd','idempotency','rate-limiting']},
{id:'circuit-breaker',ch:3,t:'Circuit breaker',aka:['fail fast','half-open','tripped'],
 one:`Stop calling a service that keeps failing, wait a bit, then test it carefully before trusting it again.`,
 body:`<p>When a downstream service is down, every call to it waits and then fails, tying up your own resources along the way. A circuit breaker counts failures. After several in a row it <strong>opens</strong> and rejects calls immediately for a cooldown period, without even trying.</p><p>After the cooldown it goes <strong>half-open</strong> and lets one test request through. If that works, it <strong>closes</strong> and traffic flows again. If not, it opens again for another cooldown.</p>`,
 done:`If the Pi's Node backend sees the API failing again and again, it can stop calling for a minute and keep playing from its local SQLite copy, instead of hammering a server that's already struggling. That "stop trying for a while" switch is a circuit breaker.`,
 like:`The breaker panel at home. When something shorts, it trips so the house doesn't burn. You flip it back on carefully, once.`,
 demo:'circuit-breaker',cap:`Turn the service off. Watch the breaker trip, reject instantly, then send a probe.`,rel:['timeout','retry-backoff']},
{id:'idempotency',ch:3,t:'Idempotency',aka:['idempotent','idempotency key','safe to retry','exactly once'],
 one:`Sending the same request twice has the same effect as sending it once.`,
 body:`<p>GET and DELETE are naturally idempotent: reading twice or deleting twice leaves things the same. POST usually isn't: "charge $5" sent twice charges $10.</p><p>That matters because networks lose replies, and the client can't tell whether the request failed or only the answer got lost. The fix is an <strong>idempotency key</strong>: the client attaches a unique ID. The server remembers keys it has already handled and, on a repeat, returns the saved result instead of doing the work again.</p>`,
 done:`A player reports "ad 42 played at 10:02" and never hears back, so it sends the report again. The API should count one play, not two. Giving each report a unique ID and checking "have I already saved this ID?" before inserting into RDS is idempotency. The same goes for a dashboard button someone double-clicks.`,
 like:`An elevator button. Press it once or ten times; one elevator comes.`,
 demo:'idempotency',cap:`The reply gets lost and the client retries. Toggle the key and compare what the customer pays.`,rel:['retry-backoff','race-condition']},
{id:'rate-limiting',ch:3,t:'Rate limiting',aka:['429','Too Many Requests','throttling','token bucket','Retry-After'],
 one:`A cap on how many requests a client can make in a time window. Go over it and you get HTTP 429.`,
 body:`<p>Rate limiting protects a service from being swamped, whether by a bug, a busy customer, or an attack.</p><p>A common implementation is the <strong>token bucket</strong>. The bucket holds up to N tokens and refills at a steady rate. Each request takes a token. If the bucket is empty, the request is rejected with <code>429 Too Many Requests</code>. The bucket size allows short bursts; the refill rate sets the long-run average.</p>`,
 done:`With 6,000 players, one buggy player build calling the API in a tight loop can slow things down for everyone. A per-device rate limit on the .NET API (ASP.NET Core has rate-limiting middleware built in) answers that device with 429 while the rest carry on.`,
 like:`A ticket machine at a ride. Tickets print at a fixed pace. A crowd can use up the stack, then everyone waits for the next ticket.`,
 demo:'rate-limiting',cap:`Send a burst. The first few pass on saved-up tokens, the rest get 429.`,rel:['backpressure','retry-backoff']},
{id:'backpressure',ch:3,t:'Backpressure',aka:['flow control','bounded queue','load shedding'],
 one:`When the consumer is slower than the producer, push back on the producer instead of letting work pile up.`,
 body:`<p>If one part of a system produces work faster than the next part can handle it, the extra has to go somewhere. Left unbounded, it piles up in memory until latency explodes or the process crashes.</p><p>Backpressure means the slow side tells the fast side to slow down: a full queue blocks new writes, a stream pauses, an API answers 503 or 429. The alternative is dropping work. Sometimes that's the right call, but it should be a decision, not an accident.</p>`,
 done:`When the dashboard pushes an update to thousands of players through Socket.IO, the server can produce messages faster than slow devices receive them. Those messages wait in a per-connection buffer in server memory, and if nothing pushes back, that buffer keeps growing. Node's <code>stream.pipe()</code> pauses reading when writing falls behind for the same reason.`,
 like:`A kitchen that stops taking orders when the ticket rail is full, instead of letting tickets fall on the floor.`,
 demo:'backpressure',cap:`With backpressure off, raise the producer speed. Watch memory fill and work get dropped. Then switch it on.`,rel:['async-queue','rate-limiting']},
{id:'thundering-herd',ch:3,t:'Thundering herd',aka:['cache stampede','dogpile','request coalescing','single flight'],
 one:`Lots of requests wake up at the same moment and all hit the same resource at once.`,
 body:`<p>Picture a popular cache entry. While it's valid, the database is calm. The moment it expires, every incoming request sees a miss and goes to the database for the same data, all at once. The database takes a spike for no good reason.</p><p>The usual fix is <strong>request coalescing</strong> (also called single flight): the first request fetches the value and everyone else waits for that one result. Other fixes are refreshing the entry just before it expires and adding jitter to TTLs.</p>`,
 done:`Restart the Socket.IO server and all 6,000 players reconnect within seconds, and many immediately call the API to resync. The Socket.IO client adds a random delay to reconnects (its <code>randomizationFactor</code> option) for exactly this reason. A schedule where every player refreshes at midnight sharp would cause the same spike.`,
 like:`A store opening its doors on sale day. Everyone was waiting, and everyone walks in at the same second.`,
 demo:'thundering-herd',cap:`Watch the key expire and the database get hammered. Then turn on coalescing.`,rel:['cache','ttl','retry-backoff']},
/* ---------- IV ---------- */
{id:'load-balancer',ch:4,t:'Load balancer',aka:['LB','round robin','least connections','horizontal scaling','vertical scaling'],
 one:`A traffic cop that spreads incoming requests across several servers.`,
 body:`<p>Once one server isn't enough, you run several copies and put a load balancer in front. It decides which server handles each request.</p><p><strong>Round robin</strong> takes turns: 1, 2, 3, 1, 2, 3. Simple, but it ignores how busy each server is. <strong>Least connections</strong> sends the next request to whichever server has the fewest in progress, so a slow server naturally gets less work.</p><p>Adding more servers like this is <em>horizontal</em> scaling. Making one server bigger is <em>vertical</em> scaling.</p>`,
 done:`If the .NET API runs as more than one instance on AWS behind a load balancer, every call from the dashboard and the players lands on one of them. Socket.IO across several servers is trickier: it needs sticky sessions and an adapter, so a message reaches a device connected to a different server.`,
 like:`Supermarket checkouts. Round robin is a staff member pointing people to lanes in order. Least connections is you picking the shortest line.`,
 demo:'load-balancer',cap:`Server 2 is slow. Compare the average latency under each strategy.`,rel:['throughput','circuit-breaker']},
{id:'cache',ch:4,t:'Cache hit & miss',aka:['cache','hit ratio','Redis','memoization'],
 one:`Keep a copy of an answer close by so you don't have to compute or fetch it again.`,
 body:`<p>A cache stores results from slow sources (a database, an external API, a heavy calculation) in fast storage, often memory or Redis.</p><p>When a request comes in, check the cache first. If the answer is there, that's a <strong>hit</strong>: return it fast. If not, that's a <strong>miss</strong>: fetch it from the source, save a copy in the cache, then return it. The <strong>hit ratio</strong> is the share of requests answered from cache. Caches trade freshness for speed, because the copy can be out of date.</p>`,
 done:`Each Pi keeps its playlist and ad files locally, in SQLite and on disk, so screens keep playing when the network drops. That's a cache of what the API told it. On the server, the .NET API can cache answers that many players ask for, so RDS doesn't run the same query thousands of times.`,
 like:`Keeping a phone charger in your bag instead of going home for it every time.`,
 demo:'cache',cap:`Requests ask for keys A to F; A is the most popular. Watch which keys stay warm and where the hit ratio settles.`,rel:['ttl','thundering-herd','eventual-consistency']},
{id:'ttl',ch:4,t:'TTL',aka:['time to live','expiry','max-age','Cache-Control','EXPIRE'],
 one:`How long a cached item, DNS record, or message may live before it's considered stale.`,
 body:`<p>Every cached copy goes stale eventually. A TTL puts a clock on it: after this many seconds, throw it away and fetch a fresh one.</p><p>Short TTLs keep data fresh but send more traffic to the source. Long TTLs are fast and cheap but can serve old data. You'll find TTLs in Redis (<code>EXPIRE</code>), in HTTP (<code>Cache-Control: max-age=60</code>), in DNS records, and in message queues.</p>`,
 done:`How long a player trusts its local playlist before asking the API again is effectively a TTL. Shorter means changes reach screens sooner and the API gets more traffic; longer means less traffic and staler screens. Pushing changes over Socket.IO lets you keep a long TTL and still update right away.`,
 like:`The best-before date on a carton of milk.`,
 demo:'cache',cap:`The bar under each cached key is its remaining TTL. Shorten the TTL and watch misses rise.`,rel:['cache','thundering-herd']},
{id:'connection-pool',ch:4,t:'Connection pool',aka:['pooling','keep-alive','handshake','TLS'],
 one:`Keep a few connections open and reuse them, instead of opening a new one for every request.`,
 body:`<p>Opening a connection is expensive. A TCP handshake costs a round trip, TLS adds more, and databases add authentication on top. If every request opens a fresh connection, it pays that cost every time.</p><p>A connection pool keeps a set of open connections ready. A request borrows one, uses it, and hands it back. The setup cost is paid once. Pools also cap how many connections exist, so you don't overwhelm the database.</p>`,
 done:`The .NET API reaches RDS through a pooled MySQL connection (pooling is on by default in the .NET MySQL drivers), so each request borrows an open connection instead of opening a new one. The players' long-lived Socket.IO connections are the same idea for push: connect once, reuse it for everything.`,
 like:`Staying on one long call with a coworker instead of hanging up and redialing for every question.`,
 demo:'connection-pool',cap:`Same database, same query. Count how many requests each side finishes.`,rel:['latency','throughput','cold-start']},
{id:'async-queue',ch:4,t:'Message queue & async jobs',aka:['queue','job queue','worker','202 Accepted','webhook','polling'],
 one:`Accept the job now, do it later in the background, and tell the client when it's done.`,
 body:`<p>Some work takes too long to finish inside one HTTP request: generating a report, encoding a video, sending 10,000 emails. Making the client wait ties up connections and often hits a timeout.</p><p>Instead, the API puts a job on a queue and answers right away with <code>202 Accepted</code> and a job ID. Background workers take jobs off the queue and process them. The client checks back (polling) or gets notified (a webhook) when it's ready. Queues also smooth out spikes, since workers go at their own pace.</p>`,
 done:`Pressing Screenshot on a device page is async by nature. The dashboard's request goes through the Socket.IO server to the Pi, the Pi takes the screenshot when it can and uploads it to the .NET API, and only then does a <code>screenshot:done</code> signal travel back through Socket.IO to the dashboard. Push playlist works the same way, ending in the \"Update completed\" pop-up. Accept the request now, report back when it's finished.`,
 like:`A dry cleaner. You drop off your clothes, get a ticket, and come back later. You don't stand at the counter while they iron.`,
 demo:'async-queue',cap:`Compare how long the client is stuck waiting in each mode.`,rel:['backpressure','timeout']},
/* ---------- V ---------- */
{id:'n-plus-1',ch:5,t:'N+1 query',aka:['N+1','ORM','eager loading','batching','JOIN'],
 one:`Fetching a list with one query, then running one more query for each item in it.`,
 body:`<p>You load 10 posts with one query. Then, for each post, you load its author, one query at a time. That's 1 + 10 = 11 queries, each paying a round trip to the database. With 100 posts it's 101.</p><p>It's easy to write by accident with an ORM, because <code>post.author</code> looks like reading a field. The fix is to fetch related data together: a JOIN, a <code>WHERE id IN (...)</code> query, or the ORM's eager loading (<code>include</code>, <code>with</code>, <code>preload</code>).</p>`,
 done:`Loading the dashboard's device list, then fetching each device's playlist or status with a separate query, is N+1. For 6,000 devices that's 6,001 queries to RDS. A JOIN, a <code>WHERE id IN (...)</code>, or <code>Include()</code> in Entity Framework does it in one or two.`,
 like:`Going to the grocery store once per ingredient, instead of once with a list.`,
 demo:'n-plus-1',cap:`Same 10 posts, same authors. Count the round trips.`,rel:['latency','connection-pool']},
{id:'pagination',ch:5,t:'Offset vs cursor pagination',aka:['pagination','offset','limit','cursor','keyset','infinite scroll'],
 one:`Returning a big list in pages. Offset says "skip 4". A cursor says "start after this item".`,
 body:`<p><strong>Offset</strong> pagination (<code>?offset=4&limit=4</code>) is easy and lets you jump to any page. But if new rows are added while someone is paging, everything shifts down and the next page repeats an item (or skips one when rows are deleted). It also slows down on deep pages, because the database still walks past every skipped row.</p><p><strong>Cursor</strong> pagination (<code>?after=7</code>) remembers the last item you saw and asks for what comes after it. It stays correct when data changes and stays fast, but you can't jump straight to page 50.</p>`,
 done:`The dashboard can't load all 6,000 devices at once, so it pages. If the list is sorted by "last seen" and check-ins keep reordering it, offset pages will repeat or skip devices as you click through. Sorting by a stable key, or using a cursor, avoids that.`,
 like:`A bookmark (cursor) versus remembering "I was on page 40" while someone keeps inserting pages at the front (offset).`,
 demo:'pagination',cap:`A new item arrives while you're on page 1. Compare what page 2 shows.`,rel:['eventual-consistency','race-condition']},
{id:'race-condition',ch:5,t:'Race condition',aka:['concurrency','lock','atomic update','lost update','oversell'],
 one:`Two operations run at the same time, and the result depends on which one happens to go first.`,
 body:`<p>Two requests try to buy the last item. Both read <code>stock = 1</code>. Both see it's available. Both write <code>stock = 0</code> and confirm the sale. You sold two items and only had one.</p><p>The bug lives in the gap between reading and writing. The fixes close that gap: a lock so only one request works on the row at a time, an atomic update (<code>UPDATE … SET stock = stock - 1 WHERE stock > 0</code>), or a version check that rejects writes based on a stale read.</p>`,
 done:`Two people edit the same playlist in the dashboard at the same time. Both load version 1, both press save, and the second save silently overwrites the first. A version column on the row (optimistic concurrency) lets the API reject the stale save instead.`,
 like:`Two people withdrawing from a joint account at two ATMs at the same second, each seeing the full balance.`,
 demo:'race-condition',cap:`Two buyers, one item. Toggle the lock and compare.`,rel:['idempotency','eventual-consistency']},
{id:'eventual-consistency',ch:5,t:'Eventual consistency',aka:['replication lag','read replica','stale read','strong consistency'],
 one:`Every copy of the data will agree, just not instantly. For a short while, some readers see the old value.`,
 body:`<p>Larger systems keep several copies of the same data: read replicas, caches, nodes in other regions. A write lands on one copy first, then spreads to the others. During that gap, reading from a copy that hasn't caught up returns the old value.</p><p>The system becomes consistent <em>eventually</em>, once replication finishes. <strong>Strong consistency</strong> means every read sees the latest write, which costs speed or availability. Many apps accept eventual consistency and design around the gap, for example by reading your own recent writes from the primary.</p>`,
 done:`This is the dashboard's online/offline status. When a player connects or drops, the Socket.IO server calls the .NET API to save the new status in RDS. The device list reads that saved value when the page loads, so it's a snapshot that can be minutes old. Open the device's own page and you get its live status over Socket.IO. Both views are correct; one is just older.`,
 like:`Changing your address. The post office knows today, your bank next week, your old friends whenever they ask.`,
 demo:'eventual-consistency',cap:`A new price is written, then read from a replica a moment later. Raise the lag to widen the stale window.`,rel:['cache','race-condition']}
];
</script>
<script>
TERMS.unshift(
{id:'rest',ch:0,t:'REST',aka:['RESTful','resource','endpoint','stateless','URL'],
 one:`A way of designing APIs where URLs name things (resources) and HTTP methods say what to do with them.`,
 body:`<p>In REST, every URL points to a <em>thing</em>, usually a noun: <code>/devices</code>, <code>/devices/42</code>, <code>/devices/42/playlist</code>. What you want to do with it comes from the HTTP method, not the URL. GET reads it, PUT replaces it, DELETE removes it. So you'll see <code>DELETE /schedules/7</code> rather than <code>/deleteSchedule?id=7</code>.</p><p>REST is also <strong>stateless</strong>. Each request carries everything the server needs: who you are (a token) and what you want. The server doesn't remember your previous request. That's what lets several API servers sit behind a load balancer, because any of them can answer any request.</p>`,
 done:`The .NET API is a REST API. When the Angular dashboard calls <code>GET /devices/42</code> and a player asks for <code>GET /devices/42/playlist</code>, both are fetching resources by URL. An ASP.NET controller usually maps to one resource, like <code>DevicesController</code>.`,
 like:`A library. Every book has a shelf address (the URL). You can borrow it, swap in a new edition, or have it removed (the methods). The librarian doesn't remember you; you show your card every visit (stateless).`,
 demo:'rest',cap:`Watch each request walk the URL down the resource tree. The path picks the thing; the method decides what happens to it.`,rel:['http-methods','status-codes','anatomy']},
{id:'http-methods',ch:0,t:'HTTP methods',aka:['GET','POST','PUT','PATCH','DELETE','verbs','safe','idempotent'],
 one:`The verb of a request. GET reads, POST creates, PUT replaces, PATCH changes part, DELETE removes.`,
 body:`<p>Every HTTP request starts with a method. <strong>GET</strong> reads and should never change anything. <strong>POST</strong> creates something new or triggers an action. <strong>PUT</strong> replaces a resource with what you send. <strong>PATCH</strong> changes only the fields you send. <strong>DELETE</strong> removes it.</p><p>Two properties matter in practice. A <em>safe</em> method doesn't change data (GET). An <em>idempotent</em> method has the same end result whether you send it once or five times (GET, PUT, DELETE, and usually PATCH). POST is neither, so sending it twice usually creates two things. That's why retrying a GET is easy and retrying a POST needs care.</p>`,
 done:`The dashboard uses GET to load the device list, POST to create a playlist, PUT or PATCH to save changes to one, and DELETE to remove a schedule. In ASP.NET those are the <code>[HttpGet]</code>, <code>[HttpPost]</code>, <code>[HttpPut]</code>, <code>[HttpPatch]</code> and <code>[HttpDelete]</code> attributes on controller actions.`,
 like:`Paperwork at a counter. Reading a form changes nothing (GET). Filing a new form adds another copy every time (POST). Swapping the whole form for a fresh one gives the same result however many times you do it (PUT).`,
 demo:'http-methods',cap:`Press each method twice. See which ones change the table again on the second press.`,rel:['rest','idempotency','status-codes']},
{id:'status-codes',ch:0,t:'HTTP status codes',aka:['200','201','304','400','401','403','404','429','500','502','503','504'],
 one:`A three-digit number on every response saying how it went. The first digit tells you whose problem it is.`,
 body:`<p><strong>2xx</strong> is success: 200 OK, 201 Created, 204 No Content. <strong>3xx</strong> means look elsewhere: 301 moved permanently, 304 not modified (use your cached copy). <strong>4xx</strong> means the request was the problem: 400 bad input, 401 not logged in, 403 not allowed, 404 not found, 429 too many requests. <strong>5xx</strong> means the server was the problem: 500 crashed, 503 temporarily unavailable, and 502 or 504 when a gateway in front couldn't get a good or timely answer from the app behind it.</p><p>The split matters for retries. Retrying a 5xx or 429 later can work. Retrying a 400 or 404 unchanged fails the same way every time.</p>`,
 done:`A player getting 401 after its token expires, or the dashboard showing an error toast after a 500, is reading status codes. In ASP.NET, <code>Ok()</code>, <code>CreatedAtAction()</code>, <code>NotFound()</code> and <code>BadRequest()</code> set them for you.`,
 like:`Delivery notices. Delivered (2xx). Moved to a new address (3xx). Wrong address written on the parcel (4xx). The post office lost it (5xx).`,
 demo:'status-codes',cap:`Trigger each response and note who caused it: the client or the server.`,rel:['http-methods','rate-limiting','retry-backoff']},
{id:'https',ch:0,t:'HTTPS, SSL & TLS',aka:['SSL','TLS','HTTPS','certificate','encryption','handshake','port 443'],
 one:`HTTPS is plain HTTP sent through an encrypted TLS connection, so nobody in between can read or change it.`,
 body:`<p>Plain HTTP travels as readable text. Anyone on the path, like a shared store Wi-Fi or a compromised router, can read tokens and data or even change them. HTTPS wraps the same HTTP inside <strong>TLS</strong>. SSL is the older name for TLS, and people still say "SSL certificate".</p><p>Before any data moves, the client and server do a <strong>handshake</strong>. The server presents a <strong>certificate</strong> proving it owns the domain, signed by an authority the client already trusts. Both sides then agree on keys, and everything after that is encrypted. The handshake costs extra round trips, which is another reason to reuse connections.</p>`,
 done:`The padlock in the browser when you open the dashboard is TLS. Every player calling the API over <code>https://</code> checks the API's certificate first. That makes an expired certificate a classic way for every device to lose contact on the same day, so renewing it (AWS Certificate Manager can do it automatically) is real operational work.`,
 like:`A postcard versus a sealed, signed envelope. Anyone handling a postcard can read it. The envelope only shows the address, and the signature proves who sent it.`,
 demo:'https',cap:`Switch HTTPS off and see what the person on the same Wi-Fi can read.`,rel:['auth','connection-pool','anatomy']},
{id:'anatomy',ch:0,t:'Request & response anatomy',aka:['headers','body','JSON','query string','Content-Type','payload'],
 one:`Every HTTP message has the same parts: a first line, headers with details about it, and an optional body with the data.`,
 body:`<p>A request starts with the method and path (<code>PUT /devices/42/playlist</code>). Then come <strong>headers</strong>, key-value details about the message: who you are (<code>Authorization</code>), what format the body is in (<code>Content-Type: application/json</code>), what you'd like back (<code>Accept</code>). Then a blank line, then the <strong>body</strong>, usually JSON.</p><p>A response mirrors it: a status line (<code>200 OK</code>), headers (<code>Content-Type</code>, <code>Cache-Control</code>), and a body. The <strong>query string</strong> is the part of the URL after <code>?</code>, used for small options like <code>?page=2&amp;limit=50</code>.</p>`,
 done:`Click any request in DevTools' Network tab while using the dashboard and you'll see these exact sections: Headers, Payload, Response. On the .NET side, <code>[FromBody]</code> reads the JSON body, <code>[FromQuery]</code> reads the query string, and <code>[FromHeader]</code> reads a header.`,
 like:`A parcel. The shipping label is the headers: where it goes, what's inside, how to handle it. The contents of the box are the body.`,
 demo:'anatomy',cap:`Follow the highlight through each part of a request, then its response.`,rel:['rest','auth','cors']},
{id:'auth',ch:0,t:'Authentication & tokens',aka:['JWT','Bearer token','authorization','401','403','refresh token','API key'],
 one:`Proving who you are on every request, usually with a token the server gave you when you logged in.`,
 body:`<p><strong>Authentication</strong> is who you are. <strong>Authorization</strong> is what you're allowed to do. Because REST is stateless, the server needs proof of identity on every request, usually a token in the <code>Authorization: Bearer …</code> header.</p><p>A common format is the <strong>JWT</strong>: three base64 parts joined by dots. A header, a payload of claims (user ID, role, expiry time), and a signature. The server checks the signature to confirm it issued the token and nobody edited it. Tokens expire, so the client logs in again or uses a refresh token to get a new one. A missing or expired token gets 401; a valid token without permission gets 403.</p>`,
 done:`An Angular app typically keeps the login token and uses an HTTP interceptor to attach it to every API call, which is why you rarely see it in component code. Devices need credentials too, so the API knows which player is asking for which playlist. On the .NET side, <code>[Authorize]</code> is the gatekeeper.`,
 like:`A wristband at an event. You show your ID once at the gate, then just flash the wristband. It's only good for today.`,
 demo:'auth',cap:`Watch the token ride along on each request. Then let it expire.`,rel:['anatomy','https','status-codes']},
{id:'cors',ch:0,t:'CORS',aka:['cross-origin','preflight','OPTIONS','Access-Control-Allow-Origin','same-origin policy'],
 one:`A browser rule: a page from one site may only read responses from another site if that site says it's allowed.`,
 body:`<p>Browsers stop a page from reading responses from a different <em>origin</em> (scheme, domain and port) unless the server opts in. That's the same-origin policy, and CORS is how a server opts in, with headers like <code>Access-Control-Allow-Origin</code>.</p><p>For requests that could change data or carry custom headers, the browser first sends a <strong>preflight</strong>: an <code>OPTIONS</code> request asking "may I?". Only if the answer allows it does the real request go out. The browser alone enforces this, so the same request from Postman, curl, or a Node server works fine. That's why CORS errors are so confusing: the API is working, and the browser is the one saying no.</p>`,
 done:`If the Angular dashboard and the .NET API are served from different domains, the API has to allow the dashboard's origin (in ASP.NET, <code>AddCors</code> plus <code>UseCors</code>). The Pi's Node backend calls the same API but isn't a browser, so CORS never applies to it.`,
 like:`A bouncer who only admits names on the guest list. He works for the browser, not the venue, and deliveries through the back door (Postman, servers) never meet him.`,
 demo:'cors',cap:`Toggle whether the API allows the dashboard's origin. The server answers either way; the browser decides.`,rel:['anatomy','auth','rest']},
{id:'websocket',ch:0,t:'WebSockets & polling',aka:['WebSocket','Socket.IO','polling','push','real-time','long-lived connection'],
 one:`Polling asks "anything new?" over and over. A WebSocket keeps one connection open so the server can push the moment something happens.`,
 body:`<p>HTTP is request and response: the server can only answer when asked. To see changes, a client can <strong>poll</strong>, asking every few seconds. It's simple, but most answers are "nothing new", and you only notice a change at the next poll.</p><p>A <strong>WebSocket</strong> upgrades one HTTP connection into a long-lived, two-way channel. Either side can send at any moment, so updates arrive almost instantly with no wasted requests. The cost is that the server holds an open connection for every client. <strong>Socket.IO</strong> is a library on top of WebSockets that adds reconnection, rooms, and fallbacks.</p>`,
 done:`This is the split in the dashboard. The device list shows status from each device's last check-in. Open one device's page and it switches to live Socket.IO events. Both the dashboard and every one of the 6,000 players are Socket.IO clients, and the Socket.IO server sits in the middle relaying events between them. It also calls the .NET API itself, for example to save a player's new online status in RDS when it reconnects. That's how a reboot or screenshot command reaches a screen within moments, and how "Update completed" gets back to the dashboard.`,
 like:`Calling a restaurant every five minutes to ask if your table is ready, versus leaving your number so they text you.`,
 demo:'websocket',cap:`Both lanes watch the same events. Compare how many requests each makes and how late each one notices.`,rel:['async-queue','backpressure','thundering-herd']}
);
</script>
<script>
/* ================= drawing engine ================= */
const col={};
const CV=['bg','paper','panel','panel2','ink','muted','line','req','ad','slot','bad','pop','pi','on'];
function readCol(){const s=getComputedStyle(document.documentElement);CV.forEach(k=>col[k]=s.getPropertyValue('--'+k).trim())}
readCol();
const FONT='Jost, system-ui, sans-serif', MONO='"JetBrains Mono", ui-monospace, monospace';
const rnd=Math.random, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,p)=>a+(b-a)*p;
const ez=p=>{p=clamp(p,0,1);return p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2};
const randn=()=>{let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const logn=(med,sig)=>med*Math.exp(sig*randn());
const alpha=(c,a)=>{const h=(c||'#888').replace('#','');const f=h.length===3?h.split('').map(x=>x+x).join(''):h;
  const n=parseInt(f,16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
function seq(e,durs){let a=0;for(let i=0;i<durs.length;i++){if(e<a+durs[i])return{i,p:(e-a)/durs[i]};a+=durs[i]}return{i:durs.length-1,p:1}}
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;

function mkG(ctx){
  const g={
    rr(x,y,w,h,r,fill,stroke,lw=2,dash){ctx.beginPath();ctx.roundRect(x,y,Math.max(0,w),Math.max(0,h),Math.min(r,2,Math.abs(w)/2,Math.abs(h)/2));
      if(fill){ctx.fillStyle=fill;ctx.fill()} if(stroke){ctx.setLineDash(dash||[]);ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke();ctx.setLineDash([])}},
    t(s,x,y,o={}){s=TX(s);ctx.font=`${o.it?'italic ':''}${o.w||600} ${o.s||13}px ${o.m?MONO:FONT}`;ctx.fillStyle=o.c||col.ink;ctx.textAlign=o.a||'center';ctx.textBaseline=o.b||'middle';ctx.fillText(s,x,y)},
    tw(s,o={}){s=TX(s);ctx.font=`${o.w||600} ${o.s||13}px ${o.m?MONO:FONT}`;return ctx.measureText(s).width},
    ln(x1,y1,x2,y2,c,lw=2,dash){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.setLineDash(dash||[]);ctx.lineWidth=lw;ctx.strokeStyle=c;ctx.stroke();ctx.setLineDash([])},
    dot(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()},
    ring(x,y,r,p,c,lw=3){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.lineWidth=lw;ctx.strokeStyle=col.line;ctx.stroke();
      ctx.beginPath();ctx.arc(x,y,r,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp(p,0,1));ctx.strokeStyle=c;ctx.lineCap='round';ctx.stroke();ctx.lineCap='butt'},
    spin(x,y,r,t,c){ctx.beginPath();ctx.arc(x,y,r,t*6,t*6+4.2);ctx.lineWidth=3;ctx.strokeStyle=c;ctx.lineCap='round';ctx.stroke();ctx.lineCap='butt'},
    box(x,y,w,h,label,c,o={}){
      if(o.glow){ctx.save();ctx.shadowColor=c;ctx.shadowBlur=18}
      g.rr(x,y,w,h,10,o.fill||col.panel,c,2,o.dash); if(o.glow)ctx.restore();
      if(o.glow) g.rr(x,y,w,h,10,null,c,2,o.dash);
      g.t(label,x+w/2,y+h/2+(o.sub?-8:0),{c:o.tc||c,w:700,s:o.s||(w<90?12.5:14)});
      if(o.sub) g.t(o.sub,x+w/2,y+h/2+10,{c:o.subc||col.muted,s:11,w:500,m:o.subm});
    },
    pill(x,y,label,bg,fg,o={}){const s=o.s||11.5,w=g.tw(label,{s,w:700,m:o.m})+16,h=s+10,xx=o.a==='left'?x:o.a==='right'?x-w:x-w/2;
      g.rr(xx,y-h/2,w,h,h/2,bg);g.t(label,xx+w/2,y+.5,{c:fg,s,w:700,m:o.m});return w},
    pk(x,y,c,label,r=7){if(label){g.pill(x,y,label,c,col.on,{s:10.5,m:true})}else g.rr(x-r,y-r,r*2,r*2,0,c)},
    x(x,y,s,c){g.ln(x-s,y-s,x+s,y+s,c,3);g.ln(x+s,y-s,x-s,y+s,c,3)},
    clip(s,maxW,o){s=TX(s);if(g.tw(s,o)<=maxW)return s;while(s.length>3&&g.tw(s+'…',o)>maxW)s=s.slice(0,-1);return s+'…'}
  };return g;
}

function Stage(host,H){
  const cv=document.createElement('canvas');cv.setAttribute('role','img');host.appendChild(cv);
  const ctx=cv.getContext('2d');const st={ctx,W:300,H,g:mkG(ctx),paused:false,T:0};
  const fit=()=>{const dpr=Math.min(2,devicePixelRatio||1);st.W=Math.max(200,host.clientWidth);cv.width=st.W*dpr;cv.height=H*dpr;
    cv.style.width=st.W+'px';cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)};
  fit();const ro=new ResizeObserver(fit);ro.observe(host);
  let fn,raf,last=performance.now(),alive=true;const speed=REDUCED?.6:1;
  const loop=now=>{if(!alive)return;let dt=Math.min(.05,(now-last)/1000)*speed;last=now;if(st.paused||document.hidden)dt=0;st.T+=dt;
    readCol();ctx.clearRect(0,0,st.W,H);try{fn(st.T,dt)}catch(e){console.error(e);alive=false}raf=requestAnimationFrame(loop)};
  st.frame=f=>{fn=f;raf=requestAnimationFrame(loop)};
  st.stop=()=>{alive=false;cancelAnimationFrame(raf);ro.disconnect()};
  st.label=s=>cv.setAttribute('aria-label',TX(s));
  return st;
}

function UI(ctrl,stats,pid){
  let n=0;const id=()=>`${pid}-c${n++}`;
  return{
    slider(label,min,max,val,on,fmt=v=>v,step=1){const i=id();const w=document.createElement('label');w.className='sl';
      w.innerHTML=`<span>${TX(label)}</span><input type="range" id="${i}" min="${min}" max="${max}" step="${step}" value="${val}"><output>${TX(fmt(val))}</output>`;
      const inp=w.querySelector('input'),out=w.querySelector('output');inp.oninput=()=>{const v=+inp.value;out.textContent=TX(fmt(v));on(v)};ctrl.appendChild(w);return inp},
    toggle(label,val,on){const i=id();const w=document.createElement('label');w.className='tg';
      w.innerHTML=`<input type="checkbox" id="${i}" ${val?'checked':''}><span class="sw"></span><span>${TX(label)}</span>`;
      const inp=w.querySelector('input');inp.onchange=()=>on(inp.checked);ctrl.appendChild(w);return inp},
    btn(label,on,ghost){const b=document.createElement('button');b.className='btn'+(ghost?' ghost':'');b.id=id();b.textContent=TX(label);b.onclick=on;ctrl.appendChild(b);return b},
    stat(label,c='ink',init='0'){const d=document.createElement('div');d.className='stat';d.innerHTML=`<b style="color:var(--${c})">${init}</b><span>${TX(label)}</span>`;
      stats.appendChild(d);const b=d.firstElementChild;let last=null;return v=>{if(v!==last){b.textContent=TX(v);last=v}}}
  };
}
const D={};
</script>
<script>
/* ================= I. Measuring speed ================= */
D.latency=(s,ui)=>{let net=80,work=120,c=0;
  ui.slider('Network, one way',10,300,net,v=>net=v,v=>v+' ms',5);
  ui.slider('Server work',10,400,work,v=>work=v,v=>v+' ms',5);
  s.label('A request travels from client to server, the server works, and the answer travels back.');
  s.frame((t,dt)=>{const {g,W,H}=s,K=.005,tot=2*net+work,dur=tot*K+1.1;c+=dt;if(c>dur)c=0;const ms=Math.min(tot,c/K);
    const bw=Math.min(120,W*.24),bh=54,y=34,x1=4,x2=W-4-bw,a=x1+bw+10,b=x2-10,wy=y+bh/2;
    const ph=ms<net?0:ms<net+work?1:c/K<tot?2:3;
    g.box(x1,y,bw,bh,'Client',col.pi,{glow:ph===3});g.box(x2,y,bw,bh,'Server',col.req,{glow:ph===1});
    g.ln(a,wy,b,wy,col.line,2,[5,5]);
    if(ph===0)g.pk(lerp(a,b,ms/net),wy,col.req,'GET /playlist');
    if(ph===1){g.spin(x2+bw/2,y+bh+20,8,t,col.slot);g.t('working',x2+bw/2,y+bh+40,{c:col.slot,s:12})}
    if(ph===2)g.pk(lerp(b,a,(ms-net-work)/net),wy,col.ad,'200 OK');
    if(ph===3)g.t('✓ answer in '+tot+' ms',x1+bw/2+10,y+bh+20,{c:col.ad,s:13,w:700,a:'left'});
    const tx=4,tw=W-8,ty=H-52,th=18;let xx=tx;
    [[net,col.req,'out'],[work,col.slot,'server'],[net,col.ad,'back']].forEach(([v,cc,l])=>{const w=tw*v/tot;g.rr(xx,ty,Math.max(2,w-3),th,4,alpha(cc,.85));
      if(w>58)g.t(l+' '+v+' ms',xx+w/2,ty+th+15,{c:col.muted,s:11.5,w:500});xx+=w});
    const px=tx+tw*ms/tot;g.ln(px,ty-7,px,ty+th+5,col.ink,2);
    g.t('Latency = '+net+' + '+work+' + '+net+' = '+tot+' ms',W/2,ty-20,{w:700,s:15});
  })};

D.ttfb=(s,ui)=>{const net=60,N=8,gap=45;let work=150,buf=false,c=0;
  ui.slider('Server think time',20,400,work,v=>work=v,v=>v+' ms',10);
  ui.toggle('Server buffers the whole response first',false,v=>{buf=v;c=0});
  s.label('A response streamed in chunks, with first byte and last byte marked on a timeline.');
  s.frame((t,dt)=>{const {g,W,H}=s,K=.0045;
    const leave=i=>buf?net+work+(N-1)*gap+i*6:net+work+i*gap, arrive=i=>leave(i)+net;
    const ttfb=arrive(0),tot=arrive(N-1),dur=tot*K+1.4;c+=dt;if(c>dur)c=0;const ms=c/K;
    const bw=Math.min(116,W*.24),bh=54,y=24,x1=4,x2=W-4-bw,a=x1+bw+10,b=x2-10,wy=y+bh/2;
    g.box(x1,y,bw,bh,'Client',col.pi);g.box(x2,y,bw,bh,'Server',col.req,{glow:ms>net&&ms<leave(N-1)});
    g.ln(a,wy,b,wy,col.line,2,[5,5]);
    if(ms<net)g.dot(lerp(a,b,ms/net),wy,7,col.req);
    if(ms>net&&ms<leave(0)){g.spin(x2+bw/2,y+bh+18,7,t,col.slot);if(buf&&ms>net+work)g.t('building full body',x2+bw/2,y+bh+38,{c:col.slot,s:11.5,a:'center'})}
    for(let i=0;i<N;i++){if(ms>leave(i)&&ms<arrive(i))g.rr(lerp(b,a,(ms-leave(i))/net)-6,wy-7,12,14,3,i===0?col.pop:col.ad)}
    // received cells
    const cw=Math.min(16,(bw-8)/N);for(let i=0;i<N;i++)g.rr(x1+bw/2-N*cw/2+i*cw,y+bh+12,cw-2,10,2,ms>=arrive(i)?(i===0?col.pop:col.ad):col.panel2);
    g.t(ms>=tot?'complete':ms>=ttfb?'receiving':'waiting',x1+bw/2,y+bh+34,{c:col.muted,s:11.5});
    // timeline
    const tx=4,tw=W-8,ty=H-40,X=v=>tx+tw*v/tot;
    g.ln(tx,ty,tx+tw,ty,col.line,6);g.ln(tx,ty,X(Math.min(ms,tot)),ty,col.req,6);
    const mk=(v,c,l,up)=>{g.ln(X(v),ty-12,X(v),ty+12,c,2);g.t(l,clamp(X(v),100,W-100),up?ty-24:ty+24,{c,s:12.5,w:700})};
    if(buf){mk(tot,col.pop,'TTFB ≈ total = '+Math.round(tot)+' ms',true)}
    else{mk(ttfb,col.pop,'TTFB '+Math.round(ttfb)+' ms',true);mk(tot,col.ad,'last byte '+Math.round(tot)+' ms',false)}
  })};

D.throughput=(s,ui)=>{let n=2,lat=1000;const lanes=Array.from({length:6},(_,i)=>({p:i*.17}));const done=[];let total=0;
  ui.slider('Workers',1,6,n,v=>n=v);ui.slider('Latency per request',250,2000,lat,v=>lat=v,v=>v+' ms',50);
  const sL=ui.stat('latency per request','slot'),sT=ui.stat('expected req / sec','req'),sR=ui.stat('finished (last 3 s, per sec)','ad'),sN=ui.stat('total finished','ink');
  s.label('Parallel worker lanes each processing one request at a time.');
  s.frame((t,dt)=>{const {g,W,H}=s;const lx=78,rx=W-70,top=14,lh=(H-28)/6;
    g.t('incoming',36,H/2,{c:col.muted,s:12});for(let k=0;k<6;k++)g.dot(30+(k%2)*12,H/2+20+Math.floor(k/2)*10,3.5,col.req);
    g.t('done',W-30,H/2-12,{c:col.muted,s:12});g.t(String(total),W-30,H/2+10,{c:col.ad,s:20,w:700});
    for(let i=0;i<6;i++){const L=lanes[i],y=top+i*lh+lh/2,on=i<n;
      g.rr(lx,y-lh/2+4,rx-lx,lh-8,8,on?col.panel2:'transparent',on?null:col.line,1,[3,4]);
      if(!on)continue;g.t('worker '+(i+1),lx+8,y,{c:col.muted,s:11,a:'left',w:500});
      L.p+=dt*1000/lat;if(L.p>=1){L.p-=1;done.push(t);total++}
      g.pk(lerp(lx+72,rx-12,L.p),y,col.req,null,6)}
    while(done.length&&done[0]<t-3)done.shift();
    sL(lat+' ms');sT((n*1000/lat).toFixed(1));sR((t<3?done.length/Math.max(t,.5):done.length/3).toFixed(1));sN(total);
  })};

D.distribution=(s,ui)=>{let tail=true,vals=[],balls=[],acc=0;const MAX=600,B=40;
  const sample=()=>tail?Math.min(MAX-1,logn(110,.6)):clamp(220+50*randn(),0,MAX-1);
  ui.toggle('Long tail (what real APIs look like)',true,v=>{tail=v;vals=[];balls=[]});
  ui.btn('Restart',()=>{vals=[];balls=[]},true);
  s.label('Histogram of request latencies building up as samples fall into buckets.');
  s.frame((t,dt)=>{const {g,W,H}=s;const x0=6,x1=W-6,base=H-30,top=50,bw=(x1-x0)/B;
    acc+=dt*45;while(acc>1){acc--;balls.push({v:sample(),y:top-30})}
    const cnt=new Array(B).fill(0);vals.forEach(v=>cnt[Math.floor(v/MAX*B)]++);const mx=Math.max(8,...cnt)*1.15;
    const hb=k=>(base-top)*cnt[k]/mx;
    balls=balls.filter(b=>{const k=Math.floor(b.v/MAX*B);b.y+=dt*520;const land=base-hb(k);if(b.y>=land){vals.push(b.v);return false}
      g.dot(x0+(k+.5)*bw,b.y,Math.min(4,bw/2.4),col.req);return true});
    if(vals.length>900){vals=[];balls=[]}
    for(let k=0;k<B;k++){const h=hb(k);if(h>0)g.rr(x0+k*bw+1,base-h,bw-2,h,2,alpha(col.req,.55))}
    g.ln(x0,base,x1,base,col.line,1.5);
    for(let m=0;m<=MAX;m+=100)g.t(m+(m===MAX?'+ ms':''),clamp(x0+(x1-x0)*m/MAX,14,W-24),base+14,{c:col.muted,s:11,w:500});
    if(vals.length>30){const so=[...vals].sort((a,b)=>a-b),med=so[Math.floor(so.length*.5)],p99=so[Math.floor(so.length*.99)],mean=so.reduce((a,b)=>a+b,0)/so.length;
      const X=v=>x0+(x1-x0)*v/MAX;
      [[med,col.ad,'median '+Math.round(med),0],[mean,col.slot,'mean '+Math.round(mean),1],[p99,col.bad,'p99 '+Math.round(p99),0]].forEach(([v,c,l,row])=>{
        g.ln(X(v),top-6+row*0,X(v),base,c,2,[4,3]);g.pill(clamp(X(v),40,W-40),row?28:10,l+' ms',c,col.on,{s:10.5})});
    }
    g.t(vals.length+' requests',x1,top+6,{c:col.muted,s:11.5,a:'right'});
  })};

D['mean-median']=(s,ui)=>{const base=[92,104,88,110,97,101,95,108,99];let vals=[...base],dm=0,dd=0,am=200,init=false;
  ui.btn('Add a slow request (3,000 ms)',()=>{if(vals.length<16)vals.push(2600+Math.round(rnd()*800))});
  ui.btn('Add a normal request',()=>{if(vals.length<16)vals.push(90+Math.round(rnd()*25))});
  ui.btn('Reset',()=>{vals=[...base]},true);
  const sMean=ui.stat('mean (average)','slot'),sMed=ui.stat('median (p50)','ad'),sN=ui.stat('requests','ink');
  s.label('Dots on a number line with mean and median markers.');
  s.frame((t,dt)=>{const {g,W,H}=s;const so=[...vals].sort((a,b)=>a-b),n=so.length;
    const mean=so.reduce((a,b)=>a+b,0)/n,med=n%2?so[(n-1)/2]:(so[n/2-1]+so[n/2])/2;
    if(!init){dm=mean;dd=med;init=true}const k=1-Math.pow(.002,dt);dm=lerp(dm,mean,k);dd=lerp(dd,med,k);am=lerp(am,Math.max(200,so[n-1]*1.08),k);
    const x0=14,x1=W-14,y=H/2+6,X=v=>x0+(x1-x0)*v/am;
    g.ln(x0,y,x1,y,col.line,2);
    const step=am>1500?1000:am>700?250:50;for(let m=0;m<=am;m+=step){g.ln(X(m),y-4,X(m),y+4,col.line,1.5);g.t(m+' ms',clamp(X(m),20,W-26),y+60,{c:col.muted,s:11,w:500})}
    const seen={};so.forEach(v=>{const bx=Math.round(X(v)/7);seen[bx]=(seen[bx]||0)+1;g.dot(X(v),y-(seen[bx]-1)*9,6,v>1000?col.bad:col.req)});
    g.ln(X(dm),y-64,X(dm),y-8,col.slot,2.5);g.pill(clamp(X(dm),60,W-60),y-74,'mean '+Math.round(dm)+' ms',col.slot,col.on);
    g.ln(X(dd),y+10,X(dd),y+34,col.ad,2.5);g.pill(clamp(X(dd),60,W-60),y+42,'median '+Math.round(dd)+' ms',col.ad,col.on);
    sMean(Math.round(mean)+' ms');sMed(Math.round(med)+' ms');sN(n);
  })};

D.percentiles=(s,ui)=>{let reqs=[],t0=0,want=true;
  const batch=()=>{const v=Array.from({length:100},()=>Math.min(1600,logn(120,.45)+(rnd()<.04?500+rnd()*900:0)));
    const order=v.map((x,i)=>i).sort((a,b)=>v[a]-v[b]);reqs=v.map((x,i)=>({v:x,from:i}));order.forEach((i,r)=>reqs[i].to=r);t0=s.T;want=false};
  ui.btn('New batch',()=>{want=true});
  const s50=ui.stat('p50','ad','–'),s95=ui.stat('p95','slot','–'),s99=ui.stat('p99','bad','–');
