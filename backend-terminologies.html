ess.</p><p>Ang backpressure ay yung pagsabi ng mabagal na side sa mabilis na side na bagalan nito: bina-block ng punong queue ang bagong writes, nagpa-pause ang stream, sumasagot ang API ng 503 o 429. Ang alternative ay mag-drop ng trabaho. Minsan tama 'yon, pero dapat desisyon 'yon, hindi aksidente.</p>","thundering-herd":"<p>Isipin mo ang isang sikat na cache entry. Habang valid pa, kalmado ang database. Pagka-expire na pagka-expire nito, bawat papasok na request ay makakakita ng miss at pupunta sa database para sa parehong data, sabay-sabay. Mag-i-spike ang database nang walang magandang dahilan.</p><p>Ang usual na fix ay <strong>request coalescing</strong> (tinatawag ding single flight): ang unang request ang kukuha ng value at maghihintay na lang ang lahat sa iisang result na 'yon. Ang iba pang fix ay i-refresh ang entry bago pa 'to mag-expire at magdagdag ng jitter sa TTLs.</p>","load-balancer":"<p>Pag hindi na kaya ng isang server, magpapatakbo ka ng ilang kopya at maglalagay ng load balancer sa harap. Ito ang nagdedesisyon kung aling server ang hahawak sa bawat request.</p><p>Ang <strong>round robin</strong> ay salitan: 1, 2, 3, 1, 2, 3. Simple, pero hindi nito tinitingnan kung gaano ka-busy ang bawat server. Ang <strong>least connections</strong> ay pinapadala ang susunod na request sa server na may pinakakaunting ginagawa, kaya natural na mas kaunti ang trabaho ng mabagal na server.</p><p>Ang pagdagdag ng servers nang ganito ay <em>horizontal</em> scaling. Ang pagpapalaki ng isang server ay <em>vertical</em> scaling.</p>","cache":"<p>Ang cache ay nagtatabi ng results mula sa mabagal na sources (database, external API, mabigat na calculation) sa mabilis na storage, kadalasan memory o Redis.</p><p>Pag may request na pumasok, i-check muna ang cache. Kung nandun ang sagot, <strong>hit</strong> 'yan: ibalik agad. Kung wala, <strong>miss</strong> 'yan: kunin sa source, mag-save ng kopya sa cache, tapos ibalik. Ang <strong>hit ratio</strong> ay yung share ng requests na nasagot galing cache. Pinagpapalit ng caches ang freshness para sa speed, kasi pwedeng luma na yung kopya.</p>","ttl":"<p>Lahat ng cached copy ay nalalaos din eventually. Nilalagyan 'to ng orasan ng TTL: after ng ganitong dami ng seconds, itapon na at kumuha ng bago.</p><p>Fresh ang data sa maiikling TTL pero mas maraming traffic papunta sa source. Mabilis at mura ang mahahabang TTL pero pwedeng lumang data ang ma-serve. Makikita mo ang TTLs sa Redis (<code>EXPIRE</code>), sa HTTP (<code>Cache-Control: max-age=60</code>), sa DNS records, at sa message queues.</p>","connection-pool":"<p>Mahal ang pagbukas ng connection. Isang round trip ang TCP handshake, may dagdag pa ang TLS, at may authentication pa sa ibabaw nito ang databases. Kung bawat request ay nagbubukas ng bagong connection, binabayaran niya 'yang cost na 'yan every time.</p><p>Ang connection pool ay may hawak na set ng open connections na ready na. Humihiram ang request ng isa, ginagamit, at ibinabalik. Isang beses lang binabayaran ang setup cost. Nililimitahan din ng pools kung ilang connections ang pwedeng mag-exist, para hindi mo malunod ang database.</p>","async-queue":"<p>May mga trabahong sobrang tagal para matapos sa loob ng isang HTTP request: pag-generate ng report, pag-encode ng video, pagpadala ng 10,000 emails. Pag pinaghintay mo ang client, naiipit ang connections at madalas tinatamaan ng timeout.</p><p>Kaya imbes, naglalagay ang API ng job sa queue at sumasagot agad ng <code>202 Accepted</code> at job ID. Kinukuha ng background workers ang jobs sa queue at pinoproseso. Bumabalik ang client para mag-check (polling) o nano-notify siya (webhook) pag ready na. Pinapakinis din ng queues ang spikes, kasi sa sarili nilang pace nagtatrabaho ang workers.</p>","n-plus-1":"<p>Nag-load ka ng 10 posts gamit ang isang query. Tapos, para sa bawat post, nilo-load mo ang author nito, isang query at a time. 1 + 10 = 11 queries 'yan, bawat isa may bayad na round trip sa database. Pag 100 posts, 101.</p><p>Madali 'tong maisulat nang hindi sinasadya pag may ORM, kasi mukhang pagbasa lang ng field ang <code>post.author</code>. Ang fix ay kunin nang sabay ang related data: JOIN, <code>WHERE id IN (...)</code> na query, o eager loading ng ORM (<code>include</code>, <code>with</code>, <code>preload</code>).</p>","pagination":"<p>Madali ang <strong>offset</strong> pagination (<code>?offset=4&limit=4</code>) at pwede kang tumalon sa kahit anong page. Pero kung may bagong rows na nadagdag habang may nagpa-page, uusog pababa lahat at mauulit ang isang item sa next page (o may malalaktawan pag may rows na na-delete). Bumabagal din 'to sa malalalim na page, kasi dinadaanan pa rin ng database ang bawat row na nilaktawan.</p><p>Ang <strong>cursor</strong> pagination (<code>?after=7</code>) ay tinatandaan yung huling item na nakita mo at hinihingi yung mga kasunod nito. Tama pa rin 'to kahit magbago ang data at mabilis pa rin, pero hindi ka makakatalon diretso sa page 50.</p>","race-condition":"<p>Dalawang request ang sabay na gustong bumili ng huling item. Pareho nilang nabasa ang <code>stock = 1</code>. Pareho nilang nakitang available. Pareho silang nag-write ng <code>stock = 0</code> at nag-confirm ng sale. Dalawang item ang nabenta mo pero isa lang ang meron ka.</p><p>Nasa gap sa pagitan ng pagbasa at pag-write ang bug. Sinasara ng mga fix ang gap na 'yan: lock para isang request lang ang gumagalaw sa row at a time, atomic update (<code>UPDATE … SET stock = stock - 1 WHERE stock > 0</code>), o version check na nire-reject ang writes na base sa stale na read.</p>","eventual-consistency":"<p>Ang malalaking systems ay may ilang kopya ng parehong data: read replicas, caches, nodes sa ibang regions. Sa isang kopya muna napupunta ang write, tapos kumakalat sa iba. Sa gap na 'yan, pag nagbasa ka sa kopyang hindi pa nakakahabol, lumang value ang makukuha mo.</p><p>Nagiging consistent ang system <em>eventually</em>, pag tapos na ang replication. Ang <strong>strong consistency</strong> ibig sabihin, bawat read ay nakikita ang latest write, na may kapalit na speed o availability. Maraming apps ang tumatanggap ng eventual consistency at nagde-design around sa gap, halimbawa sa pagbasa ng sarili mong recent writes mula sa primary.</p>"}},"ceb":{"ui":{"show":"Abri contents","hide":"Sira contents","collapse":"I-collapse tanan","expand":"I-expand tanan","start":"diri ta start","done":"Nabuhat na nimo ni, actually","picture":"Imagine-a lang ni","see":"Tan-awa sad","plain":"Simple explanation","enonly":"English pa ni for now. Ang taas nga explanation, i-translate pa namo.","try":"Try-a","nextterm":"Next term →","where":"Asa makita ang matag term","inarch":"Sa Architecture guide","howpage":"Unsaon pag-gamit ani nga page","a1t":"One sentence ra","a4d":"Example gikan sa gawas sa computer, nga ma-gets bisan sa bata.","search":"Pangita: p99, 429, cache…","a1d":"Ang whole idea, pinaka-short na, naka-spell out pa ang abbreviations.","a2d":"Animation nga naay knobs. Gubaa lang, okay ra.","a3d":"Asa ni nimo makita sa NTV360 dashboard, API ug players.","title":"Mga words nga murag lisod, pero gibuhat na diay nimo","intro":"Nakat-on ka sa polymorphism kay sige ka og code, wala pa gani nay nag-explain og tarong. Same ra sa backend jargon: p99, backpressure, idempotency. Kadaghanan ana, ngalan ra sa butang nga nabuhat, na-debug, o gimura na nimo. Tanang example diri, gikan sa NTV360 system sa ubos.","lv_beginner":"Diri ta start. Mga words nga madungog nimo sa first week nimo sa API team.","lv_mid":"Nag-ship na ka og features. Diri nimo ma-gets ngano hinay o weird ang uban.","lv_hard":"Pag-run sa production: reliability, retries, mga numbers sa dashboard.","lv_insane":"Mga problema nga mogawas ra pag dako na kaayo, pag libo-libo ka clients dungan."},"one":{"rest":"Ang REST (REpresentational State Transfer) kay style sa pag-design og API: ang URL ang ngalan sa butang (resource), ang HTTP method ang mo-ingon unsay buhaton ana.","http-methods":"Kini ang verb sa request. GET pang-basa, POST pang-create, PUT pang-replace tanan, PATCH pang-edit og part ra, DELETE pang-delete.","status-codes":"Three-digit number sa matag response nga mo-ingon unsa nahitabo. Ang first digit, mo-ingon kinsay sala.","https":"Ang HTTPS (HTTP Secure) kay HTTP nga naka-encrypt gamit ang TLS (Transport Layer Security), so walay maka-basa or maka-usab ana sa tunga.","anatomy":"Same ra ang parts sa matag HTTP message: first line, headers nga naay details, ug usahay body nga naay data.","auth":"Pag-prove kung kinsa ka sa matag request, usually gamit ang token nga gihatag sa server pag-login nimo.","cors":"Cross-Origin Resource Sharing: rule sa browser nga dili ka pabasahon sa response sa laing site, unless gi-allow ka sa site.","websocket":"Sa polling, sige ka og pangutana “naa na bay bag-o?”. Sa WebSocket, naay usa ka connection nga naka-open permi, so ang server na mismo mo-push pag naay nahitabo.","latency":"Unsa ka dugay ang usa ka request, from pag-send nimo hangtod naa na ang tubag.","ttfb":"Time To First Byte: unsa ka dugay before moabot ang first piece sa tubag, bisan wala pa nahuman ang uban.","throughput":"Pila ka requests ang mahuman sa system per second. Speed nga gi-measure sa dami, dili sa oras.","distribution":"Ang shape nga mogawas pag i-plot nimo ang daghang measurements: asa ang kadaghanan, ug unsa ka layo ang mga naulahi.","mean-median":"Ang average, dali ra madala sa usa ka dako kaayo nga value. Ang median, ang naa sa tunga, halos dili mo-move.","percentiles":"Ang p99 (99th percentile) meaning, 99% sa requests mas paspas ani. Kini ang latency sa imong malas nga 1 out of 100.","tail-latency":"Ang hinay nga dulo sa distribution, ug ngano mo-worse pa ni pag ang usa ka request nag-depend sa daghan pa.","cold-start":"Ang extra nga delay sa first request after dugay na-idle o bag-o pa gi-start.","sli-slo-sla":"SLI (Service Level Indicator) ang imong gina-measure. SLO (Service Level Objective) ang imong target. SLA (Service Level Agreement) ang promise sa contract, nga naay multa.","error-budget":"Pila ka failure ang gi-allow sa imong SLO. Pag 99.9% per month, mga 43 minutes ra imong budget.","timeout":"Ang pinaka-dugay nga kaya nimo maghulat sa tubag before ka mo-give up.","retry-backoff":"Pag nag-fail, try-a balik, pero padugaya ang hulat every try ug butangi og random para dili dungan ang tanan mo-retry.","circuit-breaker":"Undang sa usa og tawag sa service nga sige og fail, hulat kadali, then i-test hinay-hinay before nimo i-trust balik.","idempotency":"Bisan i-send nimo og kaduha ang same nga request, same ra gihapon ang effect, murag kausa ra.","rate-limiting":"Limit sa pila ka requests ang pwede sa usa ka client within a time window. Pag lapas ka, HTTP 429 imong makuha.","backpressure":"Pag mas hinay ang consumer kaysa producer, i-push back ang producer imbes nga patong-patongan og trabaho.","thundering-herd":"Daghan kaayo nga requests nga dungan nag-wake up ug dungan sad nga mi-hit sa usa ra ka resource.","load-balancer":"Murag traffic enforcer nga mo-spread sa mga requests sa lain-laing servers.","cache":"Butangi og copy ang tubag duol nimo para di na nimo kinahanglan i-compute or kuhaon balik.","ttl":"Time To Live: unsa ka dugay pwede magpuyo ang cached item, DNS record, or message before i-consider nga luma na.","connection-pool":"Ipa-open ang pipila ka connections ug i-reuse, imbes nga mo-open og bag-o every request.","async-queue":"Dawata ang job karon, buhata later sa background, then sultihi ang client pag human na.","n-plus-1":"Gikuha nimo ang list gamit ang usa ka query, then nag-query pa ka og usa para sa matag item.","pagination":"Pag-return sa taas nga list per page. Offset: “skip-a ang 4”. Cursor: “start after ani nga item”.","race-condition":"Duha ka operations nga dungan nag-run, ug ang result depende kung kinsa ang nauna.","eventual-consistency":"Magka-same ra gihapon ang tanang copies sa data, dili lang dayon. For a while, naay makakita pa sa old value."},"like":{"rest":"Murag library. Ang matag libro naay address sa shelf (ang URL). Pwede nimo hulaman, ilisan og bag-ong edition, or ipa-tangtang (ang methods). Di ka kaila sa librarian, so ipakita lang balik imong card every balik (stateless).","http-methods":"Murag nag-file og papeles sa counter. Pagbasa sa form, walay mausab (GET). Pag-file og bag-ong form, madugangan og copy every time (POST). Pag-replace sa tibuok form, same ra ang result bisan pila ka beses (PUT).","status-codes":"Murag delivery notice. Na-deliver (2xx). Nibalhin na og address (3xx). Sayop ang address sa parcel (4xx). Nawala sa courier (5xx).","https":"Postcard vs sealed nga sobre nga naay pirma. Ang postcard, bisan kinsa maka-basa. Ang sobre, address ra makita, ug ang pirma mo-prove kinsay nag-send.","anatomy":"Murag parcel. Ang shipping label, mao ang headers: asa padulong, unsay sulod, unsaon pag-handle. Ang sulod sa box, mao ang body.","auth":"Murag wristband sa event. Kausa ra nimo ipakita ang ID sa gate, then wristband na lang. Valid ra na karon nga adlaw.","cors":"Murag bouncer nga guest list ra ang pasudlon. Sa browser siya nagtrabaho, dili sa venue, so ang moagi sa likod (Postman, servers) di niya ma-block.","websocket":"Tawag ka sa restaurant every 5 minutes para mangutana kung ready na imong table, vs. ibilin lang imong number para i-text ka nila.","latency":"Murag drive-thru. Ang biyahe padulong sa window, ang pagluto, ang biyahe pabalik. Bisan unsa ka paspas sila magluto, wa gihapoy pulos kung layo ang dalan.","ttfb":"Murag restaurant nga mo-serve una og bread samtang ginaluto pa imong main course. Ang bread, mao imong first byte.","throughput":"Murag highway. Ang speed limit, mao ang latency. Pag dugang ka og lane, walay sakyanan nga mo-paspas, pero mas daghan ang makaagi per hour.","distribution":"Murag imong commute. Usually 30 minutes, usahay 35. Then one day, naay natumba nga truck, 2 hours ka sa dalan. Pero never ka naka-abot in 5 minutes.","mean-median":"Naay bilyonaryo nisulod sa coffee shop. Kalit, dako kaayo ang average nga kwarta sa sulod. Pero ang median nga customer, nagpalit ra gihapon og kape.","percentiles":"Murag ranking sa exam. “99th percentile” meaning, na-beat nimo ang 99% sa class. Sa latency, baliktad: pag naa ka sa p99, ikaw ang malas.","tail-latency":"Murag group dinner nga walay mo-uli hangtod dili pa ka-bayad tanan. Mas daghan og kuyog, mas taas ang chance nga naay usa nga nangita pa sa iyang wallet.","cold-start":"Murag sakyanan sa bugnaw nga buntag. Pangit ang dagan sa first minute. After ana, okay na.","sli-slo-sla":"Murag driving. Ang speedometer, SLI. Imong personal rule nga 5 below sa limit, SLO. Ang speed limit sign nga naay multa, SLA.","error-budget":"Murag monthly data plan. Gamita lang bisan unsaon, pero pag nahurot na, tipid sa ka hangtod mo-reset.","timeout":"Murag naghulat sa imong barkada sa mall. Ikaw mo-decide: 20 minutes, then uli na ko.","retry-backoff":"Murag gidagsaon nga pultahan. Pag dungan tanan mo-atras unya dungan sad mo-sulod, maipit gihapon. Pag random ang hulat sa matag usa, makaagi ra tanan.","circuit-breaker":"Murag breaker sa balay. Pag naay nag-short, mo-trip siya para di masunog ang balay. I-on nimo balik, careful, kausa ra.","idempotency":"Murag button sa elevator. Pindota kausa or napulo ka beses, usa ra gihapon ka elevator ang moabot.","rate-limiting":"Murag ticket machine sa rides. Same ra ang speed sa paggawas sa tickets. Mahurot sa crowd ang stack, then hulat tanan sa next ticket.","backpressure":"Murag kusina nga mo-stop og dawat og orders pag puno na ang ticket rail, imbes nga pasagdan ang tickets mahulog sa salog.","thundering-herd":"Murag mall nga ni-open sa sale day. Tanan naghulat, ug tanan dungan ni-sulod sa same second.","load-balancer":"Murag counter sa grocery. Ang round robin, staff nga mo-tudlo nimo sa lane in order. Ang least connections, ikaw mismo mo-pili sa pinaka-short nga linya.","cache":"Murag naa nay charger sa imong bag, imbes nga mo-uli pa ka every time nga kinahanglan ka mag-charge.","ttl":"Murag best-before date sa karton sa gatas.","connection-pool":"Murag naa ra ka sa usa ka taas nga call sa imong officemate, imbes nga i-end ug tawagan balik every pangutana.","async-queue":"Murag laundry shop. Ibilin nimo ang sinina, hatagan ka og ticket, balikan lang nimo later. Di man ka magbarog sa counter samtang nag-plantsa sila.","n-plus-1":"Murag mo-adto ka sa grocery every ingredient, imbes nga kausa ra nga naay dalang list.","pagination":"Bookmark (cursor) vs. pag-remember nga “naa ko sa page 40” samtang naay sige og insert og pages sa unahan (offset).","race-condition":"Murag duha ka tawo nga dungan nag-withdraw sa joint account sa duha ka ATM sa same second, ug pareho nilang nakita ang full balance.","eventual-consistency":"Murag nibalhin ka og balay. Ang post office, kahibalo na karon. Ang bangko, next week. Ang imong old friends, pag mangutana na lang sila."},"done":{"rest":"REST API ang .NET API. Pag mo-call ang Angular dashboard og <code>GET /devices/42</code> ug mangayo ang player og <code>GET /devices/42/playlist</code>, pareho ra silang nag-fetch og resources gamit ang URL. Ang usa ka ASP.NET controller usually naka-map sa usa ka resource, like <code>DevicesController</code>.","http-methods":"Ang dashboard mo-gamit og GET para i-load ang device list, POST para mag-create og playlist, PUT or PATCH para i-save ang changes ana, ug DELETE para mag-remove og schedule. Sa ASP.NET, mao na ang <code>[HttpGet]</code>, <code>[HttpPost]</code>, <code>[HttpPut]</code>, <code>[HttpPatch]</code> ug <code>[HttpDelete]</code> attributes sa controller actions.","status-codes":"Pag ma-401 ang player after ma-expire iyang token, or pag mo-gawas ang error toast sa dashboard after og 500, status codes na ang gibasa. Sa ASP.NET, ang <code>Ok()</code>, <code>CreatedAtAction()</code>, <code>NotFound()</code> ug <code>BadRequest()</code> na ang mo-set ana para nimo.","https":"Ang padlock sa browser pag i-open nimo ang dashboard, TLS na. Ang matag player nga mo-call sa API over <code>https://</code> mo-check usa sa certificate sa API. So ang expired nga certificate kay classic nga rason nganong mawad-an og contact ang tanan devices sa same day, mao nang ang pag-renew ani (kaya sa AWS Certificate Manager i-automatic) kay real operational work jud.","anatomy":"I-click ang bisan unsang request sa Network tab sa DevTools samtang gamit nimo ang dashboard ug makita nimo mismo ning sections: Headers, Payload, Response. Sa .NET side, ang <code>[FromBody]</code> mo-read sa JSON body, <code>[FromQuery]</code> mo-read sa query string, ug <code>[FromHeader]</code> mo-read og header.","auth":"Usually ang Angular app mo-keep sa login token ug mo-gamit og HTTP interceptor para i-attach kini sa matag API call, mao nang talagsa ra nimo kini makita sa component code. Kinahanglan pud og credentials ang devices, para kabalo ang API kinsa nga player ang nangayo og unsa nga playlist. Sa .NET side, ang <code>[Authorize]</code> ang gatekeeper.","cors":"Pag ang Angular dashboard ug ang .NET API naka-serve sa lain-laing domains, kinahanglan i-allow sa API ang origin sa dashboard (sa ASP.NET, <code>AddCors</code> plus <code>UseCors</code>). Ang Node backend sa Pi mo-call pud sa same API pero dili man siya browser, so wala jud CORS para niya.","websocket":"Mao ni ang split sa dashboard. Ang device list mo-show sa status gikan sa last check-in sa matag device. I-open ang page sa usa ka device ug mo-switch siya sa live Socket.IO events. Ang dashboard ug ang matag usa sa 6,000 players kay Socket.IO clients, ug ang Socket.IO server naa sa tunga nga mo-relay sa events between nila. Mo-call pud siya sa .NET API mismo, example para i-save sa RDS ang bag-ong online status sa player pag mo-reconnect kini. Mao na nganong ang reboot or screenshot command maka-abot sa screen within moments, ug ingon ana pud mobalik ang “Update completed” sa dashboard.","latency":"Pag ang Pi player sa store mo-call sa .NET API sa AWS, ang paghulat naay tulo ka parts: ang biyahe across sa internet, ang API plus iyang RDS query, ug ang biyahe pabalik. Pag mag-load og page ang Angular dashboard, ang Time column sa Network tab sa DevTools mo-show sa same nga number.","ttfb":"Pag mangayo ang dashboard og dakong list sa .NET API, ang Timing tab sa DevTools mo-show og “Waiting for server response”. Mao na ang TTFB, ug kadaghanan ana kay ang API nga nag-build sa answer ug ang RDS query sa luyo niya. Ang pag-page or pag-stream sa dagkong lists mo-pa-ubos ani.","throughput":"Mga 6,000 ka Pi players ang ga-storya sa usa ka .NET API. Pag ang matag usa mo-check in kausa every minute, 6,000 ÷ 60 = 100 requests per second na, before pa naay mo-open sa dashboard. Mao na ang throughput, ug mao na ang kinahanglan ma-keep up sa API servers ug RDS.","distribution":"I-chart ang response times sa API calls sa players ug kani nga shape ang makuha nimo. Kadaghanan paspas, ug ang pipila ka ulahi mo-stretch sa tail layo pa-right: hinay nga RDS query, busy nga moment sa API, or player nga hinay ang network sa store.","mean-median":"Pag ang monitoring sa API mo-ingon “average response 400 ms” pero halos tanan calls kay 100 ms ra, pipila ra ka hinay nga outliers, basin usa ka bug-at nga report query, ang nagdala sa number.","percentiles":"Ang “p99 sa player playlist endpoint kay 900 ms” meaning 1 sa 100 ka player calls ang maghulat ana ka dugay. Sa 100 requests per second gikan sa 6,000 players, ang 1 sa 100 kay mga 60 gihapon ka hinay nga calls every minute.","tail-latency":"Ang dashboard page nga mo-fire og daghang API calls at once ug mo-render ra pag nibalik na tanan (Angular's <code>forkJoin</code>, or <code>Promise.all</code>) maghulat sa pinakahinay. Same ra pud sa sulod sa .NET API pag ang usa ka endpoint mo-run og daghang queries ug i-merge ang results.","cold-start":"After og deploy, ang first requests sa .NET API kay usually mas hinay samtang nag-start siya, nag-warm up, ug nag-open sa iyang first connections sa RDS. Ang Pi nga bag-o lang nag-reboot, same pattern: ang iyang first calls after boot mas hinay kaysa sa uban.","sli-slo-sla":"Pag ang client agreement mo-promise nga online ang screens 99.5% of the time, SLA na. Ang “Gusto namo nga 99.9% sa player API calls mo-succeed” kay SLO. Ang measured online/offline numbers sa dashboard kay SLI.","error-budget":"Ang bati nga API deploy, RDS maintenance window, ug Socket.IO server restart, tanan ana mogasto sa same nga budget. Ang “Lisod ang semana, i-hold sa nato ang release” kay pag-manage na og error budget, wala lang gitawag sa pangalan.","timeout":"Pag ang player mo-call sa .NET API nga walay timeout ug mo-hang ang API, kana nga call pwede magpabilin didto forever. I-multiply sa 6,000 players ug ang hinay nga API mahimong liboan ka stuck connections. Ang <code>HttpClient.Timeout</code> sa .NET, ang <code>timeout</code> option sa axios sa Node backend sa Pi, ug ang 504 sa gateway, tanan ana kay mao ra ni nga idea.","retry-backoff":"Pag down ang API og usa ka minute, 6,000 players ang mag-fail sa same moment. Pag mo-retry silang tanan every 5 seconds on the dot, ang API ma-hit og synchronized nga waves pag-balik dayon niya. Ang backoff plus jitter sa Node backend sa player mo-spread out sa kana nga retries.","circuit-breaker":"Pag makita sa Node backend sa Pi nga sige ra og fail ang API, pwede siya mo-stop og call for a minute ug padayon og play gikan sa iyang local SQLite copy, imbes nga sige og bombard sa server nga naglisod na. Kana nga “undang sa og try for a while” nga switch kay circuit breaker.","idempotency":"Mo-report ang player og “ad 42 played at 10:02” ug walay reply nga nadawat, so i-send niya usab ang report. Usa ra ka play ang dapat i-count sa API, dili duha. Ang paghatag og unique ID sa matag report ug pag-check og “na-save na ba nako ni nga ID?” before mag-insert sa RDS, mao na ang idempotency. Same ra pud sa dashboard button nga gi-double-click sa usa ka tawo.","rate-limiting":"Sa 6,000 players, ang usa ka buggy nga player build nga mo-call sa API in a tight loop makapahinay sa tanan. Ang per-device rate limit sa .NET API (naay built-in rate-limiting middleware ang ASP.NET Core) mo-answer og 429 ana nga device samtang padayon ra ang uban.","backpressure":"Pag mo-push ang dashboard og update sa liboan ka players gamit ang Socket.IO, mas paspas pa mo-produce og messages ang server kaysa makadawat ang hinay nga devices. Kana nga messages maghulat sa per-connection buffer sa server memory, ug pag walay mo-push back, sige ra og dako ang buffer. Ang <code>stream.pipe()</code> sa Node mo-pause sa reading pag ma-late ang writing, same ra nga rason.","thundering-herd":"I-restart ang Socket.IO server ug ang tanan 6,000 players mo-reconnect within seconds, ug daghan dayon mo-call sa API para mo-resync. Mao jud na ang rason nganong ang Socket.IO client mo-add og random delay sa reconnects (iyang <code>randomizationFactor</code> option). Ang schedule nga ang tanan players mo-refresh at midnight sharp mo-cause pud og same nga spike.","load-balancer":"Pag ang .NET API mo-run as more than one instance sa AWS luyo sa load balancer, ang matag call gikan sa dashboard ug players mo-land sa usa nila. Mas tricky ang Socket.IO across sa daghang servers: kinahanglan niya og sticky sessions ug adapter, para maabot sa message ang device nga connected sa lain nga server.","cache":"Ang matag Pi mo-keep sa iyang playlist ug ad files locally, sa SQLite ug sa disk, para padayon og play ang screens pag mawala ang network. Cache na sa gi-ingon sa API niya. Sa server, pwede mo-cache ang .NET API sa answers nga gipangayo sa daghang players, para di na i-run sa RDS ang same nga query liboan ka beses.","ttl":"Pila ka dugay mo-trust ang player sa iyang local playlist before mangutana usab sa API, TTL na basically. Mas mubo meaning mas dali maabot sa screens ang changes ug mas daghan traffic sa API; mas taas meaning mas gamay ang traffic ug mas stale ang screens. Ang pag-push sa changes over Socket.IO mo-allow nimo nga taas ang TTL pero ma-update gihapon dayon.","connection-pool":"Ang .NET API mo-reach sa RDS gamit ang pooled MySQL connection (naka-on by default ang pooling sa .NET MySQL drivers), so ang matag request manghulam ra og open connection imbes nga mag-open og bag-o. Ang long-lived Socket.IO connections sa players kay same idea para sa push: connect kausa, i-reuse para sa tanan.","async-queue":"Ang pag-press og Screenshot sa device page kay async by nature. Ang request sa dashboard moagi sa Socket.IO server padulong sa Pi, ang Pi mo-screenshot pag kaya na niya ug i-upload sa .NET API, ug after pa ana mobalik ang <code>screenshot:done</code> nga signal gamit ang Socket.IO padulong sa dashboard. Same ra pud ang Push playlist, mo-end sa “Update completed” nga pop-up. I-accept ang request karon, mo-report back pag nahuman na.","n-plus-1":"Ang pag-load sa device list sa dashboard, then pag-fetch sa playlist or status sa matag device gamit ang separate nga query, N+1 na. Para sa 6,000 devices, 6,001 queries na sa RDS. Ang JOIN, <code>WHERE id IN (...)</code>, or <code>Include()</code> sa Entity Framework kaya ra niya in one or two.","pagination":"Di kaya sa dashboard i-load ang tanan 6,000 devices at once, so mag-page siya. Pag naka-sort ang list by “last seen” ug sige og reorder ang check-ins, ang offset pages mo-repeat or mo-skip og devices samtang nag-click ka through. Ang pag-sort by stable key, or paggamit og cursor, makalikay ana.","race-condition":"Duha ka tawo nag-edit sa same playlist sa dashboard at the same time. Pareho nag-load sa version 1, pareho nag-press og save, ug ang second save hilom nga mo-overwrite sa first. Ang version column sa row (optimistic concurrency) mo-allow sa API nga i-reject ang stale nga save.","eventual-consistency":"Mao ni ang online/offline status sa dashboard. Pag mo-connect or mo-drop ang player, ang Socket.IO server mo-call sa .NET API para i-save ang bag-ong status sa RDS. Ang device list mobasa ana nga saved value pag mag-load ang page, so snapshot ra siya nga pwedeng minutes na ka daan. I-open ang page sa device mismo ug makuha nimo iyang live status over Socket.IO. Pareho ra sakto ang duha ka views; mas daan ra ang usa."},"body":{"rest":"<p>Sa REST, ang matag URL nag-point sa usa ka <em>thing</em>, usually noun: <code>/devices</code>, <code>/devices/42</code>, <code>/devices/42/playlist</code>. Unsa imong buhaton ana, sa HTTP method na makita, dili sa URL. GET para basahon, PUT para i-replace, DELETE para tangtangon. So makita nimo ang <code>DELETE /schedules/7</code> imbes nga <code>/deleteSchedule?id=7</code>.</p><p>Ang REST kay <strong>stateless</strong> pud. Ang matag request dala na tanan nga kinahanglan sa server: kinsa ka (token) ug unsa imong gusto. Di kahinumdom ang server sa imong previous request. Mao nang pwede magbutang og daghang API servers luyo sa load balancer, kay bisan asa nila pwede mo-answer sa bisan unsang request.</p>","http-methods":"<p>Ang matag HTTP request magsugod sa method. <strong>GET</strong> mo-read ra, ug di jud dapat mag-usab og bisan unsa. <strong>POST</strong> mo-create og bag-o or mo-trigger og action. <strong>PUT</strong> mo-replace sa resource sa imong gi-send. <strong>PATCH</strong> usbon ra ang fields nga imong gi-send. <strong>DELETE</strong> tangtangon na siya.</p><p>Duha ka properties ang importante in practice. Ang <em>safe</em> nga method di mo-change og data (GET). Ang <em>idempotent</em> nga method, pareho ra ang end result bisag kausa or lima ka beses nimo i-send (GET, PUT, DELETE, ug usually PATCH). Ang POST kay wala sa duha, so pag ma-send og kaduha, usually duha pud ang ma-create. Mao nang easy ra mag-retry og GET, pero ang pag-retry og POST kinahanglan og ingat.</p>","status-codes":"<p><strong>2xx</strong> kay success: 200 OK, 201 Created, 204 No Content. <strong>3xx</strong> meaning tan-aw sa lain: 301 moved permanently, 304 not modified (gamita ang imong cached copy). <strong>4xx</strong> meaning ang request ang problema: 400 bad input, 401 wala naka-login, 403 di allowed, 404 not found, 429 too many requests. <strong>5xx</strong> meaning ang server ang problema: 500 nag-crash, 503 temporarily unavailable, ug 502 or 504 pag ang gateway sa atubangan di makakuha og maayo or on-time nga answer gikan sa app sa luyo niya.</p><p>Importante ni nga split para sa retries. Ang pag-retry og 5xx or 429 later, pwede mo-work. Ang pag-retry og 400 or 404 nga walay giusab, mag-fail ra gihapon same way every time.</p>","https":"<p>Ang plain HTTP mo-travel as readable text. Bisan kinsa naa sa path, like shared Wi-Fi sa store or compromised router, makabasa sa tokens ug data or makausab pa gani. Ang HTTPS kay mao ra nga HTTP pero naka-wrap sa sulod sa <strong>TLS</strong>. Ang SSL kay old name sa TLS, ug ang mga tawo ga-ingon gihapon og “SSL certificate”.</p><p>Before mo-move ang bisan unsang data, mag-<strong>handshake</strong> usa ang client ug server. Ang server mo-present og <strong>certificate</strong> nga proof nga iya ang domain, signed sa authority nga trusted na sa client. Then mag-agree sila sa keys, ug tanan after ana kay encrypted na. Ang handshake naay cost nga extra round trips, another reason na sad para i-reuse ang connections.</p>","anatomy":"<p>Ang request magsugod sa method ug path (<code>PUT /devices/42/playlist</code>). Then ang <strong>headers</strong>, key-value details bahin sa message: kinsa ka (<code>Authorization</code>), unsa nga format ang body (<code>Content-Type: application/json</code>), unsa imong gusto nga ibalik (<code>Accept</code>). Then usa ka blank line, then ang <strong>body</strong>, usually JSON.</p><p>Ang response kay murag salamin ana: status line (<code>200 OK</code>), headers (<code>Content-Type</code>, <code>Cache-Control</code>), ug body. Ang <strong>query string</strong> kay ang part sa URL after sa <code>?</code>, gamit para sa gagmay nga options like <code>?page=2&amp;limit=50</code>.</p>","auth":"<p>Ang <strong>Authentication</strong> kay kinsa ka. Ang <strong>Authorization</strong> kay unsa imong allowed buhaton. Kay stateless man ang REST, kinahanglan sa server og proof sa identity sa matag request, usually token sa <code>Authorization: Bearer …</code> header.</p><p>Usa ka common nga format ang <strong>JWT</strong>: tulo ka base64 parts nga gi-join og dots. Header, payload sa claims (user ID, role, expiry time), ug signature. I-check sa server ang signature para ma-confirm nga siya ang nag-issue sa token ug walay nag-edit ani. Mo-expire ang tokens, so mo-login balik ang client or mo-gamit og refresh token para makakuha og bag-o. Pag missing or expired ang token, 401; pag valid ang token pero walay permission, 403.</p>","cors":"<p>Ang browsers mo-block sa page nga mobasa og responses gikan sa lain nga <em>origin</em> (scheme, domain ug port) unless mo-opt in ang server. Mao na ang same-origin policy, ug ang CORS kay ang paagi sa server para mo-opt in, gamit ang headers like <code>Access-Control-Allow-Origin</code>.</p><p>Para sa requests nga pwedeng mo-change og data or naay custom headers, mo-send usa ang browser og <strong>preflight</strong>: usa ka <code>OPTIONS</code> request nga nangutana “pwede ba?”. Pag allowed sa answer, mao pa mo-gawas ang real request. Browser ra ang nag-enforce ani, so ang same request gikan sa Postman, curl, or Node server kay okay ra. Mao nang makalibog kaayo ang CORS errors: working ang API, ang browser ra jud ang ga-ingon og dili.</p>","websocket":"<p>Ang HTTP kay request ug response: maka-answer ra ang server pag pangutan-on. Para makita ang changes, pwede mo-<strong>poll</strong> ang client, mangutana every few seconds. Simple ra, pero kadaghanan sa answers kay “walay bag-o”, ug ma-notice ra nimo ang change sa sunod nga poll.</p><p>Ang <strong>WebSocket</strong> mo-upgrade sa usa ka HTTP connection into long-lived, two-way nga channel. Bisan asa nga side pwede mo-send anytime, so ang updates moabot almost instantly ug walay sayang nga requests. Ang cost kay ang server mag-hold og open connection para sa matag client. Ang <strong>Socket.IO</strong> kay library on top sa WebSockets nga mo-add og reconnection, rooms, ug fallbacks.</p>","latency":"<p>Ang latency kay murag stopwatch sa usa ka request. Naa siyay parts: oras sa network paadto, oras nga nag-work ang server, ug oras sa network pabalik.</p><p>Pag naay mo-ingon nga hinay ang endpoint, ang first useful nga pangutana kay <em>asa nga part</em> ang hinay. Ang server nga mo-answer in 5 ms pwede gihapon ma-feel nga hinay pag 250 ms ang layo sa user, ug ang server nga duol ra pwede pud ma-feel nga hinay pag usa ka segundo ang iyang query.</p>","ttfb":"<p>Ang TTFB kay gi-measure gikan sa pag-send sa request hangtod moabot nimo ang first byte sa response. Apil ani ang biyahe paadto, ang thinking time sa server, ug ang first nga biyahe pabalik. Di apil ang pag-download sa uban pa nga body.</p><p>Pag taas ang TTFB, usually meaning hinay ang server mo-<em>start</em> og answer: hinay nga query, cold cache, or code nga mo-build sa tibuok response sa memory before mo-send bisan gamay.</p>","throughput":"<p>Ang latency kay pila ka dugay ang usa ka request. Ang throughput kay pila ka requests ang mahuman within a period of time. Related sila, pero lahi nga numbers.</p><p>Pwede nimo pataason ang throughput bisag walay request nga mopaspas, basta daghan imong i-work at once: more workers, more servers, more connections. Handy nga rule of thumb: <strong>throughput ≈ workers ÷ latency</strong>. Upat ka workers nga 500 ms each, mga 8 requests per second ang mahuman.</p>","distribution":"<p>I-run ang same request kaliboan ka beses ug kaliboan pud ka lain-lain gamay nga latencies ang makuha nimo. I-butang sila sa buckets ug ihapa pila ang na-land sa matag usa. Kana nga shape ang distribution.</p><p>Ang ubang butang mo-form og symmetric nga bell (normal distribution). Ang API latency halos never. Mag-bunch siya duol sa paspas nga value ug naay taas nga tail pa-right, kay usahay ang garbage-collection pause, cache miss, or busy nga disk mopahinay og grabe sa request. Di na kaayo mapaspas ang requests labaw sa fast path, pero pwede sila mahinay og grabe.</p><p>Importante ang shape kay mao ni mo-decide asa nga summary number ang tinuod. Pag taas ang tail, mang-mislead ang average, pero ang percentiles dili.</p>","mean-median":"<p>Ang <strong>mean</strong> kay i-add tanan then i-divide sa count. Ang <strong>median</strong> kay i-sort ang values then kuhaon ang naa sa tunga.</p><p>Pag well-behaved ang data, duol ra sila. I-add og usa ka 3-second nga request sa batch sa 100 ms requests ug mo-jump ang mean, pero ang median di molihok. Para sa latency, ang median (p50 pud tawag) mo-tell nimo unsa makita sa typical user. Ang mean, mostly mo-tell ra nimo nga naay something, somewhere, nga hinay.</p>","percentiles":"<p>I-sort tanan imong request times gikan sa pinakapaspas hangtod pinakahinay. Ang p50 kay ang value sa tunga sa linya, ang p95 kay 95% sa dalan, ang p99 kay 99% sa dalan. So ang “p99 kay 800 ms” meaning 99 out of 100 requests nahuman in 800 ms or less, ug 1 sa 100 ang milapas.</p><p>Gibantayan sa teams ang p95 ug p99 kay ang averages mo-tago sa hinay nga end, ug didto ma-badtrip ang users. Paspas pud kaayo ni mo-add up: pag ang usa ka screen mo-make og 20 API calls, ang 1-in-100 nga hinay nga call mo-gawas sa mga 1 out of 5 screen loads.</p>","tail-latency":"<p>Ang tail latency kay ang p99-and-beyond nga end sa distribution. Pag tan-awon nimo siya ra, murag harmless ra ang 1% slow rate.</p><p>Pero pag ang usa ka request mo-fan out sa daghang backends ug maghulat sa tanan, ang pinakahinay ang mo-decide sa total. Sa 10 backends, mga 10% ang chance nga naay at least usa nga hinay. Sa 100 backends, mga 63%. Sa fan-out nga system, ang talagsa nga hinay nga case mahimong normal nga case, mao nang ang dagkong systems obsessed kaayo sa p99 ug p99.9.</p>","cold-start":"<p>Ang butang nga natulog kinahanglan og time para mamata. Ang serverless function mo-boot og container, ang JVM mo-warm up sa iyang compiler, ang connection pool mo-open sa iyang first connections, ang cache magsugod nga empty. Ang first request ang mobayad ana tanan. Paspas na ang sunod nga requests kay nahuman na ang work.</p><p>Ang cold starts mo-gawas as taas nga spikes usahay, usually after og hilom nga periods or deploys.</p>","sli-slo-sla":"<p>Kini nga tulo kanunay jud magkasagol.</p><p>Ang <strong>SLI</strong> (indicator) kay real measurement, like “percentage sa requests nga nag-succeed under 300 ms”. Ang <strong>SLO</strong> (objective) kay internal target sa imong team para ana nga number, like 99.9% over 30 days. Ang <strong>SLA</strong> (agreement) kay ang imong gi-promise sa customer, usually mas luag kaysa SLO, ug naay kwarta or credits nga at stake pag ma-miss nimo.</p><p>On purpose nga mas higpit ang SLO kaysa SLA, para ma-notice nimo ang problema before naay magasto.</p>","error-budget":"<p>Pag 99.9% imong target, acceptable ang 0.1% nga failure. Over sa 30-day nga bulan, 43.2 minutes na. Kana nga allowance ang error budget.</p><p>Gigasto ni sa teams sa deploys, experiments, ug usahay nga incident. Samtang naa pay budget, ship lang og ship. Pag nahurot na, hinay-hinay sa ug i-work ang reliability hangtod mo-refill. Ang matag extra nine mo-shrink sa budget og tenfold: ang 99.99% mo-bilin og mga 4 minutes a month.</p>","timeout":"<p>Pag walay timeout, ang request sa stuck nga server pwede mo-hang forever, nag-hold og thread, connection, ug memory sa tibuok time. Ang timeout mo-ingon: after N milliseconds, undang na og hulat ug i-treat siya as failure.</p><p>Pag mubo kaayo, mo-give up ka sa requests nga hapit na unta mo-succeed. Pag taas kaayo, mag-pile up ang hinay nga failures. Common nga starting point kay gamay ibabaw sa healthy p99. Hinumdomi nga usually padayon gihapon og work ang server bisag nag-give up na ang client, so ang timed-out nga work kay usually sayang ra.</p>","retry-backoff":"<p>Daghang failures kay temporary ra, so makes sense ang pag-retry. Pero ang pag-retry <em>dayon</em>, dili: pag overloaded ang server, ang instant retries mo-dugang ra og load.</p><p>Ang <strong>Exponential backoff</strong> maghulat og 1 s, then 2 s, then 4 s, then 8 s. Ang <strong>Jitter</strong> mo-add og randomness sa kana nga waits. Pag walay jitter, ang tanan clients nga nag-fail sa same moment mo-retry pud sa same moment, so mag-bangga na pud sila in waves. Pag naay jitter, mo-spread out ang retries ug maka-catch up ang server.</p>","circuit-breaker":"<p>Pag down ang downstream service, ang matag call ngadto niya maghulat then mag-fail, ug ma-tie up pud ang imong own resources along the way. Ang circuit breaker mo-ihap sa failures. After sa pipila ka sunod-sunod, mo-<strong>open</strong> siya ug mo-reject dayon sa calls for a cooldown period, without bisan mo-try.</p><p>After sa cooldown, mo-<strong>half-open</strong> siya ug paagion ang usa ka test request. Pag mo-work, mo-<strong>close</strong> siya ug mo-flow na usab ang traffic. Pag dili, mo-open na pud siya for another cooldown.</p>","idempotency":"<p>Ang GET ug DELETE kay naturally idempotent: basahon og kaduha or i-delete og kaduha, pareho ra gihapon ang result. Ang POST usually dili: ang “charge $5” nga na-send og kaduha, $10 ang ma-charge.</p><p>Importante ni kay ang networks mawad-an og replies, ug di kabalo ang client kung ang request ba ang nag-fail or ang answer ra ang nawala. Ang fix kay <strong>idempotency key</strong>: mo-attach ang client og unique ID. Hinumdoman sa server ang keys nga na-handle na niya ug, pag naay repeat, ibalik ang saved nga result imbes nga buhaton usab ang work.</p>","rate-limiting":"<p>Ang rate limiting mo-protect sa service para di ma-swamp, bisan bug, busy nga customer, or attack.</p><p>Common nga implementation ang <strong>token bucket</strong>. Ang bucket maka-hold og up to N tokens ug mo-refill at a steady rate. Ang matag request mokuha og usa ka token. Pag empty ang bucket, ma-reject ang request with <code>429 Too Many Requests</code>. Ang size sa bucket mo-allow og short bursts; ang refill rate mo-set sa long-run average.</p>","backpressure":"<p>Pag ang usa ka part sa system mo-produce og work nga mas paspas kaysa ma-handle sa sunod nga part, kinahanglan naay padulngan ang sobra. Pag walay limit, mo-pile up siya sa memory hangtod mo-explode ang latency or mo-crash ang process.</p><p>Ang backpressure meaning ang hinay nga side mo-ingon sa paspas nga side nga hinay-hinay sa: ang full nga queue mo-block sa bag-ong writes, ang stream mo-pause, ang API mo-answer og 503 or 429. Ang alternative kay i-drop ang work. Usahay mao na ang sakto, pero dapat decision na, dili accident.</p>","thundering-herd":"<p>Imagine-a ang usa ka popular nga cache entry. Samtang valid pa, kalma ra ang database. Pag-expire dayon niya, ang matag request nga mosulod makakita og miss ug moadto sa database para sa same nga data, sabay-sabay. Ma-spike ang database for no good reason.</p><p>Ang usual nga fix kay <strong>request coalescing</strong> (single flight pud tawag): ang first request mo-fetch sa value ug ang uban maghulat ra sa kana nga usa ka result. Ang ubang fixes kay i-refresh ang entry before pa mo-expire ug i-add og jitter sa TTLs.</p>","load-balancer":"<p>Pag kulang na ang usa ka server, mag-run ka og daghang copies ug butangan og load balancer sa atubangan. Siya ang mo-decide unsa nga server ang mo-handle sa matag request.</p><p>Ang <strong>Round robin</strong> mag-turn-turn: 1, 2, 3, 1, 2, 3. Simple, pero di niya tagdon kung unsa ka busy ang matag server. Ang <strong>Least connections</strong> mo-send sa sunod nga request sa server nga pinakagamay ang in progress, so ang hinay nga server naturally gamay ra og work.</p><p>Ang pag-add og more servers like ani kay <em>horizontal</em> scaling. Ang pagpadako sa usa ka server kay <em>vertical</em> scaling.</p>","cache":"<p>Ang cache mo-store sa results gikan sa hinay nga sources (database, external API, bug-at nga calculation) sa paspas nga storage, usually memory or Redis.</p><p>Pag naay request nga mosulod, check usa ang cache. Pag naa didto ang answer, <strong>hit</strong> na: ibalik dayon. Pag wala, <strong>miss</strong> na: i-fetch sa source, i-save ang copy sa cache, then ibalik. Ang <strong>hit ratio</strong> kay ang share sa requests nga na-answer gikan sa cache. Ang caches mo-trade sa freshness para sa speed, kay ang copy pwede nang out of date.</p>","ttl":"<p>Ang matag cached copy ma-stale ra jud eventually. Ang TTL mo-butang og orasan ani: after ani ka daghan seconds, ilabay na ug mag-fetch og bag-o.</p><p>Ang mubo nga TTLs mo-keep sa data nga fresh pero mas daghan traffic sa source. Ang taas nga TTLs kay paspas ug barato pero pwede mo-serve og daan nga data. Makit-an nimo ang TTLs sa Redis (<code>EXPIRE</code>), sa HTTP (<code>Cache-Control: max-age=60</code>), sa DNS records, ug sa message queues.</p>","connection-pool":"<p>Mahal ang pag-open og connection. Ang TCP handshake mo-cost og round trip, ang TLS mo-dugang pa, ug ang databases mo-add og authentication sa ibabaw. Pag ang matag request mo-open og bag-ong connection, bayaran niya na nga cost every time.</p><p>Ang connection pool mo-keep og set sa open connections nga ready na. Ang request manghulam og usa, gamiton, then ibalik. Kausa ra bayran ang setup cost. Ang pools mo-cap pud pila ka connections ang naa, para di ma-overwhelm ang database.</p>","async-queue":"<p>Ang ubang work kay dugay kaayo para mahuman sulod sa usa ka HTTP request: pag-generate og report, pag-encode og video, pag-send og 10,000 emails. Pag pahulaton nimo ang client, ma-tie up ang connections ug usually ma-timeout pa.</p><p>Instead, ang API mobutang og job sa queue ug mo-answer dayon og <code>202 Accepted</code> ug job ID. Ang background workers mokuha og jobs sa queue ug i-process. Ang client mo-check back (polling) or ma-notify (webhook) pag ready na. Ang queues mo-smooth out pud sa spikes, kay ang workers naa sa ilang own pace.</p>","n-plus-1":"<p>Mag-load ka og 10 posts gamit ang usa ka query. Then, para sa matag post, i-load nimo iyang author, usa-usa nga query. 1 + 10 = 11 queries na, ug ang matag usa mobayad og round trip sa database. Pag 100 posts, 101 na.</p><p>Dali ra ni masulat by accident gamit ang ORM, kay ang <code>post.author</code> murag nagbasa ra og field. Ang fix kay i-fetch dungan ang related data: JOIN, <code>WHERE id IN (...)</code> nga query, or ang eager loading sa ORM (<code>include</code>, <code>with</code>, <code>preload</code>).</p>","pagination":"<p>Ang <strong>Offset</strong> pagination (<code>?offset=4&limit=4</code>) kay easy ug pwede ka mo-jump sa bisan unsang page. Pero pag naay bag-ong rows nga ma-add samtang nag-page ang usa ka tawo, tanan mo-shift down ug ang sunod nga page mo-repeat og item (or mo-skip og usa pag naay rows nga na-delete). Mohinay pud siya sa lalom nga pages, kay ang database mo-agi gihapon sa matag skipped row.</p><p>Ang <strong>Cursor</strong> pagination (<code>?after=7</code>) mo-remember sa last item nga imong nakita ug mangayo sa sunod ana. Sakto gihapon bisag mag-change ang data ug paspas gihapon, pero di ka maka-jump diretso sa page 50.</p>","race-condition":"<p>Duha ka requests nag-try og palit sa last item. Pareho nakabasa og <code>stock = 1</code>. Pareho nakakita nga available pa. Pareho nag-write og <code>stock = 0</code> ug nag-confirm sa sale. Duha ka items imong nabaligya pero usa ra imong stock.</p><p>Ang bug naa sa gap between reading ug writing. Ang fixes mo-close ana nga gap: lock para usa ra ka request ang mo-work sa row at a time, atomic update (<code>UPDATE … SET stock = stock - 1 WHERE stock > 0</code>), or version check nga mo-reject sa writes nga based sa stale nga read.</p>","eventual-consistency":"<p>Ang dagkong systems mo-keep og daghang copies sa same nga data: read replicas, caches, nodes sa ubang regions. Ang write mo-land usa sa usa ka copy, then mo-spread sa uban. Sulod ana nga gap, pag mobasa ka sa copy nga wala pa naka-catch up, ang daan nga value ang mobalik.</p><p>Ang system mahimong consistent <em>eventually</em>, pag nahuman na ang replication. Ang <strong>Strong consistency</strong> meaning ang matag read makakita sa latest write, nga mo-cost og speed or availability. Daghang apps ang mo-accept sa eventual consistency ug mo-design around sa gap, example, ang pagbasa sa imong own recent writes gikan sa primary.</p>"}}};
const LOL={"en":{"rest":"The librarian has the memory of a goldfish. On purpose.","http-methods":"POST twice and you've ordered two pizzas. Enjoy.","status-codes":"4xx: it's you. 5xx: it's us. 2xx: nobody complains.","https":"Plain HTTP is pinning your password on the barangay bulletin board.","anatomy":"Nobody reads the label until the package goes to the wrong house.","auth":"Lose the wristband and it's back to the long line at the gate (401).","cors":"Yes, the API answered. No, the browser won't show you. Bouncer things.","websocket":"Polling is the kid in the back seat asking “are we there yet?” every minute.","latency":"Fast servers can't fix a long road. Physics doesn't do overtime.","ttfb":"The bread arrives in 2 minutes. The steak... let's not talk about the steak.","throughput":"EDSA has lots of lanes. Your car is still slow. Both are true.","distribution":"The two-hour day is the one your boss remembers.","mean-median":"Average says everyone in the café is rich. Median says it's still KKB.","percentiles":"99th percentile: congrats on an exam, condolences on latency.","tail-latency":"There's always that one friend. In a fan-out, that friend is a server.","cold-start":"Same as you before your first coffee.","sli-slo-sla":"Only the SLA comes with a ticket from the traffic enforcer.","error-budget":"Burn it all by day 3 and it's Free Data until payday.","timeout":"No timeout means waiting at the mall forever. Don't be that person.","retry-backoff":"Jitter is just not rushing the jeepney door all at once.","circuit-breaker":"Flipping it ten times in a row is not a strategy. Ask your electrician.","idempotency":"Pressing it harder doesn't help either. We've all tried.","rate-limiting":"429 is the API saying “one at a time, please, there's a line.”","backpressure":"Saying “not now” is a skill. Kitchens and servers both need it.","thundering-herd":"11.11 sale energy, except the thing getting trampled is your database.","load-balancer":"Nobody wants the lane behind const LIVE_MAP = Object.fromEntries(['tl','ceb'].map((lang,i)=>[lang,new Map(LIVE_TEXT.map(row=>[row[0],row[i+1]]))]));
const LIVE_PATTERNS = LIVE_TEXT.filter(row=>row[0]!=='{0}.'&&/\{\d+\}/.test(row[0])).map(row=>{
  const slots=[];let pattern='',last=0;
  const escape=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  for(const m of row[0].matchAll(/\{(\d+)\}/g)){pattern+=escape(row[0].slice(last,m.index))+'([\\s\\S]*?)';slots.push(m[1]);last=m.index+m[0].length}
  return {re:new RegExp('^'+pattern+escape(row[0].slice(last))+'$'),slots,row};
});
const TX_CACHE={};
function TX(value){
  if(LANG==='en'||typeof value!=='string')return value;
  const c=TX_CACHE[LANG]||(TX_CACHE[LANG]=new Map());if(c.has(value))return c.get(value);
  const out=TX_RAW(value);if(c.size>5000)c.clear();c.set(value,out);return out}
function TX_RAW(value){
  const map=LIVE_MAP[LANG];if(!map)return value;
  if(map.has(value))return map.get(value);
  const text=value.trim();if(map.has(text))return value.replace(text,()=>map.get(text));
  for(const {re,slots,row} of LIVE_PATTERNS){const m=text.match(re);if(!m)continue;
    const vars=Object.fromEntries(slots.map((key,i)=>[key,m[i+1]]));
    return row[LANG==='tl'?1:2].replace(/\{(\d+)\}/g,(_,key)=>TX(vars[key]));
  }
  if(text.endsWith('.')){const core=text.slice(0,-1),translated=TX(core);if(translated!==core)return translated+'.'}
  return value;
}
function TXHTML(html){
  if(LANG==='en')return html;
  const direct=TX(html);if(direct!==html)return direct;
  const template=document.createElement('template');template.innerHTML=html;
  const walker=document.createTreeWalker(template.content,NodeFilter.SHOW_TEXT);
  while(walker.nextNode()){const node=walker.currentNode;if(!node.parentElement?.closest('code,pre'))node.nodeValue=TX(node.nodeValue)}
  return template.innerHTML;
}

$('q').onkeydown=e=>{if(e.key==='Enter'){const b=$('toc').querySelector('button[data-id]');if(b){go(b.dataset.id);$('q').blur()}}if(e.key==='Escape'){$('q').value='';renderToc();$('q').blur()}};

const ICON={fig:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
 txt:'<svg viewBox="0 0 24 24"><path d="M4 6h16M4 11h16M4 16h10"/></svg>',

 book:'<svg viewBox="0 0 24 24"><path d="M4 5h7a2 2 0 012 2v13a2 2 0 00-2-2H4zM20 5h-5a2 2 0 00-2 2v13a2 2 0 012-2h5z"/></svg>',
 cube:'<svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7zM12 22V12M21 7l-9 5-9-5"/></svg>',

const ph=(ic,title,act)=>`<div class="ph"><div class="ic">${ICON[ic]}</div><h2>${title}</h2>${act||''}</div>`;
const WHERE=[['Angular dashboard','pop',['pagination','cors','auth','tail-latency','eventual-consistency']],
 ['.NET Core API','req',['rest','http-methods','status-codes','rate-limiting','idempotency','load-balancer','cold-start']],
 ['RDS · MySQL','ad',['connection-pool','n-plus-1','race-condition','cache']],
 ['Socket.IO server','pi',['websocket','backpressure','thundering-herd','async-queue']],
 ['Raspberry Pi players ×6,000','slot',['throughput','retry-backoff','circuit-breaker','timeout','ttl']],
 ['Across the whole system','muted',['latency','percentiles','sli-slo-sla','error-budget','https']]];
function cover(){
  return `<div class="head"><div class="l"><div class="eyebrow">Glossary</div><h1 class="term">${L('title',"Words that sound hard, for things you already do")}</h1>
  <p class="one">${L('intro',"You learned polymorphism by writing code long before anyone explained it well. Backend jargon works the same way: p99, backpressure, idempotency. Most of it names something you have already built, debugged, or cursed at. Every example in this guide uses the NTV360 system below.")}</p></div></div>
  <div class="grid">
    <div class="panel">${ph('cube',TX('The NTV360 system'),'<span class="act" style="cursor:default">3 tiers + real-time</span>')}
      <div class="pb"><div class="stats" id="stats"></div><div class="stage" id="stage"></div><div class="ctrl" id="ctrl"></div>
      <p class="cap" id="archlog"><b>${TX('Now')}</b>${TX("Players check in with the API on their own, about once a minute each. Press a button to follow one request through the system.")}</p></div></div>
    <div class="side"><div class="panel">${ph('pin',L('where','Where each term lives'))}<div class="where">${WHERE.map(([n,c,ids])=>`<div class="wh"><div class="lab" style="color:var(--${c})">${n}</div><div class="chips">${ids.map(id=>`<button data-go="${id}">${byId[id].t.replace(/ \(.*\)/,'')}</button>`).join('')}</div></div>`).join('')}</div></div></div>
  </div>
  <div class="kpis" style="margin-top:16px">${LEVELS.map(l=>{const n=SORTED.filter(x=>x.lv===l.k);return `<button class="kpi lvk" style="--c:var(--${l.c})" data-go="${n[0].id}"><div class="lab" style="color:var(--${l.c})">${l.name}${l.k==='beginner'?' · '+L('start','start here'):''}</div><b>${n.length}</b><p>${L('lv_'+l.k,l.blurb)}</p></button>`}).join('')}</div>
  <div class="chgrid">${LEVELS.map(l=>{const items=SORTED.filter(x=>x.lv===l.k),k='p-'+l.k;return `<div class="panel fp${COLL[k]?' shut':''}" data-k="${k}"><button class="ph fh" aria-expanded="${!COLL[k]}"><div class="ic"><svg viewBox="0 0 12 12" class="chev"><path d="M3 4.5l3 3 3-3"/></svg></div><h2><span style="color:var(--${l.c});font-family:var(--mono);font-size:12px;margin-right:8px">■</span>${l.name} <small>${items.length} terms</small></h2><span class="act">${COLL[k]?'Show':'Hide'}</span></button>
    <div class="fb">${items.map(x=>`<button class="row" data-go="${x.id}"><i style="--c:var(--${l.c})">${ORDER.indexOf(x.id)}</i><div><strong>${x.t}</strong><span>${esc(strip(TR(x,'one')))}</span></div></button>`).join('')}</div></div>`}).join('')}</div>
  <div class="panel" style="margin-top:16px">${ph('book',L('howpage','How each page works'))}
  <div class="anat">
    <div style="--c:var(--brand)"><b>${L('a1t','One sentence')}</b>${L('a1d',"The whole idea, as short as it gets, with every abbreviation spelled out.")}</div>
    <div style="--c:var(--req)"><b>${TX('Live figure')}</b>${L('a2d',"An animation with knobs. Break it on purpose.")}</div>
    <div style="--c:var(--ad)"><b>${L('done',"You've already done this")}</b>${L('a3d',"Where it shows up in the NTV360 dashboard, API and players.")}</div>
    <div style="--c:var(--pop)"><b>${L('picture','Picture it')}</b>${L('a4d','An analogy from outside computers.')}</div>
  </div></div>`}
function termPage(x){
  const nx=ORDER[ORDER.indexOf(x.id)+1];
  return `<div class="head"><div class="l"><div class="eyebrow">${badge(x.lv)}<span>${CHAPTERS[x.ch].name}</span></div>
    <h1 class="term">${x.t}</h1>
    ${x.full.length?`<dl class="full">${x.full.map(([a,b])=>`<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join('')}</dl>`:''}
    <p class="one">${TR(x,'one')}</p></div>
    <div class="aka">${x.aka.map(a=>`<span>${esc(a)}</span>`).join('')}</div></div>
  <div class="grid">
    <div class="panel">${ph('fig',TX('Live figure'),nx?`<button class="act" data-go="${nx}">${L('nextterm','Next term →')}</button>`:'')}
      <div class="pb"><div class="stats" id="stats"></div><div class="stage" id="stage"></div><div class="ctrl" id="ctrl"></div>
      <p class="cap"><b>${L('try','Try it')}</b>${TX(x.cap)}</p></div></div>
    <div class="side">
      <div class="panel note">${ph('done',L('done',"You've already done this"))}<div class="pb txt"><p>${TR(x,'done')}</p></div></div>
      <div class="panel likep"><div class="pb txt"><div class="lab">${L('picture','Picture it')}</div><p>${PIC(x)}</p></div></div>
      ${ARCH[x.id]?`<div class="panel">${ph('cube',L('inarch','In the Architecture guide'))}<div class="pb see">${ARCH[x.id].map(([id,t])=>`<a href="architecture-designs.html#${id}"><i>↗</i>${t}<small>design</small></a>`).join('')}</div></div>`:''}
      <div class="panel">${ph('link',L('see','See also'))}<div class="pb see">${x.rel.map(r=>`<button data-go="${r}"><i>${ORDER.indexOf(r)}</i>${byId[r].t}<small>${lvOf(byId[r].lv).name}</small></button>`).join('')}</div></div>
    </div>
  </div>
  <div class="panel plain">${ph('txt',L('plain','In plain words'))}<div class="pb txt">${ENONLY(x)}${TR(x,'body')}</div></div>`}
function go(id,push=true){if(!ORDER.includes(id))id='start';const from=ORDER.indexOf(curId),to=ORDER.indexOf(id);
  if(stage){stage.stop();stage=null}curId=id;const page=$('page');
  page.innerHTML=id==='start'?cover():termPage(byId[id]);
  page.classList.remove('turn-n','turn-p');void page.offsetWidth;if(from>=0&&from!==to)page.classList.add(to>from?'turn-n':'turn-p');
  const u=UI($('ctrl'),$('stats'),id);
  if(id==='start'){const h=matchMedia('(max-width:700px)').matches?420:500;
    try{stage=Arch3D($('stage'),u,h)}catch(e){console.warn('3D unavailable, using 2D',e);$('stats').innerHTML='';$('ctrl').innerHTML='';stage=Stage($('stage'),460);D.arch(stage,UI($('ctrl'),$('stats'),'start2'))}}
  else{const x=byId[id];stage=Stage($('stage'),HEIGHTS[x.demo]||240);D[x.demo](stage,u)}
  const x=byId[id];
  $('crumb').innerHTML=id==='start'?'Field Guide / <b>Contents</b>':`${lvOf(x.lv).name} · ${CHAPTERS[x.ch].name} / <b>${esc(x.t)}</b>`;
  $('folio').textContent=id==='start'?'Cover':`${String(to).padStart(2,'0')} / ${TERMS.length}`;
  $('prev').disabled=to<=0;$('next').disabled=to>=ORDER.length-1;
  if(id!=='start'){const k=group==='level'?'l-'+byId[id].lv:'c-'+byId[id].ch;if(COLL[k]){COLL[k]=false;saveColl()}}
  renderToc();linkify();const on=$('toc').querySelector('button.on');if(on)on.scrollIntoView({block:'nearest'});
  if(push){try{history.replaceState(null,'','#'+id)}catch(e){}}
  if(from>=0&&push)window.scrollTo({top:0,behavior:'auto'});
}
document.addEventListener('click',e=>{const f=e.target.closest('.fh');if(f){const p=f.closest('.fp'),k=p.dataset.k;COLL[k]=!COLL[k];saveColl();p.classList.toggle('shut',!!COLL[k]);f.setAttribute('aria-expanded',!COLL[k]);f.querySelector('.act').textContent=COLL[k]?'Show':'Hide';return}
  const b=e.target.closest('[data-go]');if(b){e.preventDefault();hidePop();go(b.dataset.go)}});

/* ---------- cross-links: any term mentioned in text links to its page ---------- */
const PHR={rest:['REST*','RESTful'],'http-methods':['HTTP method','HTTP methods','GET*','POST*','PUT*','PATCH*','DELETE*'],'status-codes':['status code','status codes','401*','403*','404*','500*','502*','503*','504*'],https:['HTTPS*','TLS*','SSL*','certificate','handshake','encrypted'],
 anatomy:['headers','header','query string','request body','JSON*'],auth:['JWT*','Bearer token','refresh token','authentication','log in','logged in','login'],cors:['CORS*','preflight'],websocket:['WebSocket','WebSockets','polling','poll','Socket.IO*'],
 latency:['latency','round trip','round trips'],timeout:['timeout','timeouts','timed out','times out'],cache:['cache','cached','caching','cache hit','cache miss','caches','Redis*','hit ratio'],ttfb:['TTFB*'],throughput:['throughput','requests per second','RPS*'],
 ttl:['TTL*','TTLs*','time to live'],pagination:['pagination','offset pagination','cursor pagination'],'n-plus-1':['N+1*'],'rate-limiting':['rate limit','rate limiting','rate-limiting','429*'],
 'mean-median':['median','the mean','average','averages','outlier','outliers'],'load-balancer':['load balancer','load balancers','round robin','least connections','horizontal scaling'],'connection-pool':['connection pool','connection pooling','pooling','keep-alive','pooled'],
 'cold-start':['cold start','cold starts'],distribution:['distribution','long tail','long-tailed','histogram'],percentiles:['percentile','percentiles','p50*','p95*','p99*','p99.9*'],
 'sli-slo-sla':['SLI*','SLO*','SLA*','SLOs*','SLAs*'],'error-budget':['error budget','error budgets'],'retry-backoff':['exponential backoff','backoff','jitter','retry','retries','retrying','retried'],
 idempotency:['idempotency','idempotent','idempotency key'],'circuit-breaker':['circuit breaker'],'async-queue':['queue','queues','job queue','message queue','202 Accepted','webhook','background workers'],
 'race-condition':['race condition','race conditions','optimistic concurrency','atomic update','concurrency'],'eventual-consistency':['eventual consistency','replication lag','read replica','read replicas','replica','replicas','stale read'],
 backpressure:['backpressure'],'tail-latency':['tail latency','fan-out','fans out'],'thundering-herd':['thundering herd','request coalescing','stampede']};
const PMAP=new Map();Object.entries(PHR).forEach(([id,arr])=>arr.forEach(p=>{const cs=p.endsWith('*'),w=cs?p.slice(0,-1):p;PMAP.set(w.toLowerCase(),{id,cs,w})}));
const PRE=new RegExp('(?<![\\w-])('+[...PMAP.values()].map(o=>o.w).sort((a,b)=>b.length-a.length).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\w-])','gi');
function linkify(){if(curId==='start')return;const seen=new Set([curId]);
  document.querySelectorAll('#page .one, #page .txt p, #page .cap').forEach(root=>{
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('code,a,b,.xref')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
    const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(n=>{const txt=n.nodeValue;PRE.lastIndex=0;let m,last=0,frag=null;
      while((m=PRE.exec(txt))){const o=PMAP.get(m[1].toLowerCase());if(!o||(o.cs&&m[1]!==o.w)||seen.has(o.id))continue;seen.add(o.id);
        frag=frag||document.createDocumentFragment();frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
        const a=document.createElement('a');a.className='xref';a.href='#'+o.id;a.dataset.go=o.id;a.textContent=m[1];frag.appendChild(a);last=m.index+m[1].length}
      if(frag){frag.appendChild(document.createTextNode(txt.slice(last)));n.replaceWith(frag)}})})}
const pop=document.createElement('div');pop.className='xpop';pop.hidden=true;document.body.appendChild(pop);
function hidePop(){pop.hidden=true}
document.addEventListener('mouseover',e=>{const a=e.target.closest('.xref');if(!a)return;const x=byId[a.dataset.go];if(!x)return;
  pop.innerHTML=`<div class="xh">${badge(x.lv)}<b>${x.t}</b></div>${x.full.length?`<div class="xf">${x.full.slice(0,3).map(([k,v])=>`<span>${esc(k)}</span> ${esc(v)}`).join(' · ')}</div>`:''}<p>${TR(x,'one')}</p><div class="xo">Click to open · page ${ORDER.indexOf(x.id)}</div>`;
  pop.hidden=false;const r=a.getBoundingClientRect(),w=Math.min(340,innerWidth-24);pop.style.width=w+'px';
  let left=clamp(r.left,12,innerWidth-w-12),top=r.bottom+8;pop.style.left=left+'px';pop.style.top=top+'px';
  const ph=pop.offsetHeight;if(top+ph>innerHeight-8)pop.style.top=(r.top-ph-8)+'px'});
document.addEventListener('mouseout',e=>{if(e.target.closest('.xref'))hidePop()});
addEventListener('scroll',hidePop,{passive:true});
$('prev').onclick=()=>{const i=ORDER.indexOf(curId);if(i>0)go(ORDER[i-1])};
$('next').onclick=()=>{const i=ORDER.indexOf(curId);if(i<ORDER.length-1)go(ORDER[i+1])};
document.addEventListener('keydown',e=>{const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'&&e.target.type!=='range'&&e.target.type!=='checkbox')return;
  if(e.key==='/'){e.preventDefault();$('q').focus();return}
  if(tag==='input')return;
  if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==curId)go(h,false)});
go(location.hash.slice(1)||'start',false);
paintLang();
