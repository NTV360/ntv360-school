  </div>
  <div class="panel plain">${ph('txt',L('plain','In plain words'))}<div class="pb txt">${ENONLY(d)}${TR(d,'body')}</div></div>
  <div class="panel" style="margin-top:16px">${ph('link',L('terms','Backend terms in play'),'<span class="act" style="cursor:default">opens the Backend Field Guide</span>')}<div class="pb"><div class="bts">${d.terms.map(btChip).join('')}</div></div>
    <div class="steps"><button ${pv?`data-go="${pv.id}"`:'disabled'}><small>${L('prevstep','← Previous step')}</small><b>${pv?pv.t:'—'}</b></button><button data-go="${nx?nx.id:'checklist'}"><small>${L('nextstep','Next step →')}</small><b>${nx?nx.t:'Healthy API checklist'}</b></button></div></div>`}

function checklist(){
  const tot=CHECK.reduce((a,g)=>a+g.items.length,0),done=CHECK.reduce((a,g)=>a+g.items.filter((_,j)=>TICK[g.k+j]).length,0);
  return `<div class="head"><div class="l"><div class="eyebrow">Checklist</div><h1 class="term">${L('cktitle','Signs of a healthy API')}</h1>
   <p class="one">${L('ckintro',"Good APIs share habits: they're encrypted, they keep p99 low, they fail gracefully, and someone can tell when they're sick. Tick what your API already does. Your ticks stay in this browser.")}</p></div>
   <div class="aka"><span id="sc">${TX(done+' / '+tot+' done')}</span><button class="btn ghost" id="reset">${TX('Reset')}</button></div></div>
  <div class="chgrid">${CHECK.map(g=>{const n=g.items.filter((_,j)=>TICK[g.k+j]).length;return `<div class="panel" style="border-top:2px solid var(--${g.c})"><div class="ph"><h2 style="color:var(--${g.c})">${TX(g.name)}</h2><div class="score" style="--c:var(--${g.c})"><b data-sc="${g.k}">${n}</b>/ ${g.items.length}</div></div>
   <div class="pb" style="padding-bottom:0"><div class="meter" style="--c:var(--${g.c});margin:0 0 4px"><div data-m="${g.k}" style="width:${100*n/g.items.length}%"></div></div></div>
   <div class="chk">${g.items.map(([t,why,terms,dz],j)=>`<label class="ci"><input type="checkbox" data-ck="${g.k+j}" ${TICK[g.k+j]?'checked':''}><span class="bx"></span><b>${TX(t)}</b><p>${TX(why)}</p>${terms.length||dz?`<div class="bts">${terms.map(btChip).join('')}${dz?`<a class="bt" href="#${dz}" data-go="${dz}"><i style="--c:var(--brand)"></i>${DESIGNS_BY[dz].t}<small>design</small></a>`:''}</div>`:''}</label>`).join('')}</div></div>`}).join('')}</div>`}
document.addEventListener('change',e=>{const c=e.target.closest('[data-ck]');if(!c)return;TICK[c.dataset.ck]=c.checked;saveTick();
  CHECK.forEach(g=>{const n=g.items.filter((_,j)=>TICK[g.k+j]).length,b=document.querySelector(`[data-sc="${g.k}"]`),m=document.querySelector(`[data-m="${g.k}"]`);if(b)b.textContent=n;if(m)m.style.width=100*n/g.items.length+'%'});
  const tot=CHECK.reduce((a,g)=>a+g.items.length,0),done=CHECK.reduce((a,g)=>a+g.items.filter((_,j)=>TICK[g.k+j]).length,0);$('sc').textContent=TX(done+' / '+tot+' done')});

function go(id,push=true){if(!ORDER.includes(id))id='start';const from=ORDER.indexOf(curId),to=ORDER.indexOf(id);
  if(stage){stage.stop();stage=null}curId=id;const page=$('page');const d=DESIGNS_BY[id];
  page.innerHTML=id==='start'?cover():id==='checklist'?checklist():designPage(d);
  page.classList.remove('turn-n','turn-p');void page.offsetWidth;if(from>=0&&from!==to)page.classList.add(to>from?'turn-n':'turn-p');
  if(d){stage=Stage($('stage'),d.h||320);Arch(stage,UI($('ctrl'),$('stats'),id),d,$('log'))}
  if(id==='start'){requestAnimationFrame(()=>document.querySelectorAll('[data-thumb]').forEach(cv=>thumb(cv,DESIGNS_BY[cv.dataset.thumb])))}
  if(id==='checklist')$('reset').onclick=()=>{TICK={};saveTick();go('checklist',false)};
  $('crumb').innerHTML=id==='start'?'Architecture / <b>Contents</b>':id==='checklist'?'Tools / <b>Healthy API checklist</b>':`${lvOf(d.lv).name} / <b>${esc(d.t)}</b>`;
  $('folio').textContent=id==='start'?'Cover':`${String(to).padStart(2,'0')} / ${ORDER.length-1}`;
  $('prev').disabled=to<=0;$('next').disabled=to>=ORDER.length-1;
  if(d&&COLL['l-'+d.lv]){COLL['l-'+d.lv]=false;saveColl()}
  renderToc();linkify();const on=$('toc').querySelector('button.on');if(on)on.scrollIntoView({block:'nearest'});
  if(push){try{history.replaceState(null,'','#'+id)}catch(e){}}
  if(from>=0&&push)window.scrollTo({top:0,behavior:'auto'})}
let rzT;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(curId==='start')document.querySelectorAll('[data-thumb]').forEach(cv=>thumb(cv,DESIGNS_BY[cv.dataset.thumb]))},150)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){e.preventDefault();hidePop();go(b.dataset.go)}});

/* ---------- cross-links: backend terms mentioned in text link into the Backend Field Guide ---------- */
const PHR={rest:['REST*','RESTful'],https:['HTTPS*','TLS*','certificate','certificates','TLS handshake'],auth:['JWT*','token','tokens','login token'],cors:['CORS*'],websocket:['WebSocket','WebSockets','Socket.IO*'],
 latency:['latency','round trip','round trips'],timeout:['timeout','timeouts'],cache:['cache hit','cache miss','hit ratio','Redis*'],ttl:['TTL*','TTLs*'],throughput:['throughput'],pagination:['pagination','paginated'],
 'n-plus-1':['N+1*'],'rate-limiting':['rate limit','rate limits','rate limiting','429*'],'load-balancer':['load balancer','load balancers'],'connection-pool':['connection pool','connection pools','connection limit'],
 percentiles:['p95*','p99*','p50*'],'sli-slo-sla':['SLO*','SLOs*'],'error-budget':['error budget'],'retry-backoff':['backoff','jitter','retries','retry'],idempotency:['idempotent','idempotency key'],
 'circuit-breaker':['circuit breaker'],'async-queue':['202 Accepted','queue'],'race-condition':['race condition'],'eventual-consistency':['eventually consistent','replication lag','eventual consistency'],
 backpressure:['backpressure'],'tail-latency':['tail latency','slowest one'],'thundering-herd':['thundering herd','reconnect storms','sync storms'],'cold-start':['cold start'],'status-codes':['502s','504s','status code']};
const PMAP=new Map();Object.entries(PHR).forEach(([id,arr])=>arr.forEach(p=>{const cs=p.endsWith('*'),w=cs?p.slice(0,-1):p;PMAP.set(w.toLowerCase(),{id,cs,w})}));
const PRE=new RegExp('(?<![\\w-])('+[...PMAP.values()].map(o=>o.w).sort((a,b)=>b.length-a.length).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\w-])','gi');
function linkify(){if(!DESIGNS_BY[curId])return;const seen=new Set();
  document.querySelectorAll('#page .one, #page .txt p, #page .lst li').forEach(root=>{
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('code,a,b,.xref')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
    const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(n=>{const txt=n.nodeValue;PRE.lastIndex=0;let m,last=0,frag=null;
      while((m=PRE.exec(txt))){const o=PMAP.get(m[1].toLowerCase());if(!o||(o.cs&&m[1]!==o.w)||seen.has(o.id)||!BT[o.id])continue;seen.add(o.id);
        frag=frag||document.createDocumentFragment();frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
        const a=document.createElement('a');a.className='xref';a.href=BHREF(o.id);a.dataset.bt=o.id;a.textContent=m[1];frag.appendChild(a);last=m.index+m[1].length}
      if(frag){frag.appendChild(document.createTextNode(txt.slice(last)));n.replaceWith(frag)}})})}
const pop=document.createElement('div');pop.className='xpop';pop.hidden=true;document.body.appendChild(pop);
function hidePop(){pop.hidden=true}
document.addEventListener('mouseover',e=>{const a=e.target.closest('[data-bt]');if(!a)return;const b=BT[a.dataset.bt];if(!b)return;const l=BTLV[b[1]];
  pop.innerHTML=`<div class="xh"><span class="lvb" style="--c:var(--${l[1]})">${l[0]}</span><b>${esc(b[0])}</b></div><p>${esc(b[2])}</p><div class="xo">Backend Field Guide · click to open</div>`;
  pop.hidden=false;const r=a.getBoundingClientRect(),w=Math.min(340,innerWidth-24);pop.style.width=w+'px';
  pop.style.left=clamp(r.left,12,innerWidth-w-12)+'px';pop.style.top=(r.bottom+8)+'px';const h=pop.offsetHeight;if(r.bottom+8+h>innerHeight-8)pop.style.top=(r.top-h-8)+'px'});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-bt]'))hidePop()});
addEventListener('scroll',hidePop,{passive:true});
$('prev').onclick=()=>{const i=ORDER.indexOf(curId);if(i>0)go(ORDER[i-1])};
$('next').onclick=()=>{const i=ORDER.indexOf(curId);if(i<ORDER.length-1)go(ORDER[i+1])};
document.addEventListener('keydown',e=>{const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'&&e.target.type!=='range'&&e.target.type!=='checkbox')return;
  if(e.key==='/'){e.preventDefault();$('q').focus();return}if(tag==='input')return;
  if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==curId)go(h,false)});
go(location.hash.slice(1)||'start',false);
paintLang();
</script>
