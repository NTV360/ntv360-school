{id:'event-driven',lv:'advanced',t:'Event-driven services',s:'Events',
 aka:['event bus','SNS','EventBridge','Kafka','publish/subscribe','outbox pattern'],
 one:`Instead of calling every service that cares about a change, a service publishes an event ("device registered") and whoever is interested reacts in their own time.`,
 like:`A class group chat. The teacher posts “no classes tomorrow” once. Every student reads it when they open their phone; the teacher doesn't call each one.`,
 body:`<p>In a request-driven design, registering a device might mean the devices service calls billing, then notifications, then analytics, and waits for each. If notifications is down, registration fails, even though the device itself saved fine. In an <strong>event-driven</strong> design, the devices service saves the device, publishes a <code>DeviceRegistered</code> event to a <strong>bus</strong> (SNS, EventBridge, Kafka) and answers. Each interested service has its own queue and processes the event when it can.</p><p>Services become loosely coupled: you can add a consumer without touching the publisher, and a consumer outage just means its queue grows until it comes back. The costs: the system is eventually consistent, failures are quieter (nothing errors, things just don't happen), and you must make sure the save and the publish both happen. That last one is what the <strong>outbox pattern</strong> is for.</p>`,
 adds:['An event bus between services','A queue per consumer, so each works at its own pace','Publishers that don\'t know about, or wait for, their consumers'],
 when:['One action triggers several independent follow-ups','A slow or broken side effect shouldn\'t fail the main action','Other teams keep asking you to "also call our service when X happens"'],
 watch:['Saving to the database but crashing before publishing, or the reverse. Use an outbox.','Events processed twice or out of order: consumers must be idempotent','"Nothing happened" bugs with no error anywhere. Monitor queue depth and consumer lag.','Event spaghetti: nobody knows what triggers what. Keep a list of events and their owners.'],
 good:['The main request succeeds even while a consumer is down','Every consumer is idempotent and tracks what it already processed','Queue depth and consumer-lag alerts per consumer','Events are versioned and documented'],
 ntv:`Things that happen "because a device came online" or "because a playlist changed" (alerts, audit logs, analytics, emails) are good candidates. The Socket.IO relay already behaves a little like this for live events between the dashboard and players.`,
 terms:['async-queue','idempotency','eventual-consistency','backpressure','circuit-breaker'],
 words:[['Event','a record that something happened, named in the past tense: DeviceRegistered'],['Consumer','a service that reacts to events'],['Outbox','saving the event in the same database transaction as the data, then publishing it']],
 cap:`Take the notifications service down and register devices: requests still succeed while its queue grows. Then switch to direct calls and try again.`,
 h:340,cols:4,rate:1,maxRate:5,
 nodes:[{...CLIENT,l:'Dashboard',sub:'',x:0,y:.2,stack:false},{id:'ds',l:'Devices svc',c:'req',x:.33,y:.2,ms:3},{id:'dd',l:'devices DB',c:'ad',x:.33,y:1,ms:8},
  {id:'bus',l:'Event bus',sub:'SNS / EventBridge',c:'slot',x:.66,y:.5,ms:1,new:true,dim:S=>S.direct},
  {id:'bl',l:'Billing',c:'req',x:1,y:0,ms:3,depth:S=>S.back.bl},{id:'nt',l:'Notifications',c:'req',x:1,y:.5,ms:3,depth:S=>S.back.nt},{id:'an',l:'Analytics',c:'req',x:1,y:1,ms:3,depth:S=>S.back.an}],
 edges:[['c','ds',{l:'HTTPS',ms:25}],['ds','dd'],['ds','bus',{l:'publish',dash:true,c:'slot',show:S=>!S.direct}],['bus','bl',{dash:true,c:'slot',show:S=>!S.direct}],['bus','nt',{dash:true,c:'slot',show:S=>!S.direct}],['bus','an',{dash:true,c:'slot',show:S=>!S.direct}],
  ['ds','bl',{show:S=>S.direct}],['ds','nt',{show:S=>S.direct}],['ds','an',{show:S=>S.direct}]],
 state:()=>({direct:false,back:{bl:0,nt:0,an:0}}),
 scen:[{btn:'Register a device',w:1,log:'The devices service saves the device, publishes DeviceRegistered and answers. Billing, notifications and analytics each get their own copy and handle it on their own.',
   fn:async(x,S)=>{await x.hop('c','ds','POST /devices');await x.hop('ds','dd','INSERT','ad');await x.hop('dd','ds','ok','ad');
     if(S.direct){for(const s of ['bl','nt','an']){await x.hop('ds',s,'POST /'+s,'req');await x.hop(s,'ds','200','ad')}await x.hop('ds','c','201 Created','ad');return}
     await x.hop('ds','bus','DeviceRegistered','slot');['bl','nt','an'].forEach(s=>deliver(x.ctx,s,!x.quiet));await x.hop('ds','c','201 Created','ad')}}],
 init(x){const S=x.S;
   x.every(.6,()=>['bl','nt','an'].forEach(s=>{if(S.back[s]&&!S.down.has(s)){S.back[s]--;deliver(x,s,false)}}));
   x.ui.toggle('Notifications service down',false,v=>{x.set('nt',v);x.log(v?(S.direct?'Notifications is down and the devices service calls it directly, so registration fails.':'Notifications is down. Registrations still succeed; its events wait in its queue.'):'Notifications is back and works through its backlog.')});
   x.ui.toggle('Call services directly (no bus)',false,v=>{S.direct=v;x.log(v?'Now the devices service calls each service in turn and waits. Slower, and any one of them being down fails the whole request.':'Back to publishing events.')});
   const sB=x.ui.stat('events waiting','slot');x.tick(()=>sB(S.back.bl+S.back.nt+S.back.an))}},

{id:'sharding',lv:'advanced',t:'Sharding (splitting the data)',s:'Shards',
 aka:['partitioning','shard key','horizontal partitioning','hot partition','multi-tenant'],
 one:`Split one huge database into several smaller ones, each holding a slice of the data chosen by a key like the customer ID.`,
 like:`Enrollment lines split by surname: A to H here, I to P there, Q to Z at the end. Each line is short, unless half the school is named Santos.`,
 body:`<p>Caches and replicas help reads. When <em>writes</em> or sheer data size outgrow the biggest database you can buy, you split the data itself. Each <strong>shard</strong> is a full database holding a subset of the rows, picked by a <strong>shard key</strong>: customers A to H on shard 1, I to P on shard 2, and so on (in practice usually a hash of the key). The application, or a routing layer, sends each query to the right shard.</p><p>Choosing the key is the whole game. A good key spreads load evenly and keeps most queries on one shard. A bad one creates a <strong>hot shard</strong>: one giant customer whose traffic melts their shard while the others sit idle. And anything that needs all the data, like a global report, becomes a slow fan-out.</p>`,
 adds:['Several databases, each owning a slice of the data','A shard key that decides where each row lives','Routing that sends each query to the right shard'],
 when:['A single primary can\'t keep up with writes, even on the largest instance','Tables are so big that indexes, migrations and backups become painful','Data splits naturally by tenant or customer and rarely crosses'],
 watch:['Hot shards from uneven keys (one huge customer)','Cross-shard queries and transactions: slow and complicated','Re-sharding later is a major project, so choose the key carefully','Reaching for sharding before indexes, caching, replicas and a bigger instance'],
 good:['Most requests touch exactly one shard','Load per shard is monitored and roughly even','The shard key is stable and present in almost every query','Global reports come from a separate analytics store, not a live fan-out'],
 ntv:`At NTV360's size, one well-indexed RDS instance is plenty. Sharding is here to finish the ladder, and because "split by customer" is a question you'll hear in any multi-tenant product.`,
 terms:['throughput','tail-latency','race-condition','percentiles'],
 words:[['Shard','one slice of the data, in its own database'],['Shard key','the field that decides which shard a row lives on'],['Hot shard','a shard getting far more traffic than the others']],

   fn:async(x,S)=>{const cs=[['Acme Cafe',0],['Delta Diner',0],['Iron Gym',1],['Lakeside Mall',1],['Pizza Planet',1],['Quick Mart',2],['Sunset Spa',2],['Zen Tea',2]];

     await x.hop('c','api','GET '+c[0]);await x.hop('api',sh,'SELECT','ad');await x.hop(sh,'api','rows','ad');await x.hop('api','c','200 OK','ad')}},

{id:'multi-region',lv:'advanced',t:'Multi-region & failover',s:'2 regions',
 aka:['disaster recovery','DR','active-passive','failover','RTO','RPO','Route 53 health checks'],
 one:`Run the system in two or more geographic regions, so users get a nearby server and a whole region going down isn't the end of the day.`,
 like:`A business with a second branch in another city. If a typhoon shuts the Manila branch, customers go to the Cebu branch, but orders that hadn't been sent over yet are stuck in Manila.`,
 body:`<p>Everything so far lives in one AWS region. Regions are very reliable, but they do have bad days, and users far away pay for the distance on every request. A <strong>multi-region</strong> setup runs the API in two regions. DNS (Route 53) sends each user to the nearest healthy one and stops sending traffic to a region whose health checks fail.</p><p>The database is the hard part. Usually one region holds the <strong>primary</strong> and the other a cross-region <strong>replica</strong>: reads are local everywhere, but writes travel to the primary. When the primary's region fails, you <strong>promote</strong> the replica, and any writes that hadn't replicated yet are lost. Two numbers describe the plan: <strong>RTO</strong>, how long recovery takes, and <strong>RPO</strong>, how much data you can afford to lose.</p>`,
 adds:['A second region with its own API servers','Cross-region database replication','DNS routing by latency, with health-check failover'],
 when:['Downtime costs more than running a second region','Users are spread across continents and latency matters','Contracts or regulations require disaster recovery with a set RTO and RPO'],
 watch:['A failover plan nobody has ever run. Rehearse it.','Writes crossing regions on every request (slow), or two primaries (conflicts)','Hidden single-region dependencies: a config bucket, a secret, a third-party API','Roughly double the cost, plus a lot more complexity'],
 good:['RTO and RPO written down and agreed with the business','Failover tested on a schedule, not just designed','Health checks test real dependencies like the database, not just "is the server up"','Infrastructure as code, so the second region is truly identical'],
 ntv:`Players across the USA talk to one AWS region today, and their local SQLite copy already covers short outages on the playback side. A second region matters if the dashboard and device management must stay up through a regional outage. That's a business decision first and a technical one second.`,

const DESIGNS_BY=Object.fromEntries(DESIGNS.map(d=>[d.id,d]));

/* helpers used by several designs */
function leak(x,S,what){if(S.https)return;S.leaks++;x.side('c','spy',what,'bad',{ms:1})}
function sub(S,id){return S.down&&S.down.has(id)?'':S.hc&&S.healthy&&S.healthy[id]===false?'out of rotation':'.NET'}
async function write(x,S){await x.hop('c','api','PUT /devices/42');await x.hop('api','pri','UPDATE','ad');const v=++S.ver;
  ['r1','r2'].forEach(r=>x.ctx.after(S.lag,()=>x.ctx.raw('pri',r,x.quiet?null:'v'+v,'slot',{nohit:true}).then(()=>{S.rv[r]=Math.max(S.rv[r],v)},()=>{})));
  await x.hop('pri','api','ok','ad');await x.hop('api','c','200 OK','ad');return v}
function limit(x,S){S.win=S.win.filter(t=>t>S.T-2);if(S.win.length>=10){S.lim++;x.ctx.flag('gw','429 Too Many Requests','bad');return false}S.win.push(S.T);return true}
async function call(b,svc,db){await b.hop('gw',svc,'GET','req');await b.hop(svc,db,'SELECT','ad');await b.hop(db,svc,'rows','ad');await b.hop(svc,'gw','200','ad')}
function deliver(x,s,lbl){x.raw('bus',s,lbl?'DeviceRegistered':null,'slot').catch(()=>{x.S.back[s]++})}
</script>

const I18N={"tl":{"ui":{"search":"Hanapin: cache, replica, queue…","show":"Ipakita ang contents","hide":"Itago ang contents","collapse":"I-collapse lahat","expand":"I-expand lahat","start":"dito magsimula","title":"Mula sa iisang server hanggang sa maraming region","intro":"Lahat ng malaking system ay nagsimula sa isang app at isang database. Bawat design sa baba ay nagdadagdag ng isang piraso para lutasin ang isang specific na problema, at may dala rin itong bagong problema. Aralin mo nang sunud-sunod, para alam mo kung ano'ng gagamitin pag may lumabas na sintomas, at kung magkano ang kapalit. Live ang bawat diagram: sirain mo nang sadya.","lv_beginner":"Isang app, isang database, isang front door. Dito nagsisimula ang lahat ng system, at dito na lang dapat ang marami.","lv_mid":"Ang mga unang sakit ng paglaki: mas maraming traffic, busy na database, malalaking file, mabagal na jobs, at pabago-bagong network.","lv_advanced":"Maraming server, maraming service, maraming region. Malakas, pero mahal patakbuhin nang maayos.","lv_check":"Senyales ng healthy na API: secure, mabilis, reliable, madaling bantayan. I-tick mo kung ano na ang meron sa API mo.","ladder":"Ang hagdan","climb":"umakyat lang pag masakit na","which":"Anong design ang kailangan ko?","howpage":"Paano basahin ang bawat page","h1":"Gumagalaw ang mga request sa system na parang packet. Sinisira ng mga toggle ang mga bagay nang sadya; makikita sa stats ang p50, p99 at failures.","h2":"Ang isang pagbabago mula sa naunang step. May NEW na tag ang mga bagong box sa diagram.","h5":"Halimbawa na kayang intindihin kahit ng bata, galing sa buhay sa labas ng computer.","h3":"Kailan ito gagamitin, paano ito mangangagat, at ano ang itsura ng maayos na setup.","h4":"Mga link papunta sa Backend Field Guide para sa bawat concept na ginagamit ng design.","adds":"Ano'ng dinadagdag nito sa","whatis":"Ano 'to","ntvangle":"Sa NTV360","ntvuses":"Gamit 'to ng NTV360","words":"Mga bagong salita","when":"Kailan gagamitin","watch":"Ingat sa","good":"Senyales na maayos ang pagkagawa","plain":"Sa simpleng salita","picture":"Isipin mo 'to","enonly":"English pa 'to sa ngayon. Yung mahahabang explanation, isasalin pa lang.","try":"Subukan mo","terms":"Mga backend term na gamit dito","prevstep":"← Nakaraang step","nextstep":"Susunod na step →","nextdesign":"Susunod na design →","step":"Step {n} ng {m}","cktitle":"Senyales ng healthy na API","ckintro":"May mga parehong ugali ang magagandang API: naka-encrypt, mababa ang p99, maayos mag-fail, at may nakakaalam pag may sakit sila. I-tick mo kung ano'ng ginagawa na ng API mo. Dito lang sa browser na 'to naka-save ang mga tick mo."},"one":{"single-server":"Iisang machine lang ang app at database mo. Isang i-deploy, isang babayaran, at isang bagay na pwedeng magpabagsak sa lahat.","three-tier":"Hatiin ang system sa tatlong layer na may kanya-kanyang trabaho: yung screen na ginagamit ng tao, yung API na may hawak ng rules, at yung database na nagtatago ng data.","reverse-proxy":"Maglagay ng iisang front door sa harap ng API. Siya ang bahala sa HTTPS, siya ang nagse-serve ng frontend files, at pinapasa niya ang API calls sa mga server na hindi naaabot ng internet.","load-balanced":"Magpatakbo ng ilang magkakaparehong kopya ng API sa likod ng load balancer, para hati-hati ang traffic at hindi bumagsak ang lahat kahit mag-crash ang isa.","cache-aside":"Magtabi ng kopya ng madalas basahin na data sa mabilis na in-memory store, para karamihan ng reads ay hindi na umaabot sa database.","read-replicas":"Magdagdag ng mga kopya ng database na pang-read lang. Lahat ng write ay sa primary, tapos ipinapasa niya ang changes sa mga replica.","cdn-storage":"Itago ang malalaking file (video, images, builds) sa object storage, at hayaang ang CDN ang mag-serve ng mga kopya mula sa server na pinakamalapit sa nagda-download.","async-queue":"Pag mabagal na trabaho ang hinihingi ng request, ilagay ang job sa queue, sumagot agad, at hayaan ang mga background worker na gawin ito sa sarili nilang bilis.","offline-first":"May sariling kopya ang device ng lahat ng kailangan niya at doon siya tumatakbo. Pang-sync lang ang network, kaya pag nag-outage, updates lang ang natitigil, hindi ang device.","realtime-scale":"Pag hindi na kaya ng iisang real-time server, magpatakbo ng ilan at pagdugtungin sila gamit ang pub/sub, para ang event na pinadala sa isang server ay umabot sa client na nakakonekta sa iba.","gateway-services":"Hatiin ang backend sa mga service na may kanya-kanyang hawak na parte ng negosyo at data, na may gateway sa harap na bahala sa mga gawaing pare-pareho.","event-driven":"Imbes na tawagan isa-isa ang bawat service na may pakialam sa isang pagbabago, magpa-publish ang service ng event (“device registered”), at ang interesado ang kikilos sa sarili nilang oras.","sharding":"Hatiin ang isang napakalaking database sa ilang mas maliliit, na bawat isa ay may hawak na parte ng data na pinili gamit ang key tulad ng customer ID.","multi-region":"Patakbuhin ang system sa dalawa o higit pang lugar, para malapit ang server sa mga user at hindi katapusan ng mundo kahit bumagsak ang isang buong region."},"like":{"single-server":"Parang sari-sari store na isang tao lang ang bantay. Siya ang kumukuha ng order, kumukuha ng gamit sa likod, at siya rin ang kahera. Simple at mura, hanggang magkasakit siya at sarado ang buong tindahan.","three-tier":"Parang restaurant. Sa waiter ka nakikipag-usap (frontend), ang waiter ang kakausap sa kusina (API), at kusina lang ang pumapasok sa bodega (database). Hindi ka papasok mismo sa bodega.","reverse-proxy":"Parang guard sa gate ng school. Lahat dumadaan sa iisang gate; siya ang tumitingin ng ID, nagbibigay ng visitor pass, at nagtuturo kung saang building pupunta. Walang umaakyat sa pader.","load-balanced":"Parang dinagdagan ang kahera sa Jollibee. May staff na nagtuturo sa bawat customer sa susunod na bakanteng kahera. Pag nag-break ang isa, lilipat lang ang pila sa iba.","cache-aside":"Parang ref sa bahay. Imbes na pumunta ka sa palengke tuwing gusto mo ng gatas, may nakatabi na sa ref. Mabilis kunin. Pero kapag panis na, kailangan mo pa ring bumili ng bago.","read-replicas":"Isang teacher ang nagsusulat ng lesson sa board, tapos may mga helper na kumokopya nito sa maliliit na board sa paligid ng classroom para mas maraming estudyante ang makabasa nang sabay. Pero ilang segundo silang nahuhuli sa main board.","cdn-storage":"Imbes na lahat bumiyahe pa papunta sa factory para sa isang bote ng softdrinks, nagpapadala ang factory ng mga crate sa sari-sari store sa bawat barangay. Sa kanto ka na lang bibili.","async-queue":"Parang pagkuha ng number sa bangko. Ilang segundo lang may number ka na, tapos uupo ka. Isa-isang tatawagin ng teller ang mga number, at hindi mo kailangang tumayo sa harap ng bintana buong oras.","offline-first":"Parang nagdala ka ng baon sa school. Kahit sarado ang canteen, makakakain ka pa rin ng lunch. Magre-restock ka na lang ulit sa bahay mamaya.","realtime-scale":"Parang dalawang classroom na may intercom. Pag may mensahe para sa estudyante sa kabilang room, ia-announce ito sa intercom, kaya maaabot siya kahit hindi mo siya nakikita.","gateway-services":"Parang mall. Isang main entrance na may guard, tapos hiwa-hiwalay na tindahan na may sariling negosyo at sariling stockroom. Pag nagsara nang maaga ang isang tindahan, bukas pa rin ang buong mall.","event-driven":"Parang GC ng klase. Isang beses lang magpo-post si teacher ng “walang pasok bukas”. Mababasa ng bawat estudyante pag binuksan nila ang phone; hindi na sila isa-isang tatawagan ni teacher.","sharding":"Parang pila sa enrollment na hinati ayon sa apelyido: A hanggang H dito, I hanggang P doon, Q hanggang Z sa dulo. Maikli ang bawat pila, maliban na lang kung kalahati ng school ay Santos.","multi-region":"Parang negosyo na may pangalawang branch sa ibang lungsod. Pag isinara ng bagyo ang branch sa Manila, sa Cebu branch pupunta ang customers, pero yung mga order na hindi pa naipapasa ay naiwan sa Manila."},"ntv":{"single-server":"Lampas na ang NTV360 sa stage na 'to: magkakahiwalay na ang API, ang database (RDS) at ang Socket.IO server. Makikita mo pa rin 'tong design sa mga side project at maliliit na internal tool, at lahat ng ibang design dito ay kinukumpara dito.","three-tier":"Ito ang core ng NTV360: ang Angular dashboard (presentation), ang .NET Core API (logic) at RDS MySQL (data). Yung Raspberry Pi players naman ay pangalawang presentation tier na tumatawag sa parehong API. Lahat ng susunod na design ay may dinadagdag lang sa picture na 'to.","reverse-proxy":"Static files lang naman ang Angular build, kaya pwedeng yung front door na ang mag-serve ng mga 'yan habang tumutuloy sa .NET API yung API calls. Yung HTTPS page sa backend guide ang bahala sa certificate side: chine-check ng lahat ng 6,000 players ang certificate ng API, kaya pag nag-expire 'yan, sabay-sabay silang mapuputol lahat.","load-balanced":"Kung sakaling tumakbo ang .NET API bilang ilang instances (halimbawa sa ECS sa likod ng ALB), malaking tulong na ang JWT auth: sinasabi ng token kung sino ka, kaya kahit anong instance pwedeng mag-check nito. Lahat ng naka-store sa server memory, tulad ng in-process cache o kalahating tapos na upload, kailangang ilipat sa shared na lugar.","cache-aside":"Bagay na bagay dito ang player playlists: libo-libong players ang humihingi ng parehong iilang playlists, at nagbabago lang ang mga 'yon pag may nag-edit sa dashboard. Yung local SQLite copy ng players ay cache na sa device; ang server-side cache naman ay poprotektahan ang RDS sa parehong paraan.","read-replicas":"Ilang clicks lang, may read replicas ka na sa RDS MySQL. Yung mabibigat na dashboard pages, tulad ng reports sa libo-libong devices, magandang candidates na mag-read sa replica para hindi nila mapabagal ang player check-ins na nagsusulat sa primary.","cdn-storage":"Players sa buong USA na nagda-download ng parehong ad videos, textbook case talaga 'yan para sa CDN. Ang API ang nagde-decide kung ano ang ipe-play ng bawat player; ang bytes dapat galing sa pinakamalapit na edge, hindi sa API server. Kung sakaling mapabagal ng downloads ang API, ito ang design na dapat ikumpara.","async-queue":"Proof-of-play reports, bulk playlist pushes at screenshot processing, 'yan yung klase ng trabaho na bagay dito. Detalyadong pinapaliwanag ng “Message queue & async jobs” page sa backend guide ang 202 pattern.","offline-first":"Ganito na talaga gumagana ang NTV360 players: bawat Raspberry Pi ay may local copy sa SQLite at doon nagpe-play, kaya hindi nagba-blank ang screen pag may maikling API outage. Nasa edges yung interesting na tanong: gaano kabilis umaabot ang changes sa devices, at anong mangyayari pag sabay-sabay nag-reconnect ang 6,000 sa kanila?","realtime-scale":"Isang Socket.IO server ang pinapatakbo ng NTV360 na nagre-relay sa pagitan ng dashboard at ng 6,000 players, at sensible na design 'yan sa ganitong size. Pinapakita ng page na 'to kung ano ang next step kung sakaling kailanganin ng pangalawang server, at kung bakit yung pangalawang server ang mahirap na part.","gateway-services":"Tama lang ang iisang .NET API ng NTV360 sa size nito; nandito ang design na 'to para makilala mo pag na-encounter mo. Ang realistic na first step ay ihiwalay ang isang mabigat na area, tulad ng reporting, para hinding-hindi nito mapabagal ang player check-ins.","event-driven":"Yung mga nangyayari “dahil nag-online ang device” o “dahil nagbago ang playlist” (alerts, audit logs, analytics, emails) ay magandang candidates. Medyo ganito na rin kumilos ang Socket.IO relay para sa live events sa pagitan ng dashboard at players.","sharding":"Sa size ng NTV360, sapat na sapat ang isang well-indexed na RDS instance. Nandito ang sharding para makumpleto ang ladder, at kasi yung “split by customer” ay tanong na maririnig mo sa kahit anong multi-tenant product.","multi-region":"Sa ngayon, iisang AWS region ang kinakausap ng players sa buong USA, at yung local SQLite copy nila ay sumasalo na sa maiikling outages sa playback side. Mahalaga ang pangalawang region kung kailangang manatiling up ang dashboard at device management kahit may regional outage. Business decision muna 'yan bago technical."},"body":{"single-server":"<p>Halos lahat ng project dito nagsisimula: isang virtual machine (EC2 instance, droplet, o box sa ilalim ng mesa) ang nagpapatakbo ng API code at ng database nang sabay. May papasok na request, iqu-query ng code ang database through localhost, tapos ibabalik ang sagot. Walang network sa pagitan ng code at ng data, kaya simple lang siya at nakakagulat na mabilis.</p><p>Ang catch: iisang CPU, iisang disk at iisang power supply lang ang pinaghahatian ng lahat. Pag may mabigat na report query, bumabagal lahat ng login. Pag nag-deploy, nire-restart ang nag-iisang kopya ng app, kaya error ang makikita ng users hanggang makabalik 'to. Pag namatay ang disk, damay ang data, unless may nag-setup ng backups at talagang na-test na yung pag-restore.</p>","three-tier":"<p>Ang <strong>presentation tier</strong> ay yung nakikita ng tao: yung Angular dashboard sa browser, o yung app sa player. Hindi 'to kailanman direktang kumakausap sa database. Ang <strong>logic tier</strong> ay yung API. Chine-check nito kung sino ka, vina-validate ang input, ina-apply ang business rules at dine-decide kung anong queries ang ira-run. Ang <strong>data tier</strong> ay yung database, at API lang ang pwedeng makaabot dito.</p><p>Kasi katabi lang niya ang kinakausap ng bawat tier, pwede mong baguhin ang isa nang hindi nasisira ang iba: i-redesign ang dashboard nang hindi ginagalaw ang SQL, o ilipat ang database sa mas malaking server nang hindi nire-redeploy ang frontend. Ang kapalit: dalawang beses tumatawid sa network ang bawat request, kaya yung ginagawa ng API per request (ilang queries, gaano karaming data) ang nagde-decide kung gaano kabilis ang pakiramdam ng buong system.</p>","reverse-proxy":"<p>Bago makapagpadala ng kahit ano ang browser, ginagawang IP address ng <strong>DNS</strong> yung domain name. Yung address na 'yon ay sa <strong>reverse proxy</strong> (NGINX, o cloud load balancer tulad ng AWS ALB), hindi sa API. Ang proxy ang gumagawa ng TLS handshake, nagde-decrypt ng request at nagde-decide kung saan 'to pupunta: yung mga file tulad ng <code>main.js</code> ay diretsong kinukuha sa disk o storage, at yung <code>/api/*</code> calls ay fino-forward sa API through private network.</p><p>Kaya isang lugar na lang ang pag-manage ng certificates, pag-redirect ng HTTP papuntang HTTPS, pag-compress ng responses, pagdagdag ng security headers at pag-log ng bawat request. Hindi na kailangan ng public IP address ng API servers, kaya tanggal na ang isang buong klase ng attacks.</p>","load-balanced":"<p>Pag naubusan ng CPU ang isang API server, pwede kang bumili ng mas malaki (<strong>vertical scaling</strong>) o magdagdag ng kapareho (<strong>horizontal scaling</strong>). Sa katagalan, panalo ang horizontal: walang ceiling, at pag nawala ang isang kopya, blip lang 'yon imbes na outage. May <strong>load balancer</strong> sa harap na nagkakalat ng requests sa mga kopya, at pinapadalhan ang bawat isa ng <strong>health check</strong> every few seconds para matigil ang pag-route sa kahit sinong hindi na sumasagot.</p><p>Gagana lang 'to kung <strong>stateless</strong> ang servers, ibig sabihin kahit anong kopya kayang mag-handle ng kahit anong request. Kung nagtatabi ang server ng logins, uploads o caches sa sarili niyang memory, baka mapunta ang susunod na request sa kopyang hindi ka pa kilala. Ilagay ang state na 'yan sa token, sa database o sa shared store tulad ng Redis.</p>","cache-aside":"<p>Karamihan ng systems, mas madalas magbasa ng parehong data kaysa magbago nito. Sa <strong>cache-aside</strong>, Redis muna ang chine-check ng API. Pag <strong>hit</strong>, sumasagot 'to in about a millisecond. Pag <strong>miss</strong>, binabasa niya ang database, sine-save ang result sa Redis na may <strong>TTL</strong>, tapos sumasagot. Hit na ang susunod na request para sa parehong key.</p><p>Ang mahirap ay hindi yung pagdagdag ng cache, kundi yung pagpapanatiling tama nito. Pag nagbago ang data, mali na yung naka-cache na kopya. Ang usual na rule: mag-write sa database, tapos i-<strong>delete</strong> ang cache key para kunin ng susunod na read yung bagong value. Ang TTL ang safety net mo sa mga panahong nakalimutan mo.</p>","read-replicas":"<p>Nakakatulong ang cache pag paulit-ulit binabasa ang parehong rows. Pero pag iba-iba ang reads (search, filtered lists, reports), kailangan mo ng dagdag na database capacity para sa reads. Ang <strong>read replica</strong> ay kopyang sumusunod sa <strong>primary</strong>: bawat write ay napupunta sa primary, tapos nire-replay sa bawat replica pagkalipas ng sandali. Sa primary pinapadala ng API ang writes at kinakalat ang reads sa mga replica.</p><p>Yung “pagkalipas ng sandali” na 'yan ay <strong>replication lag</strong>, kadalasan milliseconds, minsan seconds pag mabigat ang load. Yung user na nag-save ng form tapos nag-reload agad, baka mag-read sa replica na hindi pa nakakahabol, kaya parang nawala yung change niya. Ang common fix ay <em>read-your-own-writes</em>: pagkatapos mag-write ng user, sa primary muna ipadala ang reads niya for a short while.</p>","cdn-storage":"<p>Magaling ang APIs sa maliliit na JSON answers pero hirap sa pagtulak ng 80 MB na videos. Kung dadaan sa API ang downloads, bawat isa ay nakakatali ng isang API worker at ng bandwidth nito nang ilang seconds o minutes. Imbes, i-store ang files sa <strong>object storage</strong> (S3) at bigyan ang client ng URL. May <strong>CDN</strong> (CloudFront) sa harap na may servers sa maraming cities. Nagtatabi 'to ng kopya ng mga sikat na files at bumabalik lang sa S3, ang <strong>origin</strong>, pag miss.</p><p>Lumiliit ang trabaho ng API sa “ito ang ipe-play, at ito ang URLs”. Para sa private content, nagbibigay ang API ng <strong>signed URLs</strong> na nag-e-expire, kaya yung tamang client lang ang makakapag-download ng file, at for a while lang.</p>","async-queue":"<p>May mga trabahong umaabot ng seconds o minutes: pag-build ng report, pag-transcode ng video, pag-notify sa 6,000 devices. Kung gagawin 'yan ng API sa loob ng request, nakatitig lang ang user sa spinner, baka ma-timeout ang request, at bawat mabagal na request ay hino-hostage ang isang API worker. Imbes, nagsusulat ang API ng maliit na <strong>job</strong> message sa <strong>queue</strong> (SQS, RabbitMQ, Redis list) at agad sumasagot ng <code>202 Accepted</code>. Ang <strong>workers</strong> ang kumukuha ng jobs, gumagawa ng trabaho at nagse-save ng result.</p><p>Sinasalo rin ng queues ang spikes: yung 500 jobs na sabay-sabay dumating ay pumipila imbes na durugin ang database. At kung mag-crash ang worker habang nasa gitna ng job, lalabas ulit ang message pagkatapos ng <strong>visibility timeout</strong> at ibang worker ang magre-retry. Kaya dapat safe patakbuhin nang dalawang beses ang jobs.</p>","offline-first":"<p>Hindi pwedeng mag-blank ang screen sa store dahil lang nawala ang Wi-Fi o nasa gitna ng deploy ang API. Sa <strong>offline-first</strong> design, sine-store ng device ang playlist, media at settings niya locally (SQLite, files sa disk) at doon sa kopyang 'yon nagpe-play. May background <strong>sync</strong> na nagtatanong sa server ng changes paminsan-minsan, ideally yung mga nagbago lang since last sync, at ina-update ang local copy.</p><p>Pag pumalya ang sync, tuloy lang ang device sa kung anong meron siya at nagre-retry with <strong>backoff</strong> at <strong>jitter</strong>, para yung 6,000 devices na sabay bumalik online ay hindi tumama lahat sa API sa iisang second. Lahat ng kailangang i-report ng device (plays, errors) ay naka-queue locally at ina-upload pagbalik ng connection.</p>","realtime-scale":"<p>Ang WebSocket ay long-lived connection sa <em>isang specific na server</em>. Pag isa lang ang Socket.IO server, iisang lugar lang naka-connect ang lahat ng clients at madali lang mag-push ng event. Pag nagdagdag ka ng pangalawang server para sa capacity, baka nasa server 1 ang dashboard habang nasa server 2 yung player na gusto mong abutin. Walang kaalam-alam si server 1 na nag-e-exist yung player na 'yon.</p><p>Ang fix ay shared na <strong>pub/sub</strong> channel, kadalasan Redis: bawat server nagpa-publish ng events doon at bawat server ang nagde-deliver ng mga 'yon sa sarili niyang clients (Redis adapter ang tawag dito ng Socket.IO). Kailangan din ng load balancer ng <strong>sticky sessions</strong> habang sine-setup ang connection. At pag namatay ang isang server, sabay-sabay magre-reconnect lahat ng clients niya, kaya kailangan ng random delays (jitter) sa reconnects, kundi madudurog ang mga natitirang servers.</p>","gateway-services":"<p>Habang lumalaki ang team at ang codebase, humihirap baguhin nang safe ang iisang API: iisang bagay ang dine-deploy ng lahat, at kayang hilahin pababa ng isang mabagal na feature ang iba. Pag hinati by business area (devices, content, reports), may sariling code, deploys at database ang bawat <strong>service</strong>. May <strong>API gateway</strong> sa harap na gumagawa ng kailangan ng bawat request: pag-check ng token, rate limiting, at pag-route ng <code>/devices/*</code> sa isang service at <code>/content/*</code> sa iba.</p><p>Ang kapalit: yung page na dati isang database query lang, baka kailangan na ng sagot mula sa tatlong services over the network. Kasing-bilis lang 'to ng pinakamabagal (tail latency), at kung down ang isa, kailangan mo ng plano: timeouts, at partial answer imbes na error. Sinosolve ng microservices ang team at deploy problems. Bihira nilang mapabilis ang kahit ano.</p>","event-driven":"<p>Sa request-driven design, ang pag-register ng device ay pwedeng mangahulugang tatawagin ng devices service ang billing, tapos notifications, tapos analytics, at hihintayin ang bawat isa. Kung down ang notifications, fail ang registration, kahit maayos namang na-save ang device mismo. Sa <strong>event-driven</strong> design, sine-save ng devices service ang device, nagpa-publish ng <code>DeviceRegistered</code> event sa <strong>bus</strong> (SNS, EventBridge, Kafka) at sumasagot na. Bawat interesadong service ay may sariling queue at pino-process ang event pag kaya na niya.</p><p>Nagiging loosely coupled ang services: pwede kang magdagdag ng consumer nang hindi ginagalaw ang publisher, at pag may consumer outage, lumalaki lang ang queue niya hanggang makabalik siya. Ang costs: eventually consistent ang system, mas tahimik ang failures (walang nag-e-error, basta hindi lang nangyayari yung mga bagay), at kailangan mong siguraduhing parehong nangyayari ang save at ang publish. Yung huli, 'yan ang para sa <strong>outbox pattern</strong>.</p>","sharding":"<p>Nakakatulong ang caches at replicas sa reads. Pag ang <em>writes</em> o ang laki mismo ng data ay lumampas na sa pinakamalaking database na kaya mong bilhin, hinahati mo na ang data mismo. Bawat <strong>shard</strong> ay buong database na may hawak na subset ng rows, pinipili gamit ang <strong>shard key</strong>: customers A to H sa shard 1, I to P sa shard 2, at iba pa (in practice, kadalasan hash ng key). Ang application, o isang routing layer, ang nagpapadala ng bawat query sa tamang shard.</p><p>Ang pagpili ng key ang buong laro. Ang magandang key ay pantay na nagkakalat ng load at pinapanatili sa iisang shard ang karamihan ng queries. Ang pangit na key ay gumagawa ng <strong>hot shard</strong>: isang dambuhalang customer na tinutunaw ng traffic niya ang shard nila habang tambay lang ang iba. At lahat ng nangangailangan ng buong data, tulad ng global report, nagiging mabagal na fan-out.</p>","multi-region":"<p>Lahat ng nakita natin so far ay nasa iisang AWS region. Sobrang reliable ng regions, pero may bad days din sila, at yung users na malayo ay nagbabayad para sa layo sa bawat request. Sa <strong>multi-region</strong> setup, tumatakbo ang API sa dalawang regions. Pinapadala ng DNS (Route 53) ang bawat user sa pinakamalapit na healthy, at tumitigil sa pagpapadala ng traffic sa region na fail ang health checks.</p><p>Ang database ang mahirap na part. Kadalasan, isang region ang may hawak ng <strong>primary</strong> at yung isa ay cross-region <strong>replica</strong>: local ang reads kahit saan, pero bumibiyahe ang writes papunta sa primary. Pag nag-fail ang region ng primary, ipo-<strong>promote</strong> mo ang replica, at mawawala ang kahit anong writes na hindi pa na-replicate. Dalawang numbers ang nagde-describe ng plano: <strong>RTO</strong>, gaano katagal ang recovery, at <strong>RPO</strong>, gaano karaming data ang kaya mong mawala.</p>"}},"ceb":{"ui":{"show":"Abri contents","hide":"Sira contents","collapse":"I-collapse tanan","expand":"I-expand tanan","start":"diri ta start","done":"Nabuhat na nimo ni, actually","picture":"Imagine-a lang ni","see":"Tan-awa sad","plain":"Simple explanation","enonly":"English pa ni for now. Ang taas nga explanation, i-translate pa namo.","try":"Try-a","nextterm":"Next term →","where":"Asa makita ang matag term","inarch":"Sa Architecture guide","howpage":"Unsaon pag-gamit ani nga page","a1t":"One sentence ra","a4d":"Example gikan sa gawas sa computer, nga ma-gets bisan sa bata.","search":"Pangita: cache, replica, queue…","title":"From usa ka server hangtod daghang regions","intro":"Ang tanang dagkong system, nagsugod ra sa usa ka app ug usa ka database. Ang matag design sa ubos, mo-add og usa ka piece para i-solve ang usa ka specific nga problema, ug naa say dala nga bag-ong problema. Sunod-sunura lang, para kabalo ka unsay gamiton pag naay symptom, ug pila ang bayad. Live tanan diagrams: gubaa lang, okay ra.","lv_beginner":"Usa ka app, usa ka database, usa ka front door. Diri nag-start ang tanang system, ug diri ra unta ang kadaghanan.","lv_mid":"Ang first nga growing pains: dako na og traffic, busy na ang database, dagkong files, hinay nga jobs, ug network nga mawala-wala.","lv_advanced":"Daghang servers, daghang services, daghang regions. Powerful, pero mahal i-run og tarong.","lv_check":"Signs sa healthy nga API: secure, paspas, reliable, dali i-monitor. I-tick unsay naa na sa imong API.","ladder":"Ang hagdan","climb":"saka ra pag masakit na","which":"Unsang design akong kailangan?","h1":"Ang requests mo-lihok sa system murag packets. Ang toggles mo-guba og butang on purpose; ang stats mo-pakita sa p50, p99 ug failures.","h2":"Ang usa ka change from sa previous step. Ang bag-ong boxes sa diagram, naay NEW nga tag.","h5":"Example nga ma-gets bisan sa bata, with punchline para dili ma-forget.","h3":"Kanus-a ni gamiton, unsaon ka niya pag-paak, ug unsay itsura sa nindot nga setup.","h4":"Links padulong sa Backend Field Guide para sa matag concept nga gigamit sa design.","adds":"Unsay gi-add ani sa","whatis":"Unsa ni","ntvangle":"Sa NTV360","ntvuses":"Gigamit ni sa NTV360","words":"Bag-ong words","when":"Kanus-a gamiton","watch":"Bantayi ni","good":"Signs nga nindot ang pagkahimo","terms":"Backend terms nga gigamit diri","prevstep":"← Previous step","nextstep":"Next step →","nextdesign":"Next design →","step":"Step {n} of {m}","cktitle":"Signs sa healthy nga API","ckintro":"Ang nindot nga APIs, naay same nga habits: naka-encrypt, ubos ang p99, graceful mo-fail, ug naay maka-notice pag masakiton sila. I-tick unsay gibuhat na sa imong API. Diri ra sa browser naka-save imong ticks."},"one":{"single-server":"Ang imong app ug database, naa ra sa usa ka machine. Usa ra i-deploy, usa ra bayran, ug usa ra ka butang nga maka-down sa tanan.","three-tier":"I-split ang system sa tulo ka layers nga naay kaugalingong job: ang screen nga gamiton sa users, ang API nga naghawid sa rules, ug ang database nga nag-keep sa data.","reverse-proxy":"Butangi og usa ra ka front door sa atubangan sa API. Siya bahala sa HTTPS, siya mo-serve sa frontend files, ug siya mo-forward sa API calls sa servers nga di maabot sa internet.","load-balanced":"Pagpadagan og pipila ka parehas nga copies sa API sa likod sa load balancer, para shared ang traffic ug di mo-down ang tanan pag naay usa nga mo-crash.","cache-aside":"I-keep ang copy sa sige-sige basahon nga data sa paspas nga in-memory store, para kadaghanan sa reads, di na mo-abot sa database.","read-replicas":"Dugangi og copies sa database nga pang-read ra. Ang tanang writes, sa primary; siya na mo-pasa sa changes sa replicas.","cdn-storage":"I-tago ang dagkong files (videos, images, builds) sa object storage, ug pasagdi ang CDN mo-serve sa copies gikan sa server nga pinaka-duol sa nag-download.","async-queue":"Pag hinay nga trabaho ang gipangayo, ibutang ang job sa queue, tubag dayon, ug pasagdi ang background workers mo-buhat ana sa ilang pace.","offline-first":"Ang device naay iyang own copy sa tanan nga kailangan niya ug didto siya mo-run. Pang-sync ra ang network, so pag naay outage, updates ra ang mo-stop, dili ang device.","realtime-scale":"Pag di na kaya sa usa ka real-time server, pagpadagan og pipila ug i-connect sila gamit pub/sub, para ang event nga gi-send sa usa ka server, maabot sa client nga naka-connect sa lain.","gateway-services":"I-split ang backend into services nga naay kaugalingong part sa business ug data, with gateway sa atubangan nga bahala sa mga trabaho nga common sa tanan.","event-driven":"Imbes nga tawagan isa-isa ang matag service nga concerned sa usa ka change, mo-publish lang ang service og event (“device registered”), ug ang interested, mo-react sa ilang own time.","sharding":"I-split ang usa ka dako kaayo nga database into pipila ka gagmay, nga ang matag usa naghawid og part sa data base sa key like customer ID.","multi-region":"Pagpadagan sa system sa duha or labaw pa nga regions, para duol ang server sa users ug di end of the world pag mo-down ang usa ka tibuok region."},"like":{"single-server":"Murag sari-sari store nga usa ra ang bantay. Siya mo-dawat og order, mo-kuha sa likod, ug siya sad ang cashier. Simple ug barato, hangtod magkasakit siya ug sirado ang tibuok store.","three-tier":"Murag restaurant. Sa waiter ka mo-storya (frontend), ang waiter mo-storya sa kusina (API), ug kusina ra ang mo-sulod sa bodega (database). Di ka mo-sulod sa bodega, ha.","reverse-proxy":"Murag guard sa gate sa school. Tanan mo-agi sa usa ra ka gate; siya mo-check sa ID, mo-hatag og visitor pass, ug mo-tudlo asang building. Walay mo-katkat sa pader.","load-balanced":"Murag gidugangan ang cashier sa Jollibee. Naay staff nga mo-tudlo sa matag customer sa next nga bakante nga cashier. Pag mag-break ang usa, mo-balhin ra ang linya sa uban.","cache-aside":"Murag ref sa balay. Imbes nga mo-adto ka sa merkado every time ganahan ka og gatas, naa nay stock sa ref. Dali ra kuhaon. Pero pag panis na, palit gihapon og bag-o.","read-replicas":"Usa ka teacher nag-sulat sa lesson sa board, then naay helpers nga mo-copy ana sa gagmay nga boards sa palibot sa room para mas daghang students maka-basa dungan. Pero pila ka seconds silang late sa main board.","cdn-storage":"Imbes nga tanan mo-byahe sa factory para sa usa ka botelya sa softdrinks, ang factory mo-padala og crates sa sari-sari stores sa matag barangay. Sa kanto ka na lang mo-palit.","async-queue":"Murag pagkuha og number sa bangko. Pila ka seconds, naa na kay number, then lingkod ka. Ang tellers mo-tawag sa numbers isa-isa, ug di nimo kailangan mo-barog sa window sa tibuok time.","offline-first":"Murag nagdala ka og baon sa school. Bisan sirado ang canteen, maka-kaon gihapon ka og lunch. Restock na lang sa balay later.","realtime-scale":"Murag duha ka classrooms nga naay intercom. Pag naay message para sa student sa pikas room, i-announce sa intercom, so maabot siya bisan di nimo siya makita.","gateway-services":"Murag mall. Usa ka main entrance nga naay guard, then separate shops nga naay own business ug own stockroom. Pag naay usa ka shop nga sayo nag-close, open gihapon ang tibuok mall.","event-driven":"Murag class GC. Kausa ra mag-post si teacher og “walay klase ugma”. Mabasa sa matag student pag abli nila sa phone; di na sila isa-isahon og tawag ni teacher.","sharding":"Murag enrollment lines nga gi-split by apelyido: A to H diri, I to P didto, Q to Z sa dulo. Short ang matag linya, unless katunga sa school kay Santos.","multi-region":"Murag business nga naay second branch sa laing city. Pag gi-close sa bagyo ang Manila branch, sa Cebu branch mo-adto ang customers, pero ang orders nga wala pa na-send, na-stuck sa Manila."},"ntv":{"single-server":"Lapas na ang NTV360 ani nga stage: separate na ang API, ang database (RDS) ug ang Socket.IO server. Pero makita pa gihapon nimo ni nga design sa mga side project ug gagmay nga internal tools, ug ang tanang ubang design diri, i-compare jud ani.","three-tier":"Mao ni ang core sa NTV360: ang Angular dashboard (presentation), ang .NET Core API (logic) ug RDS MySQL (data). Ang Raspberry Pi players kay second presentation tier nga mo-call sa same API. Ang tanang sunod nga design, naay idugang ani nga picture.","reverse-proxy":"Ang Angular build kay static files ra man, so pwede ra i-serve sa front door samtang ang API calls kay i-pasa sa .NET API. Ang HTTPS page sa backend guide ang mo-cover sa certificate side: tanang 6,000 players mo-check sa certificate sa API, so pag ma-expire na, maputol silang tanan dungan.","load-balanced":"Pag ang .NET API mo-run na as several instances (example, sa ECS behind an ALB), makatabang na ang JWT auth: ang token na ang mo-ingon kinsa ka, so bisan asa nga instance maka-check ani. Ang bisan unsa nga naka-keep sa server memory, like in-process cache or upload nga wala pa nahuman, kinahanglan ibalhin sa shared nga lugar.","cache-aside":"Perfect fit ang player playlists: libo-libo ka players ang mangayo sa pareha nga pipila ka playlists, ug mausab ra sila pag naay mo-edit sa dashboard. Ang local SQLite copy sa players kay cache na sa device; ang server-side cache kay mo-protect sa RDS same way.","read-replicas":"Ang RDS MySQL kay naay read replicas in a few clicks ra. Ang bug-at nga dashboard pages, like reports across libo-libo ka devices, good candidates nga mo-read sa replica para di nila mapahinay ang player check-ins nga nag-write sa primary.","cdn-storage":"Players across the USA nga nag-download sa same ad videos, textbook case jud ni para sa CDN. Ang API ang mo-decide unsa ang i-play sa matag player; ang bytes kay dapat gikan sa pinakaduol nga edge, dili sa API server. Pag mapahinay gyud sa downloads ang API, mao ni ang design nga i-compare.","async-queue":"Proof-of-play reports, bulk playlist pushes ug screenshot processing, mao ni ang klase sa work nga fit diri. Ang “Message queue & async jobs” page sa backend guide ang mo-explain sa 202 pattern in detail.","offline-first":"Mao ni ang pag-work sa NTV360 players karon: ang matag Raspberry Pi naay local copy sa SQLite ug didto siya mo-play, so ang mubo nga API outage di mo-blank sa screen. Ang interesting nga questions kay naa sa edges: unsa ka paspas maabot sa devices ang changes, ug unsay mahitabo pag 6,000 sa ila dungan mo-reconnect?","realtime-scale":"Usa ra ka Socket.IO server ang gi-run sa NTV360 nga mo-relay between sa dashboard ug 6,000 players, ug sakto ra ni nga design sa ingon ani ka size. Kini nga page mo-pakita unsa ang next step pag kinahanglan na og second server, ug nganong ang second server ang lisod nga part.","gateway-services":"Sakto ra ang single .NET API sa NTV360 sa iyang size; naa ra ni diri para ma-recognize nimo pag makit-an nimo. Ang realistic nga first step kay kuhaon ang usa ka bug-at nga area, like reporting, para di gyud niya mapahinay ang player check-ins.","event-driven":"Ang mga butang nga mahitabo “kay nag-online ang device” or “kay nausab ang playlist” (alerts, audit logs, analytics, emails) kay good candidates. Ang Socket.IO relay kay murag ingon ani na gamay para sa live events between sa dashboard ug players.","sharding":"Sa size sa NTV360, igo na kaayo ang usa ka well-indexed RDS instance. Naa ra diri ang sharding para mahuman ang ladder, ug kay ang “split by customer” kay question nga madungog nimo sa bisan unsa nga multi-tenant product.","multi-region":"Ang players across the USA kay usa ra ka AWS region ang gi-istoryahan for now, ug ang ilang local SQLite copy kay naka-cover na sa mubo nga outages sa playback side. Importante ang second region pag ang dashboard ug device management kinahanglan magpabilin nga up during sa regional outage. Business decision na una, technical decision sunod."},"body":{"single-server":"<p>Halos tanang project diri magsugod: usa ka virtual machine (EC2 instance, droplet, or kahon sa ilalom sa lamesa) ang mo-run sa API code ug sa database, magkauban. Mosulod ang request, mo-query ang code sa database through localhost, then mobalik ang answer. Walay network between sa code ug sa data, so simple ra siya ug surprisingly paspas.</p><p>Ang problema, usa ra ang CPU, usa ra ang disk ug usa ra ang power supply nga gi-share sa tanan. Pag naay bug-at nga report query, mohinay tanang login. Pag mag-deploy, ma-restart ang bugtong copy sa app, so ma-error ang users hangtod mobalik siya. Pag madaot ang disk, apil ang data, unless naay nag-setup og backups ug na-test jud nila ang pag-restore.</p>","three-tier":"<p>Ang <strong>presentation tier</strong> kay mao ang makita sa tao: ang Angular dashboard sa browser, or ang app sa player. Di jud siya direkta mo-istorya sa database. Ang <strong>logic tier</strong> kay ang API. Siya ang mo-check kinsa ka, mo-validate sa input, mo-apply sa business rules ug mo-decide unsa nga queries ang i-run. Ang <strong>data tier</strong> kay ang database, ug ang API ra ang maka-abot ani.</p><p>Since ang matag tier, sa iyang silingan ra mo-istorya, pwede nimo usbon ang usa nga di maguba ang uban: i-redesign ang dashboard nga di hilabtan ang SQL, or ibalhin ang database sa mas dako nga server nga di na i-redeploy ang frontend. Ang bayad ani: ang matag request, kaduha mo-agi sa network, so ang buhaton sa API per request (pila ka queries, pila ka data) mao ang mo-decide unsa ka paspas ang feel sa tibuok system.</p>","reverse-proxy":"<p>Before pa maka-send og bisan unsa ang browser, i-convert sa <strong>DNS</strong> ang domain name into IP address. Kana nga address kay sa <strong>reverse proxy</strong> (NGINX, or cloud load balancer like AWS ALB), dili sa API. Ang proxy ang mo-handle sa TLS handshake, mo-decrypt sa request ug mo-decide asa siya padulong: ang files like <code>main.js</code> diretso gikan sa disk or storage, ug ang <code>/api/*</code> calls kay i-forward sa API through private network.</p><p>So naa kay usa ra ka lugar para mag-manage sa certificates, mag-redirect sa HTTP to HTTPS, mag-compress sa responses, mag-add og security headers ug mag-log sa matag request. Di na kinahanglan og public IP address ang API servers, so wala na ang usa ka tibuok klase sa attacks.</p>","load-balanced":"<p>Pag ang usa ka API server maubsan na og CPU, pwede ka mopalit og mas dako (<strong>vertical scaling</strong>) or magdugang og pareha (<strong>horizontal scaling</strong>). Sa long run, horizontal ang mudaog: walay ceiling, ug pag mawala ang usa ka copy, blip ra, dili outage. Ang <strong>load balancer</strong> naa sa atubangan, i-spread niya ang requests sa mga copies, ug padalhan niya ang matag usa og <strong>health check</strong> every few seconds para ma-stop niya ang pag-route sa mga di na mo-tubag.</p><p>Mo-work ra ni pag ang servers kay <strong>stateless</strong>, meaning bisan asa nga copy maka-handle sa bisan unsa nga request. Pag ang server mo-keep og logins, uploads or caches sa iyang kaugalingong memory, basin ang next request mo-landing sa copy nga wala pa gani kaila nimo. I-keep ang state sa token, sa database, or sa shared store like Redis.</p>","cache-aside":"<p>Kadaghanan sa systems, mas sige-sige mo-read sa same data kaysa mo-change ani. Sa <strong>cache-aside</strong>, i-check una sa API ang Redis. Pag <strong>hit</strong>, mo-answer siya in mga usa ka millisecond ra. Pag <strong>miss</strong>, basahon niya ang database, i-store ang result sa Redis with <strong>TTL</strong>, then mo-answer. Ang next request sa same key, hit na.</p><p>Ang lisod kay dili ang pag-add sa cache, kundi ang pag-keep niya nga honest. Pag mausab ang data, sayop na ang cached copy. Ang usual nga rule: mag-write sa database, then i-<strong>delete</strong> ang cache key para ang next read mo-fetch sa bag-ong value. Ang TTL ang imong safety net para sa mga higayon nga makalimtan nimo.</p>","read-replicas":"<p>Makatabang ang cache pag ang same rows kay sige-sige ug basa. Pero pag lain-lain ang reads (search, filtered lists, reports), kinahanglan nimo og dugang database capacity para sa reads. Ang <strong>read replica</strong> kay copy nga mo-follow sa <strong>primary</strong>: ang matag write mo-landing sa primary, then i-replay sa matag replica after a moment. Ang API mo-send sa writes sa primary ug i-spread ang reads sa replicas.</p><p>Kana nga “after a moment” kay ang <strong>replication lag</strong>, usually milliseconds, usahay seconds pag naay load. Ang user nga nag-save og form then nag-reload dayon basin mo-read sa replica nga wala pa naka-catch up, then makita niya nga nawala iyang change. Ang common fix kay <em>read-your-own-writes</em>: right after mag-write ang user, i-send iyang reads sa primary for a short while.</p>","cdn-storage":"<p>Maayo ang APIs sa gagmay nga JSON answers pero bati sila sa pag-push og 80 MB nga videos. Pag ang downloads moagi sa API, ang matag usa mo-okupar og API worker ug iyang bandwidth for seconds or minutes. Instead, i-store ang files sa <strong>object storage</strong> (S3) then hatagi ang client og URL. Ang <strong>CDN</strong> (CloudFront) naa sa atubangan, naay servers sa daghang cities. Mo-keep siya og copies sa popular files ug mobalik ra sa S3, ang <strong>origin</strong>, pag miss.</p><p>Mo-gamay ang trabaho sa API into “mao ni ang i-play, ug mao ni ang URLs”. Para sa private content, ang API mohatag og <strong>signed URLs</strong> nga ma-expire, so ang sakto ra nga client ang maka-download sa file, ug for a while ra.</p>","async-queue":"<p>Naay work nga mo-take og seconds or minutes: pag-build og report, pag-transcode og video, pag-notify sa 6,000 devices. Pag buhaton ni sa API inside sa request, magtan-aw ra ang user sa spinner, basin ma-timeout ang request, ug ang matag hinay nga request mo-hostage og API worker. Instead, mag-write ang API og gamay nga <strong>job</strong> message sa <strong>queue</strong> (SQS, RabbitMQ, Redis list) then mo-answer dayon og <code>202 Accepted</code>. Ang <strong>workers</strong> mo-pull sa jobs, buhaton ang work ug i-save ang result.</p><p>Ang queues kay mo-absorb pud sa spikes: 500 jobs nga dungan miabot, maghulat sa linya instead nga dugmokon ang database. Ug pag ang worker ma-crash mid-job, mobalik ang message after sa <strong>visibility timeout</strong> ug laing worker ang mo-retry ani. Mao nang dapat safe i-run ang jobs kaduha.</p>","offline-first":"<p>Ang screen sa store di pwede mo-blank tungod lang kay nawala ang Wi-Fi or naa sa tunga-tunga sa deploy ang API. Sa <strong>offline-first</strong> nga design, i-store sa device ang iyang playlist, media ug settings locally (SQLite, files sa disk) ug didto siya mo-play sa kana nga copy. Ang background <strong>sync</strong> kay mangutana sa server og changes every so often, ideally ang na-change ra since sa last sync, then i-update ang local copy.</p><p>Pag mag-fail ang sync, padayon ra ang device sa unsa iyang naa ug mo-retry with <strong>backoff</strong> ug <strong>jitter</strong>, para ang 6,000 devices nga mo-online balik di mo-igo tanan sa API sa same second. Ang bisan unsa nga kinahanglan i-report sa device (plays, errors) kay i-queue locally ug i-upload pag mobalik na ang connection.</p>","realtime-scale":"<p>Ang WebSocket kay long-lived connection sa <em>usa ka specific nga server</em>. Pag usa ra ang Socket.IO server, tanang clients naka-connect sa same place ug easy ra mo-push og event. Pag mag-add ka og second server para sa capacity, basin ang dashboard naa sa server 1 samtang ang player nga gusto nimo abton naa sa server 2. Walay idea ang server 1 nga nag-exist diay kana nga player.</p><p>Ang fix kay shared <strong>pub/sub</strong> channel, usually Redis: ang matag server mo-publish og events didto ug ang matag server mo-deliver ani sa iyang own clients (Redis adapter ang tawag ani sa Socket.IO). Kinahanglan pud sa load balancer ang <strong>sticky sessions</strong> samtang gi-setup pa ang connection. Ug pag mamatay ang server, tanan niyang clients dungan mo-reconnect, so kinahanglan og random delays (jitter) ang reconnects or ma-flatten ang mga servers nga nabilin.</p>","gateway-services":"<p>Pag modako na ang team ug ang codebase, lisod na usbon nga safe ang usa ka API: tanan nag-deploy sa same thing, ug ang usa ka hinay nga feature makaguyod sa uban. Pag i-split base sa business area (devices, content, reports), ang matag <strong>service</strong> naay kaugalingong code, deploys ug database. Ang <strong>API gateway</strong> sa atubangan mo-handle sa kinahanglan sa matag request: pag-check sa token, rate limiting, ug pag-route sa <code>/devices/*</code> sa usa ka service ug <code>/content/*</code> sa lain.</p><p>Ang bayad: ang page nga usa ra ka database query kaniadto, basin kinahanglan na og answers gikan sa tulo ka services over the network. Ang speed niya kay pareha ra sa pinakahinay (tail latency), ug pag naay usa nga down, kinahanglan nimo og plan: timeouts, ug partial answer instead of error. Ang microservices mo-solve sa team ug deploy problems. Rare ra sila makapaspas og bisan unsa.</p>","event-driven":"<p>Sa request-driven nga design, ang pag-register og device basin meaning ang devices service mo-call sa billing, then notifications, then analytics, ug maghulat sa matag usa. Pag down ang notifications, mag-fail ang registration, bisan og na-save ra og tarong ang device. Sa <strong>event-driven</strong> nga design, i-save sa devices service ang device, mo-publish og <code>DeviceRegistered</code> event sa <strong>bus</strong> (SNS, EventBridge, Kafka) then mo-answer. Ang matag interested nga service naay kaugalingong queue ug i-process ang event pag kaya na niya.</p><p>Ang services mahimong loosely coupled: pwede ka mag-add og consumer nga di hilabtan ang publisher, ug pag down ang consumer, modako ra iyang queue hangtod mobalik siya. Ang costs: eventually consistent ang system, mas hilom ang failures (walay mag-error, di lang mahitabo ang mga butang), ug kinahanglan nimo siguraduhon nga mahitabo ang save ug ang publish. Para ana ang <strong>outbox pattern</strong>.</p>","sharding":"<p>Ang caches ug replicas makatabang sa reads. Pag ang <em>writes</em> or ang sheer data size kay molapas na sa pinakadako nga database nga mapalit nimo, i-split na nimo ang data mismo. Ang matag <strong>shard</strong> kay full database nga naay subset sa rows, gipili base sa <strong>shard key</strong>: customers A to H sa shard 1, I to P sa shard 2, ug uban pa (in practice usually hash sa key). Ang application, or routing layer, mo-send sa matag query sa sakto nga shard.</p><p>Ang pagpili sa key ang tibuok game. Ang maayo nga key mo-spread sa load evenly ug mo-keep sa kadaghanan sa queries sa usa ka shard. Ang bati nga key mo-create og <strong>hot shard</strong>: usa ka dako kaayo nga customer nga ang traffic mo-tunaw sa ilang shard samtang ang uban kay tambay ra. Ug ang bisan unsa nga kinahanglan sa tanang data, like global report, mahimong hinay nga fan-out.</p>","multi-region":"<p>Ang tanan hangtod karon naa ra sa usa ka AWS region. Reliable kaayo ang regions, pero naa gyud silay bad days, ug ang users nga layo mobayad sa distance sa matag request. Ang <strong>multi-region</strong> setup mo-run sa API sa duha ka regions. Ang DNS (Route 53) mo-send sa matag user sa pinakaduol nga healthy region ug mo-stop og send og traffic sa region nga nag-fail ang health checks.</p><p>Ang database ang lisod nga part. Usually ang usa ka region ang naa sa <strong>primary</strong> ug ang lain naa sa cross-region <strong>replica</strong>: local ang reads bisan asa, pero ang writes mobiyahe padulong sa primary. Pag mag-fail ang region sa primary, i-<strong>promote</strong> nimo ang replica, ug ang bisan unsa nga writes nga wala pa na-replicate, mawala. Duha ka numbers ang mo-describe sa plan: <strong>RTO</strong>, unsa kadugay ang recovery, ug <strong>RPO</strong>, pila ka data ang kaya nimo mawala.</p>"}}};

  const direct=TX(html);if(direct!==html)return direct;
  const template=document.createElement('template');template.innerHTML=html;
  const walker=document.createTreeWalker(template.content,NodeFilter.SHOW_TEXT);
  while(walker.nextNode()){const node=walker.currentNode;if(!node.parentElement?.closest('code,pre'))node.nodeValue=TX(node.nodeValue)}
  return template.innerHTML;
}

<script>
/* ================= backend guide cross-reference ================= */
const BT={"rest":["REST","beginner","REST (REpresentational State Transfer) is a way of designing APIs where URLs name things (resources) and HTTP methods say what to do with them."],"http-methods":["HTTP methods","beginner","The verb of a request. GET reads, POST creates, PUT replaces, PATCH changes part, DELETE removes."],"status-codes":["HTTP status codes","beginner","A three-digit number on every response saying how it went. The first digit tells you whose problem it is."],"https":["HTTPS, SSL & TLS","beginner","HTTPS (HTTP Secure) is plain HTTP sent through an encrypted TLS (Transport Layer Security) connection, so nobody in between can read or change it."],"anatomy":["Request & response anatomy","beginner","Every HTTP message has the same parts: a first line, headers with details about it, and an optional body with the data."],"auth":["Authentication & tokens","beginner","Proving who you are on every request, usually with a token the server gave you when you logged in."],"cors":["CORS","mid","Cross-Origin Resource Sharing: a browser rule that lets a page from one site read responses from another site only if that site allows it."],"websocket":["WebSockets & polling","mid","Polling asks \"anything new?\" over and over. A WebSocket keeps one connection open so the server can push the moment something happens."],"latency":["Latency","beginner","How long one request takes, from the moment you send it to the moment the answer is back."],"ttfb":["TTFB","mid","Time To First Byte: how long until the first piece of the answer arrives, even if the rest is still on its way."],"throughput":["Throughput","mid","How many requests a system finishes per second. Speed measured in volume, not in time."],"distribution":["Statistical distribution","hard","The shape you get when you plot many measurements: where most values land, and how far the stragglers go."],"mean-median":["Mean vs median","mid","The average is easily dragged around by one huge value. The median, the middle value, barely moves."],"percentiles":["Percentiles (p50, p95, p99)","hard","p99 (the 99th percentile) means 99% of requests were faster than this. It's the latency of your unlucky 1 in 100."],"tail-latency":["Tail latency","insane","The slow end of the distribution, and why it gets worse when one request depends on many others."],"cold-start":["Cold start","mid","The extra delay on the first request after something has been idle or freshly started."],"sli-slo-sla":["SLI, SLO, SLA","hard","SLI (Service Level Indicator) is what you measure. SLO (Service Level Objective) is the target you aim for. SLA (Service Level Agreement) is the promise in a contract, with a penalty."],"error-budget":["Error budget","hard","The amount of failure your SLO allows. 99.9% per month leaves about 43 minutes."],"timeout":["Timeout","beginner","The longest you're willing to wait for an answer before giving up."],"retry-backoff":["Retry with backoff & jitter","hard","After a failure, try again, waiting longer each time and adding randomness so everyone doesn't retry at once."],"circuit-breaker":["Circuit breaker","hard","Stop calling a service that keeps failing, wait a bit, then test it carefully before trusting it again."],"idempotency":["Idempotency","hard","Sending the same request twice has the same effect as sending it once."],"rate-limiting":["Rate limiting","mid","A cap on how many requests a client can make in a time window. Go over it and you get HTTP 429."],"backpressure":["Backpressure","insane","When the consumer is slower than the producer, push back on the producer instead of letting work pile up."],"thundering-herd":["Thundering herd","insane","Lots of requests wake up at the same moment and all hit the same resource at once."],"load-balancer":["Load balancer","mid","A traffic cop that spreads incoming requests across several servers."],"cache":["Cache hit & miss","beginner","Keep a copy of an answer close by so you don't have to compute or fetch it again."],"ttl":["TTL","mid","Time To Live: how long a cached item, DNS record, or message may live before it's considered stale."],"connection-pool":["Connection pool","mid","Keep a few connections open and reuse them, instead of opening a new one for every request."],"async-queue":["Message queue & async jobs","hard","Accept the job now, do it later in the background, and tell the client when it's done."],"n-plus-1":["N+1 query","mid","Fetching a list with one query, then running one more query for each item in it."],"pagination":["Offset vs cursor pagination","mid","Returning a big list in pages. Offset says \"skip 4\". A cursor says \"start after this item\"."],"race-condition":["Race condition","hard","Two operations run at the same time, and the result depends on which one happens to go first."],"eventual-consistency":["Eventual consistency","insane","Every copy of the data will agree, just not instantly. For a short while, some readers see the old value."]};
const BTLV={beginner:['Beginner','ad'],mid:['Mid','req'],hard:['Hard','slot'],insane:['Insane','bad']};
const BHREF=id=>'backend-terminologies.html#'+id;
const btChip=id=>{const b=BT[id];if(!b)return'';const l=BTLV[b[1]];return `<a class="bt" href="${BHREF(id)}" data-bt="${id}"><i style="--c:var(--${l[1]})"></i>${b[0]}<small>${l[0]}</small></a>`};

/* ================= levels, order, checklist ================= */
const LEVELS=[
 {k:'beginner',name:'Beginner',c:'ad',blurb:'One app, one database, one front door. Where every system starts, and where many should stay.'},
 {k:'mid',name:'Mid',c:'req',blurb:'The first growing pains: more traffic, busy databases, big files, slow jobs and flaky networks.'},
 {k:'advanced',name:'Advanced',c:'slot',blurb:'Many servers, many services, many regions. Powerful, and expensive to run well.'}];
const lvOf=k=>LEVELS.find(l=>l.k===k);
const ORDER=['start',...DESIGNS.map(d=>d.id),'checklist'];
const SYMPTOMS=[
 ['Every deploy causes a minute of errors','load-balanced'],['One server crash takes everything down','load-balanced'],['API CPU is maxed out at peak times','load-balanced'],
 ['The database answers the same reads over and over','cache-aside'],['The database is busy with varied reads and reports','read-replicas'],['Big downloads slow down the API','cdn-storage'],
 ['Requests time out while doing heavy work','async-queue'],['Devices stop working when the network drops','offline-first'],['HTTPS, certificates and CORS set up in five places','reverse-proxy'],
 ['Live events go missing after adding a second server','realtime-scale'],['Teams block each other shipping one codebase','gateway-services'],['One action must trigger many follow-ups','event-driven'],
 ['Writes outgrow the biggest database you can buy','sharding'],['A region outage would cost more than a second region','multi-region']];
const CHECK=[
 {k:'sec',name:'Secure',c:'bad',items:[
  ['HTTPS everywhere, and plain HTTP redirects to HTTPS','Anyone on the same network can read plain HTTP, tokens included.',['https'],'reverse-proxy'],
  ['Certificates renew automatically, with an expiry alert','An expired certificate cuts off every client on the same day.',['https']],
  ['Every endpoint checks auth, and tokens expire','A forgotten [Authorize] is an open door. Short-lived tokens limit the damage of a leak.',['auth','status-codes']],
  ['Databases and internal services are unreachable from the internet','Only the front door has a public address.',[],'reverse-proxy'],
  ['Secrets live in a secrets manager or environment, never in git','Anything committed once is in the history forever.',[]],
  ['CORS allows only your own origins, not *','A wildcard lets any website call your API from a logged-in browser.',['cors']],
  ['Input is validated on the server','Frontend checks are a convenience; anyone can call the API directly.',['anatomy']]]},
 {k:'fast',name:'Fast',c:'req',items:[
  ['p95 and p99 are tracked, not just the average','The average hides the slow requests your users actually complain about.',['percentiles','mean-median']],
  ['Every list endpoint is paginated','A list that grows with your customers becomes a timeout one day.',['pagination'],'three-tier'],
  ['No N+1 queries on hot endpoints','Each extra query is another round trip to the database.',['n-plus-1'],'three-tier'],
  ['Database connections are pooled','Opening a connection per request costs a handshake every time.',['connection-pool']],
  ['Hot reads are cached, with a TTL','The fastest database query is the one you don\'t run.',['cache','ttl'],'cache-aside'],
  ['Big files come from storage or a CDN, not the API','APIs should move JSON, not videos.',['throughput'],'cdn-storage']]},
 {k:'rel',name:'Reliable',c:'ad',items:[
  ['Every outbound call has a timeout','Without one, a hung dependency hangs you too.',['timeout']],
  ['Retries use backoff with jitter, and only for safe calls','Instant retries from every client turn a blip into an outage.',['retry-backoff','idempotency'],'offline-first'],
  ['POSTs that may be retried accept an idempotency key','A retried payment or order must not happen twice.',['idempotency']],
  ['Rate limits answer 429 with Retry-After','One noisy client shouldn\'t be able to starve the rest.',['rate-limiting'],'gateway-services'],
  ['Slow work goes to a queue; the API answers 202','Users shouldn\'t wait on reports, and a spike shouldn\'t crush the database.',['async-queue'],'async-queue'],
  ['A failing dependency trips a circuit breaker','Fail fast instead of piling up waiting requests.',['circuit-breaker']],
  ['At least two instances behind a load balancer with health checks','One crash or deploy should be invisible to users.',['load-balancer'],'load-balanced']]},
 {k:'ops',name:'Operable',c:'slot',items:[
  ['SLOs are written down, with alerts on the error budget','Agree on "good enough" before arguing about an incident.',['sli-slo-sla','error-budget']],
  ['Dashboards for latency, traffic, errors and saturation','The four numbers that tell you something is wrong before customers do.',['throughput','percentiles']],
  ['Logs are structured, with a request ID on every line','So one request can be followed across every service it touched.',['anatomy']],
  ['Backups are automated, and a restore has actually been tested','An untested backup is a hope, not a backup.',[],'single-server'],
  ['Deploys roll out without downtime and roll back in minutes','If a deploy is scary, people stop deploying.',['load-balancer'],'load-balanced']]}];

/* ================= index + search ================= */
const $=id=>document.getElementById(id);
let stage=null,curId=null;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=h=>h.replace(/<[^>]+>/g,' ');
const badge=lv=>{const l=lvOf(lv);return `<span class="lvb" style="--c:var(--${l.c})">${l.name}</span>`};
const num=id=>ORDER.indexOf(id);
function score(d,q){if(!q)return 1;const ql=q.toLowerCase(),t=d.t.toLowerCase();
  if(t===ql||d.aka.some(a=>a.toLowerCase()===ql))return 100;if(t.includes(ql))return 60;if(d.aka.some(a=>a.toLowerCase().includes(ql)))return 50;
  if(d.words.some(([a,b])=>(a+' '+b).toLowerCase().includes(ql)))return 45;if(d.one.toLowerCase().includes(ql))return 20;
  if(strip(d.body+d.watch.join(' ')+d.good.join(' ')+d.ntv).toLowerCase().includes(ql))return 10;return 0}
function hl(s,q){if(!q)return esc(s);const i=s.toLowerCase().indexOf(q.toLowerCase());if(i<0)return esc(s);
  return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length))}
let COLL={};try{COLL=JSON.parse(localStorage.getItem('afg-coll')||'{}')}catch(e){}
const saveColl=()=>{try{localStorage.setItem('afg-coll',JSON.stringify(COLL))}catch(e){}};
let TICK={};try{TICK=JSON.parse(localStorage.getItem('afg-check')||'{}')}catch(e){}
const saveTick=()=>{try{localStorage.setItem('afg-check',JSON.stringify(TICK))}catch(e){}};
function renderToc(){const q=$('q').value.trim();let html='',hits=0;
  LEVELS.forEach(l=>{const k='l-'+l.k,items=DESIGNS.filter(d=>d.lv===l.k).map(d=>({d,sc:score(d,q)})).filter(o=>o.sc>0);if(q)items.sort((a,b)=>b.sc-a.sc);if(!items.length)return;hits+=items.length;const shut=!q&&COLL[k];
    html+=`<div class="ch${shut?' shut':''}"><h3><button class="gh" data-k="${k}" aria-expanded="${!shut}"><svg viewBox="0 0 12 12"><path d="M3 4.5l3 3 3-3"/></svg><i style="color:var(--${l.c})">■</i>${l.name}${l.k==='beginner'?' · '+L('start','start here'):''}<em>${DESIGNS.filter(d=>d.lv===l.k).length}</em></button></h3><div class="gi">`+
    items.map(({d})=>{const ql=q.toLowerCase();let via=null;if(q&&!d.t.toLowerCase().includes(ql))via=d.aka.find(a=>a.toLowerCase().includes(ql));
      return `<button data-id="${d.id}" class="${d.id===curId?'on':''}">${hl(d.t,q)}${via?`<span class="via">matches “${hl(via,q)}”</span>`:''}<span class="pg">${num(d.id)}</span></button>`}).join('')+'</div></div>'});
  if(!q||'checklist api healthy good secure'.includes(q.toLowerCase())){html+=`<div class="ch"><h3><span class="gh" style="cursor:default"><i>✓</i>Tools</span></h3><div class="gi"><button data-id="checklist" class="${curId==='checklist'?'on':''}">Healthy API checklist<span class="pg">${num('checklist')}</span></button></div></div>`;if(q)hits++}
  $('toc').innerHTML=html||`<div class="empty">Nothing matches “${esc(q)}”. Try <b>cache</b>, <b>replica</b>, <b>queue</b> or <b>CDN</b>.</div>`;
  $('found').innerHTML=q?(hits?`${hits} match${hits>1?'es':''} · Enter opens the first`:''):`<span>${DESIGNS.length} designs · ${LEVELS.length} levels</span><button class="fold" id="foldall">${Object.values(COLL).some(Boolean)?L('expand','Expand all'):L('collapse','Collapse all')}</button>`;
  const fa=$('foldall');if(fa)fa.onclick=()=>{const any=Object.values(COLL).some(Boolean);COLL={};if(!any)LEVELS.forEach(l=>COLL['l-'+l.k]=true);saveColl();renderToc()}}
document.addEventListener('click',e=>{const h=e.target.closest('button.gh');if(!h)return;COLL[h.dataset.k]=!COLL[h.dataset.k];saveColl();renderToc()});
$('toc').onclick=e=>{const b=e.target.closest('button[data-id]');if(b){go(b.dataset.id);if(matchMedia('(max-width:860px)').matches){$('index').classList.remove('open');$('mtoggle').textContent=L('show','Show contents')}}};
$('q').oninput=()=>{renderToc();if($('q').value.trim())$('index').classList.add('open')};
$('q').onkeydown=e=>{if(e.key==='Enter'){const b=$('toc').querySelector('button[data-id]');if(b){go(b.dataset.id);$('q').blur()}}if(e.key==='Escape'){$('q').value='';renderToc();$('q').blur()}};
$('mtoggle').onclick=()=>{const o=$('index').classList.toggle('open');$('mtoggle').textContent=o?L('hide','Hide contents'):L('show','Show contents')};

 txt:'<svg viewBox="0 0 24 24"><path d="M4 6h16M4 11h16M4 16h10"/></svg>',

    </div>
  </div>
  <div class="trio">
    <div class="panel pw" style="--c:var(--req)"><div class="pb"><div class="lab">${L('when','When to use it')}</div>${lst(d.when.map(TX),'req')}</div></div>
