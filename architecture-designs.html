<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Architecture Field Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: dashboard skin. Fixed left rail = contents + search; right = full-width workspace of sharp bordered panels. Single dark look by design. */
:root{
  color-scheme:dark;
  --bg:#0c161b; --rail:#0f1b21; --panel:#111e25; --panel2:#18272f; --ink:#eef2f4; --muted:#8a9aa3; --line:#22333c; --line2:#2c3f49;
  --brand:#ff6a1a; --req:#4f8cff; --ad:#2ccf7f; --slot:#f5a524; --bad:#ff4d4f; --pop:#a78bfa; --pi:#ff6a1a; --on:#0b1419; --paper:#111e25;
  --sans:'Jost',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:15px;padding:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
::selection{background:var(--brand);color:var(--on)}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}

/* ---------- rail ---------- */
.rail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;
  position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start}
.brand{padding:22px 22px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.brand img{display:block;height:28px;width:auto}
.brand small{display:block;margin-top:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.search{margin:16px 16px 6px;position:relative}
.search input{width:100%;height:40px;border-radius:0;border:1px solid var(--line2);background:var(--panel);padding:0 36px 0 34px;font-size:14px}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--brand);outline:none}
.search svg{position:absolute;left:10px;top:11px;width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2}
.search kbd{position:absolute;right:8px;top:10px;font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line2);padding:1px 6px}
.found{padding:4px 18px 4px;font-family:var(--mono);font-size:10.5px;color:var(--muted);min-height:18px;letter-spacing:.3px}
.toc{overflow:auto;padding:4px 10px 16px;flex:1}
.ch{margin-top:16px}
.ch h3{font-family:var(--mono);font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);margin:0 10px 6px;font-weight:600;display:flex;gap:8px}
.ch h3 i{font-style:normal;color:var(--brand)}
.toc button{display:flex;flex-wrap:wrap;width:100%;align-items:baseline;gap:4px 10px;text-align:left;background:none;border:0;border-left:2px solid transparent;
  padding:7px 10px 7px 14px;cursor:pointer;font-size:14.5px;font-weight:500;color:color-mix(in srgb,var(--ink) 82%,var(--muted))}
.toc button:hover{background:var(--panel);color:var(--ink)}
.toc button.on{background:var(--panel2);border-left-color:var(--brand);color:var(--ink);font-weight:600}
.toc button .pg{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.toc button mark{background:color-mix(in srgb,var(--brand) 35%,transparent);color:inherit;padding:0 1px}
.toc .via{display:block;flex-basis:100%;order:3;font-size:11.5px;color:var(--muted);font-weight:400}
.empty{padding:14px 18px;font-size:13px;color:var(--muted);line-height:1.5}
.railfoot{border-top:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
.railfoot span{font-family:var(--mono);font-size:11px;color:var(--ink);border:1px solid var(--line2);padding:2px 7px}
.mtoggle{display:none}

/* ---------- workspace ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 28px;
  position:sticky;top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);z-index:5}
.crumb{font-family:var(--mono);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:600}
.tnav{margin-left:auto;display:flex;align-items:stretch;border:1px solid var(--line2)}
.tnav button{background:var(--panel);border:0;padding:0 12px;height:34px;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.tnav button:hover:not([disabled]){color:var(--ink);background:var(--panel2)}
.tnav button[disabled]{opacity:.35;cursor:default}
.tnav span{display:flex;align-items:center;padding:0 12px;border-inline:1px solid var(--line2);font-family:var(--mono);font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums}

.page{padding:26px 28px 28px;flex:1}
.page.turn-n{animation:turnN .32s cubic-bezier(.2,.7,.2,1)}
.page.turn-p{animation:turnP .32s cubic-bezier(.2,.7,.2,1)}
@keyframes turnN{from{opacity:0;transform:translateX(22px)}}
@keyframes turnP{from{opacity:0;transform:translateX(-22px)}}

.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--brand);font-weight:600;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:8px;height:8px;background:var(--brand)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 24px;margin-bottom:20px}
.head .l{min-width:0;flex:1 1 420px}
.term{font-size:clamp(28px,3.4vw,40px);line-height:1.05;margin:8px 0 8px;font-weight:700;letter-spacing:-.6px;text-wrap:balance}
.one{font-size:16.5px;line-height:1.5;margin:0;color:var(--muted);max-width:80ch;text-wrap:pretty}
.one code{font-family:var(--mono);font-size:.85em}
.aka{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:520px}
.aka span{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);background:var(--panel);padding:4px 8px;color:var(--muted)}

.grid{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(300px,1fr);gap:16px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);min-width:0}
.ph{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.ph .ic{width:32px;height:32px;border:1px solid var(--brand);display:grid;place-items:center;flex-shrink:0}
.ph .ic svg{width:16px;height:16px;stroke:var(--brand);fill:none;stroke-width:1.8}
.ph h2{font-size:15.5px;font-weight:600;margin:0}
.ph .act{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);background:none;border:0;cursor:pointer;padding:4px 0}
.ph .act:hover{color:var(--ink)}
.pb{padding:18px}
.lab{font-family:var(--mono);font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
.lab em{font-style:normal;color:var(--brand)}

.stats{display:flex;flex-wrap:wrap;gap:0;margin:-18px -18px 16px;border-bottom:1px solid var(--line)}
.stats:empty{display:none}
.stat{display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:6px;padding:12px 18px;border-right:1px solid var(--line);min-width:0;flex:1 1 140px}
.stat b{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.3px}
.stat span{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase;line-height:1.3}
.stage{width:100%;position:relative}
.stage canvas{display:block}
.ctrl{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin:16px -18px -18px;padding:14px 18px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--rail) 60%,var(--panel))}
.ctrl:empty{display:none}
.sl{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;flex-wrap:wrap}
.sl input{width:150px;accent-color:var(--brand)}
.sl output{font-family:var(--mono);font-size:11.5px;color:var(--brand);min-width:62px}
.tg{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;font-weight:500;user-select:none}
.tg input{position:absolute;opacity:0;width:1px;height:1px}
.sw{width:38px;height:20px;background:var(--panel2);border:1px solid var(--line2);position:relative;transition:background .2s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;background:var(--muted);transition:all .2s}
.tg input:checked + .sw{background:var(--brand);border-color:var(--brand)}
.tg input:checked + .sw::after{left:21px;background:var(--on)}
.tg input:focus-visible + .sw{outline:2px solid var(--brand);outline-offset:2px}
.btn{border:1px solid var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand);padding:7px 13px;
  font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:600;cursor:pointer}
.btn:hover{background:var(--brand);color:var(--on)}
.btn.ghost{border-color:var(--line2);background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--panel2);color:var(--ink)}
.cap{font-size:13.5px;color:var(--muted);margin:14px 0 0;line-height:1.5}
.cap b{font-family:var(--mono);color:var(--brand);font-weight:600;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;margin-right:8px}

.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.txt p{font-size:15.5px;line-height:1.65;margin:0 0 12px;max-width:72ch;color:color-mix(in srgb,var(--ink) 88%,var(--muted))}
.txt p:last-child{margin-bottom:0}
.txt strong{color:var(--ink);font-weight:600}
.txt em{color:var(--ink)}
.txt code{font-family:var(--mono);font-size:.82em;background:var(--panel2);border:1px solid var(--line);padding:1px 5px}
.note{border-left:2px solid var(--ad)}
.note .lab{color:var(--ad)}
.likep{border-left:2px solid var(--pop)}
.likep .lab{color:var(--pop)}
.see{display:flex;flex-direction:column}
.see button{display:flex;align-items:center;gap:12px;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;text-align:left;cursor:pointer;font-size:14.5px;font-weight:500}
.see button:first-child{border-top:0;padding-top:0}
.see button:hover{color:var(--brand)}
.see button i{font-style:normal;font-family:var(--mono);font-size:11px;width:24px;height:24px;border:1px solid var(--brand);color:var(--brand);display:grid;place-items:center;flex-shrink:0}
.see button small{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.plain{margin-top:16px}
.plain .pb{columns:2 380px;column-gap:40px}
.plain .pb p{break-inside:avoid}

/* cover */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);padding:16px 18px}
.kpi:first-child{border-left:2px solid var(--brand)}
.kpi .lab{margin-bottom:8px}
.kpi b{font-size:34px;font-weight:600;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.kpi:first-child b{color:var(--brand)}
.kpi p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;align-items:start}
.row{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 18px;text-align:left;cursor:pointer;min-width:0}
.row:first-child{border-top:0}
.row:hover{background:var(--panel2)}
.row i{font-style:normal;font-family:var(--mono);font-size:11px;width:26px;height:26px;border:1px solid var(--brand);color:var(--brand);display:grid;place-items:center;flex-shrink:0}
.row div{min-width:0;flex:1}
.row strong{display:block;font-size:14.5px;font-weight:600}
.row span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.anat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.anat div{padding:16px 18px;border-right:1px solid var(--line);font-size:13.5px;line-height:1.5;color:var(--muted)}
.anat div:last-child{border-right:0}
.anat b{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14.5px;font-weight:600;margin-bottom:4px}
.anat b::before{content:"";width:8px;height:8px;background:var(--c)}


/* levels, abbreviations, cover extras */
.grp{display:flex;margin:4px 16px 2px;border:1px solid var(--line2)}
.grp button{flex:1;background:var(--panel);border:0;padding:6px 0;font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);cursor:pointer}
.grp button+button{border-left:1px solid var(--line2)}
.grp button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--brand)}
.lvd{width:7px;height:7px;flex-shrink:0;align-self:center}
.lvb{font-family:var(--mono);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--c);border:1px solid var(--c);padding:2px 7px;background:color-mix(in srgb,var(--c) 12%,transparent)}
.eyebrow span{color:var(--muted)}
.eyebrow:has(.lvb)::before{display:none}
.full{display:flex;flex-wrap:wrap;gap:6px 18px;margin:2px 0 12px;padding:0}
.full div{display:flex;gap:8px;align-items:baseline}
.full dt{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--brand)}
.full dd{margin:0;font-size:14px;color:var(--ink)}
.where{display:flex;flex-direction:column}
.wh{padding:14px 18px;border-top:1px solid var(--line)}
.wh:first-child{border-top:0}
.wh .lab{margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:var(--panel2);border:1px solid var(--line2);padding:4px 9px;font-size:12.5px;cursor:pointer}
.chips button:hover{border-color:var(--brand);color:var(--brand)}
.kpi.lvk{text-align:left;cursor:pointer;border-left:2px solid var(--c);font:inherit;color:inherit}
.kpi.lvk b{color:var(--c)}
.kpi.lvk:hover{background:var(--panel2)}
.row i{border-color:var(--c,var(--brand));color:var(--c,var(--brand))}
.arch3d{position:relative;width:100%;overflow:hidden;background:radial-gradient(ellipse at 55% 40%,color-mix(in srgb,var(--panel2) 70%,transparent),transparent 70%)}
.arch3d canvas{display:block;cursor:grab}
.arch3d canvas:active{cursor:grabbing}
.a3lab{position:absolute;inset:0;pointer-events:none}
.a3l{position:absolute;left:0;top:0;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line2);border-left:2px solid var(--brand);padding:4px 8px;white-space:nowrap}
.a3l b{display:block;font-size:12.5px;font-weight:600}
.a3l span{display:block;font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.4px}
.a3l.g{border-left-color:var(--ad)}.a3l.b{border-left-color:var(--req)}.a3l.o{border-left-color:var(--pi)}.a3l.p{border-left-color:var(--pop)}.a3l.y{border-left-color:var(--slot)}
.a3l.m{border:0;background:none;font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--muted)}
.a3pk{position:absolute;left:0;top:0;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--on);padding:2px 6px;white-space:nowrap}
.a3toast{position:absolute;left:12px;top:12px;background:var(--panel);border:1px solid var(--ad);border-left:3px solid var(--ad);padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--ad);opacity:0;transform:translateY(-6px);transition:all .3s;pointer-events:none}
.a3toast.on{opacity:1;transform:none}
.a3hint{position:absolute;right:10px;bottom:8px;font-family:var(--mono);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);transition:opacity .4s}
@media (max-width:700px){.a3l span{display:none}.a3l b{font-size:11px}}


/* folding + cross-links */
.ch h3{margin:0 0 4px}
.gh{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:4px 10px;cursor:pointer;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;text-align:left}
.gh:hover{color:var(--ink)}
.gh svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.6;transition:transform .2s;flex-shrink:0}
.gh em{margin-left:auto;font-style:normal;color:var(--muted);font-size:10px}
.ch.shut .gh svg{transform:rotate(-90deg)}
.ch.shut .gi{display:none}
.found{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fold{background:none;border:0;padding:0;font-family:var(--mono);font-size:10.5px;color:var(--brand);cursor:pointer;letter-spacing:.3px}
.fold:hover{text-decoration:underline}
.fh{width:100%;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;font:inherit;color:inherit}
.fh:hover{background:var(--panel2)}
.fh h2 small{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:500;margin-left:6px}
.chev{width:14px!important;height:14px!important;transition:transform .2s}
.fp.shut .chev{transform:rotate(-90deg)}
.fp.shut .fh{border-bottom:0}
.fp.shut .fb{display:none}
a.xref{color:inherit;text-decoration:underline dotted color-mix(in srgb,var(--brand) 80%,transparent);text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:pointer}
a.xref:hover{color:var(--brand);text-decoration-style:solid}
.xpop{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line2);border-top:2px solid var(--brand);padding:12px 14px;box-shadow:0 18px 40px -16px rgb(0 0 0 / .7);pointer-events:none}
.xpop .xh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.xpop .xh b{font-size:15px}
.xpop .xf{font-size:12px;color:var(--muted);margin-bottom:6px}
.xpop .xf span{font-family:var(--mono);color:var(--brand);font-weight:700}
.xpop p{margin:0;font-size:13.5px;line-height:1.5}
.xpop p code{font-family:var(--mono);font-size:.85em}
.xpop .xo{margin-top:8px;font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
@media (hover:none){.xpop{display:none}}

@media (max-width:1180px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.anat{grid-template-columns:repeat(2,minmax(0,1fr))}.anat div:nth-child(2){border-right:0}.anat div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .mtoggle{display:block;margin:4px 16px 12px;width:calc(100% - 32px)}
  .rail:not(.open) .toc,.railfoot{display:none}
  .toc{max-height:55vh}
  .topbar{padding:0 16px}
  .page{padding:20px 16px}
  .aka{justify-content:flex-start}
  .pb{padding:14px}
  .stats{margin:-14px -14px 14px}.ctrl{margin:14px -14px -14px;padding:12px 14px}
  .stat{padding:10px 14px;flex-basis:110px}.stat b{font-size:20px}
  .sl input{width:120px}
  .chgrid{grid-template-columns:1fr}
}
@media (max-width:520px){.anat{grid-template-columns:1fr}.anat div{border-right:0;border-bottom:1px solid var(--line)}.tnav button.word{display:none}}
@media (prefers-reduced-motion:reduce){.page.turn-n,.page.turn-p{animation:none}}

/* ---------- architecture guide additions ---------- */
.guides{display:flex;gap:6px;flex-wrap:wrap}
.guides a{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line2);padding:2px 7px;text-decoration:none}
.guides a:hover{color:var(--brand);border-color:var(--brand)}
.guides a.on{color:var(--ink);border-color:var(--brand)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.lst{list-style:none;margin:0;padding:0}
.lst li{position:relative;padding:9px 0 9px 22px;border-top:1px solid var(--line);font-size:14.5px;line-height:1.55;color:color-mix(in srgb,var(--ink) 88%,var(--muted))}
.lst li:first-child{border-top:0;padding-top:0}
.lst li::before{content:"";position:absolute;left:2px;top:16px;width:8px;height:8px;background:var(--c,var(--brand))}
.lst li:first-child::before{top:7px}
.lst li b{color:var(--ink);font-weight:600}
.lst li code{font-family:var(--mono);font-size:.82em;background:var(--panel2);border:1px solid var(--line);padding:1px 5px}
.lst.plus li::before{content:"+";background:none;color:var(--ad);font-family:var(--mono);font-weight:700;width:auto;height:auto;top:8px;left:3px}
.lst.plus li:first-child::before{top:-1px}
.pw{border-top:2px solid var(--c)}
.pw .lab{color:var(--c)}
.ntvb{font-family:var(--mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--on);background:var(--brand);padding:2px 7px;margin-left:auto}
.words{display:flex;flex-direction:column}
.words div{padding:10px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.5;color:var(--muted)}
.words div:first-child{border-top:0;padding-top:0}
.words b{display:block;color:var(--ink);font-size:14px;font-weight:600;margin-bottom:2px}
.bts{display:flex;flex-wrap:wrap;gap:8px}
a.bt{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line2);padding:7px 11px;font-size:13.5px;font-weight:500;color:var(--ink);text-decoration:none}
a.bt:hover{border-color:var(--brand);color:var(--brand)}
a.bt i{width:7px;height:7px;background:var(--c);flex-shrink:0}
a.bt small{font-family:var(--mono);font-size:10px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
.steps button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:none;border:0;border-top:1px solid var(--line);padding:14px 18px;text-align:left;cursor:pointer;min-width:0}
.steps button+button{border-left:1px solid var(--line)}
.steps button:hover{background:var(--panel2)}
.steps small{font-family:var(--mono);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.steps b{font-size:15px;font-weight:600}
.steps button[disabled]{opacity:.35;cursor:default}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0;border-top:1px solid var(--line)}
.card{display:flex;flex-direction:column;gap:6px;background:none;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 16px 16px;text-align:left;cursor:pointer;min-width:0}
.card:hover{background:var(--panel2)}
.card canvas{display:block;width:100%;height:96px;margin-bottom:6px}
.card .ct{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.card .ct i{font-style:normal;font-family:var(--mono);font-size:10.5px;width:22px;height:22px;border:1px solid var(--c);color:var(--c);display:grid;place-items:center;flex-shrink:0}
.card p{margin:0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.card .ntvb{margin-left:0;align-self:flex-start}
.lvh{display:flex;align-items:center;gap:10px;padding:14px 18px;font-family:var(--mono);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--c);font-weight:600}
.lvh::before{content:"";width:8px;height:8px;background:var(--c)}
.lvh span{color:var(--muted);letter-spacing:.3px;text-transform:none;font-family:var(--sans);font-size:13px;font-weight:400}
.sym{display:flex;flex-direction:column}
.sym button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:none;border:0;border-top:1px solid var(--line);padding:11px 18px;text-align:left;cursor:pointer;font-size:14px}
.sym button:first-child{border-top:0}
.sym button:hover{background:var(--panel2)}
.sym button span{font-family:var(--mono);font-size:11px;color:var(--c,var(--brand));white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;padding:14px 18px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:7px}
.legend span::before{content:"";width:10px;height:10px;border:2px solid var(--c)}
.chk{display:flex;flex-direction:column}
.ci{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:13px 18px;border-top:1px solid var(--line);cursor:pointer}
.ci:first-child{border-top:0}
.ci:hover{background:var(--panel2)}
.ci input{position:absolute;opacity:0;width:1px;height:1px}
.ci .bx{grid-row:span 2;width:20px;height:20px;border:1.5px solid var(--line2);margin-top:1px;display:grid;place-items:center}
.ci input:checked + .bx{background:var(--ad);border-color:var(--ad)}
.ci input:checked + .bx::after{content:"";width:9px;height:5px;border-left:2px solid var(--on);border-bottom:2px solid var(--on);transform:rotate(-45deg) translate(1px,-1px)}
.ci input:focus-visible + .bx{outline:2px solid var(--brand);outline-offset:2px}
.ci b{font-size:14.5px;font-weight:600}
.ci input:checked ~ b{color:var(--muted)}
.ci p{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
.ci .bts{grid-column:2;margin-top:6px}
.ci a.bt{padding:3px 8px;font-size:12px}
.meter{height:6px;background:var(--panel2);margin-top:8px}
.meter div{height:100%;background:var(--c);transition:width .3s}
.score{display:flex;align-items:baseline;gap:8px;margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.score b{font-size:15px;color:var(--c)}
@media (max-width:1180px){.trio{grid-template-columns:1fr}}
@media (max-width:640px){.steps{grid-template-columns:1fr}.steps button+button{border-left:0}.sym button{grid-template-columns:1fr}}
/* language switcher + punchlines */
.lang{display:flex;margin:14px 16px 0;border:1px solid var(--line2)}
.lang button{flex:1;background:var(--panel);border:0;padding:6px 0;font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);cursor:pointer}
.lang button+button{border-left:1px solid var(--line2)}
.lang button:hover{color:var(--ink)}
.lang button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--brand)}
.lol{display:block;margin-top:10px;color:var(--pop);font-style:italic}
.txt p.enonly{font-family:var(--mono);font-size:11px;letter-spacing:.3px;color:var(--muted);border-left:2px solid var(--line2);padding-left:10px}
</style>

<script>
/* ================= drawing engine ================= */
const col={};
const CV=['bg','paper','panel','panel2','ink','muted','line','line2','brand','req','ad','slot','bad','pop','pi','on'];
function readCol(){const s=getComputedStyle(document.documentElement);CV.forEach(k=>col[k]=s.getPropertyValue('--'+k).trim())}
readCol();
const FONT='Jost, system-ui, sans-serif', MONO='"JetBrains Mono", ui-monospace, monospace';
const rnd=Math.random, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,p)=>a+(b-a)*p;
const ez=p=>{p=clamp(p,0,1);return p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2};
const randn=()=>{let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const logn=(med,sig)=>med*Math.exp(sig*randn());
const alpha=(c,a)=>{const h=(c||'#888').replace('#','');const f=h.length===3?h.split('').map(x=>x+x).join(''):h;
  const n=parseInt(f,16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
function seq(e,durs){let a=0;for(let i=0;i<durs.length;i++){if(e<a+durs[i])return{i,p:(e-a)/durs[i]};a+=durs[i]}return{i:durs.length-1,p:1}}
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;

function mkG(ctx){
  const g={
    rr(x,y,w,h,r,fill,stroke,lw=2,dash){ctx.beginPath();ctx.roundRect(x,y,Math.max(0,w),Math.max(0,h),Math.min(r,2,Math.abs(w)/2,Math.abs(h)/2));
      if(fill){ctx.fillStyle=fill;ctx.fill()} if(stroke){ctx.setLineDash(dash||[]);ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke();ctx.setLineDash([])}},
    t(s,x,y,o={}){s=TX(s);ctx.font=`${o.it?'italic ':''}${o.w||600} ${o.s||13}px ${o.m?MONO:FONT}`;ctx.fillStyle=o.c||col.ink;ctx.textAlign=o.a||'center';ctx.textBaseline=o.b||'middle';ctx.fillText(s,x,y)},
    tw(s,o={}){s=TX(s);ctx.font=`${o.w||600} ${o.s||13}px ${o.m?MONO:FONT}`;return ctx.measureText(s).width},
    ln(x1,y1,x2,y2,c,lw=2,dash){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.setLineDash(dash||[]);ctx.lineWidth=lw;ctx.strokeStyle=c;ctx.stroke();ctx.setLineDash([])},
    dot(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()},
    ring(x,y,r,p,c,lw=3){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.lineWidth=lw;ctx.strokeStyle=col.line;ctx.stroke();
      ctx.beginPath();ctx.arc(x,y,r,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp(p,0,1));ctx.strokeStyle=c;ctx.lineCap='round';ctx.stroke();ctx.lineCap='butt'},
    spin(x,y,r,t,c){ctx.beginPath();ctx.arc(x,y,r,t*6,t*6+4.2);ctx.lineWidth=3;ctx.strokeStyle=c;ctx.lineCap='round';ctx.stroke();ctx.lineCap='butt'},
    box(x,y,w,h,label,c,o={}){
      if(o.glow){ctx.save();ctx.shadowColor=c;ctx.shadowBlur=18}
      g.rr(x,y,w,h,10,o.fill||col.panel,c,2,o.dash); if(o.glow)ctx.restore();
      if(o.glow) g.rr(x,y,w,h,10,null,c,2,o.dash);
      g.t(label,x+w/2,y+h/2+(o.sub?-8:0),{c:o.tc||c,w:700,s:o.s||(w<90?12.5:14)});
      if(o.sub) g.t(o.sub,x+w/2,y+h/2+10,{c:o.subc||col.muted,s:11,w:500,m:o.subm});
    },
    pill(x,y,label,bg,fg,o={}){const s=o.s||11.5,w=g.tw(label,{s,w:700,m:o.m})+16,h=s+10,xx=o.a==='left'?x:o.a==='right'?x-w:x-w/2;
      g.rr(xx,y-h/2,w,h,h/2,bg);g.t(label,xx+w/2,y+.5,{c:fg,s,w:700,m:o.m});return w},
    pk(x,y,c,label,r=7){if(label){g.pill(x,y,label,c,col.on,{s:10.5,m:true})}else g.rr(x-r,y-r,r*2,r*2,0,c)},
    x(x,y,s,c){g.ln(x-s,y-s,x+s,y+s,c,3);g.ln(x+s,y-s,x-s,y+s,c,3)},
    clip(s,maxW,o){s=TX(s);if(g.tw(s,o)<=maxW)return s;while(s.length>3&&g.tw(s+'…',o)>maxW)s=s.slice(0,-1);return s+'…'}
  };return g;
}

function Stage(host,H){
  const cv=document.createElement('canvas');cv.setAttribute('role','img');host.appendChild(cv);
  const ctx=cv.getContext('2d');const st={ctx,W:300,H,g:mkG(ctx),paused:false,T:0};
  const fit=()=>{const dpr=Math.min(2,devicePixelRatio||1);st.W=Math.max(200,host.clientWidth);cv.width=st.W*dpr;cv.height=H*dpr;
    cv.style.width=st.W+'px';cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)};
  fit();const ro=new ResizeObserver(fit);ro.observe(host);
  let fn,raf,last=performance.now(),alive=true;const speed=REDUCED?.6:1;
  const loop=now=>{if(!alive)return;let dt=Math.min(.05,(now-last)/1000)*speed;last=now;if(st.paused||document.hidden)dt=0;st.T+=dt;
    readCol();ctx.clearRect(0,0,st.W,H);try{fn(st.T,dt)}catch(e){console.error(e);alive=false}raf=requestAnimationFrame(loop)};
  st.frame=f=>{fn=f;raf=requestAnimationFrame(loop)};
  st.stop=()=>{alive=false;cancelAnimationFrame(raf);ro.disconnect()};
  st.label=s=>cv.setAttribute('aria-label',TX(s));
  return st;
}

<script>
/* ================= architecture diagram engine =================
   A design is data: nodes (x,y in 0..1), edges, zones, and scenarios.
   Scenarios are async functions that move packets hop by hop; each hop adds
   simulated milliseconds (edge + node work), which feed the p50/p99 stats. */
function layout(d,W,H,small){
  const px=small?6:(W<560?8:16),top=small?6:26,bot=small?6:24,cols=d.cols||4;
  const bw=small?clamp((W-2*px)/cols-12,26,74):clamp((W-2*px)/cols-22,64,d.bw||138),bh=small?18:(W<560?44:52);
  const N={};
  d.nodes.forEach(n=>{const w=bw*(n.w||1),h=bh;
    N[n.id]={x:px+w/2+n.x*(W-2*px-w),y:top+h/2+n.y*(H-top-bot-h),w,h}});
  return {N,bw,bh}}
function port(r,tx,ty){const dx=tx-r.x,dy=ty-r.y;if(!dx&&!dy)return[r.x,r.y];
  const hw=r.w/2+3,hh=r.h/2+3,k=Math.min(dx?hw/Math.abs(dx):1e9,dy?hh/Math.abs(dy):1e9);return[r.x+dx*k,r.y+dy*k]}
const fv=(v,S)=>typeof v==='function'?v(S||{}):v;

function paint(g,d,L,W,H,st,small){
  const S=st?st.S:null;
  (d.zones||[]).forEach(z=>{const rs=z.ids.map(id=>L.N[id]),p=small?4:12;
    const x0=Math.min(...rs.map(r=>r.x-r.w/2))-p,x1=Math.max(...rs.map(r=>r.x+r.w/2))+p,y0=Math.min(...rs.map(r=>r.y-r.h/2))-(small?4:16),y1=Math.max(...rs.map(r=>r.y+r.h/2))+(small?4:18);
    const c=col[z.c||'muted'];g.rr(x0,y0,x1-x0,y1-y0,2,alpha(c,.05),alpha(c,.45),1,[4,4]);
    if(!small){const lab=TX(z.l).toUpperCase(),w=g.tw(lab,{s:9.5,m:true,w:600})+10;g.rr(x0+8,y0-7,w,14,0,col.panel);g.t(lab,x0+13,y0,{s:9.5,m:true,w:600,c,a:'left'})}});
  (d.edges||[]).forEach(e=>{const o=e[2]||{};if(o.show&&!(S&&o.show(S)))return;const A=L.N[e[0]],B=L.N[e[1]];
    const P1=port(A,B.x,B.y),P2=port(B,A.x,A.y);
    g.ln(P1[0],P1[1],P2[0],P2[1],o.c?alpha(col[o.c],.7):col.line2,small?1:1.5,o.dash?[5,5]:null);
    const l=fv(o.l,S);if(!small&&l&&W>=600){const mx=(P1[0]+P2[0])/2,my=(P1[1]+P2[1])/2,w=g.tw(l,{s:9.5,m:true,w:600})+8;
      g.rr(mx-w/2,my-7,w,14,0,col.panel);g.t(l,mx,my,{s:9.5,m:true,w:600,c:o.c?col[o.c]:col.muted})}});
  d.nodes.forEach(n=>{const r=L.N[n.id],x=r.x-r.w/2,y=r.y-r.h/2,c=col[n.c]||col.req;
    if(small){if(n.stack)g.rr(x+3,y-3,r.w,r.h,2,col.panel,alpha(c,.35),1);g.rr(x,y,r.w,r.h,2,alpha(c,.16),c,1.2);
      g.t(g.clip(TX(n.s||fv(n.l,{})),r.w-4,{s:8.5,w:600}),r.x,r.y,{s:8.5,w:600,c:col.ink});return}
    const down=S.down.has(n.id),dim=n.dim&&n.dim(S),cc=down||dim?col.muted:c,busy=!down&&n._busy>st.t;
    if(n.stack)for(let k=2;k>=1;k--)g.rr(x+k*4,y-k*4,r.w,r.h,2,col.panel,alpha(cc,.35),1);
    const fs=r.w<100?12:13.5,label=g.clip(fv(n.l,S),r.w-10,{s:fs,w:700}),sub=fv(n.sub,S);
    g.box(x,y,r.w,r.h,label,cc,{s:fs,glow:busy,fill:down?col.panel2:null,dash:down||dim?[4,4]:null});
    if(sub){g.rr(x+2,y+r.h/2+2,r.w-4,r.h/2-4,0,down?col.panel2:col.panel);g.t(g.clip(sub,r.w-10,{s:10.5,w:500}),r.x,y+r.h/2+10,{s:10.5,w:500,c:col.muted})}
    if(n.new&&st.showNew)g.pill(x+r.w-4,y,'NEW',col.ad,col.on,{s:8,m:true,a:'right'});
    if(down){g.rr(x+r.w/2-24,y+r.h/2-9,48,18,0,col.bad);g.t('DOWN',r.x,y+r.h/2,{s:10,m:true,w:700,c:col.on})}
    if(n.cap&&!down){const L2=st.load(n.id),cap=fv(n.cap,S),f=L2/cap,mc=f<.7?col.ad:f<=1?col.slot:col.bad;
      g.rr(x,y+r.h+5,r.w,4,0,col.panel2);g.rr(x,y+r.h+5,r.w*Math.min(1,f),4,0,mc);
      g.t(L2.toFixed(1)+'/s'+(f>1?' · overloaded':''),x,y+r.h+16,{s:9.5,m:true,w:600,c:f>1?col.bad:col.muted,a:'left'})}
    if(n.depth){const k=n.depth(S);for(let i=0;i<Math.min(k,10);i++)g.rr(x+4+i*9,y+r.h+6,7,9,0,col.slot);
      if(k>10)g.t('+'+(k-10),x+98,y+r.h+11,{s:9.5,m:true,c:col.slot,a:'left'});if(k)g.t(k+' waiting',x+r.w,y+r.h+24,{s:9.5,m:true,c:col.slot,a:'right'})}});
  if(S)S.flags.forEach(f=>{if(f.until<st.t)return;const r=L.N[f.id];g.pill(r.x,r.y-r.h/2-12,f.t,col[f.c]||f.c,col.on,{s:10,m:true})});
}

function Arch(s,ui,d,logEl){
  const S=Object.assign({down:new Set(),flags:[],T:0},d.state?d.state():{});
  const NN=Object.fromEntries(d.nodes.map(n=>[n.id,n]));d.nodes.forEach(n=>n._busy=0);
  const flights=[],timers=[],hits={},ticks=[];d.nodes.forEach(n=>hits[n.id]=[]);
  let ok=0,err=0,lat=[],rate=d.rate!=null?d.rate:2,acc=0;
  const after=(sec,fn)=>timers.push({at:s.T+sec,fn});
  const sleep=sec=>new Promise(r=>after(sec,r));
  const load=id=>{const h=hits[id];let c=0;for(let i=h.length-1;i>=0&&h[i]>s.T-2;i--)c++;return c/2};
  const msOf=id=>{const n=NN[id],base=fv(n.ms,S)||0;if(!n.cap)return base;const L=load(id),cap=fv(n.cap,S);return L<=cap?base:base*(1+(L-cap)/cap*3)};
  const E=(d.edges||[]).map(e=>Object.assign({a:e[0],b:e[1]},e[2]||{}));
  const edgeMs=(a,b)=>{const e=E.find(e=>(e.a===a&&e.b===b)||(e.a===b&&e.b===a));return e&&e.ms!=null?e.ms:1};
  const flag=(id,t,c='slot')=>{if(t)S.flags.push({id,t,c,until:s.T+1.8});if(S.flags.length>30)S.flags.splice(0,10)};
  const busy=(id,sec)=>{NN[id]._busy=Math.max(NN[id]._busy,s.T+sec)};
  const fly=(a,b,label,c,o,r)=>new Promise((res,rej)=>{const ms=o.ms!=null?o.ms:edgeMs(a,b);if(r)r.ms+=ms;
    flights.push({a,b,label,c:c||'req',st:s.T,dur:clamp(.36+ms/240,.36,1.15),
      done(f){if(f.lost)return rej(new Error('down'));if(!o.nohit){hits[b].push(s.T);if(hits[b].length>300)hits[b].splice(0,150)}
        const w=o.work!=null?o.work:msOf(b);if(r)r.ms+=w;const sec=clamp(w/160,0,1.4);busy(b,Math.max(.15,sec));after(sec,res)}})});
  const ctx={S,ui,after,sleep,load,flag,busy,NN,
    raw:(a,b,l,c,o={})=>fly(a,b,l,c,o,null),
    set:(id,v)=>{v?S.down.add(id):S.down.delete(id)},
    log:m=>{if(logEl)logEl.innerHTML='<b>'+TX('Now')+'</b>'+TXHTML(m)},
    every:(sec,fn)=>{const tick=()=>{fn();after(sec,tick)};after(sec,tick)},
    tick:fn=>ticks.push(fn)};
  const mkR=quiet=>{const r={ms:0,quiet,ctx,
    hop:(a,b,l,c,o={})=>fly(a,b,quiet?null:l,c,o,r),
    side:(a,b,l,c,o={})=>fly(a,b,quiet?null:l,c,o,null).catch(()=>{}),
    wait:sec=>sleep(sec),
    flag:(id,t,c)=>flag(id,quiet?null:t,c),
    par:fns=>Promise.all(fns.map(fn=>{const b=mkR(quiet);return fn(b).then(()=>b.ms)})).then(a=>{r.ms+=Math.max(0,...a)})};return r};
  const run=(fn,quiet)=>{const r=mkR(quiet);return Promise.resolve().then(()=>fn(r,S)).then(v=>{if(v==='skip')return;if(v===false){err++;return}
    ok++;lat.push(r.ms);if(lat.length>100)lat.shift()},()=>{err++})};
  ctx.run=run;
  const pct=p=>{if(!lat.length)return'–';const a=[...lat].sort((x,y)=>x-y);return Math.round(a[Math.min(a.length-1,Math.floor(p/100*a.length))])+' ms'};
  const sP50=ui.stat('p50 latency','req','–'),sP99=ui.stat('p99 latency','slot','–'),sOk=ui.stat('requests ok','ad'),sErr=ui.stat('failed','bad');
  d.scen.filter(x=>x.btn).forEach(x=>ui.btn(x.btn,()=>{ctx.log(x.log);run(x.fn,false)}));
  ui.slider('Background traffic',0,d.maxRate||10,rate,v=>rate=v,v=>v?v+' req/s':'off');
  if(d.init)d.init(ctx);
  const pool=d.scen.filter(x=>x.w);const tot=pool.reduce((a,x)=>a+x.w,0);
  const pickW=()=>{let k=rnd()*tot;for(const x of pool){k-=x.w;if(k<0)return x}return pool[0]};
  s.label(d.t+': '+TX('Requests moving between')+' '+d.nodes.map(n=>TX(fv(n.l,S))).join(', ')+'.');
  s.frame((t,dt)=>{const {g,W,H}=s;S.T=t;
    for(let i=timers.length-1;i>=0;i--)if(t>=timers[i].at){const f=timers[i].fn;timers.splice(i,1);f()}
    if(pool.length){acc+=dt*rate;while(acc>=1){acc-=1;run(pickW().fn,true)}}
    const L=layout(d,W,H);paint(g,d,L,W,H,{S,t,load,showNew:true});
    for(let pass=0;pass<2;pass++)for(let i=flights.length-1;i>=0;i--){const f=flights[i],p=(t-f.st)/f.dur;
      if(pass===0){if(!f.lost&&p>=.5&&S.down.has(f.b))f.lost=true;if(p>=1){flights.splice(i,1);f.done(f)}continue}
      if((pass===1)!==true)continue;const A=L.N[f.a],B=L.N[f.b];const P1=port(A,B.x,B.y),P2=port(B,A.x,A.y);
      if(f.lost&&p>.5){if(p<.97)g.x(lerp(P1[0],P2[0],.5),lerp(P1[1],P2[1],.5),7,col.bad);continue}
      const q=ez(p),x=lerp(P1[0],P2[0],q),y=lerp(P1[1],P2[1],q),c=col[f.c]||f.c;
      if(f.label)g.pill(x,y,f.label,c,col.on,{s:10.5,m:true});else g.rr(x-4,y-4,8,8,0,c)}
    sP50(pct(50));sP99(pct(99));sOk(ok);sErr(err);ticks.forEach(fn=>fn(t));
  });
  return s}

function thumb(cv,d){const W=cv.clientWidth||240,H=cv.clientHeight||96,dpr=Math.min(2,devicePixelRatio||1);
  cv.width=W*dpr;cv.height=H*dpr;const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);const g=mkG(c);paint(g,d,layout(d,W,H,true),W,H,null,true)}

/* ================= the designs, simplest first ================= */
const pickKey=(keys,wt)=>{let r=rnd()*wt.reduce((a,b)=>a+b,0);for(let i=0;i<keys.length;i++){r-=wt[i];if(r<0)return keys[i]}return keys[0]};
const CLIENT={id:'c',l:'Clients',sub:'dashboard + players',c:'pop',stack:true};
const DESIGNS=[
/* ---------------- Beginner ---------------- */
{id:'single-server',lv:'beginner',t:'Single server',s:'1 box',
 aka:['all-in-one','one VM','VPS','single point of failure'],
 one:`Your app and your database run on the same machine. One thing to deploy, one thing to pay for, and one thing that can take everything down.`,
 like:`A sari-sari store run by one person. They take the orders, grab stuff from the back, and work the cashier. Simple and cheap, until they get sick and the whole store closes.`,
 body:`<p>Almost every project starts here: one virtual machine (an EC2 instance, a droplet, a box under a desk) runs the API code and the database together. A request comes in, the code queries the database over localhost, and the answer goes back. There's no network between the code and the data, so it's simple and surprisingly fast.</p><p>The catch is that everything shares one CPU, one disk and one power supply. A heavy report query slows down every login. A deploy restarts the only copy of the app, so users get errors until it's back. If the disk dies, so does the data, unless someone set up backups and actually tested restoring them.</p>`,
 adds:['One server running the app code and the database together'],
 when:['Prototypes, internal tools and demos','A few hundred users, where a few minutes of downtime is fine','You need to ship this week and learn what users actually do'],
 watch:['<b>Single point of failure</b>: one crash means a full outage','Deploys mean downtime unless you plan around it','The app and the database fight over the same CPU and memory','Backups on the same disk as the data are not backups'],
 good:['Automated daily backups stored somewhere else, plus a restore you have actually tried','A health-check URL and an uptime alert, so you hear about outages before customers do','The database listens on localhost only, never on a public port'],
 ntv:`NTV360 is past this stage: the API, the database (RDS) and the Socket.IO server are separate pieces. You'll still see this design in side projects and small internal tools, and every other design here is compared against it.`,
 terms:['latency','https','timeout','status-codes'],
 words:[['SPOF','Single Point Of Failure: one part that takes everything down when it breaks'],['VM','Virtual Machine: a rented slice of a bigger computer']],
 cap:`Turn up the traffic, then crash the server or deploy. Every request fails while the only copy is down.`,
 h:250,cols:4,rate:2,
 nodes:[{...CLIENT,l:'Browser',sub:'dashboard',x:0,y:.5,stack:false},{id:'app',l:'API code',sub:'same machine',c:'req',x:.58,y:.5,ms:4},{id:'db',l:'MySQL',sub:'same machine',c:'ad',x:1,y:.5,ms:10,cap:8}],
 zones:[{ids:['app','db'],l:'One server · one VM',c:'req'}],
 edges:[['c','app',{l:'HTTPS',ms:25}],['app','db',{l:'localhost',ms:.2}]],
 scen:[{btn:'Load the device list',w:1,log:'The browser asks the server for devices. The API code reads MySQL over localhost, on the same machine, and sends the rows back.',
   fn:async x=>{await x.hop('c','app','GET /devices');await x.hop('app','db','SELECT','ad');await x.hop('db','app','rows','ad');await x.hop('app','c','200 OK','ad')}}],
 init(x){x.ui.toggle('Server crashes',false,v=>{x.set('app',v);x.set('db',v);x.log(v?'The machine is down. Every request fails and nothing can take over.':'Back up. Requests sent while it was down are simply lost; users had to retry.')});
   x.ui.btn('Deploy new version',()=>{x.set('app',true);x.flag('app','restarting…','slot');x.log('A deploy restarts the only copy of the app. For a few seconds nobody can use it.');x.after(3,()=>{x.set('app',false);x.flag('app','v2 running','ad')})},true)}},

{id:'three-tier',lv:'beginner',t:'Three-tier architecture',s:'3 tiers',ntvUses:true,
 aka:['3-tier','n-tier','presentation / logic / data','client–server'],
 one:`Split the system into three layers that each do one job: the screen people use, the API that holds the rules, and the database that keeps the data.`,
 like:`A restaurant. You talk to the waiter (frontend), the waiter talks to the kitchen (API), and only the kitchen goes into the storeroom (database). You never walk into the storeroom yourself.`,
 body:`<p>The <strong>presentation tier</strong> is what people see: the Angular dashboard in a browser, or the app on a player. It never talks to the database directly. The <strong>logic tier</strong> is the API. It checks who you are, validates input, applies the business rules and decides which queries to run. The <strong>data tier</strong> is the database, and only the API can reach it.</p><p>Because each tier only talks to its neighbour, you can change one without breaking the others: redesign the dashboard without touching SQL, or move the database to a bigger server without redeploying the frontend. The cost is that every request crosses the network twice, so what the API does per request (how many queries, how much data) decides how fast the whole thing feels.</p>`,
 adds:['The frontend separated from the API','The database on its own server, reachable only by the API'],

{id:'reverse-proxy',lv:'beginner',t:'Reverse proxy, TLS & static files',s:'Front door',
 aka:['NGINX','ALB','TLS termination','DNS','static hosting','front door'],
 one:`Put one front door in front of the API. It handles HTTPS, serves the frontend files, and forwards API calls to servers the internet can't reach directly.`,
 like:`The guard at the school gate. Everyone comes in through one gate; the guard checks IDs, hands out visitor passes, and points people to the right building. Nobody climbs over the wall.`,
 body:`<p>Before a browser can send anything, <strong>DNS</strong> turns the domain name into an IP address. That address belongs to a <strong>reverse proxy</strong> (NGINX, or a cloud load balancer like AWS ALB), not to the API. The proxy does the TLS handshake, decrypts the request and decides where it goes: files like <code>main.js</code> come straight from disk or storage, and <code>/api/*</code> calls are forwarded to the API over a private network.</p><p>That gives you one place to manage certificates, redirect HTTP to HTTPS, compress responses, add security headers and log every request. The API servers don't need public IP addresses at all, which removes a whole class of attacks.</p>`,
 adds:['DNS pointing at a front door instead of the app server','A reverse proxy that terminates TLS','Static frontend files served without touching the API'],
 when:['Any time something goes on the public internet','You want HTTPS handled in one place, not in every service','The frontend and the API should share one domain (no CORS headaches)'],
 watch:['<b>Expired certificates</b>: every client fails on the same day. Automate renewal.','Proxy timeouts shorter than your slowest endpoint cause mysterious 502s and 504s','Not forwarding the real client IP (<code>X-Forwarded-For</code>), so logs and rate limits only see the proxy','Leaving the API port open to the internet too, which bypasses the proxy'],
 good:['HTTPS everywhere, with plain HTTP redirecting to HTTPS','Certificates renew automatically (ACM, Let\'s Encrypt), with an expiry alert as backup','API servers in a private subnet, reachable only from the proxy','Static files with hashed names (<code>main.3f9a.js</code>) and long cache headers'],
 ntv:`An Angular build is just static files, so a front door can serve them while API calls go on to the .NET API. The backend guide's HTTPS page covers the certificate side: all 6,000 players check the API's certificate, so an expired one cuts every one of them off at once.`,
 terms:['https','cors','timeout','status-codes','anatomy'],
 words:[['DNS','Domain Name System: turns a name into an IP address'],['Reverse proxy','a server that receives requests on behalf of other servers and forwards them'],['TLS termination','decrypting HTTPS at the proxy, so the servers behind it don\'t have to']],

{id:'load-balanced',lv:'mid',t:'Load balancer + stateless servers',s:'Scale out',
 aka:['horizontal scaling','scale out','ALB','health check','stateless','auto scaling'],
 one:`Run several identical copies of the API behind a load balancer, so traffic is shared and one crashed copy doesn't take the system down.`,
 like:`More cashiers at a fast-food counter. A staff member sends each customer to the next free cashier. If one cashier goes on break, the line just moves to the others.`,
 body:`<p>When one API server runs out of CPU you can buy a bigger one (<strong>vertical scaling</strong>) or add more of the same (<strong>horizontal scaling</strong>). Horizontal wins in the long run: there's no ceiling, and losing one copy is a blip instead of an outage. A <strong>load balancer</strong> sits in front, spreads requests across the copies, and sends each one a <strong>health check</strong> every few seconds so it can stop routing to any that stop answering.</p><p>This only works if the servers are <strong>stateless</strong>, meaning any copy can handle any request. If a server keeps logins, uploads or caches in its own memory, the next request may land on a copy that has never heard of you. Keep that state in the token, the database or a shared store like Redis.</p>`,
 adds:['A load balancer in front of the API','Two or more identical API instances','Health checks that pull dead instances out of rotation'],
 when:['One server can no longer handle peak traffic','You need deploys and crashes without downtime','Traffic is spiky and you want servers added automatically (auto scaling)'],
 watch:['Sessions or files kept in one server\'s memory or disk','Health checks that only test "the process is running", not "it can reach the database"','The shared database quietly becoming the new bottleneck','More instances means more connection pools: check the database\'s connection limit'],
 good:['Any instance can serve any request (stateless)','Health checks every few seconds; dead instances removed automatically','Rolling deploys, one instance at a time, so users never notice','At least two instances in two availability zones'],
 ntv:`If the .NET API ever runs as several instances (for example on ECS behind an ALB), JWT auth already helps: the token says who you are, so any instance can check it. Anything kept in server memory, like an in-process cache or a half-finished upload, would need to move to a shared place.`,
 terms:['load-balancer','connection-pool','auth','throughput','cold-start'],

   fn:async(x,S)=>{const u='user'+(1+Math.floor(rnd()*3));await x.hop('c','lb','GET /devices');

{id:'cache-aside',lv:'mid',t:'Cache in front of the database',s:'+ cache',
 aka:['cache-aside','lazy loading','Redis','ElastiCache','cache invalidation','hot data'],
 one:`Keep copies of frequently read data in a fast in-memory store, so most reads never reach the database.`,
 like:`A fridge at home. Instead of going to the market every time you want milk, there's some in the fridge already. Fast to grab. But if it's gone bad, you still have to buy fresh.`,
 body:`<p>Most systems read the same data far more often than they change it. With <strong>cache-aside</strong>, the API checks Redis first. On a <strong>hit</strong> it answers in about a millisecond. On a <strong>miss</strong> it reads the database, stores the result in Redis with a <strong>TTL</strong>, and answers. The next request for the same key is a hit.</p><p>The hard part isn't adding the cache, it's keeping it honest. When the data changes, the cached copy is wrong. The usual rule: write to the database, then <strong>delete</strong> the cache key so the next read fetches the new value. The TTL is your safety net for the times you forget.</p>`,
 adds:['Redis (or similar) between the API and the database','Reads: check the cache, fall back to the database, fill the cache','Writes: update the database, then delete the cached key'],
 when:['The database is busy answering the same reads over and over','Some data is read thousands of times per change (playlists, settings, device configs)','You need faster reads and can live with data a few seconds old'],
 watch:['Forgetting to invalidate on write: users see old data until the TTL runs out','Caching data that\'s rarely read twice: low hit ratio, all cost','A popular key expiring under load, so every request misses at once (thundering herd)','Treating the cache as the source of truth. It can be wiped at any moment.'],
 good:['Hit ratio on a dashboard (aim for 80% or more on hot paths)','Every cached key has a TTL','Writes delete or update the key in the same code path','The app still works, just slower, when the cache is down'],
 ntv:`Player playlists are a natural fit: thousands of players ask for the same few playlists, and they only change when someone edits them in the dashboard. The players' local SQLite copy is already a cache on the device; a server-side cache would protect RDS the same way.`,
 terms:['cache','ttl','thundering-herd','eventual-consistency','percentiles'],
 words:[['Hit / miss','found in the cache / had to go to the database'],['Invalidation','removing a cached copy because the real data changed'],['Hit ratio','hits divided by all reads']],
 cap:`With the cache off, raise the traffic until the database meter turns red. Then switch the cache on. Try forgetting to delete on write.`,

       S.hist.push(0);await x.hop('cache','api','MISS','slot')}
     await x.hop('api','db','SELECT','ad');await x.hop('db','api','rows','ad');
     if(S.on){const v=S.ver[k]||0;x.side('api','cache','SET '+key,'slot').then(()=>{S.st[k]={exp:S.T+S.ttl,v}})}

{id:'read-replicas',lv:'mid',t:'Read replicas',s:'+ replicas',
 aka:['primary / replica','replication lag','read scaling','RDS read replica','read-your-writes'],
 one:`Keep extra copies of the database that only serve reads. The primary takes every write and streams the changes to the replicas.`,
 like:`One teacher writes the lesson on the board, and helpers copy it onto smaller boards around the room so more students can read at once. The copies are a few seconds behind the main board.`,
 body:`<p>A cache helps when the same rows are read again and again. When reads are varied (search, filtered lists, reports), you need more database capacity for reads. A <strong>read replica</strong> is a copy that follows the <strong>primary</strong>: every write lands on the primary, then gets replayed on each replica a moment later. The API sends writes to the primary and spreads reads across the replicas.</p><p>That "moment later" is <strong>replication lag</strong>, usually milliseconds, sometimes seconds under load. A user who saves a form and immediately reloads may read from a replica that hasn't caught up and see their change vanish. The common fix is <em>read-your-own-writes</em>: right after a user writes, send their reads to the primary for a short while.</p>`,
 adds:['One or more replicas following the primary','Writes go to the primary, reads to the replicas','A second, read-only connection string in the API'],
 when:['Database CPU is high and most of the work is reads','Reports and dashboards slow down everyday traffic','You want a warm copy ready to promote if the primary dies'],
 watch:['Replication lag: "I saved it and it disappeared"','Code that writes, then immediately reads back from a replica','Replicas do nothing for write-heavy workloads','A replica is not a backup: a bad DELETE replicates too'],
 good:['Replication lag is monitored and alerted on','Read-after-write paths go to the primary','Heavy reports run on a replica, never on the primary','Promoting a replica has been rehearsed before you need it'],
 ntv:`RDS MySQL supports read replicas in a few clicks. Heavy dashboard pages, like reports across thousands of devices, are good candidates to read from a replica so they don't slow down player check-ins writing to the primary.`,

 one:`Keep big files (videos, images, builds) in object storage, and let a CDN serve copies from servers close to whoever is downloading them.`,
 like:`Instead of everyone travelling to the factory for a bottle of soda, the factory ships crates to sari-sari stores in every barangay. You buy from the one on the corner.`,
 body:`<p>APIs are good at small JSON answers and bad at pushing 80 MB videos. If downloads go through the API, each one ties up an API worker and its bandwidth for seconds or minutes. Instead, store files in <strong>object storage</strong> (S3) and give the client a URL. A <strong>CDN</strong> (CloudFront) sits in front with servers in many cities. It keeps copies of popular files and only goes back to S3, the <strong>origin</strong>, on a miss.</p><p>The API's job shrinks to "here's what to play, and here are the URLs". For private content, the API hands out <strong>signed URLs</strong> that expire, so only the right client can download the file, and only for a while.</p>`,
 adds:['Files live in S3, not on API servers','A CDN serving copies from nearby edge locations','The API returns URLs instead of file bytes'],
 when:['Clients download large or repeated files: video, images, firmware, app builds','Users or devices are spread across a country or the world','File traffic is starting to compete with API traffic'],
 watch:['Streaming files through the API "just for auth". Use signed URLs instead.','Public buckets by accident. Default to private.','Overwriting a file under the same name while the CDN still serves the old copy. Use versioned names.','CDN and transfer costs when every device downloads everything at once'],
 good:['API responses stay small; big bytes never pass through the API','Content files have versioned names and long cache times','Buckets are private; access is through signed URLs or the CDN','High CDN hit ratio, little origin traffic'],
 ntv:`Players across the USA downloading the same ad videos is the textbook case for a CDN. The API decides what each player should play; the bytes should come from the nearest edge, not from the API server. If downloads ever slow the API down, this is the design to compare against.`,
 terms:['cache','ttl','throughput','latency','auth'],
 words:[['CDN','Content Delivery Network: servers in many places that cache your files near users'],['Origin','where the CDN fetches a file it doesn\'t have (here, S3)'],['Signed URL','a link with an expiring signature, so only its holder can download']],
 cap:`Download content a few times and watch the CDN warm up. Then send files through the API and watch its meter and p99.`,
 h:320,cols:4,rate:2,maxRate:6,
 nodes:[{id:'p',l:'Players',sub:'×6,000 · USA',c:'slot',x:0,y:.5,stack:true},{id:'api',l:'.NET API',c:'req',x:.45,y:0,ms:4,cap:6},{id:'db',l:'MySQL',c:'ad',x:1,y:0,ms:8},
  {id:'cdn',l:'CDN edge',sub:'CloudFront',c:'pi',x:.45,y:1,ms:2,new:true,dim:S=>S.via},{id:'s3',l:'Object storage',sub:'S3 bucket',c:'ad',x:1,y:1,ms:6,new:true}],
 edges:[['p','api',{l:'JSON',ms:30}],['api','db'],['p','cdn',{l:'file bytes',ms:8,show:S=>!S.via}],['cdn','s3',{l:'on a miss',ms:40,show:S=>!S.via}],['api','s3',{l:'file bytes',ms:20,dash:true,c:'bad',show:S=>S.via}]],
 state:()=>({via:false,cached:new Set(),origin:0,hit:0,req:0}),
 scen:[{btn:'Download content',w:1,log:'The player asks the API for its playlist and gets back URLs. The video itself comes from the nearest CDN edge, which only goes to S3 if it doesn\'t have a copy.',
   fn:async(x,S)=>{await x.hop('p','api','GET playlist');await x.hop('api','db','SELECT','ad');await x.hop('db','api','rows','ad');await x.hop('api','p',S.via?'playlist':'playlist + URLs','ad');
     const f=pickKey(['ad-1.mp4','ad-2.mp4','promo.mp4','menu.png','ad-3.mp4'],[30,25,20,15,10]);S.req++;
     if(S.via){await x.hop('p','api','GET '+f);await x.hop('api','s3','GET '+f,'ad');await x.hop('s3','api',f+' · 80 MB','ad',{ms:150,work:300});await x.hop('api','p',f+' · 80 MB','ad',{ms:300});return}
     await x.hop('p','cdn','GET '+f,'pi');
     if(S.cached.has(f)){S.hit++;await x.hop('cdn','p','HIT · '+f,'ad',{ms:40});return}
     S.origin++;await x.hop('cdn','s3','MISS · '+f,'slot');await x.hop('s3','cdn',f,'ad',{ms:120});S.cached.add(f);await x.hop('cdn','p',f,'ad',{ms:40})}}],

   x.ui.toggle('Send files through the API',false,v=>{S.via=v;x.log(v?'Every video now flows through the API: S3 to API, API to player. Each download keeps the API busy for its whole length.':'Back to URLs: the API only sends JSON, and the CDN moves the bytes.')});
   x.ui.btn('Clear CDN cache',()=>{S.cached.clear();x.log('A fresh deploy or invalidation empties the edge. The next request for each file goes back to S3.')},true);
   const sA=x.ui.stat('api load','req','0/s'),sO=x.ui.stat('origin fetches','slot'),sC=x.ui.stat('cdn hit ratio','ad','–');
   x.tick(()=>{sA(x.load('api').toFixed(1)+'/s');sO(S.origin);sC(S.hit+S.origin?Math.round(100*S.hit/(S.hit+S.origin))+'%':'–')})}},

{id:'async-queue',lv:'mid',t:'Queue + background workers',s:'+ queue',
 aka:['SQS','job queue','worker','202 Accepted','async processing','visibility timeout'],
 one:`When a request asks for slow work, put a job on a queue, answer right away, and let background workers do the work at their own pace.`,
 like:`Taking a number at the bank. You get your number in seconds and sit down. The tellers call numbers one by one, and you don't have to stand at the window the whole time.`,
 body:`<p>Some work takes seconds or minutes: building a report, transcoding a video, notifying 6,000 devices. If the API does it inside the request, the user stares at a spinner, the request may hit a timeout, and every slow request holds an API worker hostage. Instead, the API writes a small <strong>job</strong> message to a <strong>queue</strong> (SQS, RabbitMQ, a Redis list) and immediately answers <code>202 Accepted</code>. <strong>Workers</strong> pull jobs, do the work and save the result.</p><p>Queues also absorb spikes: 500 jobs arriving at once wait in line instead of crushing the database. And if a worker crashes mid-job, the message reappears after a <strong>visibility timeout</strong> and another worker retries it. That's why jobs must be safe to run twice.</p>`,
 adds:['A queue between the API and the slow work','Worker processes that take jobs and run them','A way to tell the client the job is done (polling or a push)'],
 when:['Anything slower than about a second that the user doesn\'t need to wait for','Bursty work that would overload the database if done all at once','Work that has to survive a crash and be retried'],
 watch:['Jobs that aren\'t idempotent: a retry charges twice or sends two emails','No dead-letter queue, so a broken message retries forever','Nobody watching queue depth while it grows for hours','Losing the "it\'s done" signal, so users never see the result'],
 good:['The API answers 202 with a job ID in milliseconds','Queue depth and age of the oldest message on a dashboard, with alerts','Every job is idempotent (safe to process twice)','Failed jobs land in a dead-letter queue that someone actually checks'],
 ntv:`Proof-of-play reports, bulk playlist pushes and screenshot processing are the kind of work that fits here. The backend guide's "Message queue & async jobs" page covers the 202 pattern in detail.`,
 terms:['async-queue','idempotency','backpressure','timeout','retry-backoff'],
 words:[['Job','a small message describing work to be done'],['Visibility timeout','how long a taken job stays hidden before it\'s retried'],['DLQ','Dead-Letter Queue: where jobs go after failing too many times']],
 cap:`Request a few reports, then switch to doing the work inside the request and compare p99. Make workers crash to see jobs come back.`,
 h:330,cols:4,rate:1,maxRate:4,
 nodes:[{...CLIENT,l:'Dashboard',sub:'',x:0,y:.2,stack:false},{id:'api',l:'.NET API',c:'req',x:.34,y:.2,ms:4},{id:'q',l:'Queue',sub:'SQS',c:'slot',x:.68,y:.2,ms:1,new:true,depth:S=>S.q.length,dim:S=>S.inline},
  {id:'w1',l:'Worker 1',sub:S=>S.wk.w1?'job #'+S.wk.w1:'idle',c:'req',x:1,y:0,ms:2,new:true},{id:'w2',l:'Worker 2',sub:S=>S.wk.w2?'job #'+S.wk.w2:'idle',c:'req',x:1,y:.62,ms:2,new:true},
  {id:'db',l:'MySQL',c:'ad',x:.5,y:1,ms:10}],
 edges:[['c','api',{l:'HTTPS',ms:25}],['api','q',{l:'send job'}],['q','w1'],['q','w2'],['w1','db'],['w2','db'],['api','db',{l:'work inline',dash:true,c:'bad',show:S=>S.inline}]],
 state:()=>({q:[],n:0,inline:false,crash:false,done:0,wk:{w1:0,w2:0}}),
 scen:[{btn:'Request a report',w:1,log:'The API puts a job on the queue and answers 202 Accepted straight away. A free worker picks the job up, builds the report and saves it.',
   fn:async(x,S)=>{const id=++S.n;await x.hop('c','api','POST /reports');
     if(S.inline){await x.hop('api','db','build report…','ad',{work:2400});await x.hop('db','api','report','ad');S.done++;await x.hop('api','c','200 · report','ad');return}
     await x.hop('api','q','job #'+id,'slot');S.q.push(id);await x.hop('api','c','202 · job #'+id,'ad')}}],
 init(x){const S=x.S;
   x.every(.3,()=>['w1','w2'].forEach(w=>{if(S.wk[w]||S.down.has(w)||!S.q.length)return;const id=S.q.shift();S.wk[w]=id;
     x.raw('q',w,'job #'+id,'slot').then(()=>{x.busy(w,1.6);return x.sleep(1.6)}).then(()=>{
       if(S.crash&&rnd()<.4){x.set(w,true);x.flag(w,'crashed on #'+id,'bad');S.wk[w]=0;x.after(1.2,()=>x.set(w,false));x.after(3,()=>{S.q.unshift(id);x.flag('q','#'+id+' visible again','slot')});return}
       return x.raw(w,'db','INSERT result','ad').then(()=>x.raw('db',w,null,'ad')).then(()=>x.raw(w,'q','delete #'+id,'muted',{nohit:true})).then(()=>{S.done++;S.wk[w]=0})}).catch(()=>{S.wk[w]=0})}));
   x.ui.toggle('Do the work inside the request',false,v=>{S.inline=v;x.log(v?'No queue: the API builds the report while the user waits. Every request now takes seconds. Watch p99.':'Back to the queue: the API answers in milliseconds and workers do the heavy part.')});
   x.ui.toggle('Workers crash sometimes',false,v=>{S.crash=v;x.log(v?'Some workers now crash mid-job. The job was never deleted, so after the visibility timeout it reappears and another worker retries it.':'Workers are stable again.')});
   const sQ=x.ui.stat('queue depth','slot'),sD=x.ui.stat('reports done','ad');x.tick(()=>{sQ(S.q.length);sD(S.done)})}},

{id:'offline-first',lv:'mid',t:'Offline-first devices',s:'Offline-first',ntvUses:true,
 aka:['local-first','store and forward','sync','SQLite on device','edge'],
 one:`Devices keep a local copy of what they need and run from it. The network is only for syncing, so an outage pauses updates instead of stopping the device.`,
 like:`Bringing baon to school. Even if the canteen is closed, you still eat lunch. You just restock at home later.`,
 body:`<p>A screen in a store can't go blank because the Wi-Fi dropped or the API is mid-deploy. In an <strong>offline-first</strong> design, the device stores its playlist, media and settings locally (SQLite, files on disk) and plays from that copy. A background <strong>sync</strong> asks the server for changes every so often, ideally only what changed since the last sync, and updates the local copy.</p><p>When a sync fails, the device keeps going with what it has and retries with <strong>backoff</strong> and <strong>jitter</strong>, so 6,000 devices coming back online don't all hit the API in the same second. Anything the device needs to report (plays, errors) is queued locally and uploaded once the connection is back.</p>`,
 adds:['A local database on the device','Playback that reads only local data','Background sync with retry, backoff and jitter'],
 when:['Devices on unreliable networks: stores, vehicles, kiosks','The device must keep working through server outages and deploys','Thousands of devices would otherwise ask the server for everything, all the time'],
 watch:['Sync storms: every device retrying at the same moment after an outage','Local storage filling up with old media','Devices quietly running stale content for weeks without anyone noticing','Clock drift on devices breaking schedules and "changes since" timestamps'],
 good:['Each device reports its last successful sync, and the dashboard shows it','Retries use exponential backoff with jitter','Sync is incremental ("changes since X"), not a full download','Local reports are buffered, uploaded later, and safely de-duplicated'],
 ntv:`This is how NTV360 players already work: each Raspberry Pi keeps a local copy in SQLite and plays from it, so a short API outage doesn't blank the screen. The interesting questions are at the edges: how fast do changes reach devices, and what happens when 6,000 of them reconnect at once?`,
 terms:['retry-backoff','thundering-herd','idempotency','eventual-consistency','ttl'],
 words:[['Sync','bringing the local copy up to date with the server'],['Incremental sync','downloading only what changed since the last sync']],
 cap:`Cause an API outage. With a local copy, playback carries on; without one, it stops. Watch the sync retries back off.`,
 h:300,cols:4,rate:2,maxRate:6,
 nodes:[{id:'pl',l:'Player app',sub:'Node.js',c:'slot',x:0,y:0},{id:'lite',l:'SQLite',sub:'local copy',c:'slot',x:0,y:1,ms:1,new:true,dim:S=>S.direct},{id:'api',l:'.NET API',c:'req',x:.62,y:0,ms:4},{id:'db',l:'MySQL',c:'ad',x:1,y:0,ms:10}],
 zones:[{ids:['pl','lite'],l:'Raspberry Pi',c:'slot'},{ids:['api','db'],l:'AWS',c:'req'}],
 edges:[['pl','lite',{l:'local',ms:.1}],['pl','api',{l:'HTTPS',ms:40}],['api','db']],
 state:()=>({direct:false,last:0,back:2}),
 scen:[{btn:'Play next item',w:1,log:'The player reads the next item from its local SQLite copy. No network involved.',
   fn:async(x,S)=>{if(S.direct){await x.hop('pl','api','GET next item');await x.hop('api','db','SELECT','ad');await x.hop('db','api','row','ad');await x.hop('api','pl','ad-2.mp4','ad');return}
     await x.hop('pl','lite','next item?','slot');await x.hop('lite','pl','ad-2.mp4','ad')}}],
 init(x){const S=x.S;
   const sync=(loop,lbl)=>x.raw('pl','api',lbl?'GET changes?since=…':null,'req').then(()=>x.raw('api','db',null,'ad')).then(()=>x.raw('db','api',null,'ad')).then(()=>x.raw('api','pl',lbl?'3 changes':null,'ad')).then(()=>x.raw('pl','lite',lbl?'UPSERT':null,'slot'))
     .then(()=>{S.last=S.T;S.back=2;if(loop)x.after(4,()=>sync(true))},()=>{if(!loop)return x.flag('pl','sync failed','bad');const w=Math.min(16,S.back)*(.5+rnd()*.5);x.flag('pl','sync failed · retry in '+w.toFixed(1)+' s','bad');S.back*=2;x.after(w,()=>sync(true))});
   x.after(.5,()=>sync(true));
   x.ui.btn('Sync now',()=>{x.log('The player asks for changes since its last sync and writes them into SQLite.');sync(false,true)},true);
   x.ui.toggle('API outage',false,v=>{x.set('api',v);x.set('db',v);x.log(v?(S.direct?'The API is down and the player has no local copy, so playback stops.':'The API is down. Sync fails and backs off (2 s, 4 s, 8 s…), but playback keeps going from SQLite.'):'The API is back. The next retry syncs and the backoff resets.')});
   x.ui.toggle('No local copy',false,v=>{S.direct=v;x.log(v?'Every item is now fetched from the API. Fine until the network or API hiccups.':'Playing from SQLite again.')});
   const sL=x.ui.stat('last sync','slot','–');x.tick(t=>sL(S.last?Math.round(t-S.last)+' s ago':'never'))}},

{id:'realtime-scale',lv:'advanced',t:'Scaling real-time connections',s:'Real-time ×2',
 aka:['Socket.IO','Redis adapter','pub/sub','sticky sessions','WebSocket fan-out','reconnect storm'],
 one:`When one real-time server isn't enough, run several and connect them with pub/sub, so an event sent on one server reaches clients connected to another.`,
 like:`Two classrooms connected by an intercom. A message for a student in the other room gets announced over the intercom, so it reaches them even though you can't see them.`,
 body:`<p>A WebSocket is a long-lived connection to <em>one specific server</em>. With one Socket.IO server, every client is connected to the same place and pushing an event is easy. Add a second server for capacity, and the dashboard may be on server 1 while the player you want to reach is on server 2. Server 1 has no idea that player exists.</p><p>The fix is a shared <strong>pub/sub</strong> channel, usually Redis: each server publishes events there and every server delivers them to its own clients (Socket.IO calls this the Redis adapter). The load balancer also needs <strong>sticky sessions</strong> while a connection is being set up. And when a server dies, all of its clients reconnect at once, so reconnects need random delays (jitter) or the surviving servers get flattened.</p>`,
 adds:['Two or more Socket.IO servers behind a load balancer','Redis pub/sub, so every server sees every event','Client reconnect logic with jitter'],
 when:['One real-time server is near its connection or CPU limit','Real-time needs to survive a server restart','Deploys currently drop every live connection at once'],
 watch:['Events silently lost because the target is connected to another server','Reconnect storms after a crash or deploy','No sticky sessions, so connection setup fails at random','Redis becoming a single point of failure for all real-time traffic'],
 good:['Any server can deliver to any client (the adapter is in place)','Clients reconnect with exponential backoff and jitter','Connections per server on a dashboard','Deploys drain one server at a time'],
 ntv:`NTV360 runs one Socket.IO server relaying between the dashboard and 6,000 players, which is a sensible design at this size. This page shows what the next step looks like if it ever needs a second server, and why the second server is the hard part.`,
 terms:['websocket','thundering-herd','backpressure','retry-backoff','load-balancer'],
 words:[['Pub/sub','publish/subscribe: senders publish to a channel and every subscriber receives it'],['Sticky session','the load balancer keeps sending one client to the same server'],['Adapter','the Socket.IO plug-in that shares events between servers']],
 cap:`Push to Players B with the Redis adapter off, then on. Crash server #2 with and without jitter, and watch server #1's meter.`,
 h:340,cols:4,rate:2,maxRate:6,
 nodes:[{id:'d',l:'Dashboard',sub:'on server #1',c:'pop',x:0,y:.5},{id:'lb',l:'Load balancer',sub:'sticky',c:'pi',x:.27,y:.5,ms:1},

  {id:'pA',l:'Players A',sub:'on server #1',c:'slot',x:1,y:0,stack:true},{id:'pB',l:'Players B',sub:S=>S.bOn==='s1'?'moved to #1':'on server #2',c:'slot',x:1,y:1,stack:true}],
 edges:[['d','lb',{l:'WebSocket',ms:20}],['lb','s1'],['lb','s2'],['s1','rd',{dash:true,c:'slot',l:'pub/sub'}],['s2','rd',{dash:true,c:'slot'}],['s1','pA',{ms:20}],['s2','pB',{ms:20,show:S=>S.bOn==='s2'}],['s1','pB',{ms:20,dash:true,show:S=>S.bOn==='s1'}],['pB','lb',{dash:true,c:'bad',l:'reconnect',show:S=>S.storm}]],
 state:()=>({ad:true,bOn:'s2',jit:true,lost:0,storm:false}),
 scen:[{btn:'Push to Players A',w:1,log:'The dashboard and Players A are on the same server, so it can deliver directly.',
   fn:async x=>{await x.hop('d','lb','push:playlist','pi');await x.hop('lb','s1','push:playlist','pi');await x.hop('s1','pA','playlist:update','pi')}},
  {btn:'Push to Players B',w:1,log:'Players B are connected to server #2. Server #1 publishes the event to Redis; server #2 is subscribed and delivers it.',
   fn:async(x,S)=>{await x.hop('d','lb','push:playlist','pi');await x.hop('lb','s1','push:playlist','pi');
     if(S.bOn==='s1'){await x.hop('s1','pB','playlist:update','pi');return}
     if(!S.ad){S.lost++;x.ctx.flag('s1','Players B? not connected here','bad');return false}
     await x.hop('s1','rd','PUBLISH','slot');await x.hop('rd','s2','message','slot');await x.hop('s2','pB','playlist:update','pi')}}],
 init(x){const S=x.S;
   x.ui.toggle('Redis adapter',true,v=>{S.ad=v;x.log(v?'Servers share events through Redis again.':'Without the adapter each server only knows its own clients. Pushes to Players B vanish without an error.')});
   x.ui.toggle('Server #2 crashes',false,v=>{x.set('s2',v);if(!v){x.log('Server #2 is back, but Players B stay on #1 until they reconnect for some other reason. Load doesn\'t rebalance by itself.');return}
     S.bOn='s1';S.storm=true;x.after(S.jit?4.5:1.2,()=>S.storm=false);
     x.log(S.jit?'Server #2 died. Its players reconnect with random delays spread over a few seconds, so server #1 absorbs them.':'Server #2 died and every one of its players reconnects at the same instant. Server #1 is flooded.');
     for(let i=0;i<26;i++)x.after(S.jit?rnd()*4:rnd()*.25,()=>x.raw('pB','lb',i===0?'reconnect':null,'bad',{ms:20}).then(()=>x.raw('lb','s1',null,'bad')).catch(()=>{}))});
   x.ui.toggle('Jitter on reconnect',true,v=>S.jit=v);
   const sL=x.ui.stat('events lost','bad'),s1=x.ui.stat('server #1 load','pi','0/s');x.tick(()=>{sL(S.lost);s1(x.load('s1').toFixed(1)+'/s')})}},

{id:'gateway-services',lv:'advanced',t:'API gateway + services',s:'Services',
 aka:['microservices','API gateway','database per service','fan-out','BFF','service mesh'],
 one:`Split the backend into services that each own one area of the business and its data, with a gateway in front that handles the shared chores.`,
 like:`A mall. One main entrance with a guard, then separate shops that each run their own business and their own stockroom. If one shop closes early, the rest of the mall stays open.`,
 body:`<p>As the team and the codebase grow, one API gets hard to change safely: everyone deploys the same thing, and one slow feature can drag down the rest. Splitting by business area (devices, content, reports) gives each <strong>service</strong> its own code, deploys and database. An <strong>API gateway</strong> in front does what every request needs: checking the token, rate limiting, and routing <code>/devices/*</code> to one service and <code>/content/*</code> to another.</p><p>The price: a page that used to be one database query may now need answers from three services over the network. It's only as fast as the slowest one (tail latency), and if one is down you need a plan: timeouts, and a partial answer instead of an error. Microservices solve team and deploy problems. They rarely make anything faster.</p>`,
 adds:['A gateway doing auth, rate limiting and routing','Separate services per business area','Each service owning its own database'],
 when:['Several teams keep stepping on each other in one codebase','Parts of the system have very different load or release needs','A failure in one area (reports) must not take down another (playback)'],
 watch:['Splitting too early: a "distributed monolith" with all the costs and none of the gains','Fan-out requests that are only as fast as the slowest service','Services reading each other\'s databases directly','No timeouts between services, so one hang spreads everywhere'],
 good:['Every service-to-service call has a timeout and a fallback','Rate limits at the gateway, answering 429 with Retry-After','Each service deploys on its own','A request ID passed along, so one request can be traced across services'],
 ntv:`NTV360's single .NET API is the right call at its size; this design is here so you recognise it when you meet it. A realistic first step would be pulling out one heavy area, such as reporting, so it can never slow down player check-ins.`,
 terms:['rate-limiting','tail-latency','timeout','circuit-breaker','auth'],
 words:[['Microservice','a small service that owns one business area and its data'],['API gateway','the single entry point that routes requests to services'],['Fan-out','one request calling several services in parallel']],
 cap:`Open the home screen while the content service is slow, then add a timeout. Burst 20 requests to hit the rate limit.`,
