  ["The same line is changed on two branches. Watch Git mark the conflict, then pick a resolution.", "Parehong linya ang binago sa dalawang branch. Tingnan ang conflict markers, tapos pumili ng resolution.", "Parehas nga linya ang giusab sa duha ka branch. Tan-awa ang conflict markers, dayon pili og resolution."],
  ["Toggle between merge and rebase and compare the shape of the history.", "Lumipat sa merge at rebase. Ikumpara ang hugis ng history.", "Balhin sa merge ug rebase. Ikumpara ang porma sa history."],
  ["Stash your work, handle the interruption, then pop it back.", "I-stash ang trabaho, asikasuhin ang biglang singit, tapos i-pop pabalik.", "I-stash ang trabaho, atimana ang kalit nga singit, dayon i-pop balik."],
  ["Pick the fix from the feature branch and copy it onto main.", "Piliin ang fix sa feature branch at kopyahin papunta sa main.", "Pilia ang fix sa feature branch ug kopyaha padulong sa main."],
  ["Tag each release and watch the version number follow the kind of change.", "Lagyan ng tag ang bawat release. Tingnan kung paano sumusunod ang version number sa klase ng change.", "Butangi og tag ang matag release. Tan-awa unsaon pagsunod sa version number sa klase sa change."],
  ["Clone the repo, then commit on both sides. Nothing syncs by itself.", "I-clone ang repo at mag-commit sa magkabilang panig. Walang kusang nagsi-sync.", "I-clone ang repo ug pag-commit sa duha ka bahin. Walay automatic nga sync."],
  ["Push, get rejected because a teammate pushed first, pull, then push again.", "Mag-push. Nauna ang teammate, kaya rejected. Mag-pull, tapos mag-push ulit.", "Pag-push. Nauna ang teammate, mao nga rejected. Pag-pull, dayon pag-push balik."],
  ["fetch only moves origin/main. Merging is what moves your main.", "origin/main lang ang gagalaw sa fetch. Merge ang magpapagalaw sa sarili mong main.", "origin/main ra ang molihok sa fetch. Merge ang mopalihok sa imong kaugalingong main."],
  ["Commit on both sides and watch the ahead and behind counters.", "Mag-commit sa magkabilang panig. Bantayan ang ahead at behind counters.", "Pag-commit sa duha ka bahin. Bantayi ang ahead ug behind counters."],
  ["Follow a branch through checks, a requested change, approval, and merge.", "Sundan ang branch sa checks, requested change, approval, at merge.", "Sunda ang branch sa checks, requested change, approval, ug merge."],
  ["A teammate pushed while you were rebasing. Compare --force with --force-with-lease.", "Nag-push ang teammate habang nagre-rebase ka. Ikumpara ang --force at --force-with-lease.", "Nag-push ang teammate samtang nag-rebase ka. Ikumpara ang --force ug --force-with-lease."],
  ["Switch strategies and compare the shape of the history.", "Magpalit ng strategy at ikumpara ang hugis ng history.", "Pag-ilis og strategy ug ikumpara ang porma sa history."],
  ["Commit with a lint error, fix it, then push and watch the pipeline.", "Mag-commit na may lint error. Ayusin, tapos mag-push at panoorin ang pipeline.", "Pag-commit nga naay lint error. Ayuha, dayon pag-push ug tan-awa ang pipeline."],
  ["Revert the bad commit. Nothing disappears; a new commit cancels it out.", "I-revert ang sirang commit. Walang mabubura; bagong commit ang babawi sa changes nito.", "I-revert ang gubang commit. Walay mapapas; bag-ong commit ang mobawi sa changes niini."],
  ["Pick a mode and reset two commits back. Watch where the changes end up.", "Pumili ng mode at mag-reset nang dalawang commit pabalik. Tingnan kung saan napunta ang changes.", "Pili og mode ug pag-reset og duha ka commit pabalik. Tan-awa asa napunta ang changes."],
  ["Squash four messy commits into one clean commit.", "I-squash ang apat na magulong commits para maging isang maayos na commit.", "I-squash ang upat ka gubot nga commits para mahimong usa ka tarong nga commit."],
  ["Reset two commits away, then find them in the reflog and bring them back.", "Mag-reset nang dalawang commit pabalik. Hanapin sila sa reflog at ibalik.", "Pag-reset og duha ka commit pabalik. Pangitaa sila sa reflog ug ibalik."],
  ["Check out an old commit, commit there, and see what happens when you leave.", "I-checkout ang lumang commit at mag-commit doon. Tingnan ang mangyayari kapag umalis ka.", "I-checkout ang karaang commit ug pag-commit didto. Tan-awa unsay mahitabo kung mobiya ka."],
  ["Watch the search halve the range at each step until one commit is left.", "Kalahati ng range ang natitira kada step, hanggang isang commit na lang.", "Katunga sa range ang mahibilin kada step, hangtod usa na lang ka commit."],
  ["Edit one file and watch new hashes ripple up from the blob to the commit. Unchanged files are reused.", "I-edit ang isang file. Susunod ang bagong hashes mula blob hanggang commit. Gagamitin ulit ang files na hindi nagbago.", "I-edit ang usa ka file. Mosunod ang bag-ong hashes gikan sa blob hangtod commit. Gamiton balik ang files nga wala mausab."],
  ["Each line is decided by comparing both sides to the base.", "Ikinukumpara ang magkabilang panig sa base para magdesisyon sa bawat linya.", "Ikumpara ang duha ka bahin sa base para magdesisyon sa matag linya."],
  ["You rewrite a shared branch. See what happens to your teammate's copy.", "I-rewrite ang shared branch. Tingnan ang epekto sa kopya ng teammate mo.", "I-rewrite ang shared branch. Tan-awa ang epekto sa kopya sa imong teammate."],
  ["The library moves on, but the parent keeps using the pinned commit until you update the pointer.", "May bago nang library version, pero pinned commit pa rin ang gamit ng parent hanggang i-update ang pointer.", "Naay bag-ong library version, pero pinned commit gihapon ang gamit sa parent hangtod i-update ang pointer."],
  ["HEAD (detached)", "HEAD (walang branch)", "HEAD (walay branch)"],
  ["your repository", "repository mo", "imong repository"],
  ["A repository with one commit. main points at it.", "Isang commit sa repo. Dito nakaturo ang main.", "Usa ka commit sa repo. Diri nagtudlo ang main."],
  ["A new commit points back to the previous one, its parent. main moves forward to it.", "Nakaturo ang bagong commit sa parent nito. Susunod ang main sa bagong commit.", "Nagtudlo ang bag-ong commit sa iyang parent. Mosunod ang main sa bag-ong commit."],
  ["Each commit gets its own hash, shown under the square.", "May sariling hash bawat commit, sa ilalim ng square.", "Naay kaugalingong hash matag commit, ilalom sa square."],
  ["Small commits with clear messages make history easy to read later.", "Maliit na commits at malinaw na messages: madaling basahin ang history mamaya.", "Gagmay nga commits ug klarong messages: sayon basahon ang history unya."],
  ["The chain of parents is your history. git log walks it backwards from main.", "History ang chain ng parents. Pabalik itong sinusundan ng git log mula sa main.", "History ang chain sa parents. Pabalik ning subayon sa git log gikan sa main."],
  ["HEAD → main means: you are on main, at its latest commit.", "HEAD → main: nasa main ka, sa pinakabago nitong commit.", "HEAD → main: naa ka sa main, sa pinakabag-o niini nga commit."],
  ["HEAD points at main, so the new commit moves main, and HEAD moves with it.", "Nasa main ang HEAD. Gagalaw ang main sa bagong commit, kasama ang HEAD.", "Naa sa main ang HEAD. Molihok ang main sa bag-ong commit, apil ang HEAD."],
  ["HEAD now points at feature. Same commit, different branch.", "Sa feature na ang HEAD. Parehong commit, ibang branch.", "Sa feature na ang HEAD. Parehas nga commit, laing branch."],
  ["Only feature (and HEAD with it) moves. main stays put.", "Feature at HEAD lang ang gagalaw. Nananatili ang main.", "Feature ug HEAD ra ang molihok. Magpabilin ang main."],
  ["HEAD~1 from here means \"one commit before HEAD\".", "HEAD~1: isang commit bago ang HEAD.", "HEAD~1: usa ka commit sa wala pa ang HEAD."],
  ["HEAD jumps back to main, and your files change to match main’s commit.", "Balik sa main ang HEAD. Tutugma ang files sa commit ng main.", "Balik sa main ang HEAD. Motakdo ang files sa commit sa main."],
  ["main with two commits.", "Dalawang commits sa main.", "Duha ka commits sa main."],
  ["A new label on the same commit. Nothing else changed, and you are still on main.", "Bagong label, parehong commit. Nasa main ka pa rin.", "Bag-ong label, parehas nga commit. Naa ka gihapon sa main."],
  ["Now HEAD points at the new branch.", "Sa bagong branch na ang HEAD.", "Sa bag-ong branch na ang HEAD."],
  ["Commits on the branch move only that branch.", "Sariling branch lang ang gagalaw sa commits nito.", "Kaugalingong branch ra ang molihok sa commits niini."],
  ["main is still back where you branched off.", "Nandoon pa rin ang main sa pinanggalingan ng branch.", "Naa gihapon ang main sa gigikanan sa branch."],
  ["Back on main. Your scheduler work is safe on its branch.", "Balik sa main. Safe ang scheduler work sa sariling branch.", "Balik sa main. Safe ang scheduler work sa kaugalingong branch."],
  ["main and feature/scheduler now point at two separate lines of work.", "Magkaibang linya ng trabaho na ang main at feature/scheduler.", "Lahi nang linya sa trabaho ang main ug feature/scheduler."],
  ["You are on main. The folder on the right shows what’s on disk.", "Nasa main ka. Nasa kanang folder ang files sa disk.", "Naa ka sa main. Naa sa tuong folder ang files sa disk."],
  ["my-project/  (on disk)", "my-project/  (nasa disk)", "my-project/  (naa sa disk)"],
  ["scheduler.ts appears and app.ts changes to the feature version: the folder now matches feature.", "Lumabas ang scheduler.ts; naging feature version ang app.ts. Tugma na ang folder sa feature.", "Nigawas ang scheduler.ts; nahimong feature version ang app.ts. Takdo na ang folder sa feature."],
  ["scheduler.ts disappears from disk. It isn’t deleted; it lives in feature’s commits.", "Nawala sa disk ang scheduler.ts, pero hindi deleted. Nasa feature commits pa rin.", "Nawala sa disk ang scheduler.ts, pero dili deleted. Naa pa sa feature commits."],
  ["-c creates the branch and switches to it in one step.", "-c: gumawa ng branch at lumipat dito, isang command lang.", "-c: paghimo og branch ug balhin niini, usa ra ka command."],
  ["Work on hotfix changes only hotfix.", "Hotfix lang ang binabago ng trabaho sa hotfix.", "Hotfix ra ang usbon sa trabaho sa hotfix."],
  ["Each switch rewrites the folder to that branch’s latest commit.", "Bawat switch, tutugma ang folder sa latest commit ng branch.", "Matag switch, motakdo ang folder sa latest commit sa branch."],
  ["feature has two commits. main hasn’t moved since feature branched off.", "Dalawang commits sa feature. Hindi pa gumagalaw ang main mula nang mag-branch.", "Duha ka commits sa feature. Wala pa molihok ang main sukad nag-branch."],
  ["Fast-forward: main had nothing new, so Git just slides main up to feature. No new commit.", "Fast-forward: walang bago sa main, kaya iuusog lang sa feature. Walang bagong commit.", "Fast-forward: walay bag-o sa main, mao nga ibalhin ra sa feature. Walay bag-ong commit."],
  ["Start another branch.", "Gumawa ng isa pang branch.", "Paghimo og laing branch."],
  ["Work on feature/b...", "Trabaho sa feature/b…", "Trabaho sa feature/b…"],
  ["...while main also gets a new commit. Now both sides have moved.", "…may bagong commit din sa main. Parehong panig gumalaw na.", "…naay bag-ong commit pud sa main. Duha ka bahin nilihok na."],
  ["No fast-forward possible, so Git makes a merge commit with two parents, tying both lines together.", "Hindi puwedeng fast-forward. Bagong merge commit na may dalawang parents ang pagdudugtong sa kanila.", "Dili pwede fast-forward. Bag-ong merge commit nga naay duha ka parents ang modugtong nila."],
  ["Use rebase instead of merge", "Rebase, imbes na merge", "Rebase, imbes nga merge"],
  ["You’re on feature. main moved on with m1 and m2 since you branched.", "Nasa feature ka. Nadagdagan ng m1 at m2 ang main mula nang mag-branch ka.", "Naa ka sa feature. Nadugangan og m1 ug m2 ang main sukad nag-branch ka."],
  ["Your commits are replayed on top of main as new commits with new hashes. The dashed ones are the old copies, left behind.", "Uulitin ang commits sa ibabaw ng main: bagong commits, bagong hashes. Dashed ang lumang kopya.", "Balikon ang commits ibabaw sa main: bag-ong commits, bag-ong hashes. Dashed ang karaang kopya."],
  ["Switch to main to bring the work in.", "Lumipat sa main para isama ang trabaho.", "Balhin sa main para iapil ang trabaho."],
  ["A fast-forward: history is one straight line, with no merge commit.", "Fast-forward: isang tuwid na history, walang merge commit.", "Fast-forward: usa ka tul-id nga history, walay merge commit."],
  ["Merging main into feature adds a merge commit on feature. Your original commits keep their hashes.", "Merge ng main sa feature: bagong merge commit. Pareho pa rin ang hashes ng original commits.", "Merge sa main ngadto sa feature: bag-ong merge commit. Parehas gihapon ang hashes sa original commits."],
  ["History shows both lines and where they joined. Accurate, but busier than a rebase.", "Kita ang dalawang linya at ang pinagdugtungan. Mas maraming linya kaysa rebase.", "Makita ang duha ka linya ug ang gidugtongan. Mas daghang linya kaysa rebase."],
  ["feature has a crash fix that main needs now, plus unfinished work it doesn’t want.", "May crash fix sa feature na kailangan ng main, kasama ang work na hindi pa ready.", "Naay crash fix sa feature nga kinahanglan sa main, uban sa work nga dili pa ready."],
  ["Find the hash of the fix you need.", "Hanapin ang hash ng fix na kailangan mo.", "Pangitaa ang hash sa fix nga kinahanglan nimo."],
  ["Just that one commit is copied onto main, as a new commit with a new hash. The wip commits stay on feature.", "Isang commit lang ang kinopya sa main, may bagong hash. Naiwan ang WIP sa feature.", "Usa ra ka commit ang gikopya sa main, naay bag-ong hash. Nabilin ang WIP sa feature."],
  ["The fix can ship from main without waiting for the rest of feature.", "Puwede nang i-ship ang fix sa main, walang hintay sa buong feature.", "Pwede nang i-ship ang fix sa main, walay hulat sa tibuok feature."],
  ["Each release gets a tag on the exact commit that shipped.", "Bawat release, may tag sa eksaktong commit na na-ship.", "Matag release, naay tag sa eksaktong commit nga na-ship."],
  ["Tag the commit you released. The tag will never move.", "I-tag ang released commit. Dito mananatili ang tag.", "I-tag ang released commit. Diri magpabilin ang tag."],
  ["A bug fix...", "Bug fix…", "Bug fix…"],
  ["...bumps PATCH: 1.0.0 → 1.0.1.", "…taas ng PATCH: 1.0.0 → 1.0.1.", "…saka sa PATCH: 1.0.0 → 1.0.1."],
  ["A new feature that breaks nothing...", "Bagong feature, walang nasira…", "Bag-ong feature, walay naguba…"],
  ["...bumps MINOR and resets PATCH: 1.1.0.", "…taas ng MINOR, reset ng PATCH: 1.1.0.", "…saka sa MINOR, reset sa PATCH: 1.1.0."],
  ["A breaking change (old players can’t read the new format)...", "Breaking change: hindi mabasa ng lumang players ang bagong format…", "Breaking change: dili mabasa sa karaang players ang bag-ong format…"],
  ["...bumps MAJOR: 2.0.0.", "…taas ng MAJOR: 2.0.0.", "…saka sa MAJOR: 2.0.0."],
  ["Tags stay on your machine until you push them.", "Nasa machine mo lang ang tags hanggang i-push.", "Naa ra sa imong machine ang tags hangtod i-push."],
  ["your laptop", "laptop mo", "imong laptop"],
  ["no repository yet", "wala pang repository", "wala pay repository"],
  ["origin has the team’s repository. Your laptop has nothing yet.", "Nasa origin ang team repo. Wala pa sa laptop mo.", "Naa sa origin ang team repo. Wala pa sa imong laptop."],
  ["You get the whole history, not just the latest files. origin/main records where origin’s main was.", "Buong history ang kopya mo. origin/main ang record ng huling alam mong main sa origin.", "Tibuok history ang imong kopya. origin/main ang record sa katapusang nailhan nimong main sa origin."],
  ["This commit exists only on your laptop.", "Sa laptop mo lang ang commit na 'to.", "Sa imong laptop ra ning commit."],
  ["(meanwhile, a teammate pushes to origin)", "(nag-push ang teammate sa origin)", "(nag-push ang teammate sa origin)"],
  ["This one exists only on origin. Neither copy knows about the other’s new commit until you push, fetch, or pull.", "Sa origin lang ang commit na 'to. Hindi pa alam ng bawat kopya ang bago sa kabila hanggang push, fetch, o pull.", "Sa origin ra ning commit. Wala pa kahibalo ang matag kopya sa bag-o sa pikas hangtod push, fetch, o pull."],
  ["You and origin start in sync.", "Magka-sync kayo ng origin sa simula.", "Magka-sync mo sa origin sa sinugdan."],
  ["A commit on your laptop.", "Isang commit sa laptop mo.", "Usa ka commit sa imong laptop."],
  ["(a teammate pushes \"fix login\" first)", "(naunang nag-push ang teammate ng “fix login”)", "(naunang nag-push ang teammate og “fix login”)"],
  ["Origin moved on without you knowing.", "Gumalaw ang origin nang hindi mo alam.", "Nilihok ang origin nga wala ka kahibalo."],
  ["Rejected: origin has a commit you don’t have. Pushing would erase it, so Git refuses.", "Rejected: may commit ang origin na wala sa iyo. Mabubura sa branch kung i-push, kaya ayaw ng Git.", "Rejected: naay commit ang origin nga wala sa imoha. Mapapas sa branch kung i-push, mao nga dili mosugot ang Git."],
  ["pull = fetch + merge. Their commit comes down, and a merge commit ties both together.", "pull = fetch + merge sa demo: kukunin ang commit nila at pagdudugtungin ang dalawang history.", "pull = fetch + merge sa demo: kuhaon ang commit nila ug dugtongon ang duha ka history."],
  ["Now your history contains theirs, so the push is accepted.", "Kasama na ang history nila sa iyo. Accepted na ang push.", "Apil na ang history nila sa imoha. Accepted na ang push."],
  ["In sync with origin.", "Ka-sync ang origin.", "Ka-sync ang origin."],
  ["(a teammate pushes two commits)", "(nag-push ang teammate ng dalawang commits)", "(nag-push ang teammate og duha ka commits)"],
  ["origin/main on your laptop still shows where origin was at your last sync.", "Huling sync pa rin ang alam ng origin/main sa laptop mo.", "Katapusang sync gihapon ang nailhan sa origin/main sa imong laptop."],
  ["The new commits are downloaded and origin/main moves. Your main and your files are untouched.", "Na-download ang bagong commits at gumalaw ang origin/main. Hindi nagbago ang main o files mo.", "Na-download ang bag-ong commits ug nilihok ang origin/main. Wala mausab ang main o files nimo."],
  ["You can review what’s incoming before taking it.", "Puwede mong i-review ang papasok bago isama.", "Pwede nimong i-review ang mosulod sa dili pa iapil."],
  ["Now main moves (a fast-forward). fetch + merge is exactly what pull does.", "Gagalaw na ang main: fast-forward. fetch + merge ang pull sa demo; puwede ring naka-configure sa rebase ang pull.", "Molihok na ang main: fast-forward. fetch + merge ang pull sa demo; pwede pud naka-configure sa rebase ang pull."],
  ["(diverged)", "(magkaibang direksyon)", "(lain nga direksyon)"],
  ["You’re about to start a feature branch.", "Magsisimula ka ng feature branch.", "Magsugod ka og feature branch."],
  ["A new local branch with one commit. It isn’t paired with anything on origin yet.", "Bagong local branch, isang commit. Wala pang partner sa origin.", "Bag-ong local branch, usa ka commit. Wala pay partner sa origin."],
  ["Git doesn’t know where to push: \"The current branch feature/x has no upstream branch.\"", "Walang upstream ang feature/x. Hindi alam ng Git kung saan magpu-push.", "Walay upstream ang feature/x. Wala kahibalo ang Git asa mo-push."],
  ["-u pushes and pairs your branch with origin/feature/x. Now Git can count ahead and behind.", "-u: push at pair sa origin/feature/x. Mabibilang na ang ahead at behind.", "-u: push ug pair sa origin/feature/x. Maihap na ang ahead ug behind."],
  ["One commit to push: ahead by 1.", "Isang commit na ipu-push: ahead 1.", "Usa ka commit nga i-push: ahead 1."],
  ["(a teammate pushes to feature/x) && git fetch", "(nag-push ang teammate sa feature/x) && git fetch", "(nag-push ang teammate sa feature/x) && git fetch"],
  ["After fetching, you’re also behind by 1. Ahead and behind at once means diverged.", "Pagkatapos ng fetch, behind 1 ka rin. Ahead at behind: diverged.", "Human sa fetch, behind 1 ka pud. Ahead ug behind: diverged."],
  ["Your f2 is replayed on top of their t1. Ahead 1, behind 0.", "Inulit ang f2 sa ibabaw ng t1 nila. Ahead 1, behind 0.", "Gibalik ang f2 ibabaw sa t1 nila. Ahead 1, behind 0."],
  ["In sync: ahead 0, behind 0.", "Ka-sync na: ahead 0, behind 0.", "Ka-sync na: ahead 0, behind 0."],
  ["Open", "Bukas", "Abli"],
  ["Checks running…", "Tumatakbo ang checks…", "Nagdagan ang checks…"],
  ["✓ All checks passed", "✓ Pumasa lahat ng checks", "✓ Nipasar tanang checks"],
  ["Changes requested", "May hiniling na changes", "Naay gipangayong changes"],
  ["\"Handle an empty playlist, please.\"", "“Paki-handle ang empty playlist.”", "“Palihog i-handle ang empty playlist.”"],
  ["1 new commit pushed · checks ✓", "1 bagong commit na-push · checks ✓", "1 bag-ong commit na-push · checks ✓"],
  ["Approved", "Aprubado", "Aprubado"],
  ["✓ Approved by a teammate", "✓ Aprubado ng teammate", "✓ Aprubado sa teammate"],
  ["Merged", "Na-merge", "Na-merge"],
  ["Merged into main", "Na-merge sa main", "Na-merge sa main"],
  ["origin’s main. You’re about to push a feature branch.", "Main ng origin. Magpu-push ka ng feature branch.", "Main sa origin. Mo-push ka og feature branch."],
  ["Files changed", "Nabagong files", "Nausab nga files"],
  ["Reviewers", "Mga reviewer", "Mga reviewer"],
  ["Your branch, with two commits, is now on origin.", "Nasa origin na ang branch mo, may dalawang commits.", "Naa sa origin ang imong branch, naay duha ka commits."],
  ["(on GitHub/GitLab: open a pull request)", "(buksan ang PR sa GitHub/GitLab)", "(ablihi ang PR sa GitHub/GitLab)"],
  ["The PR page shows the diff and starts the automated checks.", "Kita ang diff sa PR at magsisimula ang automatic checks.", "Makita ang diff sa PR ug magsugod ang automatic checks."],
  ["(CI finishes)", "(tapos ang CI)", "(human ang CI)"],
  ["Build and tests pass.", "Pumasa ang build at tests.", "Nipasar ang build ug tests."],
  ["A reviewer asks for a change on one line.", "May pinapabago ang reviewer sa isang linya.", "Naay gipausab ang reviewer sa usa ka linya."],
  ["Pushing to the same branch updates the PR. No new PR needed.", "Push sa parehong branch, updated na ang PR. Hindi kailangan ng bago.", "Push sa parehas nga branch, updated na ang PR. Dili kinahanglan og bag-o."],
  ["Approved.", "Aprubado na.", "Aprubado na."],
  ["(press \"Merge pull request\")", "(pindutin ang “Merge pull request”)", "(pislita ang “Merge pull request”)"],
  ["The branch is merged into main with a merge commit.", "Na-merge sa main gamit ang merge commit.", "Na-merge sa main gamit ang merge commit."],
  ["Use --force-with-lease", "Gumamit ng --force-with-lease", "Gamit og --force-with-lease"],
  ["feature (f1, f2) is on origin and on your laptop. main has moved on with m1.", "Nasa origin at laptop mo ang feature (f1, f2). May m1 na ang main.", "Naa sa origin ug laptop nimo ang feature (f1, f2). Naay m1 na ang main."],
  ["(a teammate pushes t1 to feature)", "(nag-push ang teammate ng t1 sa feature)", "(nag-push ang teammate og t1 sa feature)"],
  ["You haven’t fetched, so you don’t know about t1.", "Hindi ka pa nag-fetch, kaya hindi mo alam ang t1.", "Wala pa ka nag-fetch, mao nga wala ka kahibalo sa t1."],
  ["You rebase feature onto main. f1 and f2 become new commits.", "Rebase ng feature sa main. Bagong commits na ang f1 at f2.", "Rebase sa feature ngadto sa main. Bag-ong commits na ang f1 ug f2."],
  ["Rejected: your feature no longer contains origin’s feature.", "Rejected: wala na sa feature mo ang feature history ng origin.", "Rejected: wala na sa imong feature ang feature history sa origin."],
  ["Refused, safely: origin’s feature isn’t where your origin/feature says it was. Someone else pushed.", "Safe na rejection: gumalaw ang origin mula sa huling alam mo. May nag-push na iba.", "Safe nga rejection: nilihok ang origin sukad sa katapusang nailhan nimo. Naay laing nag-push."],
  ["Fetch t1 and put your work on top of it, so it isn’t lost.", "I-fetch ang t1 at ilagay ang work mo sa ibabaw para hindi mawala.", "I-fetch ang t1 ug ibutang imong work ibabaw para dili mawala."],
  ["Accepted. The branch was rewritten, and the teammate’s change is still in it.", "Accepted. Na-rewrite ang branch, pero kasama pa rin ang change ng teammate.", "Accepted. Na-rewrite ang branch, pero apil gihapon ang change sa teammate."],
  ["Accepted, and origin now matches your laptop exactly. Your teammate’s t1 is no longer on any branch.", "Accepted: eksaktong kopya ng laptop mo ang origin. Wala na sa kahit anong branch ang t1 ng teammate. Oh my gulay.", "Accepted: eksaktong kopya sa laptop nimo ang origin. Wala na sa bisan unsang branch ang t1 sa teammate. Aguy, bai."],
  ["Git Flow (off = trunk-based)", "Git Flow (off = trunk-based)", "Git Flow (off = trunk-based)"],
  ["Git Flow: main holds releases, develop holds the next release.", "Git Flow: releases sa main, susunod na release sa develop.", "Git Flow: releases sa main, sunod nga release sa develop."],
  ["Trunk-based: one main branch, tiny feature branches.", "Trunk-based: isang main, maliliit na feature branches.", "Trunk-based: usa ka main, gagmay nga feature branches."],
  ["Features branch off develop.", "Mula develop ang feature branches.", "Gikan develop ang feature branches."],
  ["Finished features merge back into develop.", "Balik sa develop ang tapos na features.", "Balik sa develop ang nahuman nga features."],
  ["A release branch freezes what will ship; only fixes go here.", "Naka-freeze ang ilalabas sa release branch. Fixes lang dito.", "Naka-freeze ang ipagawas sa release branch. Fixes ra diri."],
  ["The release goes to main and gets tagged...", "Sa main ang release, kasama ang tag…", "Sa main ang release, uban ang tag…"],
  ["...and back into develop.", "…at pabalik sa develop.", "…ug pabalik sa develop."],
  ["Urgent production bugs branch from main.", "Mula main ang urgent production bug fixes.", "Gikan main ang urgent production bug fixes."],
  ["Five branch types, lots of merges. Very controlled; more ceremony.", "Limang branch types, maraming merges. Kontrolado, mas maraming proseso.", "Lima ka branch types, daghang merges. Kontrolado, mas daghang proseso."],

  ["(PR merged, deployed from main)", "(na-merge ang PR, deploy mula main)", "(na-merge ang PR, deploy gikan main)"],
  ["One main line, always close to releasable. Simple, but needs good automated tests.", "Isang main line, laging halos ready. Simple, pero kailangan ng maayos na automated tests.", "Usa ka main line, kanunay hapit ready. Simple, pero kinahanglan og tarong nga automated tests."],
  ["The red commit broke production. It’s already pushed.", "Red commit ang sumira sa production. Na-push na ito.", "Red commit ang nakaguba sa production. Na-push na ni."],
  ["A new commit that does the exact opposite of the bad one. Nothing is removed from history.", "Bagong commit na babawi sa maling changes. Walang aalis sa history.", "Bag-ong commit nga mobawi sa sayop nga changes. Walay tangtangon sa history."],

  ["--soft: main moves back, and the changes from those two commits sit in staging, ready to commit again.", "--soft: balik ang main, nasa staging ang changes, ready i-commit ulit.", "--soft: balik ang main, naa sa staging ang changes, ready i-commit balik."],
  ["--mixed (the default): main moves back, and the changes are back in your files, unstaged.", "--mixed: balik ang main, nasa files ang changes, hindi naka-stage. Ito ang default.", "--mixed: balik ang main, naa sa files ang changes, wala naka-stage. Mao ni ang default."],
  ["--hard: main moves back and the changes are thrown away. Your files match the older commit exactly.", "--hard: balik ang main, tapon ang changes sa tracked files. Tugma sa lumang commit ang files.", "--hard: balik ang main, gilabay ang changes sa tracked files. Takdo sa karaang commit ang files."],
  ["\"Changes to be committed\": one git commit would recreate them as a single commit.", "“Changes to be committed”: isang git commit, isang bagong commit para sa lahat.", "“Changes to be committed”: usa ka git commit, usa ka bag-ong commit para sa tanan."],
  ["\"Changes not staged\": edit and re-add them as you like.", "“Changes not staged”: puwedeng i-edit at i-add ulit.", "“Changes not staged”: pwede i-edit ug i-add balik."],
  ["\"nothing to commit\". The commits are dashed: only the reflog can find them now.", "“nothing to commit”. Dashed ang commits; sa reflog mo pa sila makikita.", "“nothing to commit”. Dashed ang commits; sa reflog pa nimo sila makita."],
  ["Four commits on your branch, three of them noise.", "Apat na commits; tatlo rito, kalat lang sa history.", "Upat ka commits; tulo niini, samok ra sa history."],
  ["An editor opens with one line per commit, oldest first.", "Magbubukas ang editor: isang linya bawat commit, pinakaluma muna.", "Moabli ang editor: usa ka linya matag commit, pinakakaraan una."],
  ["(change pick → squash on lines 2 to 4, save)", "(pick → squash sa linya 2–4, save)", "(pick → squash sa linya 2–4, save)"],
  ["Keep the first commit; squash the other three into it.", "Itira ang una; i-squash ang tatlo papunta rito.", "Ibilin ang una; i-squash ang tulo padulong niini."],
  ["(Git replays and combines them)", "(inuulit at pinagsasama ng Git)", "(gibalik ug gihiusa sa Git)"],
  ["Four commits become one new commit with a new hash. The dashed originals are left behind.", "Apat naging isa, may bagong hash. Dashed ang naiwan na originals.", "Upat nahimong usa, naay bag-ong hash. Dashed ang nabiling originals."],
  ["Your branch history is rewritten, so it needs a force push. Fine for your own branch.", "Na-rewrite ang history. Kung na-push na, kailangan ng force push; okay sa sarili mong branch na walang ibang gumagamit.", "Na-rewrite ang history. Kung na-push na, kinahanglan og force push; okay sa imong branch nga walay laing naggamit."],
  ["main has four commits.", "Apat na commits sa main.", "Upat ka commits sa main."],
  ["Oops. ui and tests seem gone: no branch points at them anymore.", "Ay! Mukhang wala na ang ui at tests: walang branch na nakaturo sa kanila.", "Ay! Murag wala na ang ui ug tests: walay branch nga nagtudlo nila."],
  ["The reflog remembers every place HEAD has been. HEAD@{1} is just before the reset.", "Naalala ng reflog ang napuntahan ng HEAD. HEAD@{1} ang bago ang reset.", "Nahinumdoman sa reflog ang giadtoan sa HEAD. HEAD@{1} ang sa wala pa ang reset."],
  ["Back where you were. Nothing was lost.", "Balik sa dating puwesto. Walang nawala.", "Balik sa dating pwesto. Walay nawala."],
  ["main is at the latest commit.", "Nasa latest commit ang main.", "Naa sa latest commit ang main."],
  ["HEAD points straight at an old commit. No branch. Your files match that old version.", "Nakaturo ang HEAD sa lumang commit, walang branch. Tugma sa lumang version ang files.", "Nagtudlo ang HEAD sa karaang commit, walay branch. Takdo sa karaang version ang files."],
  ["New commits hang off that point, held only by HEAD.", "Dito nakakabit ang bagong commits. HEAD lang ang may hawak.", "Diri nakakabit ang bag-ong commits. HEAD ra ang naghawid."],
  ["Nothing points at those two commits now (dashed). Git will clean them up eventually.", "Walang nakaturo sa dalawang commits na 'yon. Dashed na; lilinisin din sila ng Git.", "Walay nagtudlo sa duha ka commits. Dashed na; limpyohan ra pud sila sa Git."],
  ["A branch at that hash (git reflog shows it) saves them. Next time, run git switch -c before committing.", "Branch sa hash na 'yon ang sasagip. Nasa git reflog ang hash. Next time, git switch -c muna.", "Branch sa kana nga hash ang mosalbar. Naa sa git reflog ang hash. Next time, git switch -c sa."],
  ["origin and your teammate’s laptop share the same three commits.", "Parehong tatlong commits ang origin at laptop ng teammate.", "Parehas nga tulo ka commits ang origin ug laptop sa teammate."],
  ["teammate’s laptop", "laptop ng teammate", "laptop sa teammate"],
  ["You replaced \"add cache\" with an amended copy. On origin, the original is gone from main.", "Pinalitan mo ang “add cache” gamit ang amend. Wala na ang original sa main ng origin.", "Giilisan nimo ang “add cache” gamit ang amend. Wala na ang original sa main sa origin."],

  ["And the original commit you tried to remove is back on origin. That’s why shared history stays untouched.", "Balik sa origin ang original na tinanggal mo. Kaya ingat sa shared history.", "Balik sa origin ang original nga gitangtang nimo. Mao nang amping sa shared history."],

function TX(value){

  if(map.has(value))return map.get(value);
  const text=value.trim();if(map.has(text))return value.replace(text,()=>map.get(text));
  for(const {re,slots,row} of LIVE_PATTERNS){const m=text.match(re);if(!m)continue;

  $('crumb').innerHTML=id==='start'?'Field Guide / <b>Contents</b>':`${lvOf(x.lv).name} · ${CHAPTERS[x.ch].name} / <b>${esc(x.t)}</b>`;
  $('folio').textContent=id==='start'?'Cover':`${String(to).padStart(2,'0')} / ${TERMS.length}`;
  $('prev').disabled=to<=0;$('next').disabled=to>=ORDER.length-1;
  if(id!=='start'){const k=group==='level'?'l-'+byId[id].lv:'c-'+byId[id].ch;if(COLL[k]){COLL[k]=false;saveColl()}}
  renderToc();linkify();const on=$('toc').querySelector('button.on');if(on)on.scrollIntoView({block:'nearest'});
  if(push){try{history.replaceState(null,'','#'+id)}catch(e){}}
  if(from>=0&&push)window.scrollTo({top:0,behavior:'auto'});
}
document.addEventListener('click',e=>{const f=e.target.closest('.fh');if(f){const p=f.closest('.fp'),k=p.dataset.k;COLL[k]=!COLL[k];saveColl();p.classList.toggle('shut',!!COLL[k]);f.setAttribute('aria-expanded',!COLL[k]);f.querySelector('.act').textContent=COLL[k]?'Show':'Hide';return}
  const b=e.target.closest('[data-go]');if(b){e.preventDefault();hidePop();go(b.dataset.go)}});

/* ---------- cross-links: any term mentioned in text links to its page ---------- */
const PHR={repository:['repository','repositories','repo','repos','.git'],commit:['commit','commits','committed','committing','parent','hash','hashes'],'staging-area':['staging area','staging','staged','git add','working directory','index'],
 'diff-status':['git status','git diff','diff','untracked'],gitignore:['.gitignore','ignored'],head:['HEAD*','HEAD~1*','HEAD~2*'],branch:['branch','branches','feature branch'],'checkout-switch':['git switch','git checkout','switch','switching','checked out'],
 merge:['merge','merged','merging','merge commit','fast-forward','fast-forwards'],'merge-conflict':['conflict','conflicts','conflict markers'],rebase:['rebase','rebasing','rebased','replayed','pull --rebase'],stash:['stash','git stash'],
 'cherry-pick':['cherry-pick','cherry-picking','backport'],tags:['tag','tags','tagged','release tag','semantic versioning'],remote:['remote','origin','clone','cloned','cloning'],'push-pull':['push','pushed','pushes','pull','pulled','pulls'],
 fetch:['fetch','fetched','fetching','origin/main'],upstream:['upstream','ahead','behind','tracking branch'],'pull-request':['pull request','pull requests','PR*','PRs*','merge request','code review','review'],
 'force-push':['force push','force-push','--force','--force-with-lease','force pushes'],'branching-strategy':['Git Flow','trunk-based','develop','release branch','feature flags'],'hooks-ci':['hook','hooks','pre-commit','CI*','pipeline','CD*'],
 revert:['revert','git revert'],reset:['reset','git reset','--hard','--soft','--mixed'],'interactive-rebase':['squash','squashed','interactive rebase','rebase -i','amend'],reflog:['reflog'],'detached-head':['detached HEAD','detached'],
 bisect:['bisect','binary search'],'objects-hashes':['blob','blobs','tree','trees','snapshot','snapshots','SHA*'],'three-way-merge':['merge base','common ancestor'],'rewriting-history':['rewrite history','rewriting history','rewrites history','golden rule','rewritten'],
 submodules:['submodule','submodules']};
const PMAP=new Map();Object.entries(PHR).forEach(([id,arr])=>arr.forEach(p=>{const cs=p.endsWith('*'),w=cs?p.slice(0,-1):p;PMAP.set(w.toLowerCase(),{id,cs,w})}));
const PRE=new RegExp('(?<![\\w-])('+[...PMAP.values()].map(o=>o.w).sort((a,b)=>b.length-a.length).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\w-])','gi');
function linkify(){if(curId==='start')return;const seen=new Set([curId]);
  document.querySelectorAll('#page .one, #page .txt p, #page .cap').forEach(root=>{
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('code,a,b,.xref')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
    const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(n=>{const txt=n.nodeValue;PRE.lastIndex=0;let m,last=0,frag=null;
      while((m=PRE.exec(txt))){const o=PMAP.get(m[1].toLowerCase());if(!o||(o.cs&&m[1]!==o.w)||seen.has(o.id))continue;seen.add(o.id);
        frag=frag||document.createDocumentFragment();frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
        const a=document.createElement('a');a.className='xref';a.href='#'+o.id;a.dataset.go=o.id;a.textContent=m[1];frag.appendChild(a);last=m.index+m[1].length}
      if(frag){frag.appendChild(document.createTextNode(txt.slice(last)));n.replaceWith(frag)}})})}
const pop=document.createElement('div');pop.className='xpop';pop.hidden=true;document.body.appendChild(pop);
function hidePop(){pop.hidden=true}
document.addEventListener('mouseover',e=>{const a=e.target.closest('.xref');if(!a)return;const x=byId[a.dataset.go];if(!x)return;
  pop.innerHTML=`<div class="xh">${badge(x.lv)}<b>${x.t}</b></div>${x.full.length?`<div class="xf">${x.full.slice(0,3).map(([k,v])=>`<span>${esc(k)}</span> ${esc(v)}`).join(' · ')}</div>`:''}<p>${TR(x,'one')}</p><div class="xo">Click to open · page ${ORDER.indexOf(x.id)}</div>`;
  pop.hidden=false;const r=a.getBoundingClientRect(),w=Math.min(340,innerWidth-24);pop.style.width=w+'px';
  let left=clamp(r.left,12,innerWidth-w-12),top=r.bottom+8;pop.style.left=left+'px';pop.style.top=top+'px';
  const ph=pop.offsetHeight;if(top+ph>innerHeight-8)pop.style.top=(r.top-ph-8)+'px'});
document.addEventListener('mouseout',e=>{if(e.target.closest('.xref'))hidePop()});
addEventListener('scroll',hidePop,{passive:true});
$('prev').onclick=()=>{const i=ORDER.indexOf(curId);if(i>0)go(ORDER[i-1])};
$('next').onclick=()=>{const i=ORDER.indexOf(curId);if(i<ORDER.length-1)go(ORDER[i+1])};
document.addEventListener('keydown',e=>{const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'&&e.target.type!=='range'&&e.target.type!=='checkbox')return;
  if(e.key==='/'){e.preventDefault();$('q').focus();return}
  if(tag==='input')return;
  if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==curId)go(h,false)});
go(location.hash.slice(1)||'start',false);
paintLang();
