  ui.btn('You: commit',manual(act.youCommit));ui.btn('You: push',manual(act.youPush));ui.btn('Merge PR on origin',manual(act.merge));ui.btn('Teammate A: fix + merge',manual(act.aWork));
  ui.btn('Teammate B: pull',manual(()=>act.pull('b','Teammate B')));ui.btn('You: pull',manual(()=>act.pull('you','You')));ui.btn('Tag release',manual(act.tag));
  const at=ui.toggle('Auto-play',auto,v=>{auto=v;nextAuto=T+.5});
  const sO=ui.stat('commits on origin','req'),sP=ui.stat('pushes','ad'),sL=ui.stat('pulls','slot');

  let az=-.55,el=.68,drag=null,W=400;const target=new THREE.Vector3(-.6,0,.5);
  const place=()=>{const r=60;cam.position.set(target.x+r*Math.cos(el)*Math.sin(az),target.y+r*Math.sin(el),target.z+r*Math.cos(el)*Math.cos(az));cam.lookAt(target)};
  const fit=()=>{W=wrap.clientWidth;renderer.setSize(W,H);const span=W<640?19:18,asp=W/H;cam.left=-span;cam.right=span;cam.top=span/asp;cam.bottom=-span/asp;
    if(cam.top<10){const f=10/cam.top;cam.left*=f;cam.right*=f;cam.top*=f;cam.bottom*=f}cam.updateProjectionMatrix()};
  const ro=new ResizeObserver(fit);ro.observe(wrap);fit();
  renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,az,el};renderer.domElement.setPointerCapture(e.pointerId);hint.style.opacity=0});
  renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;az=drag.az-(e.clientX-drag.x)*.008;el=clamp(drag.el+(e.clientY-drag.y)*.006,.2,1.35)});
  renderer.domElement.addEventListener('pointerup',()=>drag=null);renderer.domElement.style.touchAction='pan-y';

  let T=0,last=performance.now(),raf,alive=true;const v=new THREE.Vector3(),lineMat={};
  reset();
  const loop=now=>{if(!alive)return;const dt=document.hidden?0:Math.min(.05,(now-last)/1000)*(REDUCED?.6:1);last=now;T+=dt;
    if(!drag&&!REDUCED)az+=dt*.025;place();
    if(auto&&!busy&&T>nextAuto){if(si===0&&colN>8)reset();SCRIPT[si]();si=(si+1)%SCRIPT.length;nextAuto=T+2.6}
    off=Math.max(0,colN-13);
    for(let k=flying.length-1;k>=0;k--){const f=flying[k],q=(T-f.st)/f.dur;if(q<0){f.m.visible=false;continue}f.m.visible=true;
      if(q>=1){scene.remove(f.m);f.m.material.dispose();flying.splice(k,1);f.done();continue}const e=ez(q);f.m.position.lerpVectors(f.a,f.b,e);f.m.position.y+=Math.sin(Math.PI*e)*4}
    Object.entries(REPOS).forEach(([rk,r])=>{const pts=[];Object.entries(r.meshes).forEach(([id,m])=>{const tg=slot(id);m.position.lerp(tg,1-Math.pow(.001,dt));const s=clamp((T-m.userData.born)/.35,0,1);m.scale.setScalar(.01+.99*ez(s));
        m.visible=commits[id].col>=off-1;commits[id].parents.forEach(p=>{const pm=r.meshes[p];if(pm&&pm.visible&&m.visible){pts.push(pm.position.clone(),m.position.clone())}})});
      if(r.line){r.g.remove(r.line);r.line.geometry.dispose()}lineMat[rk]=lineMat[rk]||new THREE.LineBasicMaterial({color:C('muted'),transparent:true,opacity:.7});
      r.line=new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),lineMat[rk]);r.g.add(r.line);
      if(rk!=='origin'){const o=REPOS.origin,ahead=[...r.set].filter(x=>!o.set.has(x)).length,behind=[...o.set].filter(x=>!r.set.has(x)).length;
        r.lab.querySelector('span').textContent=TX(`↑${ahead} ahead · ↓${behind} behind origin`);r.lab.style.borderLeftColor=ahead||behind?css('slot'):css(r.c)}
      else r.lab.querySelector('span').textContent=TX(`${r.set.size} commits · GitHub / GitLab`)});
    renderer.render(scene,cam);
    labs.forEach(l=>{const p=new THREE.Vector3();l.obj.getWorldPosition(p);v.copy(p).add(l.off).project(cam);l.d.style.transform=`translate(${(v.x+1)/2*W}px,${(1-v.y)/2*H}px) translate(-50%,-100%)`;l.d.style.display=l.obj.visible===false?'none':''});
    sO(REPOS.origin.set.size);sP(stats.push);sL(stats.pull);raf=requestAnimationFrame(loop)};
  raf=requestAnimationFrame(loop);
  return{stop(){alive=false;cancelAnimationFrame(raf);ro.disconnect();renderer.dispose();wrap.remove()}};
}
</script>
<script>
/* ---------- language: English · Tagalog · Bisaya (Cebuano) ----------
   Informal on purpose, tech words stay English. Lesson prose lives in I18N; lists, captions and live text use LIVE_TEXT.
   Anything missing falls back to English. LOL = the punchline under each "Picture it". */
const I18N={"tl":{"ui":{"search":"Hanapin: rebase, HEAD, PR…","show":"Ipakita ang contents","hide":"Itago ang contents","collapse":"I-collapse lahat","expand":"I-expand lahat","start":"dito magsimula","done":"Nagawa mo na 'to","picture":"Isipin mo 'to","see":"Tingnan din","plain":"Sa simpleng salita","enonly":"English pa 'to sa ngayon. Yung mahahabang explanation, isasalin pa lang.","try":"Subukan mo","nextterm":"Susunod na term →","where":"Saan nakatira ang bawat term","howpage":"Paano basahin ang bawat page","a1t":"Isang sentence","a1d":"Ang buong idea, at naka-spell out ang mga abbreviation.","a2d":"Step-by-step na replay: ang command sa taas, ano ang ginawa nito sa mga commit, at bakit.","a3d":"Kung saan mo 'to makikita sa araw-araw mong trabaho sa Git.","a4d":"Halimbawa mula sa labas ng mundo ng computer, na kayang intindihin kahit ng bata.","title":"Git, ipinaliwanag habang gumagalaw ang mga commit sa harap mo","intro":"Karamihan ng kalituhan sa Git ay galing sa isang idea na walang nagsasabi nang malakas: bawat laptop ay may buong kopya ng repository, at nagbabago lang ang mga kopya pag may nag-push, nag-pull, o nag-fetch. Panoorin mo sa baba, tapos magsimula ka sa Beginner.","lv_beginner":"Dito magsimula. Lahat ng kailangan mo para mag-commit, branch, push, at pull sa unang araw.","lv_mid":"Pagtatrabaho kasama ang team: merging, conflicts, pull requests, at pagiging naka-sync.","lv_hard":"Pag-rewrite at pag-undo ng history, team workflows, at automation.","lv_insane":"Paano gumagana ang Git sa loob, at mga pagkakamaling tatama sa buong team."},"one":{"repository":"Project folder kasama ang buong history nito, na nakatago sa hidden na .git folder.","commit":"Naka-save na snapshot ng project mo sa isang sandali, may kasamang message kung ano ang binago at bakit.","staging-area":"Yung waiting room sa pagitan ng mga file na inedit mo at ng susunod mong commit. Ikaw ang pipili kung ano'ng isasama gamit ang git add.","diff-status":"Sinasabi ng status kung aling mga file ang nagbago. Pinapakita ng diff kung aling mga linya mismo ang nagbago.","gitignore":"Listahan ng mga file at folder na hindi dapat i-track ng Git, tulad ng dependencies, build output, at secrets.","head":"Pointer kung nasaan ka ngayon: kadalasan yung branch na naka-checkout ka, at sa pamamagitan nito, yung pinakabagong commit ng branch na 'yon.","branch":"Label na naililipat at nakaturo sa isang commit. Sa branch, pwede kang magtrabaho nang hindi ginagalaw ang main.","checkout-switch":"Lilipat ka sa ibang branch: magbabago ang mga file sa folder mo para tumugma dito, at doon na ituturo ang HEAD.","merge":"Pagsasama ng trabaho mula sa isang branch papunta sa isa pa.","merge-conflict":"Pag parehong linya ang binago ng dalawang branch pero magkaiba ang pagbago, titigil ang Git at ikaw ang papapiliin.","rebase":"Ililipat ang mga commit ng branch mo para magsimula sila sa dulo ng ibang branch, na parang mas huli kang nagsimula.","stash":"Itabi muna sa shelf ang mga hindi pa tapos na changes para malinis ang folder, tapos ibalik mamaya.","cherry-pick":"Kopyahin ang isang specific na commit mula sa ibang branch papunta sa branch kung nasaan ka.","tags":"Permanenteng pangalan na nakadikit sa isang commit, kadalasan version number tulad ng v1.6.0.","remote":"Kopya ng repository sa ibang lugar, kadalasan sa GitHub o GitLab. Ang origin ang default na pangalan ng kinopyahan mo.","push-pull":"Ang push, pinapadala ang mga commit mo sa remote. Ang pull, kinukuha ang mga bagong commit ng remote papunta sa branch mo.","fetch":"Dina-download ng fetch ang mga bagong commit pero walang binabago sa branch mo. pull = fetch + merge.","upstream":"Yung remote branch na ka-partner ng local branch mo, para masabi ng Git kung gaano ka na kaabante o kahuli.","pull-request":"Ang PR (Pull Request; MR o Merge Request sa GitLab) ay paghiling na i-merge ang branch mo sa iba, may page kung saan ire-review muna ng mga ka-team mo ang changes.","force-push":"Pinipilit na tumugma ang remote branch sa branch mo kahit may matapon na commit sa remote. Gamitin ang --force-with-lease, huwag ang plain na --force.","branching-strategy":"Yung mga rule ng team kung anong mga branch ang meron, saan nagsisimula ang trabaho, at paano ito umaabot sa production.","hooks-ci":"Mga script na kusang tumatakbo sa ilang sandali sa Git: hooks sa machine mo bago mag-commit, at CI (Continuous Integration) sa server pagkatapos mag-push.","revert":"I-undo ang isang commit sa pagdagdag ng bagong commit na kabaligtaran nito. Buo pa rin ang history.","reset":"Ibabalik ang branch mo sa mas lumang commit. Ang mode ang magdedesisyon kung ano'ng mangyayari sa mga changes sa pagitan.","interactive-rebase":"I-edit ang history ng branch mo bago i-share: pagsamahin, ayusin ang order, palitan ang pangalan, o tanggalin ang mga commit.","reflog":"Ang local mong diary ng lahat ng napuntahan ng HEAD. Dito mo mababawi ang mga commit na akala mo nawala na.","detached-head":"Direktang nakaturo ang HEAD sa isang commit imbes na sa branch. Pwede kang tumingin-tingin, pero ang mga bagong commit ay hindi mapupunta sa kahit anong branch.","bisect":"Hanapin ang commit na nagdala ng bug gamit ang binary search: pipiliin ng Git ang nasa gitna, ikaw ang magsasabi kung good o bad.","objects-hashes":"Sa loob ng .git, bawat version ng file, folder, at commit ay object na pinangalanan ayon sa hash ng laman nito.","three-way-merge":"Nagme-merge ang Git sa pagkumpara ng dalawang branch sa huli nilang pinagsaluhang commit, hindi lang sa isa't isa.","rewriting-history":"Pagbago ng mga commit na meron na ang ibang tao. Gumagawa ng bagong commit ang amend, rebase, at reset, habang yung kopya ng iba ay may luma pa rin.","submodules":"Repository sa loob ng isa pang repository, naka-pin sa isang eksaktong commit."},"like":{"repository":"Parang notebook kung saan nakatago at may petsa ang bawat page na sinulat mo, at pwede kang bumalik sa kahit alin.","commit":"Parang save point sa video game. Naaalala ng bawat isa kung nasaan ka eksakto, at pwede kang mag-load ng mas luma kahit kailan.","staging-area":"Parang nag-iimpake ka ng kahon na ipapadala. Yung desk mo ang working directory, yung bukas na kahon ang staging, at pag sinelyuhan mo na may label, 'yan ang commit.","diff-status":"Parang track changes sa document: pulang guhit sa tinanggal mo, berde sa dinagdag mo.","gitignore":"Parang listahan ng “huwag isama” na nakadikit sa mga kahon pag lilipat ng bahay.","head":"Parang “You are here” na marker sa mapa ng mall.","branch":"Parang bookmark sa librong pinaghahatian. Pag inusog mo ang bookmark mo, hindi gagalaw ang bookmark ng iba.","checkout-switch":"Parang nag-load ka ng ibang save file sa game: magre-reload ang buong mundo sa save na 'yon.","merge":"Parang dalawang sapa na nagsanib para maging isang ilog. Mula noon, nasa ilog na ang tubig ng dalawa.","merge-conflict":"Parang dalawang editor na magkaiba ang pag-edit sa iisang sentence. May isang kailangang magdesisyon kung alin ang matitira.","rebase":"Parang inililipat mo ang mga sticky note mo mula sa lumang version ng plano papunta sa pinakabago, at inaayos ang bawat isa para tumugma.","stash":"Parang winalis mo lahat ng nasa desk papunta sa drawer kasi may urgent na tawag, tapos ilalabas mo ulit pagkatapos.","cherry-pick":"Parang kinopya mo lang ang isang recipe mula sa cookbook ng kaibigan mo, imbes na kunin mo ang buong libro.","tags":"Parang plake sa building na nagsasabi kung kailan ito binuksan. Pwedeng magbago ang building, pero yung plake, tanda ng sandaling 'yon.","remote":"Parang sarili mong photocopy ng binder ng team. Nasa office ang original (origin), at magbabago lang ang kopya mo pag pumunta ka at nag-sync.","push-pull":"Parang pag-upload ng edits mo sa shared drive, at pag-download ng edits ng iba.","fetch":"Kinuha mo yung sulat at iniwan sa mesa, versus binuksan mo agad at inaksyunan.","upstream":"Parang step counter na naka-pair sa step counter ng kaibigan mo, para malaman mo kung lamang ka o hinahabol mo pa siya.","pull-request":"Parang pagpasa ng article sa editor. Mamarkahan niya, ire-revise mo, at saka pa lang ipi-print.","force-push":"Parang pinalitan mo ang shared document ng kopya mo. Okay lang kung ikaw lang ang nag-e-edit; disaster kung may nag-save ng changes isang oras na ang nakaraan.","branching-strategy":"Ang Git Flow, parang factory na may hiwa-hiwalay na linya para sa paggawa, pag-test, at pag-ship. Ang trunk-based, parang kusina na lumalabas agad ang bawat ulam pag luto na.","hooks-ci":"Parang spell-checker na tumatakbo bago mo mapindot ang Send (hook), at proofreader na tumitingin sa bawat printed na kopya (CI).","revert":"Parang naglabas ka ng correction sa dyaryo bukas, imbes na bawiin pa ang lahat ng kopya kahapon.","reset":"Parang nire-rewind ang recording. Sa soft, nasa mesa pa rin yung na-cut na footage. Sa mixed, binalik sa drawer. Sa hard, ginutay-gutay na.","interactive-rebase":"Parang ginawa mong malinis na summary ang mga magulo mong notes bago mo ipasa.","reflog":"Parang browser history mo. Na-close mo na yung tab, pero mahahanap mo pa rin yung page.","detached-head":"Parang lumabas ka sa markadong trail. Okay lang mag-explore, pero kung magtatayo ka ng kampo, maglagay ka ng karatula para mahanap mo ulit.","bisect":"Parang hula-hulaan ng number mula 1 hanggang 100 na may nagsasabing “taasan” o “babaan” kada hula.","objects-hashes":"Parang library na nag-aayos ng libro ayon sa fingerprint ng text nito. Pag magkaparehong-magkapareho ang dalawang libro, iisang pwesto lang sila, kaya isang kopya lang ang tinatago.","three-way-merge":"Parang pinagsasama ang dalawang na-edit na kopya ng kontrata sa pagkumpara ng bawat isa sa original, hindi sa isa't isa.","rewriting-history":"Parang binago mo ang kwento pagkatapos itong mabasa ng lahat. Nagbago ang kopya mo, pero yung original pa rin ang naaalala ng iba.","submodules":"Parang libro na nagsasabing “isingit dito ang chapter 7 ng 2024 edition ng ibang libro” imbes na i-print ito."},"done":{"repository":"Ang dashboard, ang .NET API, at ang player ay tig-iisang repository. Pag binuksan mo yung isa sa VS Code at may nakita kang branch name sa bandang baba, nasa loob ka ng repo.","commit":"Bawat <code>git commit -m \"...\"</code>, at bawat pindot ng Commit sa VS Code, gumagawa ng isa. Kung nagsusulat ang team mo ng prefixes tulad ng <code>feat:</code> at <code>fix:</code>, convention 'yan na tinatawag na Conventional Commits.","staging-area":"Sa Source Control panel ng VS Code, ang “Changes” ay yung working directory mo at ang “Staged Changes” ay yung staging area. Yung pag-click sa + sa tabi ng file ay <code>git add</code>.","diff-status":"Yung colored side-by-side view pag kinlick mo yung changed file sa VS Code, at yung “Files changed” tab ng pull request, parehong diff 'yan.","gitignore":"Kadalasan, ini-ignore ng Angular projects ang <code>node_modules/</code> at <code>dist/</code>, at ng .NET projects ang <code>bin/</code> at <code>obj/</code>. Kung may settings file na may totoong database credentials na lumabas sa diff, kadalasan kulang ng isang line sa .gitignore ang dahilan.","head":"Yung branch name sa terminal prompt mo o sa status bar ng VS Code, 'yan yung tinuturo ng HEAD. Pag nag-switch ka ng branch, gumagalaw ang HEAD.","branch":"Bawat <code>git checkout -b feature/...</code> o “Create branch” button na pinindot mo, gumawa ng isa. Yung branch dropdown sa GitHub o GitLab ay listahan ng mga pointer na 'to.","checkout-switch":"Pag kinlick mo yung branch name sa status bar ng VS Code at pumili ka ng iba, 'to yung tumatakbo. Kung parang nawala yung files pagka-switch, safe sila: nasa kabilang branch lang sila.","merge":"Pag pinindot mo yung “Merge pull request” sa GitHub o GitLab, nagme-merge 'yan papunta sa main. Nagme-merge din ang <code>git pull</code>, kasi ang pull ay fetch tapos merge.","merge-conflict":"Pag dalawang tao ang nag-change ng parehong file, tulad ng parehong nag-edit ng <code>environment.ts</code> o ng parehong service, dun lumalabas ang conflicts. Yung “Accept Current / Accept Incoming / Accept Both” buttons ng VS Code ang nagre-resolve sa kanila.","rebase":"Ang <code>git pull --rebase</code> ay nire-replay yung local commits mo sa ibabaw ng kaka-pull mo lang, kaya iwas ka sa maliliit na “Merge branch 'main' of …” commits. Common na rebase yung pag-update ng feature branch gamit ang latest main bago mag-pull request.","stash":"Nasa gitna ka ng feature, tapos may nag-report ng bug sa main na kailangan ng hotfix ngayon na. Stash, switch sa main, fix, switch pabalik, pop. 'Yan yung classic na gamit.","cherry-pick":"May fix na pumasok sa feature o develop branch, pero kailangan na 'to ng production ngayong araw. Yung pag-cherry-pick ng isang commit na 'yon papunta sa main o release branch ay tinatawag na backport.","tags":"Yung <code>v1.6.0</code> sa sulok ng Adexchange Performance dashboard ay version label, at ideally tugma 'yan sa isang tag. Naka-build sa tags ang “Releases” sa GitHub at GitLab.","remote":"Yung URL na kinopya mo sa “Clone” button sa GitHub o GitLab ang nag-set up ng origin. Pinapakita 'yan ng <code>git remote -v</code>.","push-pull":"Yung “Updates were rejected because the remote contains work that you do not have locally” ay ibig sabihin, may teammate na naunang mag-push. Mag-pull ka, i-resolve ang kahit anong conflict, tapos mag-push ulit.","fetch":"Pag nagpakita ang VS Code ng ↓3 sa tabi ng branch name after ng background fetch, may 3 commits ang origin na hindi mo pa nime-merge.","upstream":"Yung “The current branch has no upstream branch” sa first push mo, 'yan yung Git na humihingi ng <code>-u</code>. Yung ↑2 ↓1 counters sa VS Code ay ahead at behind.","pull-request":"Bawat “Review requested” notification at bawat “LGTM” (Looks Good To Me) ay part nito. Yung branch protection rules na nagba-block ng merge hangga't walang nag-a-approve ang nagpapa-mandatory sa reviews.","force-push":"After mong i-rebase yung feature branch mo sa latest main para i-update ang pull request, kailangan mo ng force push. 'Yan yung safe na case, kasi branch mo naman 'yon.","branching-strategy":"Kung may <code>develop</code> branch ang repos mo na pinagkukunan ng releases, malapit ka na sa Git Flow. Kung lahat diretso sa main through PRs at doon nagde-deploy, trunk-based o GitHub Flow 'yan.","hooks-ci":"Yung green check o red cross sa tabi ng commit o PR ay result ng CI pipeline. Yung lint error na pumigil sa commit mo bago pa ito mangyari, pre-commit hook 'yon.","revert":"Yung “Revert” button sa merged pull request, exactly 'to ang ginagawa: bagong PR na nag-a-undo sa luma.","reset":"Ang <code>git reset --soft HEAD~1</code> ay yung classic na “napaaga yung commit ko, ulitin ko nga”. Ang <code>git reset --hard origin/main</code> naman ay “itapon na yung local kalat ko at gayahin ang remote”.","interactive-rebase":"Ginagawa 'to para sa'yo ng “Squash and merge” sa pull request: lahat ng commits ng PR ay nagiging isang commit sa main.","reflog":"Kung nag-panic ka na after ng reset at may teammate na nagsabing “check mo yung reflog”, 'yan yung ibig niyang sabihin.","detached-head":"Pag nag-checkout ka ng lumang release tag para i-reproduce yung bug mula sa player build sa field, mapupunta ka sa detached HEAD. Yung mahabang warning ng Git, sinasabi lang na gumawa ka ng branch kung may gusto kang i-keep.","bisect":"Yung “gumagana siya sa v1.5, sira sa v1.6, at may 80 commits sa pagitan”, 'yan mismo ang trabaho ng bisect. Mga 7 tests lang 'yan.","objects-hashes":"Bawat short hash na kinopya mo mula sa <code>git log</code> ay isa sa mga ID na 'to. Snapshots ang commits, hindi diffs; yung diffs na nakikita mo ay kinocompute on the fly sa pag-compare ng dalawang snapshot.","three-way-merge":"Pini-print ng <code>git merge-base main feature/x</code> yung shared commit na 'yon. Yung clean merge kung saan magkaibang parts ng parehong file ang in-edit niyo ng teammate mo, 'yan ang three-way merging na ginagawa ang trabaho niya.","rewriting-history":"May nag-force push sa shared branch, tapos kinabukasan, ilang teammates ang nakakita ng weird na duplicate commits after mag-pull. 'Yan 'to, at kaya usually bina-block ng branch protection ang force push sa main.","submodules":"Kung may shared na set ng components ang dashboard at ang Angular UI ng player, isang paraan ang submodule para i-share sila, at private npm package naman yung isa pa. Yung empty folder pagka-clone ay yung classic na submodule surprise."},"body":{"repository":"<p>Ang repository ay yung files ng project mo kasama lahat ng naka-save na version nila. Nakatira yung history sa hidden na <code>.git</code> folder sa pinakataas ng project. Pag binura mo yung folder na 'yan, plain files na lang ang matitira, walang history; pag hindi, pwede kang bumalik sa kahit anong naka-save na point.</p><p>Nagkakaroon ka ng repository pag nag-run ka ng <code>git init</code> sa isang folder, o pag nag-clone ka ng existing na. Full copy ang bawat clone, kasama ang history, kaya nasa laptop mo talaga yung buong kwento, hindi lang yung latest na files.</p>","commit":"<p>Nire-record ng commit kung ano yung itsura ng bawat tracked file sa moment na 'yon, sino gumawa, kailan, at may kasamang message. Bawat commit naka-point sa commit bago nito, yung <strong>parent</strong> niya, kaya nagiging chain ang mga commit: 'yan ang history mo.</p><p>May ID ang bawat commit na tinatawag na <strong>hash</strong> (o SHA), mahabang string tulad ng <code>a1b2c3d…</code> na kadalasang pinapaikli sa 7 characters. I-commit nang sabay yung maliliit at magkakaugnay na changes, with a message na nag-e-explain kung bakit, tulad ng <code>fix: retry playlist fetch on timeout</code>. Magpapasalamat sa'yo yung future you na nagbabasa ng <code>git log</code> habang may incident.</p>","staging-area":"<p>Pwedeng nasa tatlong lugar ang changes mo. Ang <strong>working directory</strong> ay yung files na ine-edit mo. Ang <strong>staging area</strong> (tinatawag ding index) ang may hawak ng changes na pinili mo para sa next commit. Ang <strong>repository</strong> ay yung history ng mga commit na naka-save na.</p><p>Inililipat ng <code>git add</code> ang changes mula sa working directory papunta sa staging. Sine-save ng <code>git commit</code> lahat ng naka-stage bilang isang bagong commit. Dahil sa middle step na 'yan, pwede mong i-commit yung part lang ng work mo: mag-fix ka ng dalawang magkaibang bagay, tapos i-commit mo sila nang hiwalay with malinaw na messages.</p>","diff-status":"<p>Nililista ng <code>git status</code> yung files na modified, staged, o <strong>untracked</strong> (bagong files na hindi pa sinusundan ng Git). Sinasabi rin nito kung anong branch ka at kung ahead o behind ka sa remote.</p><p>Pinapakita ng <code>git diff</code> ang changes line by line: red with <code>-</code> yung tinanggal na lines, green with <code>+</code> yung dinagdag. Ang plain na <code>git diff</code> ay nagpapakita ng unstaged changes; ang <code>git diff --staged</code> naman ay yung ico-commit mo na. Ang pagbasa ng diff bago ang bawat commit ang pinakamurang code review na meron.</p>","gitignore":"<p>May mga file na hindi dapat nasa history. Ang <code>node_modules</code> at ang <code>bin/</code> at <code>obj/</code> folders ng .NET ay sobrang laki at pwede namang i-rebuild. Generated naman ang build output tulad ng <code>dist/</code>. Ang mga file tulad ng <code>.env</code> ay may passwords at keys na hinding-hindi dapat ma-push.</p><p>Naglilista ang <code>.gitignore</code> file ng patterns, isa kada line, at sini-skip ng Git lahat ng tumutugma dito. Untracked files lang ang apektado: kung na-commit na yung file, hindi siya matatanggal sa history pag dinagdag mo sa <code>.gitignore</code>. Kaya pag may na-leak na secret, kailangan siyang i-rotate, hindi lang i-ignore.</p>","head":"<p>Sinasagot ng HEAD ang tanong na “nasaan ako?”. Usually naka-point siya sa branch name, tulad ng <code>main</code>, at yung branch naman ang naka-point sa commit. Pag nag-commit ka, uusad yung branch sa bagong commit at sasama rin ang HEAD.</p><p>Makikita mo rin ang HEAD bilang starting point sa mga command. Ang <code>HEAD~1</code> ay isang commit bago kung nasaan ka; ang <code>HEAD~3</code> ay tatlo pabalik. Parehong gumagamit nito ang <code>git reset HEAD~1</code> at <code>git diff HEAD~2</code>.</p>","branch":"<p>Ang branch ay naka-name na pointer lang sa isang commit, kaya ang cheap ng branches: instant lang gumawa ng isa. Pag nag-commit ka sa isang branch, uusad yung pointer niya sa bagong commit. Yung ibang branches, nandun pa rin kung nasaan sila.</p><p>Gumagamit ang mga team ng branches para hiwa-hiwalay ang work. Nasa <code>main</code> yung naka-release na o ready nang i-release. May sariling branch ang bawat feature o fix, tulad ng <code>feature/scheduler</code>, at bumabalik siya sa main through merge o pull request pag tapos na.</p>","checkout-switch":"<p>Ang <code>git switch feature/x</code>, o yung mas lumang <code>git checkout feature/x</code>, ang nagpapalit kung anong branch ka. Ire-rewrite ng Git yung files sa folder mo para tumugma sa latest commit ng branch na 'yon. Ang <code>git switch -c new-branch</code> ay gagawa ng branch at magsi-switch dito in one step.</p><p>Ayaw mag-switch ng Git kung mao-overwrite yung uncommitted changes mo. I-commit mo muna, o itabi mo gamit ang stash, tapos saka ka mag-switch.</p>","merge":"<p>Kung hindi pa gumagalaw yung target branch simula nung nag-branch off ka, pwedeng i-slide lang ng Git yung pointer nito pa-forward sa latest commit mo. 'Yan ang <strong>fast-forward</strong>: walang kailangang bagong commit.</p><p>Kung parehong may bagong commits ang dalawang branch, gagawa ang Git ng <strong>merge commit</strong> na may dalawang parent, para pagdugtungin yung dalawang history. Nananatili sa history ang parehong linya kung paano talaga sila nangyari. Maraming team ang pinipilit ang merge commit kahit pwede namang fast-forward (<code>--no-ff</code>), para lumabas ang bawat feature bilang isang malinaw na unit.</p>","merge-conflict":"<p>Automatic na nime-merge ng Git ang karamihan ng changes. Naiipit lang siya pag parehong side ang nag-change ng parehong lines sa parehong file, o pag binura ng isang side yung file na in-edit ng kabila. Dun siya nagsusulat ng conflict markers sa file: yung version mo sa pagitan ng <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code> at <code>=======</code>, yung kanila sa pagitan ng <code>=======</code> at <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt;</code>.</p><p>I-edit mo yung file para maging kung ano dapat siya (sa'yo, sa kanila, o halo), burahin mo yung markers, i-<code>git add</code> mo yung file, at tapusin mo sa commit. Hindi errors ang conflicts. Ayaw lang talaga manghula ng Git.</p>","rebase":"<p>Kinukuha ng rebase yung mga commit sa branch mo at nire-replay sila isa-isa sa ibabaw ng ibang branch, usually main. Ang resulta, parang nagsimula ka sa latest commit ng main, at straight line lang ang history, walang merge commit.</p><p>Ang mga na-replay na commit ay <em>bagong</em> commits na may bagong hashes; naiiwan yung mga luma. Okay lang 'yan sa sarili mong branch, pero pag ni-rebase mo yung commits na na-pull na ng ibang tao, nire-rewrite mo yung history sa ilalim ng paa nila. Ang usual na rule: i-rebase mo lang nang malaya yung local work mo, pero huwag na huwag i-rebase ang shared branches.</p>","stash":"<p>Kinukuha ng <code>git stash</code> yung uncommitted changes mo, tinatabi sila, at nire-reset yung files mo sa last commit. Pwede ka nang mag-switch ng branch o mag-pull nang hindi kino-commit yung kalahating tapos na work. Ibinabalik ng <code>git stash pop</code> yung changes at tinatanggal sila sa shelf; ang <code>git stash apply</code> naman ay ibinabalik sila at nagtatabi ng copy.</p><p>Pwede kang mag-stack ng ilang stash, at pinapakita sila ng <code>git stash list</code>. Sa machine mo lang nakatira ang stashes at madali silang makalimutan, kaya gamitin mo sila para sa maiikling interruption, hindi bilang storage.</p>","cherry-pick":"<p>Minsan isang fix lang ang kailangan mo mula sa isang branch, hindi yung buong branch. Kinukuha ng <code>git cherry-pick a1b2c3d</code> yung changes mula sa commit na 'yon at ina-apply sila bilang bagong commit sa current branch mo.</p><p>May bagong hash yung copy, at nandun pa rin yung original kung nasaan siya, kaya dalawang beses lumalabas yung parehong change sa history. Okay lang 'yan: kung ma-merge yung branch later, kadalasan nakikita ng Git na nandun na yung change. Ang cherry-pick na nag-conflict ay nire-resolve tulad ng kahit anong merge conflict.</p>","tags":"<p>Minamarkahan ng tag ang isang specific na commit at, hindi tulad ng branch, hindi siya gumagalaw kahit kailan. Tina-tag ng mga team yung commit na nire-release nila para lagi nilang mahanap, ma-rebuild, o ma-compare yung exact na version na 'yon later.</p><p>Usually sumusunod ang version numbers sa <strong>semantic versioning</strong>: <code>MAJOR.MINOR.PATCH</code>. I-bump ang PATCH para sa bug fixes (1.6.0 → 1.6.1), MINOR para sa bagong features na walang sinisira (1.6.1 → 1.7.0), at MAJOR para sa breaking changes (1.7.0 → 2.0.0). Hindi napu-push ang tags by default; ang <code>git push --tags</code> ang nagpapadala sa kanila.</p>","remote":"<p>Hindi kailangan ng Git ng server: complete repository ang bawat clone. Ang <strong>remote</strong> ay isa pang copy na binigyan mo ng pangalan, para makapagpadala ka ng commits dito at makakuha ng commits mula dito. Kinokopya ng <code>git clone &lt;url&gt;</code> ang isang repository at pinapangalanan yung source na <code>origin</code>.</p><p>Hindi kusang nagsi-sync ang laptop mo at ang origin. Walang gumagalaw sa pagitan nila hangga't hindi ka nagpu-push, nagfe-fetch, o nagpu-pull. Ganyan nauuwi na behind yung local <code>main</code> mo sa <code>origin/main</code> nang hindi mo napapansin.</p>","push-pull":"<p>Ina-upload ng <code>git push</code> yung commits na meron ka na wala sa remote, at inuusad yung remote branch. Kung may commits ang remote na wala sa'yo, rejected ang push: kailangan mo munang mag-pull, para hindi mo mabura yung work ng iba.</p><p>Dalawang step ang <code>git pull</code>: <code>fetch</code> para i-download ang bagong commits, tapos <code>merge</code> (o <code>rebase</code>, gamit ang <code>git pull --rebase</code>) para ipasok sila sa branch mo. Mag-pull ka nang madalas, para hindi ka masyadong mapag-iwanan.</p>","fetch":"<p>Tinatanong ng <code>git fetch</code> ang remote kung may bago, at sine-save ito sa remote-tracking branches tulad ng <code>origin/main</code>. Yung sarili mong <code>main</code> at yung files mo, walang galaw talaga, kaya laging safe 'to.</p><p>After mag-fetch, pwede kang tumingin muna bago tumalon: pinapakita ng <code>git log main..origin/main</code> kung ano yung paparating. Tapos mag-merge o mag-rebase ka pag ready ka na. Ginagawa ng <code>git pull</code> ang dalawang step nang sabay, convenient pero wala kang chance na tumingin muna.</p>","upstream":"<p>Pag nagta-track ang local branch ng remote branch, masasabi ng <code>git status</code> na “Your branch is ahead of 'origin/main' by 2 commits”. Ahead, ibig sabihin may commits kang ipu-push; behind, ibig sabihin may commits na ipu-pull. Pag pareho, nag-diverge na yung branches.</p><p>Sine-set mo yung pairing sa first push ng bagong branch: <code>git push -u origin feature/x</code>. After nun, alam na ng plain <code>git push</code> at <code>git pull</code> kung saan pupunta.</p>","pull-request":"<p>Ang pull request (PR; merge request o MR ang tawag ng GitLab) ay hindi Git command. Feature 'yan ng hosting service. Ipu-push mo yung branch mo, mag-o-open ka ng PR mula dito papunta sa main, at ipapakita ng page yung diff, discussion, at results ng automated checks.</p><p>Nagko-comment ang teammates sa specific na lines at nag-a-approve o nagre-request ng changes. Magpu-push ka ng dagdag na commits sa parehong branch at mag-a-update yung PR. Pag approved na at pumasa ang checks, mime-merge siya bilang merge commit, squash, o rebase, depende sa setting ng team.</p>","force-push":"<p>Nagdadagdag lang ng commits ang normal na push. After mong mag-rebase o mag-amend, wala na sa branch mo yung version ng remote ng mga commit na 'yon, kaya rejected ang normal na push. Ino-overwrite ng <code>git push --force</code> ang remote branch gamit yung sa'yo.</p><p>Ang delikado: kung may teammate na nag-push sa branch na 'yon in the meantime, mawawala sa remote yung commits niya. Ang <code>--force-with-lease</code> ay nag-o-overwrite lang kung exactly pa rin yung remote sa huling na-fetch mo, kaya ayaw niya pag may mawawalang work ng iba. Huwag na huwag mag-force push sa main o sa ibang shared branches.</p>","branching-strategy":"<p>Ang <strong>Git Flow</strong> ay may dalawang long-lived branches, <code>main</code> (production) at <code>develop</code> (yung next release), plus short-lived na <code>feature/</code>, <code>release/</code>, at <code>hotfix/</code> branches. Structured siya at bagay sa scheduled releases, pero kapalit nun mas maraming merging.</p><p>Ang <strong>Trunk-based development</strong>, at yung pinsan niyang GitHub Flow, ay iisang main branch lang. Maiikli ang feature branches at nime-merge within isa o dalawang araw, at nakatago sa likod ng feature flags yung mga hindi pa tapos na features. Kailangan nito ng magagandang automated tests, at kapalit nun, lahat lagi malapit sa latest code.</p>","hooks-ci":"<p>Ang <strong>Hooks</strong> ay scripts na pinapatakbo ng Git sa machine mo sa ilang specific na points. Ang <code>pre-commit</code> hook ay pwedeng mag-lint at mag-format ng code at i-block ang commit pag pumalya; ang <code>commit-msg</code> hook naman ay pwedeng mag-enforce ng message format. Ini-install sila ng tools tulad ng Husky para sa buong team.</p><p>Ang <strong>CI</strong> (Continuous Integration) ay tumatakbo sa server: bawat push o PR ay nagti-trigger ng pipeline na nagbi-build, nagte-test, at nagche-check ng code. Mas malayo pa ang inaabot ng <strong>CD</strong> (Continuous Delivery o Deployment) at automatic na nagshi-ship ng builds na pumasa, halimbawa pag-deploy ng API pag nagbago ang main.</p>","revert":"<p>Gumagawa ang <code>git revert a1b2c3d</code> ng bagong commit na binabaliktad yung changes ng <code>a1b2c3d</code>. Matatanggal yung lines na dinagdag nito, at babalik yung lines na tinanggal nito. Nananatili sa history yung original na commit, pati yung undo.</p><p>Dahil nagdadagdag lang siya ng commit, safe ang revert sa shared branches tulad ng main: walang history na nare-rewrite. Kaya 'yan ang tamang tool para i-back out ang palpak na change na na-push o na-deploy na.</p>","reset":"<p>Inililipat ng <code>git reset</code> ang current branch (at ang HEAD) sa ibang commit, usually yung mas maaga. Natatanggal sa branch yung commits pagkatapos nun. Kung ano mangyayari sa changes nila, depende sa mode.</p><p>Ang <code>--soft</code> ay pinapanatili silang staged, ready i-commit ulit. Ang <code>--mixed</code>, yung default, ay pinapanatili sila sa files mo pero unstaged. Ang <code>--hard</code> ay tinatapon sila at ginagawang exactly kapareho ng target yung files mo. Nire-rewrite ng reset ang history, kaya gamitin mo lang sa commits na hindi mo pa napu-push, at mag-ingat ka sa <code>--hard</code>: yung uncommitted work na tinapon niya, wala na talaga forever.</p>","interactive-rebase":"<p>Ang <code>git rebase -i HEAD~4</code> ay nag-o-open ng listahan ng huling apat mong commits, bawat isa may command. Palitan ang <code>pick</code> ng <code>squash</code> (o <code>fixup</code>) para isama ang isang commit sa commit bago nito, <code>reword</code> para palitan ang message niya, <code>drop</code> para burahin siya, o galawin ang lines para i-reorder sila.</p><p>Ganito nagiging isang malinis na commit yung “wip”, “fix typo”, at “fix it again” bago ang review. Tulad ng kahit anong rebase, gumagawa siya ng bagong commits, kaya gawin mo 'to bago mag-push, o sa sarili mong branch tapos force push with lease.</p>","reflog":"<p>Tuwing gumagalaw ang HEAD (commit, checkout, reset, rebase, merge), nagsusulat ang Git ng isang line sa reflog. Yung commits na wala nang branch na naka-point sa kanila ay hindi agad nabubura; naka-hide lang sila, at nililista pa rin sila ng reflog.</p><p>After ng palpak na <code>git reset --hard</code> o rebase na sumablay, i-run ang <code>git reflog</code>, hanapin yung entry bago yung mistake, at <code>git reset --hard HEAD@{2}</code> (o gumawa ng branch sa hash na 'yon). Local lang ang reflog, at nag-e-expire ang entries after ng ilang panahon (90 days by default), pero nakakasalba talaga 'to ng career.</p>","detached-head":"<p>Pag nag-checkout ka ng commit hash o tag (<code>git checkout v1.5.0</code>), mapupunta ka sa detached HEAD state. Tugma yung files mo sa commit na 'yon, perfect para mag-inspect o mag-test ng lumang version.</p><p>Kung mag-commit ka dun, nakasabit yung bagong commits sa point na 'yon nang walang branch na humahawak sa kanila. Pag nag-switch ka palayo, nagiging unreachable sila, at eventually lilinisin sila ng Git. Para ma-keep sila, gumawa ka agad ng branch dun mismo: <code>git switch -c my-fix</code>.</p>","bisect":"<p>Alam mong may bug ngayon at wala pa siya sa isang lumang version. I-run ang <code>git bisect start</code>, i-mark ang current commit na <code>bad</code> at yung luma na <code>good</code>. Iche-checkout ng Git yung commit sa kalagitnaan. Ite-test mo, sasagot ka ng <code>good</code> o <code>bad</code>, at hahatiin ulit ng Git yung range.</p><p>Kung 1,000 commits ang pagitan, mga 10 tests lang ang kailangan mo, hindi 1,000. Kung may script na kayang i-distinguish ang good sa bad, ang <code>git bisect run</code> na ang gagawa ng buong search mag-isa.</p>","objects-hashes":"<p>Tatlong main na klase ng objects ang sine-save ng Git. Ang <strong>blob</strong> ay contents ng isang file. Ang <strong>tree</strong> ay folder: listahan ng names na naka-point sa blobs at ibang trees. Ang <strong>commit</strong> ay naka-point sa isang tree (yung buong project sa moment na 'yon), sa parent commits niya, sa author, at sa message.</p><p>Ang ID ng bawat object ay hash ng contents niya. Parehong contents, parehong hash, kaya yung file na hindi nagbago between commits ay isang beses lang sine-save at shine-share. Mag-change ka ng isang byte at magbabago ang hash niya, na magpapabago sa tree hash ng folder niya, na magpapabago sa commit hash. Dahil sa chain na 'yan, hindi pwedeng tahimik na i-edit ang history: kahit anong change ay gagawa ng bagong IDs hanggang sa taas.</p>","three-way-merge":"<p>Kung yung dalawang branch tips lang ang iko-compare, hindi malalaman kung sino nag-change ng ano. Kung magkaiba ang isang line, ikaw ba nag-change o sila? Kaya hinahanap ng Git ang <strong>merge base</strong>, yung pinaka-recent na commit na shared ng dalawang branch, at kino-compare ang bawat side dito.</p><p>Kung isang side lang ang nag-change ng line, kukunin ng Git yung version ng side na 'yon. Kung walang nag-change, kine-keep ito ng Git. Kung parehong nag-change pero magkaiba, conflict 'yan. Kaya madalas malinis mag-merge ang Git, at kaya pag may conflict, ibig sabihin parehong side talaga ang gumalaw sa parehong bagay.</p>","rewriting-history":"<p>Hindi nag-e-edit ng commits ang amend, rebase, reset, at squash. Gumagawa sila ng bagong commits at inililipat ang branch doon. Kung ikaw lang ang may hawak ng lumang commits, walang makakapansin.</p><p>Kung na-pull na ng teammates yung mga luma, nag-diverge na yung copies nila at yung sa'yo, at yung next pull nila ay pwedeng magbalik ng duplicates ng pinalitan mo. Ang golden rule: huwag i-rewrite ang history na na-push na sa shared branch. Ang exception ay leaked secret, kung saan ang tool tulad ng <code>git filter-repo</code> ay nire-rewrite ang lahat at kailangang mag-re-clone ng bawat teammate. Kahit ganun, i-rotate pa rin ang secret, kasi baka may nakakuha na ng copy.</p>","submodules":"<p>Pinapayagan ng submodule na mag-include ang isang repo ng ibang repo, tulad ng shared library, habang hiwalay pa rin ang history nito. Hindi sine-save ng parent repo ang files ng library. Pointer ang sine-save niya: “gamitin ang commit <code>a1b2c3d</code> ng repo na 'yan dito”.</p><p>Gumagalaw lang yung pointer pag may nag-update nito at nag-commit ng change sa parent. Kailangan ng <code>--recurse-submodules</code> pag nagki-clone, kundi empty folder ang makukuha mo. Pag nakalimutan mag-update o mag-push ng isang side, common na source 'yan ng “works on my machine”, kaya maraming team ang nagshi-share na lang ng code bilang npm o NuGet package.</p>"}},"ceb":{"ui":{"show":"Abri contents","hide":"Sira contents","collapse":"I-collapse tanan","expand":"I-expand tanan","start":"diri ta start","done":"Nabuhat na nimo ni, actually","picture":"Imagine-a lang ni","see":"Tan-awa sad","plain":"Simple explanation","enonly":"English pa ni for now. Ang taas nga explanation, i-translate pa namo.","try":"Try-a","nextterm":"Next term →","where":"Asa makita ang matag term","inarch":"Sa Architecture guide","howpage":"Unsaon pag-gamit ani nga page","a1t":"One sentence ra","a4d":"Example gikan sa gawas sa computer, nga ma-gets bisan sa bata.","search":"Pangita: rebase, HEAD, PR…","a1d":"Ang whole idea, naka-spell out pa ang abbreviations.","a2d":"Step-by-step replay: ang command sa taas, unsay gibuhat niini sa commits, ug ngano.","a3d":"Asa ni nimo makita sa imong day-to-day nga Git work.","title":"Git, gi-explain samtang naglihok ang commits sa imong atubangan","intro":"Kadaghanan sa kalibog sa Git, gikan sa usa ka idea nga walay nag-ingon og klaro: ang matag laptop naay complete copy sa repository, ug mausab ra ang copies pag naay mag-push, pull, or fetch. Tan-awa sa ubos, then start sa Beginner.","lv_beginner":"Diri ta start. Tanan nimong kailangan para mag-commit, branch, push, ug pull sa day one.","lv_mid":"Trabaho with the team: merging, conflicts, pull requests, ug pag-stay in sync.","lv_hard":"Pag-rewrite ug pag-undo sa history, team workflows, ug automation.","lv_insane":"Unsaon pag-work sa Git sa sulod, ug mga sayop nga masakitan ang tibuok team."},"one":{"repository":"Project folder plus ang tibuok history niini, naka-tago sa hidden nga .git folder.","commit":"Saved nga snapshot sa imong project at one moment, with message kung unsay giusab ug ngano.","staging-area":"Ang waiting room between sa imong gi-edit nga files ug sa next commit. Ikaw mo-pili unsay iapil gamit ang git add.","diff-status":"Ang status, mo-ingon unsang files ang nausab. Ang diff, mo-pakita mismo unsang lines ang nausab.","gitignore":"List sa files ug folders nga dili i-track sa Git, like dependencies, build output, ug secrets.","head":"Pointer kung asa ka karon: usually ang branch nga naka-checkout ka, ug through ana, ang latest commit sa branch.","branch":"Label nga mo-move ug naka-point sa usa ka commit. Sa branch, pwede ka mag-work nga dili ma-touch ang main.","checkout-switch":"Mo-balhin ka sa laing branch: mausab ang files sa imong folder para mo-match, ug didto na mo-point ang HEAD.","merge":"I-combine ang work gikan sa usa ka branch ngadto sa lain.","merge-conflict":"Pag ang duha ka branch nag-usab sa same lines pero lahi, mo-stop ang Git ug ikaw ang papilion.","rebase":"I-move ang commits sa imong branch para mo-start sila sa dulo sa laing branch, murag later ka ni-start.","stash":"I-tago sa usa ang imong unfinished changes para limpyo ang folder, then ibalik later.","cherry-pick":"I-copy ang usa ka specific commit gikan sa laing branch ngadto sa imong branch karon.","tags":"Permanent nga name nga gi-stick sa usa ka commit, usually version number like v1.6.0.","remote":"Copy sa repository sa laing lugar, usually sa GitHub or GitLab. Ang origin, default name sa imong gi-clone-an.","push-pull":"Push: i-send imong commits sa remote. Pull: kuhaa ang bag-ong commits sa remote ngadto sa imong branch.","fetch":"Ang fetch, mo-download sa bag-ong commits pero walay usbon sa imong branch. pull = fetch + merge.","upstream":"Ang remote branch nga partner sa imong local branch, para ma-ingnan ka sa Git pila ka ahead or behind.","pull-request":"Ang PR (Pull Request; MR or Merge Request sa GitLab) kay request nga i-merge imong branch, with page diin i-review sa imong teammates ang changes una.","force-push":"Pugson ang remote branch nga mo-match sa imoha bisan naay commits nga ma-wala sa remote. Gamita ang --force-with-lease, ayaw ang plain --force.","branching-strategy":"Ang rules sa team: unsang branches naa, asa mag-start ang work, ug unsaon pag-abot sa production.","hooks-ci":"Scripts nga kusa mo-run sa certain Git moments: hooks sa imong machine before commit, ug CI (Continuous Integration) sa server after push.","revert":"I-undo ang commit by adding og bag-ong commit nga baliktad. Buo gihapon ang history.","reset":"I-balik imong branch sa mas old nga commit. Ang mode mo-decide unsay mahitabo sa changes sa tunga.","interactive-rebase":"I-edit ang history sa imong branch before i-share: combine, reorder, rename, or i-drop ang commits.","reflog":"Imong local diary sa tanang naadtoan sa HEAD. Diri nimo ma-recover ang commits nga akala nimo nawala na.","detached-head":"Ang HEAD naka-point direkta sa commit, dili sa branch. Pwede ka mag-look around, pero ang bag-ong commits walay branch.","bisect":"Pangitaa ang commit nga nagdala sa bug gamit binary search: ang Git mo-pili sa tunga, ikaw mo-ingon good or bad.","objects-hashes":"Sa sulod sa .git, ang matag file version, folder, ug commit kay object nga gi-name base sa hash sa sulod.","three-way-merge":"Mo-merge ang Git by comparing sa duha ka branch sa ilang last shared commit, dili lang sa usag usa.","rewriting-history":"Pag-usab sa commits nga naa na sa uban. Ang amend, rebase, ug reset mo-create og bag-ong commits, pero ang copy sa uban, old gihapon.","submodules":"Repository sa sulod sa laing repository, naka-pin sa usa ka exact commit."},"like":{"repository":"Murag notebook nga tanang page nga imong gisulat kay naka-keep ug naay date, ug pwede ka mo-balik bisan asa.","commit":"Murag save point sa video game. Kabalo ang matag usa exactly asa ka, ug pwede ka mo-load og old save anytime.","staging-area":"Murag nag-pack ka og box nga ipadala. Imong desk, working directory. Ang open nga box, staging. Pag gi-tape na nimo with label, commit na.","diff-status":"Murag track changes sa document: red nga strikethrough sa imong gi-remove, green sa gi-add.","gitignore":"Murag “ayaw i-pack” nga list nga gi-tape sa mga box pag mo-balhin og balay.","head":"Murag “You are here” marker sa mapa sa mall.","branch":"Murag bookmarks sa shared nga libro. Pag i-move nimo imong bookmark, di ma-move ang bookmark sa uban.","checkout-switch":"Murag nag-load ka og lain nga save file sa game: ang whole world mo-reload sa kana nga save.","merge":"Murag duha ka sapa nga nag-meet para mahimong usa ka suba. After ana, ang tubig sa duha naa na sa suba.","merge-conflict":"Murag duha ka editors nga lahi og edit sa same sentence. Naay usa nga kinahanglan mo-decide asa ang i-keep.","rebase":"Murag gi-balhin nimo imong sticky notes gikan sa old version sa plan ngadto sa latest, ug gi-adjust ang matag usa para mo-fit.","stash":"Murag gi-swipe nimo tanan sa imong desk ngadto sa drawer kay naay urgent call, then gi-gawas balik after.","cherry-pick":"Murag gi-copy ra nimo ang usa ka recipe sa cookbook sa imong friend, imbes nga kuhaon ang whole book.","tags":"Murag plaque sa building nga nag-ingon kanus-a ni-open. Pwede mausab ang building, pero ang plaque, mark sa kana nga moment.","remote":"Murag imong own photocopy sa team binder. Ang original naa sa office (origin), ug mausab ra imong copy pag adto ka ug mag-sync.","push-pull":"Murag nag-upload ka sa imong edits sa shared drive, ug nag-download sa edits sa uban.","fetch":"Gikuha nimo ang mail ug gibilin sa lamesa, vs. gi-open dayon nimo ug gi-action.","upstream":"Murag step counter nga naka-pair sa step counter sa imong friend, para kabalo ka kung una ka or ginagukod pa nimo siya.","pull-request":"Murag nag-submit og article sa editor. I-markup niya, i-revise nimo, ug saka pa i-print.","force-push":"Murag gi-replace nimo ang shared doc sa imong copy. Okay ra kung ikaw ra nag-edit; disaster kung naay nag-save og changes 1 hour ago.","branching-strategy":"Ang Git Flow, murag factory nga naay separate lines para sa build, test, ug ship. Ang trunk-based, murag kusina nga i-serve dayon ang matag dish pag ready na.","hooks-ci":"Murag spell-checker nga mo-run before ka maka-Send (hook), ug proofreader nga mo-check sa matag printed copy (CI).","revert":"Murag nag-print og correction sa newspaper ugma, imbes nga bawion pa ang tanang copies gahapon.","reset":"Murag nag-rewind og recording. Soft: naa pa sa lamesa ang na-cut nga footage. Mixed: gibalik sa drawer. Hard: na-shred na.","interactive-rebase":"Murag gi-himo nimo og clean summary ang imong magulo nga notes before nimo i-pasa.","reflog":"Murag imong browser history. Na-close na nimo ang tab, pero makita pa gihapon nimo ang page.","detached-head":"Murag ni-gawas ka sa marked nga trail. Okay ra mag-explore, pero pag mo-camp ka, butangi og sign para makit-an nimo balik.","bisect":"Murag guessing game sa number 1 to 100 nga naay mo-ingon “taas pa” or “ubos pa” every guess.","objects-hashes":"Murag library nga i-shelf ang matag libro base sa fingerprint sa iyang text. Pag pareho gyud ang duha ka libro, same spot ra, so usa ra ka copy ang i-keep.","three-way-merge":"Murag nag-combine og duha ka edited copies sa contract by comparing sa matag usa sa original, dili sa usag usa.","rewriting-history":"Murag giusab nimo ang story after nabasa na sa tanan. Imong copy, nausab. Pero ang original gihapon ang na-remember sa uban.","submodules":"Murag libro nga nag-ingon “i-insert diri ang chapter 7 sa 2024 edition sa laing libro” imbes nga i-print na lang."},"done":{"repository":"Ang dashboard, ang .NET API, ug ang player, tag-usa sila ka repository. Pag open nimo ug usa sa VS Code then naay branch name sa ubos nga corner, naa ka sa sulod sa repo.","commit":"Matag <code>git commit -m \"...\"</code>, ug matag pindot sa Commit sa VS Code, mo-create ug usa. Pag ang inyong team nag-sulat ug prefixes like <code>feat:</code> ug <code>fix:</code>, convention na siya nga gitawag ug Conventional Commits.","staging-area":"Sa Source Control panel sa VS Code, ang “Changes” kay imong working directory ug ang “Staged Changes” kay ang staging area. Ang pag-click sa + tupad sa file kay <code>git add</code>.","diff-status":"Ang colored side-by-side view pag i-click nimo ang changed file sa VS Code, ug ang “Files changed” tab sa pull request, parehas na sila diffs.","gitignore":"Ang Angular projects usually mo-ignore sa <code>node_modules/</code> ug <code>dist/</code>, ug ang .NET projects mo-ignore sa <code>bin/</code> ug <code>obj/</code>. Pag naay settings file nga naay real database credentials nga ni-gawas sa diff, usually ang cause ana kay kulang ug line sa .gitignore.","head":"Ang branch name sa imong terminal prompt or sa status bar sa VS Code mao ang gi-point sa HEAD. Pag mo-switch ka ug branch, mo-move ang HEAD.","branch":"Matag <code>git checkout -b feature/...</code> or “Create branch” button nga imong gipindot, nag-create ug usa. Ang branch dropdown sa GitHub or GitLab kay list ra sa mga pointers ani.","checkout-switch":"Pag i-click nimo ang branch name sa status bar sa VS Code then mopili ka ug lain, mao na ni ang ma-run. Pag murag nawala ang files after mo-switch, safe ra na sila: naa ra sila sa pikas branch.","merge":"Pag pindot sa “Merge pull request” sa GitHub or GitLab, mo-merge siya sa main. Ang <code>git pull</code> mo-merge pud, kay ang pull kay fetch then merge.","merge-conflict":"Pag duha ka tawo nag-change sa same file, like parehas nag-edit sa <code>environment.ts</code> or sa same service, diha mo-gawas ang conflicts. Ang “Accept Current / Accept Incoming / Accept Both” buttons sa VS Code mao ang mo-resolve ana.","rebase":"Ang <code>git pull --rebase</code> mo-replay sa imong local commits on top sa imong gi-pull, para wala nay gagmay nga “Merge branch 'main' of …” commits. Ang pag-update sa feature branch gamit ang latest main before pull request kay common nga rebase.","stash":"Tunga-tunga ka sa feature, then naay nag-report ug bug sa main nga kinahanglan ug hotfix karon dayon. Stash, switch sa main, fix, switch balik, pop. Mao na ang classic use.","cherry-pick":"Naay fix nga ni-land sa feature or develop branch, pero kinahanglan na sa production karon. Ang pag-cherry-pick sa kana nga usa ka commit ngadto sa main or release branch gitawag ug backport.","tags":"Ang <code>v1.6.0</code> sa corner sa Adexchange Performance dashboard kay version label, ug ideally mo-match siya sa tag. Ang “Releases” sa GitHub ug GitLab kay naka-build on top sa tags.","remote":"Ang URL nga imong gi-copy gikan sa “Clone” button sa GitHub or GitLab mao ang nag-setup sa origin. Ang <code>git remote -v</code> mo-show ana.","push-pull":"Ang “Updates were rejected because the remote contains work that you do not have locally” meaning naay teammate nga nauna ug push. Pull, i-resolve ang conflicts kung naa, then push balik.","fetch":"Pag mo-show ang VS Code ug ↓3 tupad sa branch name after sa background fetch, naay 3 ka commits sa origin nga wala pa nimo na-merge.","upstream":"Ang “The current branch has no upstream branch” sa imong first push kay ang Git nangayo ana nga <code>-u</code>. Ang ↑2 ↓1 counters sa VS Code kay ahead ug behind.","pull-request":"Ang matag “Review requested” notification ug matag “LGTM” (Looks Good To Me) part ani. Ang branch protection rules nga mo-block sa merge hangtod naay mo-approve mao ang nag-himo nga mandatory ang reviews.","force-push":"After nimo i-rebase ang imong feature branch onto sa latest main para i-update ang pull request, kinahanglan nimo ug force push. Mao na ang safe nga case, kay imo man na nga branch.","branching-strategy":"Pag ang inyong repos naay <code>develop</code> branch nga diha gi-cut ang releases, duol na mo sa Git Flow. Pag ang tanan diretso sa main through PRs ug didto mag-deploy, trunk-based or GitHub Flow na na.","hooks-ci":"Ang green check or red cross tupad sa commit or PR kay result sa CI pipeline. Ang lint error nga ni-stop sa imong commit before pa ni-happen kay pre-commit hook.","revert":"Ang “Revert” button sa merged pull request mao exactly ni ang i-create: bag-ong PR nga mo-undo sa daan.","reset":"Ang <code>git reset --soft HEAD~1</code> kay ang classic nga “sayo kaayo ko ni-commit, usbon nako”. Ang <code>git reset --hard origin/main</code> kay “ilabay na ang akong local mess ug i-match sa remote”.","interactive-rebase":"Ang “Squash and merge” sa pull request mao ni ang buhaton para nimo: ang tanan commits sa PR mahimong usa ra ka commit sa main.","reflog":"Pag na-panic na ka after ug reset then naay teammate nga ni-ingon “check the reflog”, mao ni ang ilang gi-refer.","detached-head":"Pag i-checkout nimo ang daan nga release tag para i-reproduce ang bug gikan sa player build sa field, ma-detached HEAD ka. Ang taas nga warning sa Git nag-ingon ra nga mag-himo ka ug branch kung naa kay gusto i-keep.","bisect":"Ang “Ni-work siya sa v1.5, guba na sa v1.6, ug naay 80 commits sa tunga” mao exactly ang para sa bisect. Mga 7 ka tests ra.","objects-hashes":"Matag short hash nga imong gi-copy gikan sa <code>git log</code> kay usa ani nga IDs. Ang commits kay snapshots, di diffs; ang diffs nga imong makita kay gi-calculate on the fly through pag-compare sa duha ka snapshots.","three-way-merge":"Ang <code>git merge-base main feature/x</code> mo-print sa kana nga shared commit. Ang clean merge nga ikaw ug imong teammate nag-edit sa lain-laing parts sa same file kay three-way merging nga nag-work as expected.","rewriting-history":"Naay ni-force-push sa shared branch, then pagka-ugma daghang teammates ang nakakita ug weird nga duplicate commits after mag-pull. Mao na ni, ug mao na nga usually i-block sa branch protection ang force pushes sa main.","submodules":"Pag ang dashboard ug ang Angular UI sa player nag-share ug set sa components, ang submodule kay usa ka way para i-share sila ug ang private npm package ang laing way. Ang empty folder dayon after mag-clone kay ang classic nga submodule surprise."},"body":{"repository":"<p>Ang repository kay ang files sa imong project plus tanan nga na-save nga version ana. Ang history naa sa hidden nga <code>.git</code> folder sa top sa project. Pag i-delete nimo na nga folder, plain files na lang ang mabilin, walay history; pag i-keep nimo, makabalik ka sa bisan asa nga saved point.</p><p>Makakuha ka ug repository pag mag-run ka ug <code>git init</code> sa usa ka folder, or mag-clone ka sa existing na. Ang matag clone kay full copy, apil ang history, so naa sa imong laptop ang tibuok story, di lang ang latest files.</p>","commit":"<p>Ang commit mo-record sa itsura sa matag tracked file at that moment, kinsa nag-commit, kanus-a, ug usa ka message. Ang matag commit mo-point sa commit before niya, iyang <strong>parent</strong>, so ang commits murag chain: mao na ang imong history.</p><p>Ang matag commit naay ID nga gitawag ug <strong>hash</strong> (or SHA), taas nga string like <code>a1b2c3d…</code> nga usually gi-shorten to 7 characters. I-commit together ang gagmay ug related nga changes, with message nga mo-explain ngano, like <code>fix: retry playlist fetch on timeout</code>. Ang future nimo, nga mobasa sa <code>git log</code> during incident, magpasalamat jud nimo.</p>","staging-area":"<p>Naay tulo ka lugar nga pwede naa ang imong changes. Ang <strong>working directory</strong> kay ang files nga imong gi-edit. Ang <strong>staging area</strong> (gitawag pud ug index) naa ang changes nga imong gipili para sa next commit. Ang <strong>repository</strong> kay ang history sa commits nga na-save na.</p><p>Ang <code>git add</code> mo-move sa changes gikan sa working directory ngadto sa staging. Ang <code>git commit</code> mo-save sa tanan nga staged as usa ka bag-ong commit. Kana nga middle step mao ang mo-allow nimo nga i-commit ra ang part sa imong work: pag naa kay duha ka unrelated nga gi-fix, i-commit sila separately with klaro nga messages.</p>","diff-status":"<p>Ang <code>git status</code> mo-list sa files nga modified, staged, or <strong>untracked</strong> (bag-ong files nga wala pa gi-follow sa Git). Mo-ingon pud siya kung asa nga branch ka naa ug kung ahead or behind ka sa remote.</p><p>Ang <code>git diff</code> mo-show sa changes line by line: ang removed lines red with <code>-</code>, ang added lines green with <code>+</code>. Ang plain <code>git diff</code> mo-show sa unstaged changes; ang <code>git diff --staged</code> mo-show sa imong i-commit na. Ang pag-basa sa diff before every commit mao ang pinaka-cheap nga code review.</p>","gitignore":"<p>Naay files nga di dapat apil sa history. Ang <code>node_modules</code> ug ang .NET <code>bin/</code> ug <code>obj/</code> folders kay dagko kaayo ug pwede ra i-rebuild. Ang build output like <code>dist/</code> kay generated. Ang files like <code>.env</code> naay passwords ug keys nga di jud dapat ma-push.</p><p>Ang <code>.gitignore</code> file mo-list ug patterns, usa per line, then i-skip sa Git ang tanan nga mo-match. Sa untracked files ra siya mo-apply: pag na-commit na ang file, ang pag-add ana sa <code>.gitignore</code> di mo-remove ana sa history. Mao na nga ang leaked secret kinahanglan i-rotate, di lang i-ignore.</p>","head":"<p>Ang HEAD mo-answer sa “asa ko?”. Normally mo-point siya sa branch name, like <code>main</code>, then ang branch mo-point sa commit. Pag mo-commit ka, mo-move forward ang branch sa bag-ong commit ug mo-uban pud ang HEAD.</p><p>Makita pud nimo ang HEAD as starting point sa commands. Ang <code>HEAD~1</code> meaning usa ka commit before sa imong position; ang <code>HEAD~3</code> meaning tulo pabalik. Parehas nag-gamit ani ang <code>git reset HEAD~1</code> ug <code>git diff HEAD~2</code>.</p>","branch":"<p>Ang branch kay named pointer ra sa usa ka commit, mao nga cheap ra ang branches: instant ra ang pag-create. Pag mo-commit ka sa branch, mo-move forward ang pointer niya sa bag-ong commit. Ang ubang branches magpabilin ra sa ilang position.</p><p>Gamit sa teams ang branches para separate ang work. Ang <code>main</code> naa ang na-release na or ready na i-release. Ang matag feature or fix naay kaugalingon nga branch, like <code>feature/scheduler</code>, then mobalik sa main through merge or pull request pag human na.</p>","checkout-switch":"<p>Ang <code>git switch feature/x</code>, or ang mas daan nga <code>git checkout feature/x</code>, mo-change kung asa nga branch ka naa. I-rewrite sa Git ang files sa imong folder para mo-match sa latest commit sa kana nga branch. Ang <code>git switch -c new-branch</code> mo-create ug branch then mo-switch dayon, in one step ra.</p><p>Di mo-switch ang Git pag ma-overwrite ang imong uncommitted changes. I-commit sila, or i-set aside gamit ang stash, then switch.</p>","merge":"<p>Pag wala ni-move ang target branch since ni-branch off ka, pwede ra i-slide sa Git ang pointer niya forward sa imong latest commit. Mao na ang <strong>fast-forward</strong>: walay bag-ong commit nga kinahanglan.</p><p>Pag naay bag-ong commits ang duha ka branches, mag-create ang Git ug <strong>merge commit</strong> nga naay duha ka parents, para i-tie together ang duha ka histories. Ang duha ka lines magpabilin sa history exactly sa pagkahitabo nila. Daghang teams mo-force ug merge commit bisan pwede ang fast-forward (<code>--no-ff</code>), para ang matag feature mo-appear as usa ka klaro nga unit.</p>","merge-conflict":"<p>Automatic ra i-merge sa Git ang most sa changes. Ma-stuck ra siya pag ang duha ka sides nag-change sa same lines sa same file, or ang usa ka side ni-delete sa file nga gi-edit sa pikas. Then mo-sulat siya ug conflict markers sa file: ang imong version between <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code> ug <code>=======</code>, ang ila between <code>=======</code> ug <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt;</code>.</p><p>I-edit nimo ang file sa unsa ang dapat (imo, ila, or mix), i-delete ang markers, <code>git add</code> ang file, then tapuson gamit ang commit. Ang conflicts di errors. Ang Git ra na nga di gusto mag-guess.</p>","rebase":"<p>Ang rebase mo-kuha sa commits sa imong branch then i-replay sila one by one on top sa laing branch, usually main. Ang result murag ni-start ka sa latest commit sa main, ug straight line ra ang history, walay merge commit.</p><p>Ang replayed commits kay <em>bag-o</em> nga commits with bag-ong hashes; ang daan kay mabilin ra. Okay ra na sa imong kaugalingon nga branch, pero pag i-rebase nimo ang commits nga na-pull na sa uban, ma-rewrite nimo ang history nga gigamit na nila. Ang usual rule: rebase freely sa imong local work, pero ayaw jud i-rebase ang shared branches.</p>","stash":"<p>Ang <code>git stash</code> mo-kuha sa imong uncommitted changes, i-save sa gilid, then i-reset ang imong files sa last commit. Pwede na ka mo-switch ug branch or mo-pull nga di mag-commit ug half-done nga work. Ang <code>git stash pop</code> mo-balik sa changes ug i-remove sila sa shelf; ang <code>git stash apply</code> mo-balik sa changes pero mag-keep ug copy.</p><p>Pwede ka mag-stack ug daghang stashes, ug ang <code>git stash list</code> mo-show nila. Ang stashes naa ra sa imong machine ug dali ra kalimtan, so gamita ra sila sa short interruptions, di storage.</p>","cherry-pick":"<p>Usahay usa ra ka fix ang kinahanglan nimo gikan sa branch, di ang tibuok branch. Ang <code>git cherry-pick a1b2c3d</code> mo-kuha sa changes sa kana nga commit then i-apply as bag-ong commit sa imong current branch.</p><p>Ang copy naay bag-ong hash, ug ang original magpabilin ra sa iyang lugar, so ang same change kaduha na sa history. Okay ra na: pag ma-merge ang branch later, usually makita sa Git nga naa na ang change. Ang cherry-pick nga nag-conflict, i-resolve ra like bisan unsang merge conflict.</p>","tags":"<p>Ang tag mo-mark sa specific nga commit ug, di like sa branch, di jud siya mo-move. I-tag sa teams ang commit nga ilang gi-release para makit-an, ma-rebuild, or ma-compare nila ang exact nga version later.</p><p>Ang version numbers usually mo-follow sa <strong>semantic versioning</strong>: <code>MAJOR.MINOR.PATCH</code>. I-bump ang PATCH para sa bug fixes (1.6.0 → 1.6.1), MINOR para sa bag-ong features nga walay maguba (1.6.1 → 1.7.0), ug MAJOR para sa breaking changes (1.7.0 → 2.0.0). Ang tags di ma-push by default; ang <code>git push --tags</code> mo-send nila.</p>","remote":"<p>Di kinahanglan ug server ang Git: ang matag clone kay complete repository. Ang <strong>remote</strong> kay laing copy nga imong gihatagan ug name, para maka-send ka ug commits ngadto ug maka-kuha ka ug commits gikan niya. Ang <code>git clone &lt;url&gt;</code> mo-copy sa repository ug i-name ang source ug <code>origin</code>.</p><p>Ang imong laptop ug origin di mag-sync ra sa ilang kaugalingon. Walay mo-move between nila hangtod mo-push, fetch, or pull ka. Mao na nga ang imong local <code>main</code> ma-behind sa <code>origin/main</code> nga wala nimo namatikdi.</p>","push-pull":"<p>Ang <code>git push</code> mo-upload sa commits nga naa nimo pero wala sa remote, then i-move forward ang remote branch. Pag naay commits ang remote nga wala nimo, ma-reject ang push: kinahanglan ka mo-pull una, para di nimo ma-erase ang work sa uban.</p><p>Ang <code>git pull</code> kay duha ka steps: <code>fetch</code> para i-download ang bag-ong commits, then <code>merge</code> (or <code>rebase</code>, gamit ang <code>git pull --rebase</code>) para i-dala sila sa imong branch. Pull permi, para di ka ma-behind ug layo.</p>","fetch":"<p>Ang <code>git fetch</code> mangutana sa remote kung naay bag-o then i-store sa remote-tracking branches like <code>origin/main</code>. Ang imong kaugalingon nga <code>main</code> ug imong files magpabilin exactly as is, so safe jud siya permi.</p><p>After mag-fetch, pwede ka mo-tan-aw una before mo-ambak: ang <code>git log main..origin/main</code> mo-show kung unsa ang incoming. Then mo-merge or mo-rebase ka pag ready na ka. Ang <code>git pull</code> mo-buhat sa duha ka steps at once, convenient pero di ka makatan-aw una.</p>","upstream":"<p>Pag ang local branch nag-track ug remote branch, maka-ingon ang <code>git status</code> ug “Your branch is ahead of 'origin/main' by 2 commits”. Ang ahead meaning naa kay commits nga i-push; ang behind meaning naay commits nga i-pull. Pag parehas, meaning nag-diverge na ang branches.</p><p>I-set nimo ang pairing sa first push sa bag-ong branch: <code>git push -u origin feature/x</code>. After ana, ang plain <code>git push</code> ug <code>git pull</code> kabalo na asa mo-adto.</p>","pull-request":"<p>Ang pull request (PR; sa GitLab, merge request or MR) di Git command. Feature siya sa hosting service. I-push nimo ang imong branch, mag-open ug PR gikan ana ngadto sa main, then ang page mo-show sa diff, discussion, ug results sa automated checks.</p><p>Ang teammates mo-comment sa specific lines then mo-approve or mo-request ug changes. Mag-push ka ug dugang commits sa same branch then ma-update ang PR. Pag approved na ug pasado ang checks, i-merge siya as merge commit, squash, or rebase, depende sa setting sa team.</p>","force-push":"<p>Ang normal push mo-add ra ug commits. After mo-rebase or mo-amend ka, wala na sa imong branch ang version sa remote sa kana nga commits, so ma-reject ang normal push. Ang <code>git push --force</code> mo-overwrite sa remote branch gamit ang imo.</p><p>Ang delikado: pag naay teammate nga ni-push sa kana nga branch in the meantime, mawala ilang commits sa remote. Ang <code>--force-with-lease</code> mo-overwrite ra pag ang remote exactly pareha pa sa imong last fetch, so mo-refuse siya pag naay work sa uban nga mawala. Ayaw jud mag-force push sa main or sa ubang shared branches.</p>","branching-strategy":"<p>Ang <strong>Git Flow</strong> naay duha ka long-lived branches, <code>main</code> (production) ug <code>develop</code> (ang next release), plus short-lived <code>feature/</code>, <code>release/</code>, ug <code>hotfix/</code> branches. Structured siya ug bagay sa scheduled releases, pero mas daghan ang merging.</p><p>Ang <strong>trunk-based development</strong>, ug iyang cousin nga GitHub Flow, usa ra ka main branch. Ang feature branches mubo ra ug ma-merge within usa or duha ka adlaw, ug ang unfinished features gitago behind feature flags. Kinahanglan ani ug nindot nga automated tests, pero in return ang tanan duol ra sa latest code.</p>","hooks-ci":"<p>Ang <strong>hooks</strong> kay scripts nga i-run sa Git sa imong machine sa certain points. Ang <code>pre-commit</code> hook pwede mag-lint ug mag-format sa code then i-block ang commit pag ni-fail; ang <code>commit-msg</code> hook pwede mo-enforce ug message format. Ang tools like Husky mo-install ani para sa tibuok team.</p><p>Ang <strong>CI</strong> (Continuous Integration) mo-run sa server: matag push or PR mo-trigger ug pipeline nga mo-build, mo-test, ug mo-check sa code. Ang <strong>CD</strong> (Continuous Delivery or Deployment) mas layo pa ug automatic nga mo-ship sa passing builds, example i-deploy ang API pag mausab ang main.</p>","revert":"<p>Ang <code>git revert a1b2c3d</code> mo-create ug bag-ong commit nga mo-reverse sa changes sa <code>a1b2c3d</code>. Ang lines nga gi-add niya ma-remove, ug ang lines nga gi-remove niya mobalik. Ang original commit magpabilin sa history, ug pati ang undo.</p><p>Kay mo-add ra man siya ug commit, safe ang revert sa shared branches like main: walay history nga ma-rewrite. Mao nga siya ang sakto nga tool para i-back out ang bad change nga na-push or na-deploy na.</p>","reset":"<p>Ang <code>git reset</code> mo-move sa current branch (ug HEAD) sa laing commit, usually mas daan. Ang commits after ana mahulog sa branch. Unsa mahitabo sa ilang changes, depende sa mode.</p><p>Ang <code>--soft</code> mo-keep nila nga staged, ready i-commit balik. Ang <code>--mixed</code>, ang default, mo-keep nila sa imong files pero unstaged. Ang <code>--hard</code> mo-labay nila ug i-match exactly ang imong files sa target. Ang reset mo-rewrite sa history, so gamita ra sa commits nga wala pa na-push, ug pag-amping sa <code>--hard</code>: ang uncommitted work nga iyang ma-discard, wala na jud for good.</p>","interactive-rebase":"<p>Ang <code>git rebase -i HEAD~4</code> mo-open ug list sa imong last four commits, matag usa naay command. I-change ang <code>pick</code> to <code>squash</code> (or <code>fixup</code>) para i-fold ang commit sa commit before niya, <code>reword</code> para usbon ang message, <code>drop</code> para i-delete, or i-move ang lines para i-reorder.</p><p>Mao ni ang way nga ang “wip”, “fix typo”, ug “fix it again” mahimong usa ka limpyo nga commit before review. Like sa tanan nga rebase, mo-create siya ug bag-ong commits, so buhata before mo-push, or sa imong kaugalingon nga branch then sundan ug force push with lease.</p>","reflog":"<p>Matag mo-move ang HEAD (commit, checkout, reset, rebase, merge), mag-sulat ang Git ug line sa reflog. Ang commits nga wala nay branch nga nag-point nila di dayon ma-delete; gitago ra sila, ug naa pa sila sa list sa reflog.</p><p>After sa sayop nga <code>git reset --hard</code> or rebase nga nasayop, i-run ang <code>git reflog</code>, pangitaa ang entry before sa mistake, then <code>git reset --hard HEAD@{2}</code> (or mag-create ug branch sa kana nga hash). Local ra ang reflog, ug ang entries mo-expire after a while (90 days by default), pero daghan na ni naluwas nga careers.</p>","detached-head":"<p>Ang pag-checkout sa commit hash or tag (<code>git checkout v1.5.0</code>) mo-butang nimo sa detached HEAD state. Ang imong files mo-match sa kana nga commit, perfect para mo-inspect or mo-test ug daan nga version.</p><p>Pag mo-commit ka diha, ang bag-ong commits mag-hang off sa kana nga point nga walay branch nga nag-hold nila. Pag mo-switch ka palayo, mahimo silang unreachable, ug eventually limpyohan sila sa Git. Para ma-keep, mag-create ug branch diha dayon: <code>git switch -c my-fix</code>.</p>","bisect":"<p>Kabalo ka nga naa ang bug karon ug wala pa sa usa ka daan nga version. I-run ang <code>git bisect start</code>, i-mark ang current commit nga <code>bad</code> ug ang daan nga <code>good</code>. I-checkout sa Git ang commit sa tunga. I-test nimo then answer <code>good</code> or <code>bad</code>, then i-halve balik sa Git ang range.</p><p>Pag 1,000 commits sa tunga, mga 10 tests ra imong kinahanglan, di 1,000. Pag naay script nga makaila sa good ug bad, ang <code>git bisect run</code> mo-buhat sa tibuok search by itself.</p>","objects-hashes":"<p>Naay tulo ka main nga klase sa objects nga gi-store sa Git. Ang <strong>blob</strong> kay ang contents sa usa ka file. Ang <strong>tree</strong> kay folder: list sa names nga mo-point sa blobs ug ubang trees. Ang <strong>commit</strong> mo-point sa usa ka tree (ang tibuok project at that moment), iyang parent commits, ang author, ug ang message.</p><p>Ang ID sa matag object kay hash sa iyang contents. Same contents, same hash, so ang file nga wala nausab between commits kausa ra i-store ug shared. Usba ang usa ka byte then mausab ang hash niya, then mausab ang tree hash sa iyang folder, then mausab ang commit hash. Kana nga chain mao ang reason nga di ma-edit ang history nga walay makabantay: bisan unsa nga change mo-produce ug bag-ong IDs hangtod sa taas.</p>","three-way-merge":"<p>Pag i-compare ra ang duha ka branch tips, di nimo mahibal-an kinsa nag-change sa unsa. Pag lahi ang line, ikaw ba nag-change or sila? So pangitaon sa Git ang <strong>merge base</strong>, ang pinaka-recent nga commit nga shared sa duha ka branches, then i-compare ang matag side against ana.</p><p>Pag usa ra ka side ang nag-change sa line, kuhaon sa Git ang version sa kana nga side. Pag walay nag-change, i-keep ra sa Git. Pag parehas nag-change pero lahi, conflict na. Mao na nga kanunay ra clean ang merge sa Git, ug mao pud nga pag naay conflict, meaning parehas jud nga sides ni-hilabot sa same thing.</p>","rewriting-history":"<p>Ang amend, rebase, reset, ug squash di mo-edit sa commits. Mag-create sila ug bag-ong commits then i-move ang branch ngadto nila. Pag ikaw ra ang naay old commits, walay makabantay.</p><p>Pag na-pull na sa teammates ang old commits, nag-diverge na ang ilang copies ug imo, ug ang ilang next pull basin mo-dala balik ug duplicates sa imong gi-replace. Golden rule: ayaw i-rewrite ang history nga na-push na sa shared branch. Exception ang leaked secret: ang tool like <code>git filter-repo</code> mo-rewrite sa tanan ug kinahanglan mag-re-clone ang tanan teammates. Bisan pa ana, i-rotate ang secret, kay basin naay naka-copy na.</p>","submodules":"<p>Ang submodule mo-allow sa usa ka repo nga i-include ang laing repo, like shared library, pero separate gihapon ang history. Ang parent repo di mo-store sa files sa library. Pointer ra ang iyang i-store: “gamita diri ang commit <code>a1b2c3d</code> sa kana nga repo”.</p><p>Kana nga pointer mo-move ra pag naay mo-update ana ug mo-commit sa change sa parent. Ang pag-clone kinahanglan ug <code>--recurse-submodules</code>, or empty folder ang imong makuha. Ang pagkalimot nga i-update or i-push ang usa ka side kay common nga source sa “works on my machine”, mao nga daghang teams mo-share na lang ug code as npm or NuGet package.</p>"}}};
