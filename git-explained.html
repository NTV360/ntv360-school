<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Git Field Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: dashboard skin. Fixed left rail = contents + search; right = full-width workspace of sharp bordered panels. Single dark look by design. */
:root{
  color-scheme:dark;
  --bg:#0c161b; --rail:#0f1b21; --panel:#111e25; --panel2:#18272f; --ink:#eef2f4; --muted:#8a9aa3; --line:#22333c; --line2:#2c3f49;
  --brand:#ff6a1a; --req:#4f8cff; --ad:#2ccf7f; --slot:#f5a524; --bad:#ff4d4f; --pop:#a78bfa; --pi:#ff6a1a; --on:#0b1419; --paper:#111e25;
  --sans:'Jost',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:15px;padding:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
::selection{background:var(--brand);color:var(--on)}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}

/* ---------- rail ---------- */
.rail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;
  position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start}
.brand{padding:22px 22px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.brand img{display:block;height:28px;width:auto}
.brand small{display:block;margin-top:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.search{margin:16px 16px 6px;position:relative}
.search input{width:100%;height:40px;border-radius:0;border:1px solid var(--line2);background:var(--panel);padding:0 36px 0 34px;font-size:14px}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--brand);outline:none}
.search svg{position:absolute;left:10px;top:11px;width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2}
.search kbd{position:absolute;right:8px;top:10px;font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line2);padding:1px 6px}
.found{padding:4px 18px 4px;font-family:var(--mono);font-size:10.5px;color:var(--muted);min-height:18px;letter-spacing:.3px}
.toc{overflow:auto;padding:4px 10px 16px;flex:1}
.ch{margin-top:16px}
.ch h3{font-family:var(--mono);font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);margin:0 10px 6px;font-weight:600;display:flex;gap:8px}
.ch h3 i{font-style:normal;color:var(--brand)}
.toc button{display:flex;flex-wrap:wrap;width:100%;align-items:baseline;gap:4px 10px;text-align:left;background:none;border:0;border-left:2px solid transparent;
  padding:7px 10px 7px 14px;cursor:pointer;font-size:14.5px;font-weight:500;color:color-mix(in srgb,var(--ink) 82%,var(--muted))}
.toc button:hover{background:var(--panel);color:var(--ink)}
.toc button.on{background:var(--panel2);border-left-color:var(--brand);color:var(--ink);font-weight:600}
.toc button .pg{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.toc button mark{background:color-mix(in srgb,var(--brand) 35%,transparent);color:inherit;padding:0 1px}
.toc .via{display:block;flex-basis:100%;order:3;font-size:11.5px;color:var(--muted);font-weight:400}
.empty{padding:14px 18px;font-size:13px;color:var(--muted);line-height:1.5}
.railfoot{border-top:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
.railfoot span{font-family:var(--mono);font-size:11px;color:var(--ink);border:1px solid var(--line2);padding:2px 7px}
.mtoggle{display:none}

/* ---------- workspace ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 28px;
  position:sticky;top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);z-index:5}
.crumb{font-family:var(--mono);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:600}
.tnav{margin-left:auto;display:flex;align-items:stretch;border:1px solid var(--line2)}
.tnav button{background:var(--panel);border:0;padding:0 12px;height:34px;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.tnav button:hover:not([disabled]){color:var(--ink);background:var(--panel2)}
.tnav button[disabled]{opacity:.35;cursor:default}
.tnav span{display:flex;align-items:center;padding:0 12px;border-inline:1px solid var(--line2);font-family:var(--mono);font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums}

.page{padding:26px 28px 28px;flex:1}
.page.turn-n{animation:turnN .32s cubic-bezier(.2,.7,.2,1)}
.page.turn-p{animation:turnP .32s cubic-bezier(.2,.7,.2,1)}
@keyframes turnN{from{opacity:0;transform:translateX(22px)}}
@keyframes turnP{from{opacity:0;transform:translateX(-22px)}}

.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--brand);font-weight:600;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:8px;height:8px;background:var(--brand)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 24px;margin-bottom:20px}
.head .l{min-width:0;flex:1 1 420px}
.term{font-size:clamp(28px,3.4vw,40px);line-height:1.05;margin:8px 0 8px;font-weight:700;letter-spacing:-.6px;text-wrap:balance}
.one{font-size:16.5px;line-height:1.5;margin:0;color:var(--muted);max-width:80ch;text-wrap:pretty}
.one code{font-family:var(--mono);font-size:.85em}
.aka{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:520px}
.aka span{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);background:var(--panel);padding:4px 8px;color:var(--muted)}

.grid{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(300px,1fr);gap:16px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);min-width:0}
.ph{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.ph .ic{width:32px;height:32px;border:1px solid var(--brand);display:grid;place-items:center;flex-shrink:0}
.ph .ic svg{width:16px;height:16px;stroke:var(--brand);fill:none;stroke-width:1.8}
.ph h2{font-size:15.5px;font-weight:600;margin:0}
.ph .act{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);background:none;border:0;cursor:pointer;padding:4px 0}
.ph .act:hover{color:var(--ink)}
.pb{padding:18px}
.lab{font-family:var(--mono);font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
.lab em{font-style:normal;color:var(--brand)}

.stats{display:flex;flex-wrap:wrap;gap:0;margin:-18px -18px 16px;border-bottom:1px solid var(--line)}
.stats:empty{display:none}
.stat{display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:6px;padding:12px 18px;border-right:1px solid var(--line);min-width:0;flex:1 1 140px}
.stat b{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.3px}
.stat span{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase;line-height:1.3}
.stage{width:100%;position:relative}
.stage canvas{display:block}
.ctrl{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin:16px -18px -18px;padding:14px 18px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--rail) 60%,var(--panel))}
.ctrl:empty{display:none}
.sl{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;flex-wrap:wrap}
.sl input{width:150px;accent-color:var(--brand)}
.sl output{font-family:var(--mono);font-size:11.5px;color:var(--brand);min-width:62px}
.tg{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;font-weight:500;user-select:none}
.tg input{position:absolute;opacity:0;width:1px;height:1px}
.sw{width:38px;height:20px;background:var(--panel2);border:1px solid var(--line2);position:relative;transition:background .2s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;background:var(--muted);transition:all .2s}
.tg input:checked + .sw{background:var(--brand);border-color:var(--brand)}
.tg input:checked + .sw::after{left:21px;background:var(--on)}
.tg input:focus-visible + .sw{outline:2px solid var(--brand);outline-offset:2px}
.btn{border:1px solid var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand);padding:7px 13px;
  font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:600;cursor:pointer}
.btn:hover{background:var(--brand);color:var(--on)}
.btn.ghost{border-color:var(--line2);background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--panel2);color:var(--ink)}
.cap{font-size:13.5px;color:var(--muted);margin:14px 0 0;line-height:1.5}
.cap b{font-family:var(--mono);color:var(--brand);font-weight:600;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;margin-right:8px}

.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.txt p{font-size:15.5px;line-height:1.65;margin:0 0 12px;max-width:72ch;color:color-mix(in srgb,var(--ink) 88%,var(--muted))}
.txt p:last-child{margin-bottom:0}
.txt strong{color:var(--ink);font-weight:600}
.txt em{color:var(--ink)}
.txt code{font-family:var(--mono);font-size:.82em;background:var(--panel2);border:1px solid var(--line);padding:1px 5px}
.note{border-left:2px solid var(--ad)}
.note .lab{color:var(--ad)}
.likep{border-left:2px solid var(--pop)}
.likep .lab{color:var(--pop)}
.see{display:flex;flex-direction:column}
.see button{display:flex;align-items:center;gap:12px;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;text-align:left;cursor:pointer;font-size:14.5px;font-weight:500}
.see button:first-child{border-top:0;padding-top:0}
.see button:hover{color:var(--brand)}
.see button i{font-style:normal;font-family:var(--mono);font-size:11px;width:24px;height:24px;border:1px solid var(--brand);color:var(--brand);display:grid;place-items:center;flex-shrink:0}
.see button small{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.plain{margin-top:16px}
.plain .pb{columns:2 380px;column-gap:40px}
.plain .pb p{break-inside:avoid}

/* cover */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);padding:16px 18px}
.kpi:first-child{border-left:2px solid var(--brand)}
.kpi .lab{margin-bottom:8px}
.kpi b{font-size:34px;font-weight:600;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.kpi:first-child b{color:var(--brand)}
.kpi p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;align-items:start}
.row{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 18px;text-align:left;cursor:pointer;min-width:0}
.row:first-child{border-top:0}
.row:hover{background:var(--panel2)}
.row i{font-style:normal;font-family:var(--mono);font-size:11px;width:26px;height:26px;border:1px solid var(--brand);color:var(--brand);display:grid;place-items:center;flex-shrink:0}
.row div{min-width:0;flex:1}
.row strong{display:block;font-size:14.5px;font-weight:600}
.row span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.anat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.anat div{padding:16px 18px;border-right:1px solid var(--line);font-size:13.5px;line-height:1.5;color:var(--muted)}
.anat div:last-child{border-right:0}
.anat b{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14.5px;font-weight:600;margin-bottom:4px}
.anat b::before{content:"";width:8px;height:8px;background:var(--c)}


/* levels, abbreviations, cover extras */
.grp{display:flex;margin:4px 16px 2px;border:1px solid var(--line2)}
.grp button{flex:1;background:var(--panel);border:0;padding:6px 0;font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);cursor:pointer}
.grp button+button{border-left:1px solid var(--line2)}
.grp button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--brand)}
.lvd{width:7px;height:7px;flex-shrink:0;align-self:center}
.lvb{font-family:var(--mono);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--c);border:1px solid var(--c);padding:2px 7px;background:color-mix(in srgb,var(--c) 12%,transparent)}
.eyebrow span{color:var(--muted)}
.eyebrow:has(.lvb)::before{display:none}
.full{display:flex;flex-wrap:wrap;gap:6px 18px;margin:2px 0 12px;padding:0}
.full div{display:flex;gap:8px;align-items:baseline}
.full dt{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--brand)}
.full dd{margin:0;font-size:14px;color:var(--ink)}
.where{display:flex;flex-direction:column}
.wh{padding:14px 18px;border-top:1px solid var(--line)}
.wh:first-child{border-top:0}
.wh .lab{margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:var(--panel2);border:1px solid var(--line2);padding:4px 9px;font-size:12.5px;cursor:pointer}
.chips button:hover{border-color:var(--brand);color:var(--brand)}
.kpi.lvk{text-align:left;cursor:pointer;border-left:2px solid var(--c);font:inherit;color:inherit}
.kpi.lvk b{color:var(--c)}
.kpi.lvk:hover{background:var(--panel2)}
.row i{border-color:var(--c,var(--brand));color:var(--c,var(--brand))}
.arch3d{position:relative;width:100%;overflow:hidden;background:radial-gradient(ellipse at 55% 40%,color-mix(in srgb,var(--panel2) 70%,transparent),transparent 70%)}
.arch3d canvas{display:block;cursor:grab}
.arch3d canvas:active{cursor:grabbing}
.a3lab{position:absolute;inset:0;pointer-events:none}
.a3l{position:absolute;left:0;top:0;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line2);border-left:2px solid var(--brand);padding:4px 8px;white-space:nowrap}
.a3l b{display:block;font-size:12.5px;font-weight:600}
.a3l span{display:block;font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.4px}
.a3l.g{border-left-color:var(--ad)}.a3l.b{border-left-color:var(--req)}.a3l.o{border-left-color:var(--pi)}.a3l.p{border-left-color:var(--pop)}.a3l.y{border-left-color:var(--slot)}
.a3l.m{border:0;background:none;font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--muted)}
.a3pk{position:absolute;left:0;top:0;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--on);padding:2px 6px;white-space:nowrap}
.a3toast{position:absolute;left:12px;top:12px;background:var(--panel);border:1px solid var(--ad);border-left:3px solid var(--ad);padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--ad);opacity:0;transform:translateY(-6px);transition:all .3s;pointer-events:none}
.a3toast.on{opacity:1;transform:none}
.a3hint{position:absolute;right:10px;bottom:8px;font-family:var(--mono);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);transition:opacity .4s}
@media (max-width:700px){.a3l span{display:none}.a3l b{font-size:11px}}


/* folding + cross-links */
.ch h3{margin:0 0 4px}
.gh{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:4px 10px;cursor:pointer;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;text-align:left}
.gh:hover{color:var(--ink)}
.gh svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.6;transition:transform .2s;flex-shrink:0}
.gh em{margin-left:auto;font-style:normal;color:var(--muted);font-size:10px}
.ch.shut .gh svg{transform:rotate(-90deg)}
.ch.shut .gi{display:none}
.found{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fold{background:none;border:0;padding:0;font-family:var(--mono);font-size:10.5px;color:var(--brand);cursor:pointer;letter-spacing:.3px}
.fold:hover{text-decoration:underline}
.fh{width:100%;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;font:inherit;color:inherit}
.fh:hover{background:var(--panel2)}
.fh h2 small{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:500;margin-left:6px}
.chev{width:14px!important;height:14px!important;transition:transform .2s}
.fp.shut .chev{transform:rotate(-90deg)}
.fp.shut .fh{border-bottom:0}
.fp.shut .fb{display:none}
a.xref{color:inherit;text-decoration:underline dotted color-mix(in srgb,var(--brand) 80%,transparent);text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:pointer}
a.xref:hover{color:var(--brand);text-decoration-style:solid}
.xpop{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line2);border-top:2px solid var(--brand);padding:12px 14px;box-shadow:0 18px 40px -16px rgb(0 0 0 / .7);pointer-events:none}
.xpop .xh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.xpop .xh b{font-size:15px}
.xpop .xf{font-size:12px;color:var(--muted);margin-bottom:6px}
.xpop .xf span{font-family:var(--mono);color:var(--brand);font-weight:700}
.xpop p{margin:0;font-size:13.5px;line-height:1.5}
.xpop p code{font-family:var(--mono);font-size:.85em}
.xpop .xo{margin-top:8px;font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
@media (hover:none){.xpop{display:none}}

.toc .gh{display:flex;font-family:var(--mono);font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;font-weight:600;color:var(--muted);border-left:0;padding:4px 10px;background:none}
.toc .gh:hover{background:none;color:var(--ink)}
@media (max-width:1180px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.anat{grid-template-columns:repeat(2,minmax(0,1fr))}.anat div:nth-child(2){border-right:0}.anat div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .mtoggle{display:block;margin:4px 16px 12px;width:calc(100% - 32px)}
  .rail:not(.open) .toc,.railfoot{display:none}
  .toc{max-height:55vh}
  .topbar{padding:0 16px}
  .page{padding:20px 16px}
  .aka{justify-content:flex-start}
  .pb{padding:14px}
  .stats{margin:-14px -14px 14px}.ctrl{margin:14px -14px -14px;padding:12px 14px}
  .stat{padding:10px 14px;flex-basis:110px}.stat b{font-size:20px}
  .sl input{width:120px}
  .chgrid{grid-template-columns:1fr}
}
@media (max-width:520px){.anat{grid-template-columns:1fr}.anat div{border-right:0;border-bottom:1px solid var(--line)}.tnav button.word{display:none}}
@media (prefers-reduced-motion:reduce){.page.turn-n,.page.turn-p{animation:none}}
/* guide switcher */
.guides{display:flex;gap:6px;flex-wrap:wrap}

<script>
const CHAPTERS=[
 {n:'I',name:'The basics',blurb:'Repositories, commits, staging, and what Git is tracking.'},
 {n:'II',name:'Branching',blurb:'Branches, merging, rebasing, and moving work between them.'},
 {n:'III',name:'Working with others',blurb:'Remotes, pushing, pulling, pull requests, and team rules.'},
 {n:'IV',name:'Undoing things',blurb:'Revert, reset, reflog, and finding the commit that broke it.'},
 {n:'V',name:'Under the hood',blurb:'How Git stores history, merges, and why rewriting it hurts.'}
];
const TERMS=[
/* ---------- I. basics ---------- */
{id:'repository',ch:0,t:'Repository',aka:['repo','.git folder','git init','project history'],
 one:`A project folder plus its complete history, stored in a hidden .git folder.`,
 body:`<p>A repository is your project's files together with every saved version of them. The history lives in a hidden <code>.git</code> folder at the top of the project. Delete that folder and you have plain files with no history; keep it and you can go back to any saved point.</p><p>You get a repository by running <code>git init</code> in a folder, or by cloning one that already exists. Every clone is a full copy, history included, so your laptop holds the whole story, not just the latest files.</p>`,
 done:`The dashboard, the .NET API, and the player are each a repository. When you open one in VS Code and see a branch name in the bottom corner, you're inside a repo.`,
 like:`A notebook where every page you've ever written is kept and dated, and you can flip back to any of them.`,
 demo:'repository',cap:`Save a few versions and watch the history grow inside .git. Then try deleting .git.`,rel:['commit','remote','objects-hashes']},
{id:'commit',ch:0,t:'Commit',aka:['git commit','snapshot','commit message','hash','SHA','parent'],
 one:`A saved snapshot of your project at one moment, with a message saying what changed and why.`,
 body:`<p>A commit records what every tracked file looked like at that moment, who made it, when, and a message. Each commit points to the one before it, its <strong>parent</strong>, so commits form a chain: your history.</p><p>Every commit gets an ID called a <strong>hash</strong> (or SHA), a long string like <code>a1b2c3d…</code> that's usually shortened to 7 characters. Commit small, related changes together with a message that explains why, like <code>fix: retry playlist fetch on timeout</code>. Future you, reading <code>git log</code> during an incident, will be grateful.</p>`,
 done:`Every <code>git commit -m "..."</code>, and every press of Commit in VS Code, makes one. If your team writes prefixes like <code>feat:</code> and <code>fix:</code>, that's a convention called Conventional Commits.`,
 like:`Save points in a video game. Each one remembers exactly where you were, and you can always load an older one.`,
 demo:'commit',cap:`Each commit points back to its parent. Watch the chain grow, and the branch label move with it.`,rel:['staging-area','branch','objects-hashes']},
{id:'staging-area',ch:0,t:'Staging area',aka:['index','git add','working directory','the three trees','staged','unstaged'],
 one:`The waiting room between your edited files and your next commit. You choose what goes in with git add.`,
 body:`<p>Your changes can be in three places. The <strong>working directory</strong> is the files you're editing. The <strong>staging area</strong> (also called the index) holds the changes you've picked for the next commit. The <strong>repository</strong> is the history of commits already saved.</p><p><code>git add</code> moves changes from the working directory into staging. <code>git commit</code> saves everything staged as one new commit. That middle step lets you commit only part of your work: fix two unrelated things, then commit them separately with clear messages.</p>`,
 done:`In VS Code's Source Control panel, "Changes" is your working directory and "Staged Changes" is the staging area. Clicking the + next to a file is <code>git add</code>.`,
 like:`Packing a box to ship. Your desk is the working directory, the open box is staging, and taping it shut with a label is the commit.`,
 demo:'staging-area',cap:`Stage two files, leave one out, then commit. Only what was staged gets saved.`,rel:['commit','diff-status','stash']},
{id:'diff-status',ch:0,t:'git status & git diff',aka:['status','diff','changes','modified','untracked'],
 one:`status tells you which files changed. diff shows exactly which lines changed.`,
 body:`<p><code>git status</code> lists files that are modified, staged, or <strong>untracked</strong> (new files Git isn't following yet). It also says which branch you're on and whether you're ahead of or behind the remote.</p><p><code>git diff</code> shows line-by-line changes: removed lines in red with <code>-</code>, added lines in green with <code>+</code>. Plain <code>git diff</code> shows unstaged changes; <code>git diff --staged</code> shows what you're about to commit. Reading the diff before every commit is the cheapest code review there is.</p>`,
 done:`The colored side-by-side view when you click a changed file in VS Code, and the "Files changed" tab of a pull request, are both diffs.`,
 like:`Track changes in a document: red strikethrough for what you removed, green for what you added.`,
 demo:'diff-status',cap:`The file gets edited step by step. Watch status and diff describe each change.`,rel:['staging-area','commit','merge-conflict']},
{id:'gitignore',ch:0,t:'.gitignore',aka:['ignore','node_modules','.env','secrets','bin/obj'],
 one:`A list of files and folders Git should never track, like dependencies, build output, and secrets.`,
 body:`<p>Some files don't belong in history. <code>node_modules</code> and the .NET <code>bin/</code> and <code>obj/</code> folders are huge and can be rebuilt. Build output like <code>dist/</code> is generated. Files like <code>.env</code> hold passwords and keys that must never be pushed.</p><p>A <code>.gitignore</code> file lists patterns, one per line, and Git skips anything matching them. It only affects untracked files: if a file was already committed, adding it to <code>.gitignore</code> won't remove it from history. That's why a leaked secret has to be rotated, not just ignored.</p>`,
 done:`Angular projects normally ignore <code>node_modules/</code> and <code>dist/</code>, and .NET projects ignore <code>bin/</code> and <code>obj/</code>. If a settings file with real database credentials ever appeared in a diff, a missing .gitignore line is the usual cause.`,
 like:`A "do not pack" list taped to the moving boxes.`,
 demo:'gitignore',cap:`Files head for the repository. The ones that match a .gitignore pattern get stopped at the door.`,rel:['staging-area','diff-status','rewriting-history']},
{id:'head',ch:0,t:'HEAD',aka:['current branch','HEAD~1','HEAD^','where am I'],
 one:`A pointer to where you are right now: usually the branch you have checked out, and through it, that branch's latest commit.`,
 body:`<p>HEAD answers "where am I?". Normally it points to a branch name, like <code>main</code>, and the branch points to a commit. When you commit, the branch moves forward to the new commit and HEAD moves along with it.</p><p>You'll also see HEAD as a starting point in commands. <code>HEAD~1</code> means one commit before where you are; <code>HEAD~3</code> means three back. <code>git reset HEAD~1</code> and <code>git diff HEAD~2</code> both use it.</p>`,
 done:`The branch name in your terminal prompt or VS Code's status bar is what HEAD points to. Switching branches moves HEAD.`,
 like:`The "You are here" marker on a mall map.`,
 demo:'head',cap:`Watch HEAD ride along with the branch as you commit, then jump when you switch.`,rel:['branch','detached-head','reset']},
/* ---------- II. branching ---------- */
{id:'branch',ch:1,t:'Branch',aka:['git branch','feature branch','main','master'],
 one:`A movable label pointing at a commit. A branch lets you work on something without touching main.`,
 body:`<p>A branch is just a named pointer to a commit, which makes branches cheap: creating one is instant. When you commit on a branch, its pointer moves forward to the new commit. Other branches stay where they were.</p><p>Teams use branches to keep work separate. <code>main</code> holds what's released or ready to release. Each feature or fix gets its own branch, like <code>feature/scheduler</code>, and comes back into main through a merge or pull request when it's done.</p>`,
 done:`Every <code>git checkout -b feature/...</code> or "Create branch" button you've pressed made one. The branch dropdown on GitHub or GitLab is the list of these pointers.`,
 like:`Bookmarks in a shared book. Moving your bookmark forward doesn't move anyone else's.`,
 demo:'branch',cap:`Create a branch, commit on it, and switch back. main never moves.`,rel:['head','checkout-switch','merge']},
{id:'checkout-switch',ch:1,t:'checkout & switch',aka:['git checkout','git switch','change branch','switch -c'],
 one:`Moves you to another branch: the files in your folder change to match it, and HEAD points at it.`,
 body:`<p><code>git switch feature/x</code>, or the older <code>git checkout feature/x</code>, changes which branch you're on. Git rewrites the files in your folder to match that branch's latest commit. <code>git switch -c new-branch</code> creates a branch and switches to it in one step.</p><p>Git refuses to switch if your uncommitted changes would be overwritten. Commit them, or set them aside with stash, then switch.</p>`,
 done:`Clicking the branch name in VS Code's status bar and picking another one runs this. If files seem to vanish after switching, they're safe: they live on the other branch.`,
 like:`Loading a different save file in a game: the whole world reloads to that save.`,
 demo:'checkout-switch',cap:`Switch branches and watch the files in the folder change to match.`,rel:['branch','head','stash']},
{id:'merge',ch:1,t:'Merge',aka:['git merge','fast-forward','merge commit','--no-ff'],
 one:`Bring the work from one branch into another.`,
 body:`<p>If the target branch hasn't moved since you branched off, Git can just slide its pointer forward to your latest commit. That's a <strong>fast-forward</strong>: no new commit needed.</p><p>If both branches have new commits, Git creates a <strong>merge commit</strong> with two parents, tying the two histories together. Both lines stay in history exactly as they happened. Many teams force a merge commit even when a fast-forward is possible (<code>--no-ff</code>), so each feature shows up as one clear unit.</p>`,
 done:`Pressing "Merge pull request" on GitHub or GitLab merges into main. <code>git pull</code> also merges, because pull is fetch followed by merge.`,
 like:`Two streams joining into one river. From then on, both streams' water is in the river.`,
 demo:'merge',cap:`First a fast-forward, then a real merge that needs a merge commit.`,rel:['merge-conflict','rebase','three-way-merge']},
{id:'merge-conflict',ch:1,t:'Merge conflict',aka:['conflict','<<<<<<<','=======','>>>>>>>','resolve'],
 one:`When two branches changed the same lines differently, Git stops and asks you to choose.`,
 body:`<p>Git merges most changes automatically. It only gets stuck when both sides changed the same lines of the same file, or one side deleted a file the other edited. Then it writes conflict markers into the file: your version between <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code> and <code>=======</code>, theirs between <code>=======</code> and <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt;</code>.</p><p>You edit the file to what it should be (yours, theirs, or a mix), delete the markers, <code>git add</code> the file, and finish with a commit. Conflicts aren't errors. They're Git refusing to guess.</p>`,
 done:`Two people changing the same file, like both editing <code>environment.ts</code> or the same service, is where conflicts appear. VS Code's "Accept Current / Accept Incoming / Accept Both" buttons resolve them.`,
 like:`Two editors marking up the same sentence differently. Someone has to decide which wording stays.`,
 demo:'merge-conflict',cap:`The same line is changed on two branches. Watch Git mark the conflict, then pick a resolution.`,rel:['merge','three-way-merge','diff-status']},
{id:'rebase',ch:1,t:'Rebase',aka:['git rebase','rebase onto main','linear history','replay','pull --rebase'],
 one:`Move your branch's commits so they start from the tip of another branch, as if you'd begun your work later.`,
 body:`<p>Rebasing takes the commits on your branch and replays them one by one on top of another branch, usually main. The result looks as if you started from main's latest commit, and history stays a straight line with no merge commit.</p><p>Replayed commits are <em>new</em> commits with new hashes; the old ones are left behind. That's fine on your own branch, but rebasing commits that other people already pulled rewrites history under their feet. The usual rule: rebase your local work freely, never rebase shared branches.</p>`,
 done:`<code>git pull --rebase</code> replays your local commits on top of what you just pulled, which avoids the little "Merge branch 'main' of …" commits. Updating a feature branch with the latest main before a pull request is a common rebase.`,
 like:`Moving your sticky notes from an old version of the plan onto the latest one, rewriting each so it fits.`,
 demo:'rebase',cap:`Toggle between merge and rebase and compare the shape of the history.`,rel:['merge','interactive-rebase','rewriting-history']},
{id:'stash',ch:1,t:'Stash',aka:['git stash','stash pop','stash apply','WIP'],
 one:`Put your unfinished changes on a shelf to get a clean folder, then bring them back later.`,
 body:`<p><code>git stash</code> takes your uncommitted changes, saves them aside, and resets your files to the last commit. Now you can switch branches or pull without committing half-done work. <code>git stash pop</code> brings the changes back and removes them from the shelf; <code>git stash apply</code> brings them back and keeps a copy.</p><p>You can stack several stashes, and <code>git stash list</code> shows them. Stashes live only on your machine and are easy to forget, so use them for short interruptions, not storage.</p>`,
 done:`Mid-feature, someone reports a bug on main that needs a hotfix now. Stash, switch to main, fix, switch back, pop. That's the classic use.`,
 like:`Sweeping everything on your desk into a drawer to take an urgent call, then pulling it back out.`,
 demo:'stash',cap:`Stash your work, handle the interruption, then pop it back.`,rel:['checkout-switch','staging-area','commit']},
{id:'cherry-pick',ch:1,t:'Cherry-pick',aka:['git cherry-pick','copy a commit','backport','hotfix'],
 one:`Copy one specific commit from another branch onto the branch you're on.`,
 body:`<p>Sometimes you need one fix from a branch, not the whole branch. <code>git cherry-pick a1b2c3d</code> takes the changes from that commit and applies them as a new commit on your current branch.</p><p>The copy gets a new hash, and the original stays where it was, so the same change exists twice in history. That's fine: if the branch is merged later, Git usually sees the change is already there. A cherry-pick that conflicts is resolved like any merge conflict.</p>`,
 done:`A fix lands on a feature or develop branch, but production needs it today. Cherry-picking that one commit onto main or a release branch is called a backport.`,
 like:`Copying one recipe from a friend's cookbook into yours, instead of taking the whole book.`,
 demo:'cherry-pick',cap:`Pick the fix from the feature branch and copy it onto main.`,rel:['rebase','branching-strategy','merge']},
{id:'tags',ch:1,t:'Tags & releases',aka:['git tag','release','v1.6.0','semantic versioning','semver'],
 one:`A permanent name stuck on one commit, usually a version number like v1.6.0.`,
 body:`<p>A tag marks a specific commit and, unlike a branch, never moves. Teams tag the commit they release so they can always find, rebuild, or compare that exact version later.</p><p>Version numbers usually follow <strong>semantic versioning</strong>: <code>MAJOR.MINOR.PATCH</code>. Bump PATCH for bug fixes (1.6.0 → 1.6.1), MINOR for new features that don't break anything (1.6.1 → 1.7.0), and MAJOR for breaking changes (1.7.0 → 2.0.0). Tags aren't pushed by default; <code>git push --tags</code> sends them.</p>`,
 done:`The <code>v1.6.0</code> in the corner of the Adexchange Performance dashboard is a version label, and ideally it matches a tag. "Releases" on GitHub and GitLab are built on tags.`,
 like:`A plaque on a building that says when it opened. The building may change later; the plaque marks that moment.`,
 demo:'tags',cap:`Tag each release and watch the version number follow the kind of change.`,rel:['commit','branching-strategy','hooks-ci']},
/* ---------- III. working with others ---------- */
{id:'remote',ch:2,t:'Remote, origin & clone',aka:['git remote','origin','git clone','GitHub','GitLab'],
 one:`A copy of the repository somewhere else, usually on GitHub or GitLab. origin is the default name for the one you cloned from.`,
 body:`<p>Git doesn't need a server: every clone is a complete repository. A <strong>remote</strong> is another copy you've given a name, so you can send commits to it and get commits from it. <code>git clone &lt;url&gt;</code> copies a repository and names the source <code>origin</code>.</p><p>Your laptop and origin don't sync on their own. Nothing moves between them until you push, fetch, or pull. That's how your local <code>main</code> ends up behind <code>origin/main</code> without you noticing.</p>`,
 done:`The URL you copied from the "Clone" button on GitHub or GitLab set up origin. <code>git remote -v</code> shows it.`,
 like:`Your own photocopy of the team binder. The original stays in the office (origin), and your copy only changes when you go and sync it.`,
 demo:'remote',cap:`Clone the repo, then commit on both sides. Nothing syncs by itself.`,rel:['push-pull','fetch','upstream']},
{id:'push-pull',ch:2,t:'push & pull',aka:['git push','git pull','sync','rejected push'],
 one:`push sends your commits to the remote. pull brings the remote's new commits into your branch.`,
 body:`<p><code>git push</code> uploads the commits you have that the remote doesn't, and moves the remote branch forward. If the remote has commits you don't have, the push is rejected: you have to pull first, so you can't erase someone else's work.</p><p><code>git pull</code> is two steps: <code>fetch</code> to download new commits, then <code>merge</code> (or <code>rebase</code>, with <code>git pull --rebase</code>) to bring them into your branch. Pull often, so you never fall far behind.</p>`,
 done:`"Updates were rejected because the remote contains work that you do not have locally" means a teammate pushed first. Pull, resolve any conflicts, then push again.`,
 like:`Uploading your edits to a shared drive, and downloading everyone else's.`,
 demo:'push-pull',cap:`Push, get rejected because a teammate pushed first, pull, then push again.`,rel:['fetch','remote','force-push']},
{id:'fetch',ch:2,t:'fetch vs pull',aka:['git fetch','origin/main','remote-tracking branch'],
 one:`fetch downloads new commits but changes nothing in your branch. pull = fetch + merge.`,
 body:`<p><code>git fetch</code> asks the remote for anything new and stores it in remote-tracking branches like <code>origin/main</code>. Your own <code>main</code> and your files stay exactly as they were, so it's always safe.</p><p>After fetching you can look before you leap: <code>git log main..origin/main</code> shows what's incoming. Then you merge or rebase when you're ready. <code>git pull</code> does both steps at once, which is convenient but gives you no chance to look first.</p>`,
 done:`When VS Code shows ↓3 next to the branch name after a background fetch, origin has 3 commits you haven't merged yet.`,
 like:`Bringing the mail in and leaving it on the table, versus opening it and acting on it right away.`,
 demo:'fetch',cap:`fetch only moves origin/main. Merging is what moves your main.`,rel:['push-pull','upstream','merge']},
{id:'upstream',ch:2,t:'Upstream & tracking branch',aka:['upstream','tracking branch','ahead','behind','push -u'],
 one:`The remote branch your local branch is paired with, so Git can tell you how far ahead or behind you are.`,
 body:`<p>When a local branch tracks a remote branch, <code>git status</code> can say "Your branch is ahead of 'origin/main' by 2 commits". Ahead means you have commits to push; behind means there are commits to pull. Both at once means the branches have diverged.</p><p>You set the pairing on the first push of a new branch: <code>git push -u origin feature/x</code>. After that, plain <code>git push</code> and <code>git pull</code> know where to go.</p>`,
 done:`"The current branch has no upstream branch" on your first push is Git asking for that <code>-u</code>. The ↑2 ↓1 counters in VS Code are ahead and behind.`,
 like:`A step counter paired with a friend's, telling you how far above or below them you are.`,
 demo:'upstream',cap:`Commit on both sides and watch the ahead and behind counters.`,rel:['fetch','push-pull','remote']},
{id:'pull-request',ch:2,t:'Pull request & code review',aka:['PR','merge request','MR','code review','approve','LGTM'],
 one:`A request to merge your branch into another, with a page where teammates review the changes first.`,
 body:`<p>A pull request (PR; GitLab calls it a merge request, MR) isn't a Git command. It's a feature of the hosting service. You push your branch, open a PR from it into main, and the page shows the diff, a discussion, and the results of automated checks.</p><p>Teammates comment on specific lines and approve or request changes. You push more commits to the same branch and the PR updates. Once it's approved and the checks pass, it's merged as a merge commit, a squash, or a rebase, depending on the team's setting.</p>`,
 done:`Every "Review requested" notification and every "LGTM" (Looks Good To Me) is part of this. Branch protection rules that block merging until someone approves are what make reviews mandatory.`,
 like:`Submitting an article to an editor. They mark it up, you revise, and only then is it printed.`,
 demo:'pull-request',cap:`Follow a branch through checks, a requested change, approval, and merge.`,rel:['branch','merge','hooks-ci']},
{id:'force-push',ch:2,t:'Force push',aka:['git push --force','--force-with-lease','-f','overwrite remote'],
 one:`Make the remote branch match yours even if that throws away commits on the remote. Use --force-with-lease, never plain --force.`,
 body:`<p>A normal push only adds commits. After you rebase or amend, your branch no longer contains the remote's version of those commits, so a normal push is rejected. <code>git push --force</code> overwrites the remote branch with yours.</p><p>The danger: if a teammate pushed to that branch in the meantime, their commits vanish from the remote. <code>--force-with-lease</code> only overwrites if the remote is still exactly what you last fetched, so it refuses when someone else's work would be lost. Never force push to main or other shared branches.</p>`,
 done:`After rebasing your feature branch onto the latest main to update a pull request, you need a force push. That's the safe case, because it's your branch.`,
 like:`Replacing a shared document with your copy. Fine if you're the only editor; a disaster if someone saved changes an hour ago.`,
 demo:'force-push',cap:`A teammate pushed while you were rebasing. Compare --force with --force-with-lease.`,rel:['rebase','rewriting-history','push-pull']},
{id:'branching-strategy',ch:2,t:'Branching strategy',aka:['Git Flow','trunk-based development','GitHub Flow','develop','release branch','hotfix branch'],
 one:`Your team's rules for which branches exist, where work starts, and how it reaches production.`,
 body:`<p><strong>Git Flow</strong> keeps two long-lived branches, <code>main</code> (production) and <code>develop</code> (the next release), plus short-lived <code>feature/</code>, <code>release/</code>, and <code>hotfix/</code> branches. It's structured and suits scheduled releases, at the cost of more merging.</p><p><strong>Trunk-based development</strong>, and its cousin GitHub Flow, keeps one main branch. Feature branches are short and merged within a day or two, and unfinished features hide behind feature flags. It needs good automated tests, and in return everyone stays close to the latest code.</p>`,
 done:`If your repos have a <code>develop</code> branch that releases are cut from, you're close to Git Flow. If everything goes straight to main through PRs and deploys from there, that's trunk-based or GitHub Flow.`,
 like:`Git Flow is a factory with separate lines for building, testing, and shipping. Trunk-based is a kitchen where each dish goes out the moment it's ready.`,
 demo:'branching-strategy',cap:`Switch strategies and compare the shape of the history.`,rel:['branch','tags','hooks-ci']},
{id:'hooks-ci',ch:2,t:'Hooks & CI',aka:['git hooks','pre-commit','Husky','CI/CD','pipeline','GitHub Actions','GitLab CI'],
 one:`Scripts that run automatically at Git moments: on your machine before a commit, or on a server after a push.`,
 body:`<p><strong>Hooks</strong> are scripts Git runs on your machine at certain points. A <code>pre-commit</code> hook can lint and format code and block the commit if it fails; a <code>commit-msg</code> hook can enforce a message format. Tools like Husky install them for the whole team.</p><p><strong>CI</strong> (Continuous Integration) runs on a server: every push or PR triggers a pipeline that builds, tests, and checks the code. <strong>CD</strong> (Continuous Delivery or Deployment) goes further and ships passing builds automatically, for example deploying the API when main changes.</p>`,
 done:`The green check or red cross next to a commit or PR is a CI pipeline result. A lint error that stopped your commit before it happened was a pre-commit hook.`,
 like:`A spell-checker that runs before you can hit Send (the hook), and a proofreader who checks every printed copy (CI).`,
 demo:'hooks-ci',cap:`Commit with a lint error, fix it, then push and watch the pipeline.`,rel:['pull-request','branching-strategy','tags']},
/* ---------- IV. undoing things ---------- */
{id:'revert',ch:3,t:'git revert',aka:['revert','undo a commit','inverse commit'],
 one:`Undo a commit by adding a new commit that does the opposite. History stays intact.`,
 body:`<p><code>git revert a1b2c3d</code> creates a new commit that reverses the changes of <code>a1b2c3d</code>. Lines it added get removed, and lines it removed come back. The original commit stays in history, and so does the undo.</p><p>Because it only adds a commit, revert is safe on shared branches like main: nobody's history gets rewritten. That makes it the right tool for backing out a bad change that's already pushed or deployed.</p>`,
 done:`The "Revert" button on a merged pull request creates exactly this: a new PR that undoes the old one.`,
 like:`Printing a correction in tomorrow's paper instead of trying to recall yesterday's copies.`,
 demo:'revert',cap:`Revert the bad commit. Nothing disappears; a new commit cancels it out.`,rel:['reset','commit','rewriting-history']},
{id:'reset',ch:3,t:'git reset (soft, mixed, hard)',aka:['git reset','--soft','--mixed','--hard','uncommit'],
 one:`Move your branch back to an earlier commit. The mode decides what happens to the changes in between.`,
 body:`<p><code>git reset</code> moves the current branch (and HEAD) to another commit, usually an earlier one. The commits after it fall off the branch. What happens to their changes depends on the mode.</p><p><code>--soft</code> keeps them staged, ready to commit again. <code>--mixed</code>, the default, keeps them in your files but unstaged. <code>--hard</code> throws them away and makes your files match the target exactly. Reset rewrites history, so use it on commits you haven't pushed, and be careful with <code>--hard</code>: uncommitted work it discards is gone for good.</p>`,
 done:`<code>git reset --soft HEAD~1</code> is the classic "I committed too early, let me redo it". <code>git reset --hard origin/main</code> is "throw away my local mess and match the remote".`,
 like:`Rewinding a recording. Soft keeps the cut footage on the desk, mixed puts it back in the drawer, hard shreds it.`,
 demo:'reset',cap:`Pick a mode and reset two commits back. Watch where the changes end up.`,rel:['revert','reflog','head']},
{id:'interactive-rebase',ch:3,t:'Interactive rebase & squash',aka:['git rebase -i','squash','fixup','reword','squash and merge'],
 one:`Edit your branch's history before sharing it: combine, reorder, rename, or drop commits.`,
 body:`<p><code>git rebase -i HEAD~4</code> opens a list of your last four commits, each with a command. Change <code>pick</code> to <code>squash</code> (or <code>fixup</code>) to fold a commit into the one before it, <code>reword</code> to change its message, <code>drop</code> to delete it, or move lines to reorder them.</p><p>It's how "wip", "fix typo", and "fix it again" become one clean commit before review. Like every rebase it creates new commits, so do it before pushing, or on your own branch followed by a force push with lease.</p>`,
 done:`"Squash and merge" on a pull request does this for you: all the PR's commits become a single commit on main.`,
 like:`Turning your rough notes into a clean summary before handing them in.`,
 demo:'interactive-rebase',cap:`Squash four messy commits into one clean commit.`,rel:['rebase','force-push','commit']},
{id:'reflog',ch:3,t:'Reflog',aka:['git reflog','undo a reset','lost commits','recovery','HEAD@{1}'],
 one:`Your local diary of everywhere HEAD has been. It's how you recover commits you thought were lost.`,
 body:`<p>Every time HEAD moves (commit, checkout, reset, rebase, merge), Git writes a line in the reflog. Commits that no branch points to anymore aren't deleted right away; they're just hidden, and the reflog still lists them.</p><p>After a bad <code>git reset --hard</code> or a rebase gone wrong, run <code>git reflog</code>, find the entry from before the mistake, and <code>git reset --hard HEAD@{2}</code> (or create a branch at that hash). The reflog is local only, and entries expire after a while (90 days by default), but it saves careers.</p>`,
 done:`If you've ever panicked after a reset and a teammate said "check the reflog", this is what they meant.`,
 like:`Your browser history. You closed the tab, but you can still find the page.`,
 demo:'reflog',cap:`Reset two commits away, then find them in the reflog and bring them back.`,rel:['reset','head','rebase']},
{id:'detached-head',ch:3,t:'Detached HEAD',aka:['checkout a commit','headless','checkout a tag'],
 one:`HEAD points at a commit directly instead of a branch. You can look around, but new commits won't belong to any branch.`,
 body:`<p>Checking out a commit hash or a tag (<code>git checkout v1.5.0</code>) puts you in detached HEAD state. Your files match that commit, which is perfect for inspecting or testing an old version.</p><p>If you commit there, the new commits hang off that point with no branch holding them. Switch away and they become unreachable, and Git eventually cleans them up. To keep them, create a branch right there: <code>git switch -c my-fix</code>.</p>`,
 done:`Checking out an old release tag to reproduce a bug from a player build in the field puts you in detached HEAD. Git's long warning is just telling you to make a branch if you want to keep anything.`,
 like:`Leaving the marked trail. Fine for exploring, but if you set up camp, put up a sign so you can find it again.`,
 demo:'detached-head',cap:`Check out an old commit, commit there, and see what happens when you leave.`,rel:['head','tags','reflog']},
{id:'bisect',ch:3,t:'git bisect',aka:['bisect','binary search','good','bad','find the bad commit'],
 one:`Find the commit that introduced a bug by binary search: Git picks the middle, you say good or bad.`,
 body:`<p>You know the bug exists now and didn't exist in some older version. Run <code>git bisect start</code>, mark the current commit <code>bad</code> and the old one <code>good</code>. Git checks out the commit halfway between. You test it and answer <code>good</code> or <code>bad</code>, and Git halves the range again.</p><p>With 1,000 commits in between you need about 10 tests, not 1,000. If a script can tell good from bad, <code>git bisect run</code> does the whole search by itself.</p>`,
 done:`"It worked in v1.5, it's broken in v1.6, and there are 80 commits in between" is exactly what bisect is for. It takes about 7 tests.`,
 like:`Guessing a number between 1 and 100 when someone says "higher" or "lower" each time.`,
 demo:'bisect',cap:`Watch the search halve the range at each step until one commit is left.`,rel:['tags','detached-head','commit']},
/* ---------- V. under the hood ---------- */
{id:'objects-hashes',ch:4,t:'Objects & hashes',aka:['blob','tree','commit object','SHA-1','content-addressable','.git/objects','snapshot'],
 one:`Inside .git, every file version, folder, and commit is an object named by a hash of its contents.`,
 body:`<p>Git stores three main kinds of objects. A <strong>blob</strong> is the contents of one file. A <strong>tree</strong> is a folder: a list of names pointing to blobs and other trees. A <strong>commit</strong> points to one tree (the whole project at that moment), its parent commits, the author, and the message.</p><p>Each object's ID is a hash of its contents. Same contents, same hash, so a file that didn't change between commits is stored once and shared. Change one byte and its hash changes, which changes its folder's tree hash, which changes the commit hash. That chain is why history can't be quietly edited: any change produces new IDs all the way up.</p>`,
 done:`Every short hash you've copied from <code>git log</code> is one of these IDs. Commits are snapshots, not diffs; the diffs you see are calculated on the fly by comparing two snapshots.`,
 like:`A library that shelves every book by a fingerprint of its text. Two identical books land on the same spot, so only one copy is kept.`,
 demo:'objects-hashes',cap:`Edit one file and watch new hashes ripple up from the blob to the commit. Unchanged files are reused.`,rel:['commit','repository','rewriting-history']},
{id:'three-way-merge',ch:4,t:'Three-way merge & merge base',aka:['merge base','common ancestor','3-way merge','ours','theirs'],
 one:`Git merges by comparing both branches to their last shared commit, not just to each other.`,
 body:`<p>Comparing only the two branch tips can't tell who changed what. If a line differs, did you change it or did they? So Git finds the <strong>merge base</strong>, the most recent commit both branches share, and compares each side against it.</p><p>If only one side changed a line, Git takes that side's version. If neither changed it, Git keeps it. If both changed it differently, that's a conflict. This is why Git merges cleanly so often, and why a conflict means both sides really did touch the same thing.</p>`,
 done:`<code>git merge-base main feature/x</code> prints that shared commit. A clean merge where you and a teammate edited different parts of the same file is three-way merging doing its job.`,
 like:`Combining two edited copies of a contract by comparing each to the original, not to each other.`,
 demo:'three-way-merge',cap:`Each line is decided by comparing both sides to the base.`,rel:['merge','merge-conflict','rebase']},
{id:'rewriting-history',ch:4,t:'Rewriting shared history',aka:['rewrite history','amend','golden rule','filter-repo','leaked secret'],
 one:`Changing commits that other people already have. Amend, rebase, and reset make new commits, while everyone else's copy keeps the old ones.`,
 body:`<p>Amend, rebase, reset, and squash don't edit commits. They create new commits and move the branch to them. If you're the only one with the old commits, nobody notices.</p><p>If teammates already pulled the old ones, their copies and yours have diverged, and their next pull may bring back duplicates of what you replaced. The golden rule: don't rewrite history that's been pushed to a shared branch. The exception is a leaked secret, where a tool like <code>git filter-repo</code> rewrites everything and every teammate must re-clone. Even then, rotate the secret, because someone may already have a copy.</p>`,
 done:`Someone force-pushes to a shared branch, and the next morning several teammates see strange duplicate commits after pulling. That's this, and it's why branch protection usually blocks force pushes to main.`,
 like:`Changing a story after everyone has read it. Your copy changes, but everyone else still remembers the original.`,
 demo:'rewriting-history',cap:`You rewrite a shared branch. See what happens to your teammate's copy.`,rel:['force-push','rebase','gitignore']},
{id:'submodules',ch:4,t:'Submodules',aka:['git submodule','nested repository','.gitmodules','--recurse-submodules'],
 one:`A repository inside another repository, pinned to one exact commit.`,
 body:`<p>A submodule lets one repo include another, like a shared library, while keeping its history separate. The parent repo doesn't store the library's files. It stores a pointer: "use commit <code>a1b2c3d</code> of that repo here".</p><p>That pointer only moves when someone updates it and commits the change in the parent. Cloning needs <code>--recurse-submodules</code>, or you get an empty folder. Forgetting to update or push one side is a common source of "works on my machine", which is why many teams share code as an npm or NuGet package instead.</p>`,
 done:`If the dashboard and the player's Angular UI shared a set of components, a submodule would be one way to share them and a private npm package the other. An empty folder right after cloning is the classic submodule surprise.`,
 like:`A book that says "insert chapter 7 from the 2024 edition of another book here" instead of printing it.`,
 demo:'submodules',cap:`The library moves on, but the parent keeps using the pinned commit until you update the pointer.`,rel:['repository','commit','objects-hashes']}
];
</script>
<script>
/* ================= drawing engine ================= */
const col={};
const CV=['bg','paper','panel','panel2','ink','muted','line','line2','req','ad','slot','bad','pop','pi','on','brand'];
function readCol(){const s=getComputedStyle(document.documentElement);CV.forEach(k=>col[k]=s.getPropertyValue('--'+k).trim())}
readCol();
const FONT='Jost, system-ui, sans-serif', MONO='"JetBrains Mono", ui-monospace, monospace';
const rnd=Math.random, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,p)=>a+(b-a)*p;
const ez=p=>{p=clamp(p,0,1);return p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2};
const randn=()=>{let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const logn=(med,sig)=>med*Math.exp(sig*randn());
const alpha=(c,a)=>{const h=(c||'#888').replace('#','');const f=h.length===3?h.split('').map(x=>x+x).join(''):h;
  const n=parseInt(f,16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
function seq(e,durs){let a=0;for(let i=0;i<durs.length;i++){if(e<a+durs[i])return{i,p:(e-a)/durs[i]};a+=durs[i]}return{i:durs.length-1,p:1}}
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;

function mkG(ctx){
  const g={

function Scen(s,ui,cfg){let i=-1,last=0,cmdT=0,st,steps,auto=!REDUCED,P={},doneAt=null;const dur=cfg.dur||2.7;

  ui.btn('Next step ▶',()=>{auto=false;at.checked=false;step()});
  const at=ui.toggle('Auto-play',auto,v=>{auto=v;last=s.T});
  ui.btn('Restart',()=>{cfg.onRestart&&cfg.onRestart();P={};rebuild(-1)},true);
  (cfg.toggles||[]).forEach(tg=>ui.toggle(tg.label,tg.val,v=>{tg.on(v);P={};rebuild(-1)}));
